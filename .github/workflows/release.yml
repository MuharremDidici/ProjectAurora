name: Build & Publish Project Aurora Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Yayınlanacak SemVer sürümü (ör. 7.3.0)'
        required: true
        default: '7.3.0'
      release_notes:
        description: 'Sürüm notları (isteğe bağlı)'
        required: false
        default: 'Project Aurora v7.2.0: Saf Rust Win32 + Tek Paylaşımlı WebView2 masaüstü kabuğu, 10 kabuk mimarisi, 6 Dinamik Ada stili, Alt Dock OmniSearch, gerçek Win11 sistem tepsisi, Alt+Tab odak bütünlüğü ve v2.x/v3.x+ tek tık otomatik yükseltme.'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Stable Toolchain (MSVC x64)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo Build Artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: aurora-rs -> target

      - name: Resolve Release Version
        id: ver
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}".Trim().TrimStart('v', 'V')
            $notes = "${{ inputs.release_notes }}"
          } else {
            $v = "${{ github.ref_name }}".Trim().TrimStart('v', 'V')
            $notes = ""
          }

          $releaseBodyPath = Join-Path $env:RUNNER_TEMP "release_body.md"
          $sectionMarkdown = ""
          if (Test-Path ".\RELEASE_NOTES.md") {
            $rawNotes = [System.IO.File]::ReadAllText(".\RELEASE_NOTES.md", [System.Text.UTF8Encoding]::new($false))
            $pattern = "(?ms)^##\s+v" + [Regex]::Escape($v) + "\s*\r?\n(.*?)(?=^##\s+v|\z)"
            $m = [Regex]::Match($rawNotes, $pattern)
            if ($m.Success) {
              $sectionMarkdown = $m.Groups[1].Value.Trim()
              $sumMatch = [Regex]::Match($sectionMarkdown, "(?m)^>\s*Summary:\s*(.+)$")
              if ($sumMatch.Success -and [string]::IsNullOrWhiteSpace($notes)) {
                $notes = $sumMatch.Groups[1].Value.Trim()
                $sectionMarkdown = [Regex]::Replace($sectionMarkdown, "(?m)^>\s*Summary:\s*.+\r?\n*", "").Trim()
              }
            }
          }

          if ([string]::IsNullOrWhiteSpace($notes)) {
            $commitSubj = (git log -1 --pretty=%s 2>$null | Out-String).Trim()
            $notes = if (-not [string]::IsNullOrWhiteSpace($commitSubj)) { $commitSubj } else { "Project Aurora v$v — Saf Rust + Native GPU sürümü." }
          }

          $bodySb = [System.Text.StringBuilder]::new()
          [void]$bodySb.AppendLine("## ✦ Project Aurora v$v (Saf Rust Motoru)")
          [void]$bodySb.AppendLine("")
          [void]$bodySb.AppendLine($notes)
          if (-not [string]::IsNullOrWhiteSpace($sectionMarkdown)) {
            [void]$bodySb.AppendLine("")
            [void]$bodySb.AppendLine($sectionMarkdown)
          }
          [void]$bodySb.AppendLine("")
          [void]$bodySb.AppendLine("### Tek Tık Kurulum (Windows 11 x64 — ~3.7 MB)")
          [void]$bodySb.AppendLine("- Aşağıdaki **`Aurora-Kurulum-v*-x64.exe`** dosyasını indirip çalıştırın (sıfır .NET 10, sıfır harici DLL, sıfır UAC).")
          [void]$bodySb.AppendLine("- Mevcut v2.x (.NET) ve v3.x–v7.x (Rust) kullanıcıları tüm ayarlarını, pano kasasını ve ajandasını kaybetmeden uygulama içi güncelleme veya tek tık kurulumla doğrudan yükseltebilir.")
          [System.IO.File]::WriteAllText($releaseBodyPath, $bodySb.ToString(), [System.Text.UTF8Encoding]::new($false))

          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$v" -Encoding utf8NoBOM
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=v$v" -Encoding utf8NoBOM
          Add-Content -Path $env:GITHUB_OUTPUT -Value "notes=$notes" -Encoding utf8NoBOM
          Add-Content -Path $env:GITHUB_OUTPUT -Value "body_path=$releaseBodyPath" -Encoding utf8NoBOM

      - name: Strict Clippy
        shell: pwsh
        run: cargo clippy --manifest-path .\aurora-rs\Cargo.toml --workspace --all-targets -- -D warnings

      - name: Automated Workspace Tests
        shell: pwsh
        run: |
          $out = & cargo test --manifest-path .\aurora-rs\Cargo.toml --workspace -- --nocapture 2>&1
          $ec = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          if ($ec -ne 0) {
            $out | Select-String -Pattern 'FAILED|panicked at|assertion' | Select-Object -First 10 | ForEach-Object {
              Write-Host "::error::$($_.Line)"
            }
            exit $ec
          }

      - name: Build Self-Contained Native Rust Installer & SHA-256 Manifest
        shell: pwsh
        run: |
          $baseUrl = "https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}"
          .\Build-Installer.ps1 `
            -Version "${{ steps.ver.outputs.version }}" `
            -ReleaseDownloadBaseUrl "$baseUrl" `
            -ReleaseNotes "${{ steps.ver.outputs.notes }}"

      - name: Publish GitHub Release with Installer + Manifest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Project Aurora ${{ steps.ver.outputs.tag }}
          body_path: ${{ steps.ver.outputs.body_path }}
          files: |
            dist/Aurora-Kurulum-*.exe
            dist/release-manifest.json
            dist/Project-Aurora-TekTik-Kurulum-*.zip
            dist/BENIOKU-Kurulum.txt
          draft: false
          prerelease: false
