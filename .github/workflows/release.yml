name: Build & Publish Project Aurora Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Yayınlanacak SemVer sürümü (ör. 2.1.0)'
        required: true
        default: '2.0.0'
      release_notes:
        description: 'Sürüm notları (isteğe bağlı)'
        required: false
        default: 'Yeni özellikler, kararlılık ve performans iyileştirmeleri.'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve Release Version
        id: ver
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}".Trim().TrimStart('v', 'V')
            $notes = "${{ inputs.release_notes }}"
          } else {
            $v = "${{ github.ref_name }}".Trim().TrimStart('v', 'V')
            $notes = ""
          }

          # Prefer curated release notes from RELEASE_NOTES.md (## v<version>) over raw commit subjects
          $releaseBodyPath = Join-Path $env:RUNNER_TEMP "release_body.md"
          $sectionMarkdown = ""
          if (Test-Path ".\RELEASE_NOTES.md") {
            $rawNotes = [System.IO.File]::ReadAllText(".\RELEASE_NOTES.md", [System.Text.UTF8Encoding]::new($false))
            $pattern = "(?ms)^##\s+v" + [Regex]::Escape($v) + "\s*\r?\n(.*?)(?=^##\s+v|\z)"
            $m = [Regex]::Match($rawNotes, $pattern)
            if ($m.Success) {
              $sectionMarkdown = $m.Groups[1].Value.Trim()
              $sumMatch = [Regex]::Match($sectionMarkdown, "(?m)^>\s*Summary:\s*(.+)$")
              if ($sumMatch.Success -and [string]::IsNullOrWhiteSpace($notes)) {
                $notes = $sumMatch.Groups[1].Value.Trim()
                $sectionMarkdown = [Regex]::Replace($sectionMarkdown, "(?m)^>\s*Summary:\s*.+\r?\n*", "").Trim()
              }
            }
          }

          if ([string]::IsNullOrWhiteSpace($notes)) {
            $commitSubj = (git log -1 --pretty=%s 2>$null | Out-String).Trim()
            $notes = if (-not [string]::IsNullOrWhiteSpace($commitSubj)) { $commitSubj } else { "Project Aurora v$v — GitHub otomatik güncelleme paketi." }
          }

          $bodySb = [System.Text.StringBuilder]::new()
          [void]$bodySb.AppendLine("## ✦ Project Aurora v$v")
          [void]$bodySb.AppendLine("")
          [void]$bodySb.AppendLine($notes)
          if (-not [string]::IsNullOrWhiteSpace($sectionMarkdown)) {
            [void]$bodySb.AppendLine("")
            [void]$bodySb.AppendLine($sectionMarkdown)
          }
          [void]$bodySb.AppendLine("")
          [void]$bodySb.AppendLine("### Tek Tık Kurulum (Windows 11 x64)")
          [void]$bodySb.AppendLine("- Aşağıdaki **`Aurora-Kurulum-v*-x64.exe`** dosyasını indirip çalıştırın (yönetici izni / UAC veya ek .NET kurulumu gerektirmez).")
          [void]$bodySb.AppendLine("- Mevcut Project Aurora kullanıcıları uygulama içindeki **Üst Damla → Stüdyo & Ayarlar → Güncellemeleri Kontrol Et** butonundan ayarlarını kaybetmeden tek tıkla güncelleyebilir.")
          [System.IO.File]::WriteAllText($releaseBodyPath, $bodySb.ToString(), [System.Text.UTF8Encoding]::new($false))

          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$v" -Encoding utf8NoBOM
          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=v$v" -Encoding utf8NoBOM
          Add-Content -Path $env:GITHUB_OUTPUT -Value "notes=$notes" -Encoding utf8NoBOM
          Add-Content -Path $env:GITHUB_OUTPUT -Value "body_path=$releaseBodyPath" -Encoding utf8NoBOM

      - name: Build & Run All Automated Tests
        shell: pwsh
        run: |
          dotnet build .\Aurora.sln -c Release -p:Platform=x64 -p:Version=${{ steps.ver.outputs.version }} --nologo
          dotnet test .\Aurora.sln -c Release -p:Platform=x64 --no-build --nologo --verbosity normal

      - name: Build Self-Contained Installer & SHA-256 Manifest
        shell: pwsh
        run: |
          $baseUrl = "https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.tag }}"
          .\Build-Installer.ps1 `
            -Version "${{ steps.ver.outputs.version }}" `
            -ReleaseDownloadBaseUrl "$baseUrl" `
            -ReleaseNotes "${{ steps.ver.outputs.notes }}"

      - name: Publish GitHub Release with Installer + Manifest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Project Aurora ${{ steps.ver.outputs.tag }}
          body_path: ${{ steps.ver.outputs.body_path }}
          files: |
            dist/Aurora-Kurulum-*.exe
            dist/release-manifest.json
            dist/Project-Aurora-TekTik-Kurulum-*.zip
            dist/BENIOKU-Kurulum.txt
          draft: false
          prerelease: false
