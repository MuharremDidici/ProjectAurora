function isDockTuckedNow() {
    if (radialGroupKey || openFolderPath || quickControlsOpen || calNotifOpen || trayPopOpen || widgetPickerOpen || widgetInspectorKind || quickWheelOpen || aiPopOpen || ctxMenuOpen || omniOpen || state?.dockEditMode || autoHideRevealed || isDraggingFileOverDock)
        return false;
    if (manualTucked)
        return true;
    const mode = state?.dockMode || (state?.dockAutoHide ? 'AutoHide' : 'AlwaysVisible');
    if (mode === 'AutoHide') return true;
    if (mode === 'SmartDodge') {
        const dodged = (liveDodgedOverride !== null) ? liveDodgedOverride : Boolean(state?.dockDodged);
        return dodged;
    }
    return false;
}

let pointerOverDock = false;
let lastReportedDockPopOpen = false;

function reportHitRects() {
    if (!state) return;
    const rects = [];
    const dock = document.getElementById('dockBar');
    const hub = document.getElementById('radialHub');
    const fcard = document.getElementById('folderStackCard');
    const qcPop = document.getElementById('dockQuickControls');
    const cnPop = document.getElementById('dockCalNotif');
    const trPop = document.getElementById('dockTrayPop');
    const wpPop = document.getElementById('dockWidgetPicker');
    const wiPop = document.getElementById('dockWidgetInspector');
    const aiPop = document.getElementById('dockAiPop');
    const ctxPop = document.getElementById('dockCtxMenu');
    const qwPop = document.getElementById('quickWheelPop');
    const omniPop = document.getElementById('omnibar');
    const edge = getDockEdge();
    const isVert = isVerticalEdge();
    const pinnedBar = isPinnedBarMode();
    const isIslands = !isVert && (getDockSilhouette() === 'islands' || SPLIT_ARCHS.includes(getShellArchitecture()));
    let dockRect = null;

    if (dock && getComputedStyle(dock).display !== 'none') {
        const r = dock.getBoundingClientRect();
        if (r.width > 0 && r.height > 0) {
            dockRect = r;
            const tuckedNow = isDockTuckedNow();
            if (isIslands && !tuckedNow) {
                // Split Islands: report 3 independent clickable island rects so wallpaper gaps stay 100% click-through!
                const extraTop = pointerOverDock ? 56 : 14;
                const zones = dock.querySelectorAll('.bar-zone-left, .bar-zone-center, .bar-zone-right');
                zones.forEach(z => {
                    const zr = z.getBoundingClientRect();
                    if (zr.width > 4 && zr.height > 4) {
                        rects.push({
                            x: Math.max(0, zr.left - 8),
                            y: Math.max(0, zr.top - extraTop),
                            w: zr.width + 16,
                            h: zr.height + extraTop + 12
                        });
                    }
                });
            } else if (isVert) {
                if (tuckedNow) {
                    const padY = 48;
                    const rx = edge === 'Left' ? 0 : Math.max(0, r.left - 6);
                    const rw = edge === 'Left' ? (r.right + 6) : (window.innerWidth - rx);
                    rects.push({ x: rx, y: Math.max(0, r.top - padY), w: Math.min(14, Math.max(10, rw)), h: r.height + padY * 2 });
                } else if (pinnedBar) {
                    const hoverPad = pointerOverDock ? 56 : 4;
                    const rx = edge === 'Left' ? 0 : Math.max(0, r.left - hoverPad);
                    const rw = edge === 'Left' ? (r.right + hoverPad) : (window.innerWidth - rx);
                    rects.push({ x: rx, y: 0, w: rw, h: window.innerHeight });
                } else {
                    const padLeft = edge === 'Right' ? (pointerOverDock ? 56 : 16) : 12;
                    const padRight = edge === 'Left' ? (pointerOverDock ? 56 : 16) : 12;
                    const padY = 16;
                    rects.push({
                        x: Math.max(0, r.left - padLeft),
                        y: Math.max(0, r.top - padY),
                        w: r.width + padLeft + padRight,
                        h: r.height + padY * 2
                    });
                }
            } else if (tuckedNow) {
                // Precision bottom-edge trigger (total ~11px) so WhatsApp/Antigravity typing boxes NEVER accidentally wake Dock!
                const extraTop = 4;
                const padX = 72;
                const padB = 6;
                rects.push({
                    x: Math.max(0, r.left - padX),
                    y: Math.max(0, r.top - extraTop),
                    w: Math.min(window.innerWidth, r.width + padX * 2),
                    h: Math.min(14, r.height + extraTop + padB)
                });
            } else if (pinnedBar) {
                // Dynamic unclipped tooltip halo ONLY while cursor is on the Dock — 0px overlap while typing above!
                const extraTop = pointerOverDock ? 56 : 2;
                rects.push({ x: 0, y: Math.max(0, r.top - extraTop), w: window.innerWidth, h: r.height + extraTop });
            } else {
                const extraTop = pointerOverDock ? 56 : 18;
                const padX = 14;
                const padB = 12;
                rects.push({ x: r.left - padX, y: Math.max(0, r.top - extraTop), w: r.width + padX * 2, h: r.height + extraTop + padB });
            }
        }
    }

    for (const pop of [hub, fcard, qcPop, cnPop, trPop, wpPop, wiPop, aiPop, ctxPop, qwPop, omniPop]) {
        if (pop && getComputedStyle(pop).display !== 'none') {
            const hr = pop.getBoundingClientRect();
            if (hr.width > 0 && hr.height > 0) {
                if (isVert && dockRect) {
                    const leftX = edge === 'Left'
                        ? Math.min(hr.left - 14, dockRect.right - 4)
                        : (hr.left - 14);
                    const rightX = edge === 'Right'
                        ? Math.max(hr.right + 14, dockRect.left + 4)
                        : (hr.right + 14);
                    rects.push({
                        x: Math.max(0, leftX),
                        y: Math.max(0, hr.top - 16),
                        w: Math.max(hr.width + 28, rightX - leftX),
                        h: hr.height + 32
                    });
                } else {
                    const bridgeBottom = dockRect ? Math.max(hr.bottom + 14, dockRect.top + 8) : (hr.bottom + 16);
                    rects.push({
                        x: Math.max(0, hr.left - 14),
                        y: Math.max(0, hr.top - 18),
                        w: hr.width + 28,
                        h: Math.max(hr.height + 34, bridgeBottom - Math.max(0, hr.top - 18))
                    });
                }
            }
        }
    }

    const anyPopOpen = Boolean(
        radialGroupKey || branchCatId || openFolderPath || expandedAccordionCat
        || quickControlsOpen || calNotifOpen || trayPopOpen || widgetPickerOpen
        || widgetInspectorKind || quickWheelOpen || aiPopOpen || ctxMenuOpen || omniOpen
    );
    if (anyPopOpen !== lastReportedDockPopOpen) {
        lastReportedDockPopOpen = anyPopOpen;
        send('setDockPopoverState', { open: anyPopOpen });
    }

    window.chrome.webview.postMessage({
        type: 'hitRects',
        vw: window.innerWidth,
        vh: window.innerHeight,
        rects
    });
}

function classifyCategory(proc) {
    const p = (proc || '').toLowerCase();
    if (/edge|chrome|firefox|brave|opera|arc/.test(p)) return { id: 'cat-web', name: 'Web' };
    if (/code|devenv|antigravity|powershell|pwsh|windowsterminal|cmd|git|rider|idea|cursor/.test(p)) return { id: 'cat-dev', name: 'Geliştirme' };
    if (/spotify|music|vlc|discord|whatsapp|telegram|teams|slack/.test(p)) return { id: 'cat-media', name: 'İletişim' };
    return { id: 'cat-sys', name: 'Uygulama' };
}

function cleanWindowTitle(raw, appName) {
    let t = String(raw || '').trim();
    if (!t) return appName || 'Pencere';
    const suffixes = [
        ' - Opera', ' - Brave', ' - Google Chrome', ' - Microsoft Edge',
        ' — Mozilla Firefox', ' - Mozilla Firefox', ' - Visual Studio Code',
        ' - Microsoft Teams', ' - Dosya Gezgini', ' - File Explorer',
        ' - Notepad', ' - Not Defteri', ' - Windows PowerShell'
    ];
    if (appName) suffixes.unshift(' - ' + appName, ' — ' + appName);
    for (const sfx of suffixes) {
        if (t.length > sfx.length + 2 && t.toLowerCase().endsWith(sfx.toLowerCase())) {
            t = t.slice(0, t.length - sfx.length).trim();
            break;
        }
    }
    return t || appName || 'Pencere';
}

function shortOrbLabel(cleaned) {
    let s = String(cleaned || '').replace(/^\(\d+\)\s*/, '').trim();
    if (!s) return 'Pencere';
    if (s.includes('\\') && s.length > 14) {
        const segs = s.split('\\').filter(Boolean);
        if (segs.length) s = segs[segs.length - 1];
    }
    if (/^[a-z0-9.-]+\.[a-z]{2,}(\/|$)/i.test(s)) {
        s = s.split('/')[0].replace(/^www\./i, '').split('.')[0];
    }
    const words = s.split(/\s+/);
    if (words.length === 1 && s.length > 9) {
        return s.slice(0, 8) + '…';
    }
    return s.length > 16 ? s.slice(0, 15) + '…' : s;
}

function getSmartTidyBuckets(runningUnpinned) {
    const buckets = {};
    for (const g of runningUnpinned) {
        const cat = classifyCategory(g.windows[0]?.processName || g.displayName);
        if (!buckets[cat.id]) buckets[cat.id] = { ...cat, groups: [], windows: [], icons: [], hasActive: false };
        buckets[cat.id].groups.push(g);
        buckets[cat.id].windows.push(...g.windows);
        if (g.hasActive) buckets[cat.id].hasActive = true;
        const ic = resolveItemIcon(g);
        if (ic && buckets[cat.id].icons.length < 4) buckets[cat.id].icons.push(ic);
    }
    return Object.values(buckets);
}

function renderDock() {
    if (!state) return;
    document.body.classList.add('state-ready');
    applyThemeVars(state.theme);

    const edge = getDockEdge();
    const isVert = isVerticalEdge();
    const edgeChanged = (lastRenderedEdge !== edge);
    lastRenderedEdge = edge;
    document.body.classList.toggle('edge-left', edge === 'Left');
    document.body.classList.toggle('edge-right', edge === 'Right');

    const stage = document.querySelector('.dock-stage');
    const dock = document.getElementById('dockBar');
    if (isDockTuckedNow()) {
        closeRadialHub(false);
        if (stage) {
            stage.classList.remove('pinned-bar-stage');
            stage.classList.add('tucked-stage');
        }
        dock.className = 'glass-shell tucked';
        dock.innerHTML = '';
        applyDockGeometryAndOffset();
        dock.onmouseenter = () => { clearTimeout(autoHideTimer); manualTucked = false; autoHideRevealed = true; renderDock(); };
        dock.onmouseleave = null;
        dock.onclick = () => { clearTimeout(autoHideTimer); manualTucked = false; autoHideRevealed = true; renderDock(); };
        reportHitRects();
        requestAnimationFrame(reportHitRects);
        if (edgeChanged) { setTimeout(reportHitRects, 140); setTimeout(reportHitRects, 320); }
        return;
    }
    dock.onmouseenter = () => { clearTimeout(autoHideTimer); clearTimeout(radialCloseTimer); autoHideRevealed = true; };
    dock.onmouseleave = () => {
        mouseX = null;
        mouseY = null;
        applyParabolicWave();
        scheduleDockAutoHide(440);
    };
    dock.onclick = null;

    const pinnedBar = isPinnedBarMode();
    const isIslands = !isVert && (getDockSilhouette() === 'islands' || SPLIT_ARCHS.includes(getShellArchitecture()));
    const splitLayout = isIslands || (pinnedBar && state.dockBarLayout === 'Split3Zone');
    if (stage) {
        stage.classList.toggle('pinned-bar-stage', pinnedBar && !isIslands);
        stage.classList.remove('tucked-stage');
    }
    const densCls = state.dockDensity === 'Compact' ? ' density-compact' : (state.dockDensity === 'Cozy' ? ' density-cozy' : '');
    const barCls = isIslands ? ' layout-split' : (pinnedBar ? (' pinned-bar' + (splitLayout ? ' layout-split' : '')) : '');
    dock.className = 'glass-shell' + densCls + barCls;

    const groups = state.groups || [];
    const pinned = groups.filter(g => g.isPinned);
    const runningUnpinned = groups.filter(g => !g.isPinned && g.windows.length > 0);
    const compactMode = isVert || (window.innerWidth < 1050);

    // Item #1: ONE single unified Start & OmniSearch trigger
    const startStyle = state.dockStartStyle || 'icon';
    const searchHtml = (startStyle === 'capsule' && !compactMode)
        ? `<button class="start-btn start-capsule ${omniOpen ? 'active' : ''}" onclick="toggleDockOmni(event)" oncontextmenu="event.preventDefault();event.stopPropagation();send('openStartHub');" title="Başlat & OmniSearch (Sağ Tık: Üst OmniSearch)">
               ${SVG.sparkles}<span>Ara</span>
           </button>`
        : `<button class="start-btn ${omniOpen ? 'active' : ''}" onclick="toggleDockOmni(event)" oncontextmenu="event.preventDefault();event.stopPropagation();send('openStartHub');" title="Başlat & OmniSearch (Sağ Tık: Üst OmniSearch)">
               ${SVG.sparkles}
               <span class="hover-label">Başlat & OmniSearch</span>
           </button>`;

    const dockWidgets = Array.isArray(state.dockWidgets) ? state.dockWidgets : [];
    const editMode = Boolean(state.dockEditMode);
    document.body.classList.toggle('dock-edit-mode', editMode);

    const zFarLeft = !isVert ? getWidgetsInZone(dockWidgets, 'far-left') : [];
    const zBeforeApps = !isVert ? getWidgetsInZone(dockWidgets, 'before-apps') : [];
    const zAfterApps = !isVert ? getWidgetsInZone(dockWidgets, 'after-apps') : [];
    const zFarRightAll = !isVert ? getWidgetsInZone(dockWidgets, 'far-right') : [];
    const rightClockWidget = zFarRightAll.find(w => w.kind === 'clock') || null;
    const zFarRightExtra = zFarRightAll.filter(w => w.kind !== 'clock');

    const renderZoneContainer = (zoneId, items) => {
        if (isVert || window.innerWidth < 860) return '';
        const rendered = items.map((w, idx) => renderDockMicroWidgetHtml(w, zoneId, idx)).filter(Boolean).join('');
        const isEmpty = !rendered;
        return `<div class="dw-zone ${isEmpty ? 'empty-idle zone-has-only-tag' : ''}" data-dw-zone="${zoneId}"><span class="dw-zone-tag">${escHtml(DOCK_ZONE_LABELS[zoneId] || zoneId)}</span>${rendered}</div>`;
    };
    const farLeftZoneHtml = renderZoneContainer('far-left', zFarLeft);
    const beforeAppsZoneHtml = renderZoneContainer('before-apps', zBeforeApps);
    const afterAppsZoneHtml = renderZoneContainer('after-apps', zAfterApps);
    const farRightZoneHtml = renderZoneContainer('far-right', zFarRightExtra);
    const addWidgetBtnHtml = (!isVert && window.innerWidth >= 860)
        ? `<button class="dw-add-btn ${widgetPickerOpen ? 'open' : ''}" onclick="toggleDockWidgetPicker(event)" title="Alt Dock Widget Ekle / Özelleştir (14 Pro Widget)">${SVG.plus}</button>${editMode ? `<button class="dw-edit-done" onclick="send('setDockEditMode',{active:false})" title="Düzenleme Modunu Kapat (ESC)">✓ Bitti</button>` : ''}`
        : '';

    let appsHtml = '';
    for (let i = 0; i < pinned.length; i++) {
        appsHtml += buildDockIconHtml(pinned[i], i, null);
    }

    if (runningUnpinned.length > 0) {
        appsHtml += `<div class="dock-sep"></div>`;
        if (state.smartTidy) {
            const buckets = getSmartTidyBuckets(runningUnpinned);
            if (expandedAccordionCat && !buckets.some(b => b.id === expandedAccordionCat)) {
                expandedAccordionCat = null;
            }
            for (const b of buckets) {
                if (isVert && b.groups.length === 1) {
                    appsHtml += buildDockIconHtml(b.groups[0], -1, null, 0);
                    continue;
                }
                const isOpen = (expandedAccordionCat === b.id) || (radialAnchorCatId === b.id && Boolean(radialGroupKey));
                const vMosaicHtml = b.icons.length
                    ? `<div class="v-mosaic ${b.icons.length <= 2 ? 'pair' : ''}">${b.icons.slice(0, 4).map(ic => `<img src="data:image/png;base64,${ic}"/>`).join('')}</div>`
                    : SVG.layers;
                const horizHeadHtml = `
                    <div class="stack-icons">
                        ${b.icons.length ? b.icons.slice(0, 3).map(ic => `<img src="data:image/png;base64,${ic}"/>`).join('') : SVG.layers}
                    </div>
                    ${compactMode ? '' : `<span>${escHtml(b.name)}</span>`}
                    <span class="acc-count num">${b.windows.length}</span>
                `;
                const vertHeadHtml = `
                    ${vMosaicHtml}
                    <span class="count-pill num">${b.windows.length}</span>
                    <span class="dock-dot"></span>
                    <span class="hover-label">${escHtml(b.name)} (${b.windows.length})</span>
                `;
                appsHtml += `
                    <div class="acc-bucket ${isOpen ? 'open' : ''} ${b.hasActive ? 'has-active' : ''}"
                         data-cat-id="${b.id}"
                         onmouseenter="scheduleAccordionOpen('${b.id}')"
                         onmouseleave="scheduleAccordionClose('${b.id}')">
                        <div class="acc-head"
                             onclick="handleCategoryClick('${b.id}')"
                             onwheel="handleCategoryWheel(event,'${b.id}')">
                            ${isVert ? vertHeadHtml : horizHeadHtml}
                        </div>
                        <div class="acc-drawer">
                            ${b.groups.map((g, gi) => buildDockIconHtml(g, -1, b.id, gi)).join('')}
                        </div>
                    </div>
                `;
            }
        } else {
            expandedAccordionCat = null;
            for (let i = 0; i < runningUnpinned.length; i++) {
                appsHtml += buildDockIconHtml(runningUnpinned[i], -1, null, i);
            }
        }
    }

    let foldersHtml = '';
    const dockFolders = state.dockFolders || [];
    if (!compactMode || isVert) {
        dockFolders.forEach((f, idx) => {
            const isOpen = (openFolderPath && openFolderPath.toLowerCase() === f.path.toLowerCase());
            foldersHtml += `
                <div class="folder-chip mag-target ${isOpen ? 'open' : ''}" data-folder-idx="${idx}"
                     onclick="toggleFolderStackByIdx(this, ${idx})"
                     oncontextmenu="event.preventDefault();openDockFolderNative(${idx});">
                    ${SVG.folderColor}
                    <span class="hover-label">${escHtml(f.name)}</span>
                </div>
            `;
        });
        if (dockFolders.length < 4) {
            foldersHtml += `
                <div class="folder-chip mag-target" style="width:calc(var(--item-sz)*0.72);height:calc(var(--item-sz)*0.72);opacity:0.75;"
                     onclick="send('pickDockFolder')">
                    ${SVG.plus}
                    <span class="hover-label">Dock'a Klasör Ekle</span>
                </div>
            `;
        }
    }

    const trayCount = state.trayCount ?? (state.trayApps || []).length;
    const dockMode = state.dockMode || (state.dockAutoHide ? 'AutoHide' : 'AlwaysVisible');
    const pinCls = dockMode === 'AlwaysVisible' ? 'active' : (dockMode === 'SmartDodge' ? 'smart-dodge' : '');
    const pinLabel = dockMode === 'AlwaysVisible'
        ? 'Sabit Bar Açık (Tıkla → Akıllı Kaçınma · Sağ Tık → Oto-Gizle)'
        : (dockMode === 'SmartDodge'
            ? 'Akıllı Kaçınma / Yüzen (Tıkla → Sabit Bar · Sağ Tık → Oto-Gizle)'
            : 'Oto-Gizle (Tıkla → Sabit Bar)');

    const showStatus = !isVert && state.showDockStatusCluster !== false && window.innerWidth >= 820;
    const volPct = state.audio?.volume ?? 50;
    const volMuted = Boolean(state.audio?.muted);
    const bat = state.battery || { present: false, percent: 100, charging: false };
    const unread = Number(state.unreadNotifCount || 0);

    const clockInnerHtml = rightClockWidget
        ? renderClockInnerByVariant(rightClockWidget.variant || 'classic')
        : `<span style="font-size:11px;font-weight:700;color:var(--text-2);">${escHtml(state.shortDate || 'Takvim')}</span>`;

    const scrubTip = state.dockScrubGestures !== false
        ? `Hızlı Kontroller · Sürükle/Tekerlek: Ses %${volPct} · Shift: Parlaklık · Orta Tık: Sessiz`
        : `Hızlı Kontroller · Tekerlek: Ses %${volPct} · Orta Tık: Sessiz`;

    const utilsHtml = showStatus ? `
        ${farRightZoneHtml}
        <button class="tray-btn dock-tray-chevron ${trayPopOpen ? 'open' : ''}" onclick="toggleDockTrayPop(event)" title="Gizli Simgeler (${trayCount})">
            ${SVG.tray}
            ${trayCount > 0 ? `<span class="tray-dot-cnt num">${trayCount}</span>` : ''}
        </button>
        <button class="dock-status-pill ${quickControlsOpen ? 'open' : ''}"
                onpointerdown="startStatusScrub(event)"
                onclick="if(window.__suppressNextStatusClick && Date.now()<window.__suppressNextStatusClick) return; toggleQuickControls(event);"
                onauxclick="if(event.button===1){event.preventDefault();event.stopPropagation();send('toggleMute');}"
                onwheel="event.preventDefault();event.stopPropagation();if(event.shiftKey){send('adjustBrightnessDelta',{delta:event.deltaY<0?5:-5});}else{send('adjustVolumeDelta',{delta:event.deltaY<0?2:-2});}"
                title="${scrubTip}">
            <span style="color:${state.wifi?.on !== false ? 'var(--text-1)' : 'var(--text-2)'};display:inline-flex;">${SVG.wifi}</span>
            <span style="color:${volMuted ? 'var(--danger)' : 'var(--text-1)'};display:inline-flex;">${volMuted ? SVG.mute : SVG.vol}</span>
            ${bat.present ? `<span class="st-bat num ${bat.charging ? 'chg' : (bat.percent <= 20 ? 'low' : '')}">${SVG.battery}<span>${bat.percent}%</span></span>` : `<span class="st-bat num">${volPct}%</span>`}
        </button>
        <button class="dock-clock-pill ${calNotifOpen ? 'open' : ''}"
                onclick="toggleCalNotif(event, ${state.notificationMode === 'aurora-mirror' ? 'null' : "'calendar'"})"
                oncontextmenu="event.preventDefault();event.stopPropagation();openWidgetInspector(event,'clock');"
                title="Takvim (Sağ Tık: Saat Stili & Konum)">
            ${clockInnerHtml}
            ${state.notificationMode === 'aurora-mirror'
                ? (unread > 0 ? `<span class="dock-notif-badge num">${unread}</span>` : `<span style="color:var(--text-2);display:inline-flex;">${SVG.bell}</span>`)
                : ''}
        </button>
    ` : `
        <button class="pill-btn dock-v-btn num ${trayPopOpen ? 'active' : ''}" onclick="toggleDockTrayPop(event)" title="Sistem Tepsisi (${trayCount})">
            ${SVG.tray}${isVert ? '' : `<span>${trayCount}</span>`}
            ${isVert && trayCount > 0 ? `<span class="dock-v-badge num">${trayCount}</span>` : ''}
            ${isVert ? `<span class="hover-label">Sistem Tepsisi (${trayCount})</span>` : ''}
        </button>
        ${isVert ? `
        <button class="micro-btn dock-pin-btn ${quickControlsOpen ? 'active' : ''}" onclick="toggleQuickControls(event)" title="Hızlı Kontroller">
            ${SVG.sliders}
            <span class="hover-label">Hızlı Kontroller</span>
        </button>
        <button class="micro-btn dock-pin-btn ${calNotifOpen ? 'active' : ''}" onclick="toggleCalNotif(event, ${state.notificationMode === 'aurora-mirror' ? 'null' : "'calendar'"})" title="Takvim & Ajanda">
            ${SVG.calendar}
            <span class="hover-label">Takvim & Ajanda</span>
        </button>` : ''}
        <button class="micro-btn dock-pin-btn" onclick="send('openSettings',{section:'appearance'})" title="Aurora Ayarları">
            ${SVG.settings}
            <span class="hover-label">Ayarlar</span>
        </button>
        <button class="micro-btn dock-pin-btn ${pinCls}" onclick="toggleDockPin()" oncontextmenu="event.preventDefault();send('setDockAutoHideMode');">
            ${SVG.pin}
            <span class="hover-label">${pinLabel}</span>
        </button>
    `;

    let html;
    if (!isVert) {
        html = `
            <div class="bar-zone-left">
                ${searchHtml}
                ${foldersHtml ? `<div class="dock-sep"></div>${foldersHtml}` : ''}
                ${farLeftZoneHtml}
                ${addWidgetBtnHtml}
            </div>
            <div class="bar-zone-center">
                ${beforeAppsZoneHtml}
                ${appsHtml}
                ${afterAppsZoneHtml}
            </div>
            <div class="bar-zone-right">
                ${utilsHtml}
            </div>
        `;
    } else if (splitLayout) {
        html = `
            <div class="bar-zone-left">
                ${searchHtml}
                ${foldersHtml ? `<div class="dock-sep"></div>${foldersHtml}` : ''}
                ${farLeftZoneHtml}
                ${addWidgetBtnHtml}
            </div>
            <div class="bar-zone-center">
                ${beforeAppsZoneHtml}
                ${appsHtml}
                ${afterAppsZoneHtml}
            </div>
            <div class="bar-zone-right">
                ${utilsHtml}
            </div>
        `;
    } else {
        html = `

            ${foldersHtml ? `<div class="dock-sep"></div>${foldersHtml}` : ''}

        `;
    }

    dock.innerHTML = html;

    fitDockZones();
    applyDockGeometryAndOffset();

                radialAnchorY = cr.top + cr.height / 2;
            }
        }
    } else if (radialGroupKey) {
        const anchorEl = dock.querySelector(`[data-group-key="${CSS.escape(radialGroupKey)}"]`);

            if (ar.width > 0) {
                radialAnchorX = ar.left + ar.width / 2;
                radialAnchorY = ar.top + ar.height / 2;
            }
        }
    }
    renderRadialHub(false);
    renderFolderStackCard();
    if (quickControlsOpen) renderQuickControlsPop();
    if (calNotifOpen) renderCalNotifPop();
    if (trayPopOpen) renderTrayPop();
    if (widgetPickerOpen) renderDockWidgetPickerPop();
    if (widgetInspectorKind) renderWidgetInspectorPop();
    if (quickWheelOpen) renderQuickWheelPop();
    if (aiPopOpen) renderDockAiPop();
    if (ctxMenuOpen) renderCtxMenuPop();
    if (omniOpen) positionOmniBar();
    reportHitRects();
    requestAnimationFrame(reportHitRects);
    if (edgeChanged) { setTimeout(reportHitRects, 140); setTimeout(reportHitRects, 320); }

const DOCK_DM_GLYPHS = {
    '0': [0x0E,0x11,0x13,0x15,0x19,0x11,0x0E], '1': [0x04,0x0C,0x04,0x04,0x04,0x04,0x0E],
    '2': [0x0E,0x11,0x01,0x06,0x08,0x10,0x1F], '3': [0x1F,0x02,0x04,0x06,0x01,0x11,0x0E],
    '4': [0x02,0x06,0x0A,0x12,0x1F,0x02,0x02], '5': [0x1F,0x10,0x1E,0x01,0x01,0x11,0x0E],

    '8': [0x0E,0x11,0x11,0x0E,0x11,0x11,0x0E], '9': [0x0E,0x11,0x11,0x0F,0x01,0x02,0x0C],
    ':': [0x00,0x04,0x04,0x00,0x04,0x04,0x00]
};
function renderDockDot5x7Svg(hhmm) {
    const str = String(hhmm || '--:--').slice(0, 5);
    let dots = '', cx = 1;
    for (const ch of str) {
        if (ch === ':') {
            dots += `<circle cx="${cx+1}" cy="5.5" r="1.1" fill="var(--accent-1)"/><circle cx="${cx+1}" cy="11.5" r="1.1" fill="var(--accent-1)"/>`;
            cx += 4.5; continue;
        }
        const rows = DOCK_DM_GLYPHS[ch] || DOCK_DM_GLYPHS['0'];
        for (let r = 0; r < 7; r++) {
            for (let c = 0; c < 5; c++) {
                if ((rows[r] >> (4 - c)) & 1) {
                    dots += `<circle cx="${cx + c * 2.2}" cy="${1.5 + r * 2.2}" r="0.95" fill="currentColor"/>`;
                }
            }
        }
        cx += 13;
    }
    return `<svg class="dw-dot5x7-svg" id="dockDot5x7" viewBox="0 0 ${Math.ceil(cx)} 17">${dots}</svg>`;
}
function renderDockSparkSvg(arr1, arr2) {
    const mapPts = (arr) => {
        const a = (Array.isArray(arr) && arr.length > 1) ? arr : [10, 14, 12, 18, 16, 20];
        return a.map((v, i) => `${((i / (a.length - 1)) * 46).toFixed(1)},${(17 - Math.max(0, Math.min(100, v)) / 100 * 15).toFixed(1)}`).join(' ');
    };
    return `<svg class="dw-spark-svg" viewBox="0 0 46 18">
        <polyline points="${mapPts(arr2)}" fill="none" stroke="var(--accent-2)" stroke-width="1.4" opacity="0.65" stroke-linecap="round" stroke-linejoin="round"/>
        <polyline points="${mapPts(arr1)}" fill="none" stroke="var(--accent-1)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
}

            </span>
        `;
    }
    if (variant === 'analog') {
        const now = new Date();
        const hDeg = ((now.getHours() % 12) + now.getMinutes() / 60) * 30;
        const mDeg = (now.getMinutes() + now.getSeconds() / 60) * 6;

                <line id="dockAnaS" x1="14" y1="14" x2="14" y2="4.6" stroke="var(--accent-1)" stroke-width="1" stroke-linecap="round" transform="rotate(${sDeg.toFixed(1)} 14 14)"/>

        return `

                <span class="dw-ed-date">${escHtml(dateLine)}</span>

        `;

    if (variant === 'world') {

    return `

    }
    if (w.kind === 'pomodoro') {
        const f = state.focus || { running: false, label: '25:00' };
        const total = Math.max(1, Number(f.totalSeconds || f.durationSecs || 1500));
        const rem = Math.max(0, Math.min(total, Number(f.seconds ?? total)));
        const frac = f.running ? Math.max(0.05, Math.min(1, rem / total)) : (rem < total ? rem / total : 1);
        const dashOffset = (44 * (1 - frac)).toFixed(1);
        if (v === 'pill') {
            return `<button class="${baseCls} num ${f.running ? 'active' : ''}" ${dwAttrs} onclick="${guardClick}send('toggleFocus')" title="Pomodoro (Tıkla: Başlat / Duraklat)"><span style="color:${f.running ? 'var(--accent-1)' : 'var(--text-2)'};display:inline-flex;">${SVG.timer}</span><span>${escHtml(f.label || '25:00')}</span></button>`;
        }
        return `
            <button class="${baseCls} num ${f.running ? 'active' : ''}" ${dwAttrs} onclick="${guardClick}send('toggleFocus')" title="Pomodoro Odak · Tıkla: Başlat / Duraklat · Sağ Tık: Özelleştir">
                <svg class="dw-pomo-ring" viewBox="0 0 18 18">
                    <circle cx="9" cy="9" r="7" fill="none" stroke="var(--border-subtle)" stroke-width="2.1"/>
                    <circle cx="9" cy="9" r="7" fill="none" stroke="${f.running ? 'var(--accent-1)' : 'var(--text-2)'}" stroke-width="2.1"
                            stroke-dasharray="44" stroke-dashoffset="${dashOffset}" stroke-linecap="round" transform="rotate(-90 9 9)"/>
                </svg>
                <span>${escHtml(f.label || '25:00')}</span>
            </button>

    if (w.kind === 'market') {
        const mk = state.market || {};
        if (!mk.valid) {
            return `<button class="${baseCls}" ${dwAttrs} onclick="${guardClick}send('refreshMarket')" title="Döviz & BTC Yükleniyor"><span style="color:var(--accent-1);display:inline-flex;">${SVG.market}</span><span class="dw-sub">Piyasa…</span></button>`;
        }
        const usd = mk.usdTry > 0 ? `$${mk.usdTry.toFixed(2)}` : '';
        const btc = mk.btcUsd > 0 ? `₿${(mk.btcUsd / 1000).toFixed(1)}k` : '';
        return `<button class="${baseCls} num" ${dwAttrs} onclick="${guardClick}send('refreshMarket')" title="USD/TRY · BTC/USD (${escHtml(mk.updatedAtHhmm || '')})"><span>${usd || btc}</span>${usd && btc ? `<span class="dw-sub">${btc}</span>` : ''}</button>`;
    }
    if (w.kind === 'clipboard') {
        const c = state.latestClip;
        const prev = c ? String(c.preview || 'Görsel').slice(0, 14) : 'Pano boş';
        return `<button class="${baseCls}" ${dwAttrs} onclick="${guardClick}send('openToolsHub',{tab:'clipboard'})" title="Son Pano · Tıkla: Pano Kasası"><span style="color:var(--text-2);display:inline-flex;">${SVG.clip}</span><span class="dw-media-txt" style="max-width:74px;">${escHtml(prev)}</span></button>`;
    }
    return '';
}

function handleDockWidgetWheel(e, kind) {
    const dw = (state?.dockWidgets || []).find(w => w.kind === kind);
    let act = dw?.wheelAction || 'default';
    if (act === 'default') {
        if (kind === 'volume-slider') act = 'volume';
        else if (kind === 'brightness-slider') act = 'brightness';
        else if (kind === 'desktops') act = 'desktop';
        else if (kind === 'media') act = 'media';
        else act = 'none';
    }
    if (act === 'none') return;
    e.preventDefault();
    e.stopPropagation();
    const up = e.deltaY < 0;
    if (act === 'volume') send('adjustVolumeDelta', { delta: up ? 2 : -2 });
    else if (act === 'brightness') send('adjustBrightnessDelta', { delta: up ? 5 : -5 });
    else if (act === 'desktop') send('switchVirtualDesktopDelta', { delta: up ? -1 : 1 });
    else if (act === 'media') send('mediaCmd', { cmd: up ? 'next' : 'prev' });
}

function cycleDockWidgetZone(kind) {
    const dw = (state?.dockWidgets || []).find(w => w.kind === kind);
    if (!dw) return;
    const cur = getWidgetZone(dw);
    const idx = DOCK_ZONES.findIndex(z => z[0] === cur);
    const nextZone = DOCK_ZONES[(idx + 1) % DOCK_ZONES.length][0];
    send('moveDockWidget', { kind, targetZone: nextZone, targetIndex: 99 });
}

function openWidgetInspector(e, kind) {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    closeRadialHub(false);
    closeFolderStack(false);
    closeAllDockPopovers(false);
    widgetInspectorKind = kind;
    widgetInspectorX = e ? e.clientX : (window.innerWidth / 2);
    renderWidgetInspectorPop();
    renderDock();
}

function moveWidgetStepInZone(kind, delta) {
    const list = state?.dockWidgets || [];
    const dw = list.find(w => w.kind === kind);
    if (!dw) return;
    const z = getWidgetZone(dw);
    const same = getWidgetsInZone(list, z);
    const idx = same.findIndex(x => x.kind === kind);
    if (idx < 0) return;
    const nextIdx = Math.max(0, Math.min(same.length - 1, idx + delta));
    if (nextIdx !== idx) send('moveDockWidget', { kind, targetZone: z, targetIndex: nextIdx });
}

                ${[['compact','Kompakt'],['normal','Normal'],['wide','Geniş']].map(([k,l]) => `<button class="dwi-btn ${curSize === k ? 'active' : ''}" onclick="send('updateDockWidget',{kind:'${sk}',size:'${k}'})">${l}</button>`).join('')}

                <button class="dwp-mini" onclick="moveWidgetStepInZone('${sk}',-1)" title="Sola Kaydır">← Sola</button>
                <button class="dwp-mini" onclick="moveWidgetStepInZone('${sk}',1)" title="Sağa Kaydır">Sağa →</button>

            <button class="pill-btn subtle" style="height:24px;font-size:10.5px;color:var(--danger);" onclick="send('toggleDockWidget',{kind:'${sk}'});closeAllDockPopovers(true);">Kaldır</button>

function openQuickWheel(cx) {

    quickWheelX = typeof cx === 'number' ? cx : (window.innerWidth / 2);

    const micMuted = Boolean(state.mic?.muted);
    const items = [
        { deg: 0,   label: muted ? 'Sesi Aç' : 'Sessiz', ic: muted ? SVG.mute : SVG.vol, on: muted, act: "send('toggleMute')" },
        { deg: 60,  label: micMuted ? 'Mik Aç' : 'Mik Kapat', ic: micMuted ? SVG.micOff : SVG.mic, on: micMuted, act: "send('toggleMicMute')" },
        { deg: 120, label: 'Medya', ic: state.media?.isPlaying ? SVG.pause : SVG.play, on: Boolean(state.media?.isPlaying), act: "send('mediaCmd',{cmd:'play_pause'})" },
        { deg: 180, label: 'Masaüstü', ic: SVG.desktop, on: false, act: "send('showDesktop')" },
        { deg: 240, label: '50/50 Diz', ic: SVG.pair, on: false, act: "send('applyWindowLayout',{preset:'split'})" },
        { deg: 300, label: 'OCR Tara', ic: SVG.scanText, on: false, act: "send('startScreenOcr')" }

function toggleDockWidgetPicker(e) {
    if (e) e.stopPropagation();
    const next = !widgetPickerOpen;
    closeRadialHub(false);
    closeFolderStack(false);
    closeAllDockPopovers(false);
    widgetPickerOpen = next;
    if (next) renderDockWidgetPickerPop();
    renderDock();
}

function cycleDockWidgetVariant(kind) {
    const dw = (state?.dockWidgets || []).find(w => w.kind === kind);
    const meta = DOCK_WIDGET_META[kind];
    if (!dw || !meta || meta.variants.length <= 1) return;
    const idx = meta.variants.findIndex(v => v[0] === dw.variant);
    const nextVar = meta.variants[(idx + 1) % meta.variants.length][0];
    send('updateDockWidget', { kind, variant: nextVar });
}

function flipDockWidgetSlot(kind) {
    const dw = (state?.dockWidgets || []).find(w => w.kind === kind);
    if (!dw) return;
    send('updateDockWidget', { kind, slot: dw.slot === 'left' ? 'right' : 'left' });
}

const DOCK_WIDGET_CATEGORIES = [
    { id: 'all', label: 'Tümü', kinds: null },

            </div>
        </div>
        <div class="dwp-cats">
            ${DOCK_WIDGET_CATEGORIES.map(c => `<button class="dwp-cat-btn ${widgetPickerCat === c.id ? 'active' : ''}" onclick="setWidgetPickerCat('${c.id}')">${escHtml(c.label)}</button>`).join('')}

    requestAnimationFrame(reportHitRects);

function scheduleDockAutoHide(delayMs = 440) {
    clearTimeout(autoHideTimer);
    autoHideTimer = setTimeout(() => {
        const mode = state?.dockMode || (state?.dockAutoHide ? 'AutoHide' : 'AlwaysVisible');
        const shouldHide = (mode === 'AutoHide') ||
            (mode === 'SmartDodge' && ((liveDodgedOverride !== null) ? liveDodgedOverride : Boolean(state?.dockDodged)));
        const pointerOutside = isVerticalEdge() ? (mouseY === null) : (mouseX === null);
        if (shouldHide && !pointerInRadial && !radialGroupKey && !pointerInFolder && !openFolderPath && !quickControlsOpen && !calNotifOpen && !trayPopOpen && !widgetPickerOpen && !widgetInspectorKind && !quickWheelOpen && !aiPopOpen && !ctxMenuOpen && !omniOpen && !state?.dockEditMode && !isDraggingFileOverDock && pointerOutside) {
            autoHideRevealed = false;
            renderDock();
        }
    }, delayMs);
}

    quickControlsOpen = false;

    widgetPickerOpen = false;
    widgetInspectorKind = null;
    quickWheelOpen = false;
    aiPopOpen = false;
    ctxMenuOpen = false;
    omniOpen = false;
    for (const id of ['dockQuickControls', 'dockCalNotif', 'dockTrayPop', 'dockWidgetPicker', 'dockWidgetInspector', 'dockAiPop', 'dockCtxMenu', 'quickWheelPop', 'omnibar']) {
        const el = document.getElementById(id);

function toggleCalNotif(e, forceTab) {
    if (e) e.stopPropagation();
    const mirror = state?.notificationMode === 'aurora-mirror';
    const next = (mirror && forceTab)
        ? (calNotifOpen ? (calNotifTab !== forceTab ? true : false) : true)
        : !calNotifOpen;
    closeRadialHub(false);
    closeFolderStack(false);
    closeAllDockPopovers(false);
    calNotifOpen = next;
    if (!mirror) {
        calNotifTab = 'calendar';
    } else if (forceTab) {
        calNotifTab = forceTab;
    } else if (next) {
        calNotifTab = (state?.notifications?.length || 0) > 0 ? 'notifications' : 'calendar';
    }
    if (next) {
        if (mirror && calNotifTab === 'notifications') send('markNotificationsRead');
        renderCalNotifPop();
    }
    renderDock();

                    </div>
                `).join('')}
            </div>
        `;
    } else {
        const firstDay = new Date(calViewYear, calViewMonth, 1);
        const startOffset = (firstDay.getDay() + 6) % 7;
        const daysInMonth = new Date(calViewYear, calViewMonth + 1, 0).getDate();
        const prevDays = new Date(calViewYear, calViewMonth, 0).getDate();
        const now = new Date();
        const todayIso = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
        const todayFull = `${now.getDate()} ${monthsTr[now.getMonth()]} · ${daysTr[now.getDay()]}`;

        let cdBadge = 'Geri Sayım';
        if (cd.targetDate && /^\d{4}-\d{2}-\d{2}$/.test(cd.targetDate)) {
            const targetMs = new Date(cd.targetDate + 'T00:00:00').getTime();
            const todayMs = new Date(todayIso + 'T00:00:00').getTime();
            const diffDays = Math.round((targetMs - todayMs) / 86400000);
            cdBadge = diffDays === 0 ? 'Bugün!' : (diffDays > 0 ? `${diffDays} gün` : `${Math.abs(diffDays)} gün geçti`);

        let cells = dows.map(d => `<div class="cal-dow">${d}</div>`).join('');

                    <button class="dwp-mini" onclick="send('toggleFocus')" title="${focus.running ? 'Duraklat' : 'Başlat'}">${focus.running ? 'Duraklat' : 'Başlat'}</button>
                    <button class="dwp-mini" onclick="send('resetFocus')" title="Odak Sayacını Sıfırla">Sıfırla</button>
                </div>
            </div>

            <div class="cal-head">
                <button class="micro-btn" onclick="stepDockCalMonth(-1)">${SVG.chevL}</button>
                <span style="display:inline-flex;align-items:center;gap:6px;">
                    <span>${monthsTr[calViewMonth]} ${calViewYear}</span>
                    <button class="dwp-mini" onclick="jumpDockCalToday()">Bugün</button>
                </span>
                <button class="micro-btn" onclick="stepDockCalMonth(1)">${SVG.chevR}</button>
            </div>
            <div class="cal-grid">${cells}</div>
            <div class="cal-note-row">
                <input id="dockCalNoteInp" class="cal-note-inp" type="text" placeholder="${escHtml(calSelectedDate)} ajanda notu..." value="${escHtml(curNote)}"
                       onfocus="requestDockInputFocus()" onblur="releaseDockInputFocus()"
                       onkeydown="if(event.key==='Enter'){saveDockCalNote();}"/>
                <button class="pill-btn accent" style="height:30px;padding:0 11px;" onclick="saveDockCalNote()">Kaydet</button>
            </div>

            <div class="cal-section">
                <div class="cal-sec-hdr">
                    <span>Görevler (${pendingCnt} açık)</span>
                    <button class="cal-cd-pill" onclick="calCdEditOpen=!calCdEditOpen;renderCalNotifPop();" title="Geri sayım hedefini düzenle">
                        ${SVG.timer}<span>${escHtml(cd.title || 'Hedef')}: <strong class="num" style="color:var(--accent-1);">${escHtml(cdBadge)}</strong></span>
                    </button>
                </div>
                ${calCdEditOpen ? `
                    <div class="cal-note-row">
                        <input id="dockCdTitleInp" class="cal-note-inp" type="text" placeholder="Hedef adı..." value="${escHtml(cd.title || '')}"
                               onfocus="requestDockInputFocus()" onblur="releaseDockInputFocus()"/>
                        <input id="dockCdDateInp" class="cal-note-inp num" type="text" style="max-width:98px;" placeholder="YYYY-AA-GG" value="${escHtml(cd.targetDate || todayIso)}"
                               onfocus="requestDockInputFocus()" onblur="releaseDockInputFocus()"
                               onkeydown="if(event.key==='Enter'){saveDockCalCountdown();}"/>
                        <button class="pill-btn accent" style="height:30px;padding:0 9px;" onclick="saveDockCalCountdown()">✓</button>
                    </div>
                ` : ''}
                <div class="cal-note-row" style="margin-top:0;">
                    <input id="dockCalTodoInp" class="cal-note-inp" type="text" placeholder="Hızlı görev ekle..."
                           onfocus="requestDockInputFocus()" onblur="releaseDockInputFocus()"
                           onkeydown="if(event.key==='Enter'){addDockCalTodo();}"/>
                    <button class="pill-btn" style="height:30px;padding:0 10px;" onclick="addDockCalTodo()">${SVG.plus}</button>
                </div>
                ${todos.length > 0 ? `
                    <div class="cal-todo-list">
                        ${todos.slice(0, 6).map(td => `
                            <div class="cal-todo-row">
                                <button class="cal-todo-chk ${td.done ? 'done' : ''}" onclick="send('toggleTodo',{id:'${escAttr(td.id)}'})">${td.done ? '✓' : ''}</button>

                    </div>
                ` : ''}
            </div>
        `;
    }

    el.innerHTML = mirror ? `
        <div class="cn-tabs">
            <button class="cn-tab ${calNotifTab === 'notifications' ? 'active' : ''}" onclick="switchCalNotifTab('notifications')">Bildirimler ${notifs.length > 0 ? '(' + notifs.length + ')' : ''}</button>

        </div>

    el.classList.add('open');
    requestAnimationFrame(reportHitRects);
}

function buildDockIconHtml(g, pinIndex, catId, runIndex = -1) {
    const isAnchored = (radialGroupKey === g.key);
    const hasAttn = Boolean(g.hasAttention);
    const prog = Number(g.progress || 0);
    const hasProg = prog > 0 && prog < 100;
    const cls = `dock-item mag-target ${g.hasActive ? 'active' : (g.windows.length > 0 ? 'running' : '')} ${isAnchored ? 'radial-anchored' : ''} ${hasAttn ? 'attention' : ''}`;
    const safeKey = escHtml(g.key);
    const safeKeyAttr = escAttr(g.key);
    const safeCat = catId ? `'${escHtml(catId)}'` : 'null';
    const monogram = escHtml((g.displayName || 'A').slice(0, 1).toUpperCase());
    const appIdx = pinIndex >= 0 ? pinIndex : runIndex;
    const dragAttrs = (!catId && appIdx >= 0)
        ? `data-app-key="${safeKey}" data-app-pinned="${pinIndex >= 0 ? '1' : '0'}" data-app-idx="${appIdx}" onpointerdown="startAppDrag(event,'${safeKeyAttr}',${pinIndex >= 0 ? 'true' : 'false'},${appIdx})"`
        : '';
    const singleSub = g.windows.length === 1
        ? cleanWindowTitle(g.windows[0].title, g.displayName)
        : '';
    const labelText = g.windows.length > 1
        ? `${g.displayName} (${g.windows.length})`
        : (singleSub && singleSub.toLowerCase() !== g.displayName.toLowerCase() ? `${g.displayName} · ${shortOrbLabel(singleSub)}` : g.displayName);

    const showAudioBadge = state?.dockPerAppAudio !== false && Boolean(g.audioPid);
    const audioBadgeHtml = showAudioBadge ? `
        <button class="app-audio-badge ${g.audioMuted ? 'muted' : ''}"
                onpointerdown="event.stopPropagation();"
                onclick="event.stopPropagation();send('toggleAppMute',{pid:${g.audioPid},groupKey:'${safeKeyAttr}'});"
                title="${g.audioMuted ? 'Sesi Aç' : 'Uygulamayı Sustur'} (%${g.audioVolume ?? 100} · Alt+Tekerlek: Uygulama Sesi)">
            ${g.audioMuted ? SVG.mute : SVG.vol}
        </button>
    ` : '';

    const progOffset = hasProg ? (152 * (1 - prog / 100)).toFixed(1) : '152';
    const progSvg = hasProg ? `
        <svg class="dock-prog-svg" viewBox="0 0 46 46">
            <rect x="2" y="2" width="42" height="42" rx="12" fill="none" stroke="rgba(52,211,153,0.25)" stroke-width="2.2"/>
            <rect x="2" y="2" width="42" height="42" rx="12" fill="none" stroke="var(--success)" stroke-width="2.4"
                  stroke-dasharray="152" stroke-dashoffset="${progOffset}" stroke-linecap="round"/>
        </svg>
        <span class="prog-pill num">${prog}%</span>
    ` : '';

    const gIcon = resolveItemIcon(g);
    return `
        <div class="${cls}" data-group-key="${safeKey}" ${dragAttrs}
             onmouseenter="onDockItemEnter(this,'${safeKeyAttr}',${g.windows.length},${safeCat})"
             onmouseleave="onDockItemLeave('${safeKeyAttr}')"
             ondragover="onDockAppDragOver(event,this,'${safeKeyAttr}')"
             ondragleave="onDockAppDragLeave(this)"
             ondrop="onDockAppDrop(event,this,'${safeKeyAttr}')"
             onwheel="handleGroupWheel(event,'${safeKeyAttr}')"
             onauxclick="if(event.button===1 && ${g.windows.length}>0){send('closeWindow',{hwnd:${g.windows[0]?.hwnd || 0}});}"
             onclick="handleGroupClick(event,'${safeKeyAttr}')"
             oncontextmenu="event.preventDefault();openRadialForElement(this,'${safeKeyAttr}',${safeCat},true);">
            ${progSvg}
            ${audioBadgeHtml}
            ${(hasAttn && !showAudioBadge) ? `<span class="attn-pip"></span>` : ''}
            <span class="hover-label">${escHtml(labelText)}</span>
            ${gIcon ? `<img src="data:image/png;base64,${gIcon}"/>` : `<div class="fallback-badge">${monogram}</div>`}
            ${g.windows.length > 1 ? `<span class="count-pill num">${g.windows.length}</span>` : ''}
            ${g.windows.length > 0 ? `<span class="dock-dot"></span>` : ''}
        </div>
    `;
}

function onDockAppDragOver(e, el, key) {
    e.preventDefault();
    e.stopPropagation();
    if (!el.classList.contains('drag-target')) {
        document.querySelectorAll('.dock-item.drag-target').forEach(x => x.classList.remove('drag-target'));
        el.classList.add('drag-target');
        clearTimeout(dragFocusTimer);
        dragFocusTimer = setTimeout(() => {
            send('focusGroupForDrop', { key });
        }, 420);
    }
}

function onDockAppDragLeave(el) {
    el.classList.remove('drag-target');
    clearTimeout(dragFocusTimer);
}

function onDockAppDrop(e, el, key) {
    e.preventDefault();
    e.stopPropagation();
    el.classList.remove('drag-target');
    clearTimeout(dragFocusTimer);
    isDraggingFileOverDock = false;
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0 && window.chrome.webview.postMessageWithAdditionalObjects) {
        window.chrome.webview.postMessageWithAdditionalObjects({ action: 'dropOnDockApp', key }, Array.from(e.dataTransfer.files));
    }
}

function toggleFolderStackByIdx(el, idx) {
    const f = (state?.dockFolders || [])[idx];
    if (!f) return;
    closeRadialHub(false);
    if (openFolderPath && openFolderPath.toLowerCase() === f.path.toLowerCase()) {
        closeFolderStack(true);
        return;
    }
    const r = el.getBoundingClientRect();
    openFolderAnchorX = r.left + r.width / 2;
    openFolderAnchorY = r.top + r.height / 2;
    openFolderPath = f.path;
    send('requestFolderStack', { path: f.path });
    renderDock();
}

function openDockFolderNative(idx) {
    const f = (state?.dockFolders || [])[idx];
    if (f) send('launchPath', { path: f.path });
}

function closeFolderStack(updateRects = true) {
    clearTimeout(folderCloseTimer);

    pointerInFolder = false;

        card.className = 'glass-shell';
        card.innerHTML = '';
