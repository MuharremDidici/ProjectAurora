    if (omniIdx >= currentOmniItems.length) omniIdx = Math.max(0, currentOmniItems.length - 1);
    wrap.innerHTML = html;
    syncOmniSelectionVisual();
    requestAnimationFrame(() => { positionOmniBar(); reportHitRects(); });
}

function setOmniHoverIdx(idx) {
    if (omniIdx === idx) return;
    omniIdx = idx;
    syncOmniSelectionVisual();
}

function syncOmniSelectionVisual() {
    const wrap = document.getElementById('omniResultsWrap');
    if (!wrap) return;
    wrap.querySelectorAll('[data-omni-idx]').forEach(node => {
        const i = Number(node.getAttribute('data-omni-idx'));
        node.classList.toggle('sel', i === omniIdx);
        if (i === omniIdx) node.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    });
}

function toggleOmniPin(ev, idx) {
    if (ev) { ev.preventDefault(); ev.stopPropagation(); }
    const it = currentOmniItems[idx];
    if (!it || it.kind !== 'app') return;
    send('togglePin', { name: it.name, path: it.path || '', aumid: it.aumid || '' });
}

function execOmniItem(idx) {
    const it = currentOmniItems[idx];
    if (!it) return;
    if (it.kind === 'smart' && it.copyText) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(it.copyText).catch(() => {});
        }
        closeDockOmni(true);
        return;
    }
    if ((it.kind === 'smart-web' || it.kind === 'web') && it.url) {
        send('openWebUrl', { url: it.url });
        closeDockOmni(true);
        return;
    }
    if (it.kind === 'win' && it.hwnd) {
        send('focusWindow', { hwnd: it.hwnd });
        closeDockOmni(true);
        return;
    }
    if (it.kind === 'clip' && it.clipId !== undefined) {
        send('copyClipById', { id: it.clipId });
        closeDockOmni(true);
        return;
    }
    if (it.kind === 'file' && it.path) {
        send('launchPath', { path: it.path });
        closeDockOmni(true);
        return;
    }
    if (it.kind === 'app') {
        if (it.path) send('launchNewInstance', { path: it.path });
        else if (it.key) send('launchNewInstance', { key: it.key });
        closeDockOmni(true);
        return;
    }
    if (it.kind === 'cmd' && it.act) {
        const a = it.act;
        if (a.t === 'power') send('systemPower', { action: a.v });
        else if (a.t === 'focus25') send('setFocusPreset', { minutes: 25, start: true });
        else if (a.t === 'focusReset') send('resetFocus', {});
        else if (a.t === 'theme') { send('applyTheme', { id: a.id }); return; }
        else if (a.t === 'openThemes') { omniQuery = '> Tema '; renderOmniBar(false); const inp = document.getElementById('omniInput'); if (inp) inp.focus(); return; }
        else if (a.t === 'shell') send('launchPath', { path: 'cmdrun:' + a.cmd });
        closeDockOmni(true);
    }
}

function handleOmniKeydown(e) {
    if (!omniOpen) return;
    const total = currentOmniItems.length;
    if (e.key === 'Escape') {
        e.preventDefault();
        e.stopPropagation();
        closeDockOmni(true);
        return;
    }
    if (e.key === 'Tab') {
        e.preventDefault();
        const order = ['all', 'apps', 'wins', 'cmds', 'clip', 'files'];
        const nextIdx = (order.indexOf(omniFilter) + (e.shiftKey ? order.length - 1 : 1)) % order.length;
        setOmniFilter(order[nextIdx]);
        return;
    }
    if (e.key === 'Enter') {
        e.preventDefault();
        if (total > 0) execOmniItem(omniIdx);
        return;
    }
    if (total === 0) return;

    const gridEl = document.querySelector('#omniResultsWrap .omni-grid');
    const gridStart = gridEl ? Number(gridEl.getAttribute('data-grid-start')) : total;
    let cols = 1;
    if (gridEl && gridEl.children.length > 1) {
        const firstTop = gridEl.children[0].offsetTop;
        let c = 0;
        for (const ch of gridEl.children) {
            if (ch.offsetTop === firstTop) c++; else break;
        }
        cols = Math.max(1, c);
    }

    if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (omniIdx >= gridStart && cols > 1) {
            omniIdx = Math.min(total - 1, omniIdx + cols);
        } else {
            omniIdx = (omniIdx + 1) % total;
        }
        syncOmniSelectionVisual();
    } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (omniIdx >= gridStart && cols > 1) {
            const up = omniIdx - cols;
            omniIdx = up >= gridStart ? up : Math.max(0, gridStart - 1);
        } else {
            omniIdx = (omniIdx - 1 + total) % total;
        }
        syncOmniSelectionVisual();
    } else if (e.key === 'ArrowRight' && omniIdx >= gridStart) {
        e.preventDefault();
        omniIdx = (omniIdx + 1 < total) ? omniIdx + 1 : gridStart;
        syncOmniSelectionVisual();
    } else if (e.key === 'ArrowLeft' && omniIdx >= gridStart) {
        e.preventDefault();
        omniIdx = (omniIdx > gridStart) ? omniIdx - 1 : total - 1;
        syncOmniSelectionVisual();
    }
}

window.chrome.webview.addEventListener('message', e => {
    const msg = e.data;
    if (msg.type === 'state') {
        state = msg.payload;
        ingestIconCache(state);
        liveDodgedOverride = null;
        liveScaleOverride = null;
        renderDock();
        if (omniOpen) renderOmniResults();
    } else if (msg.type === 'catalog') {
        ingestIconCache(msg);
        dockCatalog = {
            installedApps: msg.installedApps || [],
            themes: msg.themes || dockCatalog.themes || [],
            frecency: msg.frecency || dockCatalog.frecency || {}
        };
        if (omniOpen) renderOmniResults();
    } else if (msg.type === 'fileSearchResults') {
        if (!omniOpen) return;
        if (msg.seq === omniFileSearchSeq || (msg.query && msg.query.trim() === omniQuery.trim())) {
            omniLatestFileQuery = msg.query || omniQuery;
            omniLatestFileHits = Array.isArray(msg.items) ? msg.items : (Array.isArray(msg.results) ? msg.results : []);
            renderOmniResults();
        }
    } else if (msg.type === 'toggleOmni' || msg.type === 'toggleDockOmni') {
        toggleDockOmni();
    } else if (msg.type === 'dockLivePreview') {
        liveScaleOverride = typeof msg.scalePercent === 'number' ? msg.scalePercent : null;
        applyDockGeometryAndOffset();
        fitDockZones();
        applyDockGeometryAndOffset();
        reportHitRects();
        requestAnimationFrame(reportHitRects);
    } else if (msg.type === 'syncLayout') {
        applyDockGeometryAndOffset();
        fitDockZones();
        applyDockGeometryAndOffset();
        reportHitRects();
    } else if (msg.type === 'cursorWake') {
        clearTimeout(autoHideTimer);
        if (isDockTuckedNow()) {
            manualTucked = false;
            autoHideRevealed = true;
            renderDock();
        }
    } else if (msg.type === 'cursorLeft') {
        mouseX = null;
        mouseY = null;
        applyParabolicWave();
        if (!pointerInRadial && !radialGroupKey && !pointerInFolder && !openFolderPath) {
            scheduleDockAutoHide(420);
        }
    } else if (msg.type === 'dodgeState') {
        liveDodgedOverride = Boolean(msg.dodged);
        if (!liveDodgedOverride) autoHideRevealed = false;
        renderDock();
    } else if (msg.type === 'folderStackItems') {
        if (msg.path) {
            folderStackCache[msg.path.toLowerCase()] = { name: msg.name, items: msg.items || [] };
            if (openFolderPath && openFolderPath.toLowerCase() === msg.path.toLowerCase()) {
                renderFolderStackCard();
                requestAnimationFrame(reportHitRects);
            }
        }
    } else if (msg.type === 'openRadialPreview') {
        if (!state || !state.groups) return;
        const sorted = [...state.groups].sort((a, b) => (b.windows?.length || 0) - (a.windows?.length || 0));
        let pick = sorted.find(g => (g.windows?.length || 0) > 1);
        if (!pick && state.groups.length >= 3) {
            const baseIcon = resolveItemIcon(state.groups[2]) || resolveItemIcon(state.groups[0]) || null;
            const demoGroup = {
                key: 'preview-opera',
                displayName: 'Opera',
                executablePath: 'opera.exe',
                isPinned: false,
                hasActive: true,
                icon: baseIcon,
                windows: [
                    { hwnd: 101, title: '(4) Anasayfa / X - Opera', processName: 'opera', isActive: false, isTopMost: false },
                    { hwnd: 102, title: 'Teknosa Timpani - Opera', processName: 'opera', isActive: true, isTopMost: false },
                    { hwnd: 103, title: 'pckasasrv3.teknosa.com - Opera', processName: 'opera', isActive: false, isTopMost: true }
                ]
            };
            state = { ...state, smartTidy: false, groups: [...state.groups, demoGroup] };
            renderDock();
            pick = demoGroup;
        }
        if (pick) {
            const el = document.querySelector(`.dock-item[data-group-key="${CSS.escape(pick.key)}"]`);
            if (el) openRadialForElement(el, pick.key, null, false);
        }
    } else if (msg.type === 'openAccordionPreview') {
        if (!state) return;
        closeRadialHub(false);
        const realGroups = (state.groups || []).filter(g => !g.key.startsWith('preview-'));
        const unpinnedReal = realGroups.filter(g => !g.isPinned && g.windows.length > 0);
        if (unpinnedReal.length === 0 && realGroups.length >= 3) {
            const ic1 = resolveItemIcon(realGroups[0]) || null;
            const ic2 = resolveItemIcon(realGroups[1]) || null;
            const ic3 = resolveItemIcon(realGroups[2]) || null;
            state = {
                ...state,
                smartTidy: true,
                groups: [
                    ...realGroups,
                    { key: 'preview-brave', displayName: 'Brave', executablePath: 'brave.exe', isPinned: false, hasActive: false, icon: ic2, windows: [{ hwnd: 201, title: 'GitHub - Brave', processName: 'brave', isActive: false, isTopMost: false }] },
                    { key: 'preview-opera', displayName: 'Opera', executablePath: 'opera.exe', isPinned: false, hasActive: true, icon: ic3, windows: [{ hwnd: 202, title: 'Teknosa Timpani - Opera', processName: 'opera', isActive: true, isTopMost: false }, { hwnd: 203, title: 'Anasayfa / X - Opera', processName: 'opera', isActive: false, isTopMost: false }, { hwnd: 204, title: 'pckasasrv3.teknosa.com - Opera', processName: 'opera', isActive: false, isTopMost: false }] },
                    { key: 'preview-teams', displayName: 'Teams', executablePath: 'teams.exe', isPinned: false, hasActive: false, icon: ic1, windows: [{ hwnd: 205, title: 'Ekip Sohbeti - Microsoft Teams', processName: 'teams', isActive: false, isTopMost: false }] }
                ]
            };
        } else {
            state = { ...state, smartTidy: true, groups: realGroups };
        }
        const buckets = getSmartTidyBuckets((state.groups || []).filter(g => !g.isPinned && g.windows.length > 0));
        if (buckets.length > 0) {
            expandedAccordionCat = buckets[0].id;
        }
        renderDock();
    } else if (msg.type === 'clockTick') {
        if (state && msg.clock) {
            state.clock = msg.clock;
            const ct = document.getElementById('dockClockTime');
            if (ct) ct.textContent = msg.clock;
            const dm = document.getElementById('dockDot5x7');
            if (dm) dm.outerHTML = renderDockDot5x7Svg(msg.clock);
            const parts = msg.clock.split(':');
            const fh = document.getElementById('dockFlipH');
            const fm = document.getElementById('dockFlipM');
            if (fh && parts[0]) fh.textContent = parts[0];
            if (fm && parts[1]) fm.textContent = parts[1];
            const ah = document.getElementById('dockAnaH');
            const am = document.getElementById('dockAnaM');
            const as = document.getElementById('dockAnaS');
            if (ah && am && as) {
                const now = new Date();
                ah.setAttribute('transform', `rotate(${(((now.getHours()%12)+now.getMinutes()/60)*30).toFixed(1)} 14 14)`);
                am.setAttribute('transform', `rotate(${((now.getMinutes()+now.getSeconds()/60)*6).toFixed(1)} 14 14)`);
                as.setAttribute('transform', `rotate(${(now.getSeconds()*6).toFixed(1)} 14 14)`);
            }
        }
        tickDockMediaTimeline();
    } else if (msg.type === 'toggleQuickControls') {
        toggleQuickControls(null);
    } else if (msg.type === 'toggleCalNotif') {
        toggleCalNotif(null, msg.tab || null);
    } else if (msg.type === 'outsideDeactivate') {
        pointerOverDock = false;
        mouseX = null;
        mouseY = null;
        applyParabolicWave();
        if (radialGroupKey || branchCatId) closeRadialHub(true);
        if (openFolderPath) closeFolderStack(true);
        if (omniOpen) closeDockOmni(false);
        if (quickControlsOpen || calNotifOpen || trayPopOpen || widgetPickerOpen || widgetInspectorKind || quickWheelOpen || aiPopOpen || ctxMenuOpen) closeAllDockPopovers(true);
        else releaseDockInputFocus();
        if (expandedAccordionCat) {
            expandedAccordionCat = null;
            renderDock();
        }
    }
});

// Clicking empty space on the Dock bar, app icons, or transparent backdrop closes any open Dock popover on click #1
document.addEventListener('pointerdown', (e) => {
    const anyOpen = radialGroupKey || branchCatId || openFolderPath || expandedAccordionCat
        || quickControlsOpen || calNotifOpen || trayPopOpen || widgetPickerOpen
        || widgetInspectorKind || quickWheelOpen || aiPopOpen || ctxMenuOpen || omniOpen;
    if (!anyOpen) return;
    if (e.target.closest(
        '#omnibar, #radialHub, #folderStackCard, #quickWheelPop, #dockCtxMenu, #dockTrayPop, ' +
        '#dockQuickControls, #dockCalNotif, #dockWidgetPicker, #dockWidgetInspector, #dockAiPop, ' +
        '.dock-pop, .hub-shell-card, .fan3d-card, .win-card, .arc-node, .orb-node, ' +
        '.start-btn, .dock-status-pill, .dock-clock-pill, .dock-tray-chevron, .dw-add-btn, .folder-chip, .acc-head, [data-dw-kind="ai-quota"]'
    )) {
        return;
    }
    if (radialGroupKey || branchCatId) closeRadialHub(true);
    if (openFolderPath) closeFolderStack(true);
    if (omniOpen) closeDockOmni(false);
    if (quickControlsOpen || calNotifOpen || trayPopOpen || widgetPickerOpen || widgetInspectorKind || quickWheelOpen || aiPopOpen || ctxMenuOpen) closeAllDockPopovers(true);
    else releaseDockInputFocus();
    if (expandedAccordionCat) {
        expandedAccordionCat = null;
        renderDock();
    }
});

// Cold-boot / wake-from-sleep self-healing readiness handshake (guarantees Dock never stays empty!)
function signalUiReady() {
    try { window.chrome.webview.postMessage({ type: 'uiReady' }); } catch (_) {}
}
signalUiReady();
const _dockReadyRetry = setInterval(() => {
    if (state) { clearInterval(_dockReadyRetry); return; }
    signalUiReady();
}, 450);
        </script>
