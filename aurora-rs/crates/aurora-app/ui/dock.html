function renderFolderStackCard() {
    const card = document.getElementById('folderStackCard');
    if (!openFolderPath || !state) {
        card.className = 'glass-shell';
        return;
    }
    const prevScroll = card.querySelector('.fstack-list')?.scrollTop || 0;
    const folderInfo = (state.dockFolders || []).find(f => f.path.toLowerCase() === openFolderPath.toLowerCase());
    const folderName = folderInfo?.name || 'Klasör';
    const data = folderStackCache[openFolderPath.toLowerCase()];
    const items = data?.items || [];

    const cardW = 288;
    const edge = getDockEdge();
    const dockR = document.getElementById('dockBar')?.getBoundingClientRect();
    if (isVerticalEdge() && dockR) {
        const rawY = openFolderAnchorY ?? (window.innerHeight / 2);
        const clampedTop = Math.max(10, Math.min(window.innerHeight - 320, rawY - 150));
        card.style.bottom = 'auto';
        card.style.top = `${clampedTop.toFixed(1)}px`;
        const leftPos = edge === 'Left'
            ? (dockR.right + 12)
            : Math.max(8, dockR.left - cardW - 12);
        card.style.left = `${leftPos.toFixed(1)}px`;
    } else {
        const rawX = openFolderAnchorX ?? (window.innerWidth / 2);
        const clampedLeft = Math.max(10, Math.min(window.innerWidth - cardW - 10, rawX - cardW / 2));
        card.style.top = 'auto';
        card.style.bottom = '68px';
        card.style.left = `${clampedLeft.toFixed(1)}px`;
    }
    card.className = 'glass-shell open';

    card.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;">
            <span style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--text-1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                ${SVG.folder}<span>${escHtml(folderName)}</span>
            </span>
            <div style="display:flex;gap:4px;flex-shrink:0;">
                <button class="micro-btn" onclick="openCurrentFolderStack()" title="Gezginde Aç">${SVG.desktop}</button>
                <button class="micro-btn" onclick="send('pickDockFolder');closeFolderStack(true);" title="Yeni Klasör Ekle">${SVG.plus}</button>
                <button class="micro-btn danger" onclick="removeCurrentFolderStack()" title="Dock'tan Kaldır">${SVG.trash}</button>
                <button class="micro-btn" onclick="closeFolderStack(true)">${SVG.close}</button>
            </div>
        </div>
        ${!data ? `<div style="padding:14px;text-align:center;font-size:11.5px;color:var(--text-2);">Yükleniyor…</div>` :
          items.length === 0 ? `<div style="padding:14px;text-align:center;font-size:11.5px;color:var(--text-2);">Bu klasör şu an boş.</div>` : `
            <div class="fstack-list">
                ${items.map((it, idx) => `
                    <div class="fstack-row" onclick="openFolderStackItem(${idx})">
                        ${it.icon ? `<img src="data:image/png;base64,${it.icon}"/>` : `<span style="width:20px;display:inline-flex;justify-content:center;color:var(--accent-1);">${it.isDir ? SVG.folder : SVG.note}</span>`}
                        <div style="flex:1;min-width:0;">
                            <div style="font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escHtml(it.name)}</div>
                            <div style="font-size:10px;color:var(--text-2);" class="num">${escHtml(it.size)}${it.mod ? ' · ' + escHtml(it.mod) : ''}</div>
                        </div>
                        <button class="micro-btn" style="width:22px;height:22px;" onclick="event.stopPropagation();revealFolderStackItem(${idx});" title="Klasörde Göster">${SVG.folder}</button>
                    </div>
                `).join('')}
            </div>
        `}
    `;
    const newList = card.querySelector('.fstack-list');
    if (newList && prevScroll > 0) newList.scrollTop = prevScroll;
    requestAnimationFrame(reportHitRects);
    setTimeout(reportHitRects, 200);
}

function openCurrentFolderStack() {
    if (!openFolderPath) return;
    const p = openFolderPath;
    closeFolderStack(true);
    send('launchPath', { path: p });
}

function removeCurrentFolderStack() {
    if (!openFolderPath) return;
    const p = openFolderPath;
    closeFolderStack(true);
    send('removeDockFolder', { path: p });
}

function openFolderStackItem(idx) {
    if (!openFolderPath) return;
    const items = folderStackCache[openFolderPath.toLowerCase()]?.items || [];
    const it = items[idx];
    if (!it) return;
    closeFolderStack(true);
    send('launchPath', { path: it.path });
}

function revealFolderStackItem(idx) {
    if (!openFolderPath) return;
    const items = folderStackCache[openFolderPath.toLowerCase()]?.items || [];
    const it = items[idx];
    if (!it) return;
    closeFolderStack(true);
    send('launchPath', { path: 'reveal:' + it.path });
}

function scheduleAccordionOpen(catId) {
    clearTimeout(accCloseTimer);
    clearTimeout(accOpenTimer);
    clearTimeout(radialCloseTimer);
    if (branchCatId === catId) return;
    const delay = (branchCatId || radialGroupKey) ? 75 : 120;
    accOpenTimer = setTimeout(() => openAccordionCat(catId), delay);
}

function openAccordionCat(catId) {
    clearTimeout(accOpenTimer);
    clearTimeout(accCloseTimer);
    clearTimeout(radialCloseTimer);
    clearTimeout(hoverRadialTimer);
    closeFolderStack(false);

    const catEl = document.querySelector(`.acc-bucket[data-cat-id="${CSS.escape(catId)}"]`);
    if (catEl) {
        const cr = catEl.getBoundingClientRect();
        if (cr.width > 0) {
            radialAnchorX = cr.left + cr.width / 2;
            radialAnchorY = cr.top + cr.height / 2;
        }
    }
    branchCatId = catId;
    expandedAccordionCat = catId;
    radialAnchorCatId = catId;
    radialGroupKey = null;
    radialSelectedHwnd = null;
    syncDockAnchorClasses();
    renderRadialHub(true);
    requestAnimationFrame(reportHitRects);
}

function scheduleAccordionClose(catId) {
    clearTimeout(accOpenTimer);
    clearTimeout(accCloseTimer);
    accCloseTimer = setTimeout(() => {
        if (pointerInRadial) return;
        if (branchCatId === catId) {
            closeRadialHub(true);
        }
    }, 300);
}

function handleCategoryClick(catId) {
    const runningUnpinned = (state?.groups || []).filter(g => !g.isPinned && g.windows.length > 0);
    const b = getSmartTidyBuckets(runningUnpinned).find(x => x.id === catId);
    if (!b || b.windows.length === 0) return;
    send('cycleCategoryWindows', { hwnds: b.windows.map(w => w.hwnd), delta: 1, fromWheel: false });
}

function handleCategoryWheel(e, catId) {
    e.preventDefault();
    e.stopPropagation();
    const runningUnpinned = (state?.groups || []).filter(g => !g.isPinned && g.windows.length > 0);
    const b = getSmartTidyBuckets(runningUnpinned).find(x => x.id === catId);
    if (!b || b.windows.length === 0) return;
    send('cycleCategoryWindows', { hwnds: b.windows.map(w => w.hwnd), delta: e.deltaY > 0 ? 1 : -1, fromWheel: true });
}

function onDockItemEnter(el, key, winCount, catId) {
    clearTimeout(hoverRadialTimer);
    if (catId) clearTimeout(accCloseTimer);
    if (radialGroupKey === key) {
        clearTimeout(radialCloseTimer);
        return;
    }
    if (winCount > 1 && !dragAppState && !dragWidgetState) {
        const delay = radialGroupKey ? 90 : 145;
        hoverRadialTimer = setTimeout(() => {
            if (!dragAppState && !dragWidgetState) openRadialForElement(el, key, catId, false);
        }, delay);
    } else if (radialGroupKey && !pointerInRadial) {
        scheduleRadialClose(220);
    }
}

function onDockItemLeave(key) {
    clearTimeout(hoverRadialTimer);
    if (radialGroupKey === key) {
        scheduleRadialClose(320);
    }
}

function openRadialForElement(el, key, catId, isToggleIfSame) {
    clearTimeout(hoverRadialTimer);
    clearTimeout(radialCloseTimer);
    clearTimeout(accOpenTimer);
    clearTimeout(accCloseTimer);
    closeFolderStack(false);
    if (isToggleIfSame && radialGroupKey === key && !branchCatId) {
        closeRadialHub(true);
        return;
    }
    const r = el.getBoundingClientRect();
    radialAnchorX = r.left + r.width / 2;
    radialAnchorY = r.top + r.height / 2;
    branchCatId = null;
    expandedAccordionCat = null;
    radialGroupKey = key;
    radialAnchorCatId = catId || null;

    const g = (state?.groups || []).find(x => x.key === key);
    if (g && g.windows.length > 0) {
        const act = g.windows.find(w => w.isActive) || g.windows[0];
        radialSelectedHwnd = act.hwnd;
    } else {
        radialSelectedHwnd = null;
    }

    syncDockAnchorClasses();
    renderRadialHub(true);
    requestAnimationFrame(reportHitRects);
}

function syncDockAnchorClasses() {
    document.querySelectorAll('.dock-item.radial-anchored').forEach(x => x.classList.remove('radial-anchored'));
    document.querySelectorAll('.acc-bucket.open').forEach(x => x.classList.remove('open'));
    if (branchCatId) {
        const cel = document.querySelector(`.acc-bucket[data-cat-id="${CSS.escape(branchCatId)}"]`);
        if (cel) cel.classList.add('open');
    } else if (radialGroupKey) {
        const el = document.querySelector(`.dock-item[data-group-key="${CSS.escape(radialGroupKey)}"]`);
        if (el) el.classList.add('radial-anchored');
    }
}

function scheduleRadialClose(delayMs = 300) {
    clearTimeout(radialCloseTimer);
    radialCloseTimer = setTimeout(() => {
        if (!pointerInRadial) {
            closeRadialHub(true);
        }
    }, delayMs);
}

function hideDwmPreviewNow() {
    clearTimeout(dwmPreviewTimer);
    if (dwmPreviewActiveHwnd !== null) {
        dwmPreviewActiveHwnd = null;
        send('hideDwmPreview');
    }
}

function scheduleDwmPreview(hwnd, immediate = false) {
    clearTimeout(dwmPreviewTimer);
    if (!hwnd || state?.dwmLivePreview === false || (!radialGroupKey && !branchCatId)) {
        hideDwmPreviewNow();
        return;
    }
    const delay = (immediate || dwmPreviewActiveHwnd !== null) ? 45 : 210;
    dwmPreviewTimer = setTimeout(() => {
        if ((!radialGroupKey && !branchCatId) || !pointerInRadial) return;
        const hub = document.getElementById('radialHub');
        if (!hub) return;
        const r = hub.getBoundingClientRect();
        if (r.width <= 0 || r.height <= 0) return;
        dwmPreviewActiveHwnd = hwnd;
        send('showDwmPreview', {
            hwnd,
            hubLeft: r.left,
            hubTop: r.top,
            hubWidth: r.width,
            hubHeight: r.height,
            vw: window.innerWidth,
            vh: window.innerHeight
        });
    }, delay);
}

function closeRadialHub(updateHitRects = true) {
    clearTimeout(hoverRadialTimer);
    clearTimeout(radialCloseTimer);
    clearTimeout(orbTargetTimer);
    clearTimeout(branchSubTimer);
    clearTimeout(accOpenTimer);
    clearTimeout(accCloseTimer);
    clearTimeout(constellationHoverTimer);
    hideDwmPreviewNow();
    radialGroupKey = null;
    branchCatId = null;
    expandedAccordionCat = null;
    radialLastOpenedKey = null;
    constellationSig = null;
    constellationHoveredId = null;
    constellationNodes = [];
    radialSelectedHwnd = null;
    radialAnchorCatId = null;
    pointerInRadial = false;
    const hub = document.getElementById('radialHub');
    if (hub) {
        hub.className = '';
        hub.innerHTML = '';
        hub.style.width = '';
        hub.style.height = '';
    }
    syncDockAnchorClasses();
    if (updateHitRects) requestAnimationFrame(reportHitRects);
}

function handleGroupClick(e, key) {
    clearTimeout(hoverRadialTimer);
    if (window.__suppressNextDockClick && Date.now() < window.__suppressNextDockClick) return;
    const g = (state?.groups || []).find(x => x.key === key);
    if (!g) return;
    closeRadialHub(false);
    closeFolderStack(false);
    if (e && e.shiftKey) {
        send('launchNewInstance', { key });
        return;
    }
    if (g.windows.length === 0) {
        send('invokeGroup', { key });
    } else {
        send('cycleGroupWindow', { key, delta: 1, fromWheel: false });
    }
}

function handleGroupWheel(e, key) {
    const g = (state?.groups || []).find(x => x.key === key);
    if (!g || g.windows.length === 0) return;
    e.preventDefault();
    e.stopPropagation();
    if (e.altKey && state?.dockPerAppAudio !== false && g.audioPid) {
        send('adjustAppVolumeDelta', { pid: g.audioPid, groupKey: key, delta: e.deltaY < 0 ? 5 : -5 });
        return;
    }
    const delta = e.deltaY > 0 ? 1 : -1;
    send('cycleGroupWindow', { key, delta, fromWheel: true });
    if (radialGroupKey === key && g.windows.length > 1) {
        const idx = Math.max(0, g.windows.findIndex(w => w.hwnd === radialSelectedHwnd));
        const next = g.windows[(idx + (delta > 0 ? 1 : -1) + g.windows.length) % g.windows.length];
        if (next) setTargetedOrbImmediate(next.hwnd);
    }
}

function polar(cx, cy, r, deg) {
    const rad = (deg * Math.PI) / 180;
    return { x: cx + r * Math.sin(rad), y: cy - r * Math.cos(rad) };
}

function orbArcPath(cx, cy, r, a0, a1) {
    const p0 = polar(cx, cy, r, a0);
    const p1 = polar(cx, cy, r, a1);
    const lg = Math.abs(a1 - a0) > 180 ? 1 : 0;
    return `M ${p0.x.toFixed(1)} ${p0.y.toFixed(1)} A ${r.toFixed(1)} ${r.toFixed(1)} 0 ${lg} 1 ${p1.x.toFixed(1)} ${p1.y.toFixed(1)}`;
}

function orbCurveBetween(x1, y1, r1, x2, y2, r2, bend) {
    const dx = x2 - x1, dy = y2 - y1;
    const dist = Math.hypot(dx, dy) || 1;
    const ux = dx / dist, uy = dy / dist;
    const sx = x1 + ux * r1, sy = y1 + uy * r1;
    const ex = x2 - ux * r2, ey = y2 - uy * r2;
    const mx = (sx + ex) / 2, my = (sy + ey) / 2;
    const isVert = isVerticalEdge();
    const cpx = isVert ? (mx + bend) : (mx + (x1 - x2) * 0.08);
    const cpy = isVert ? (my + (y1 - y2) * 0.08) : (my + bend);
    return `M ${sx.toFixed(1)} ${sy.toFixed(1)} Q ${cpx.toFixed(1)} ${cpy.toFixed(1)}, ${ex.toFixed(1)} ${ey.toFixed(1)}`;
}

function fanAnglesForCount(count) {
    if (count <= 1) return { angles: [0], radius: 74 };
    if (count === 2) return { angles: [-46, 46], radius: 86 };
    if (count === 3) return { angles: [-58, 0, 58], radius: 92 };
    if (count === 4) return { angles: [-66, -22, 22, 66], radius: 102 };
    if (count === 5) return { angles: [-70, -35, 0, 35, 70], radius: 110 };
    return { angles: [-74, -44, -15, 15, 44, 74], radius: 118 };
}

function pairRadialGroupWindows(key) {
    const k = key || radialGroupKey;
    if (!k) return;
    closeRadialHub(true);
    send('pairGroupWindows', { key: k });
}

function buildConstellationModel() {
    const edge = getDockEdge();
    const isVert = isVerticalEdge();
    const baseDeg = edge === 'Left' ? 90 : (edge === 'Right' ? -90 : 0);
    const nodes = [];
    const edges = [];
    let rootBarMeta = null;

    if (branchCatId) {
        // MODE A: Smart Tidy Category Dendritic Constellation (Level 1 = Apps, Level 2 = Multi-window app leaves!)
        const runningUnpinned = (state.groups || []).filter(g => !g.isPinned && g.windows.length > 0);
        const bucket = getSmartTidyBuckets(runningUnpinned).find(b => b.id === branchCatId);
        if (!bucket || bucket.groups.length === 0) return null;

        const groups = bucket.groups.slice(0, 6);
        const multiCount = groups.filter(g => g.windows.length > 1).length;
        const maxKidsPerApp = multiCount <= 1 ? 5 : 3;
        const fan = fanAnglesForCount(groups.length);

        groups.forEach((g, idx) => {
            const relDeg = fan.angles[idx];
            const outDeg = baseDeg + relDeg;
            const p1 = polar(0, 0, fan.radius, outDeg);
            const hasKids = g.windows.length > 1;
            const w0 = g.windows[0] || null;
            const appNodeId = `app:${g.key}`;
            const pNode = {
                id: appNodeId,
                level: 1,
                r: 21,
                x: p1.x,
                y: p1.y,
                relDeg,
                outDeg,
                parentId: null,
                groupKey: g.key,
                hwnd: (!hasKids && w0) ? w0.hwnd : null,
                isTopMost: Boolean(!hasKids && w0 && w0.isTopMost),
                isActive: Boolean(g.hasActive),
                hasKids,
                kidCount: g.windows.length,
                isLeaf: !hasKids && Boolean(w0),
                icon: resolveItemIcon(g) || null,
                monogram: (g.displayName || 'A').slice(0, 1).toUpperCase(),
                label: shortOrbLabel(g.displayName),
                fullTitle: hasKids
                    ? `${g.displayName} · ${g.windows.length} Pencere`
                    : (w0 ? `${g.displayName} — ${cleanWindowTitle(w0.title, g.displayName)}` : g.displayName),
                stagger: idx
            };
            nodes.push(pNode);
            edges.push({ fromNode: null, toNode: pNode, bend: isVert ? (edge === 'Left' ? -10 : 10) : 10 });

            if (hasKids) {
                const kids = g.windows.slice(0, maxKidsPerApp);
                const lean = relDeg < -8 ? (relDeg - 6) : (relDeg > 8 ? (relDeg + 6) : 0);
                const spread = kids.length === 2 ? 46 : (kids.length === 3 ? 38 : 32);
                const kDist = kids.length <= 2 ? 66 : (kids.length === 3 ? 72 : 78);
                kids.forEach((w, ci) => {
                    const rawRel = lean + (ci - (kids.length - 1) / 2) * spread;
                    const clampedRel = Math.max(-80, Math.min(80, rawRel));
                    const cDeg = baseDeg + clampedRel;
                    const p2 = polar(p1.x, p1.y, kDist, cDeg);
                    const clean = cleanWindowTitle(w.title, g.displayName);
                    const cNode = {
                        id: `win:${w.hwnd}`,
                        level: 2,
                        r: 18,
                        x: p2.x,
                        y: p2.y,
                        relDeg: clampedRel,
                        outDeg: cDeg,
                        parentId: appNodeId,
                        groupKey: g.key,
                        hwnd: w.hwnd,
                        isTopMost: Boolean(w.isTopMost),
                        isActive: Boolean(w.isActive),
                        hasKids: false,
                        kidCount: 0,
                        isLeaf: true,
                        icon: resolveItemIcon(g) || null,
                        monogram: (g.displayName || 'A').slice(0, 1).toUpperCase(),
                        label: shortOrbLabel(clean),
                        fullTitle: `${g.displayName} — ${clean}`,
                        stagger: idx + 1 + ci
                    };
                    nodes.push(cNode);
                    edges.push({ fromNode: pNode, toNode: cNode, bend: isVert ? (edge === 'Left' ? -6 : 6) : 6 });
                });
            }
        });

        const firstMulti = groups.find(g => g.windows.length >= 2);
        if (firstMulti) {
            rootBarMeta = { isCat: true, pairKey: firstMulti.key, pairName: firstMulti.displayName };
        }
    } else {
        // MODE B: Direct Dock App Constellation (Level 1 = Fixed Window Orbs + Whisper-Thin Root Micro-Bar!)
        const g = (state.groups || []).find(x => x.key === radialGroupKey);
        if (!g) return null;
        const wins = (g.windows || []).slice(0, 6);

        if (wins.length === 0) {
            const p0 = polar(0, 0, 66, baseDeg);
            const launchNode = {
                id: `launch:${g.key}`,
                level: 1,
                r: 22,
                x: p0.x,
                y: p0.y,
                relDeg: 0,
                outDeg: baseDeg,
                parentId: null,
                groupKey: g.key,
                hwnd: null,
                isTopMost: false,
                isActive: true,
                hasKids: false,
                kidCount: 0,
                isLeaf: false,
                isLaunch: true,
                icon: resolveItemIcon(g) || null,
                monogram: (g.displayName || 'A').slice(0, 1).toUpperCase(),
                label: shortOrbLabel(g.displayName),
                fullTitle: `${g.displayName} · Başlat`,
                stagger: 0
            };
            nodes.push(launchNode);
            edges.push({ fromNode: null, toNode: launchNode, bend: 0 });
        } else {
            const fan = fanAnglesForCount(wins.length);
            wins.forEach((w, idx) => {
                const relDeg = fan.angles[idx];
                const outDeg = baseDeg + relDeg;
                const p1 = polar(0, 0, fan.radius, outDeg);
                const clean = cleanWindowTitle(w.title, g.displayName);
                const wNode = {
                    id: `win:${w.hwnd}`,
                    level: 1,
                    r: 21,
                    x: p1.x,
                    y: p1.y,
                    relDeg,
                    outDeg,
                    parentId: null,
                    groupKey: g.key,
                    hwnd: w.hwnd,
                    isTopMost: Boolean(w.isTopMost),
                    isActive: Boolean(w.isActive),
                    hasKids: false,
                    kidCount: 0,
                    isLeaf: true,
                    icon: resolveItemIcon(g) || null,
                    monogram: (g.displayName || 'A').slice(0, 1).toUpperCase(),
                    label: shortOrbLabel(clean),
                    fullTitle: clean,
                    stagger: idx
                };
                nodes.push(wNode);
                edges.push({ fromNode: null, toNode: wNode, bend: isVert ? (edge === 'Left' ? -10 : 10) : 10 });
            });
        }

        rootBarMeta = {
            isCat: false,
            groupKey: g.key,
            isPinned: Boolean(g.isPinned),
            winCount: wins.length
        };
    }

    // Build structural signature to avoid rebuilding DOM on idle telemetry refreshes
    const sig = `${edge}|${branchCatId || ''}|${radialGroupKey || ''}|` +
        nodes.map(n => `${n.id}:${n.isActive?1:0}:${n.isTopMost?1:0}:${n.kidCount}:${n.label}`).join(',') +
        `|${rootBarMeta ? `${rootBarMeta.isPinned?1:0}:${rootBarMeta.winCount||0}:${rootBarMeta.pairKey||''}` : ''}`;

    return { edge, isVert, baseDeg, nodes, edges, rootBarMeta, sig };
}

function renderRadialHub(forceAnimate) {
    const hub = document.getElementById('radialHub');
    if ((!radialGroupKey && !branchCatId) || !state) {
        hub.className = '';
        hub.innerHTML = '';
        constellationSig = null;
        constellationNodes = [];
        return;
    }

    // Dispatch to selectable v4.0 Multi-Window Hub Style (dendritic | fan3d | cards | radial)
    const hubStyle = state.dockHubStyle || 'dendritic';
    if (!branchCatId && hubStyle !== 'dendritic') {
        const g = (state.groups || []).find(x => x.key === radialGroupKey);
        if (!g) { closeRadialHub(true); return; }
        renderAlternateHubStyle(hub, g, hubStyle, forceAnimate);
        return;
    }

    const model = buildConstellationModel();
    if (!model || model.nodes.length === 0) {
        closeRadialHub(true);
        return;
    }

    const activeKeySig = `${branchCatId || ''}|${radialGroupKey || ''}`;
    const shouldAnimate = forceAnimate || (radialLastOpenedKey !== activeKeySig);

    // If background telemetry refreshed state without changing anything in this constellation, skip DOM rebuild!
    if (!shouldAnimate && constellationSig === model.sig && hub.classList.contains('open')) {
        return;
    }
    radialLastOpenedKey = activeKeySig;
    constellationSig = model.sig;

    // Ensure a valid initial hovered/selected node (active window first)
    if (!constellationHoveredId || !model.nodes.some(n => n.id === constellationHoveredId)) {
        const pref = model.nodes.find(n => n.isLeaf && n.isActive)
            || model.nodes.find(n => n.isLeaf)
            || model.nodes[0];
        constellationHoveredId = pref ? pref.id : null;
        radialSelectedHwnd = (pref && pref.hwnd) ? pref.hwnd : null;
    }

    // Compute generous, zero-overlap local bounding box (pure open air around every circle!)
    let minX = -176, maxX = 176, minY = -28, maxY = 4;
    if (model.isVert) {
        minX = model.edge === 'Left' ? -10 : -180;
        maxX = model.edge === 'Left' ? 180 : 10;
        minY = -90;
        maxY = 90;
    }
    model.nodes.forEach(n => {
        const padSide = n.r + 44; // room for centered 88px micro-label with zero clipping
        const padBot = n.r + 24;
        const padTop = n.r + 16;
        minX = Math.min(minX, n.x - padSide);
        maxX = Math.max(maxX, n.x + padSide);
        minY = Math.min(minY, n.y - padTop);
        maxY = Math.max(maxY, n.y + padBot);
    });
    // Reserve 44px clean header band right beneath DWM live preview for the single unified top action pill!
    minY -= 44;

    const hubW = Math.ceil(maxX - minX);
    const hubH = Math.ceil(maxY - minY);
    const offX = -minX;
    const offY = -minY;

    // Position #radialHub flush against the Dock rim, centered on radialAnchorX/Y!
    const dockR = document.getElementById('dockBar')?.getBoundingClientRect();
    let rootX = offX;
    let rootY = offY;

    if (model.isVert && dockR) {
        const rawY = radialAnchorY ?? (window.innerHeight / 2);
        const clampedTop = Math.max(8, Math.min(window.innerHeight - hubH - 8, rawY - offY));
        const leftPos = model.edge === 'Left'
            ? Math.min(window.innerWidth - hubW - 8, dockR.right)
            : Math.max(8, dockR.left - hubW);
        hub.style.bottom = 'auto';
        hub.style.top = `${clampedTop.toFixed(1)}px`;
        hub.style.left = `${leftPos.toFixed(1)}px`;
        rootX = model.edge === 'Left' ? 2 : (hubW - 2);
        rootY = Math.max(22, Math.min(hubH - 22, rawY - clampedTop));
    } else {
        const rawAnchorX = (radialAnchorX ?? (window.innerWidth / 2));
        const clampedLeft = Math.max(8, Math.min(window.innerWidth - hubW - 8, rawAnchorX - offX));
        const bottomPx = dockR ? Math.max(40, Math.round(window.innerHeight - dockR.top)) : 52;
        hub.style.top = 'auto';
        hub.style.bottom = `${bottomPx}px`;
        hub.style.left = `${clampedLeft.toFixed(1)}px`;
        rootX = Math.max(20, Math.min(hubW - 20, rawAnchorX - clampedLeft));
        rootY = hubH - 2;
    }

    hub.style.width = `${hubW}px`;
    hub.style.height = `${hubH}px`;

    // Shift node positions strictly inside [0, hubW] x [0, hubH]
    const shiftX = offX;
    const shiftY = offY;
    const nodes = model.nodes.map(n => ({
        ...n,
        px: n.x + shiftX,
        py: n.y + shiftY
    }));
    const nodeById = {};
    nodes.forEach(n => { nodeById[n.id] = n; });
    constellationNodes = nodes;

    // Build SVG curved organic stems + glow layer (100% open & clean!)
    let stemsHtml = '';
    model.edges.forEach(e => {
        const from = e.fromNode ? nodeById[e.fromNode.id] : null;
        const to = nodeById[e.toNode.id];
        if (!to) return;
        const x1 = from ? from.px : rootX;
        const y1 = from ? from.py : rootY;
        const r1 = from ? (from.r + 1.5) : 4;
        const d = orbCurveBetween(x1, y1, r1, to.px, to.py, to.r + 1.5, e.bend);
        const edgeAttr = `data-edge-to="${escAttr(to.id)}" data-edge-parent="${escAttr(to.parentId || '')}"`;
        stemsHtml += `<path class="orb-stem-glow" ${edgeAttr} d="${d}" filter="url(#orbSilkGlow)"/>`;
        stemsHtml += `<path class="orb-stem" ${edgeAttr} d="${d}"/>`;
    });

    const svgHtml = `
        <svg class="const-svg-layer" viewBox="0 0 ${hubW} ${hubH}">
            <defs>
                <filter id="orbSilkGlow" x="-40%" y="-40%" width="180%" height="180%">
                    <feGaussianBlur stdDeviation="2.4" result="b"/>
                    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
                </filter>
            </defs>
            ${stemsHtml}
            <circle cx="${rootX.toFixed(1)}" cy="${rootY.toFixed(1)}" r="7" fill="var(--accent-1)" opacity="0.22"/>
            <circle cx="${rootX.toFixed(1)}" cy="${rootY.toFixed(1)}" r="3.6" fill="var(--accent-1)" stroke="rgba(10,14,24,0.92)" stroke-width="1.4"/>
        </svg>
    `;

    // Build single unified top control bar + completely uncluttered fixed glass orbs!
    let domHtml = `<div class="orb-topbar" id="orbTopBar"></div>`;

    nodes.forEach(n => {
        const dia = n.r * 2;
        const safeId = escAttr(n.id);
        const icHtml = n.icon
            ? `<img class="orb-ic" src="data:image/png;base64,${n.icon}"/>`
            : `<span class="orb-mono">${escHtml(n.monogram)}</span>`;

        const clickCode = n.isLaunch
            ? `launchRadialGroup()`
            : (n.hwnd
                ? `send('focusWindow',{hwnd:${n.hwnd}});closeRadialHub(true);`
                : `handleGroupClick(event,'${escAttr(n.groupKey)}')`);
        const midClickCode = n.hwnd
            ? `if(event.button===1){event.stopPropagation();send('closeWindow',{hwnd:${n.hwnd}});}`
            : '';

        domHtml += `
            <div class="orb-node ${n.level === 2 ? 'orb-child' : ''} ${n.isActive ? 'active-win' : ''}"
                 data-orb-id="${safeId}"
                 data-orb-hwnd="${n.hwnd || 0}"
                 onmouseenter="setConstellationHover('${safeId}')"
                 onclick="${clickCode}"
                 onauxclick="${midClickCode}"
                 style="left:${n.px.toFixed(1)}px;top:${n.py.toFixed(1)}px;width:${dia}px;height:${dia}px;--stagger:${n.stagger};">
                ${icHtml}
                ${n.hasKids ? `<span class="orb-cnt-badge num">${n.kidCount}</span>` : ''}
                ${(!n.hasKids && n.isActive && !n.isLaunch) ? `<span class="orb-live-dot"></span>` : ''}
                <span class="orb-cap">${escHtml(n.label)}</span>
            </div>
        `;
    });

    hub.innerHTML = `${svgHtml}${domHtml}`;
    hub.className = shouldAnimate ? 'open animate-in' : 'open';
    updateConstellationHoverVisuals();

    requestAnimationFrame(reportHitRects);
    if (shouldAnimate) setTimeout(reportHitRects, 220);
}

function renderAlternateHubStyle(hub, g, hubStyle, forceAnimate) {
    const wins = (g.windows || []).slice(0, 6);
    const sig = `${hubStyle}|${g.key}|${g.isPinned?1:0}|` + wins.map(w => `${w.hwnd}:${w.isActive?1:0}:${w.isTopMost?1:0}:${w.title}`).join(',');
    const activeKeySig = `${hubStyle}|${g.key}`;
    const shouldAnimate = forceAnimate || (radialLastOpenedKey !== activeKeySig);
    if (!shouldAnimate && constellationSig === sig && hub.classList.contains('open')) return;
    radialLastOpenedKey = activeKeySig;
    constellationSig = sig;
    constellationNodes = wins.map(w => ({ id: `win:${w.hwnd}`, hwnd: w.hwnd, isLeaf: true, groupKey: g.key }));

    const dockR = document.getElementById('dockBar')?.getBoundingClientRect();
    const edge = getDockEdge();
    const isVert = isVerticalEdge();
    const safeKey = escAttr(g.key);
    const gIcon = resolveItemIcon(g);
    const icHtml = gIcon
        ? `<img src="data:image/png;base64,${gIcon}" style="width:18px;height:18px;border-radius:4px;"/>`
        : `<span style="width:18px;height:18px;border-radius:5px;background:var(--accent-1);color:var(--accent-ink);font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;">${escHtml((g.displayName||'A')[0])}</span>`;

    if (hubStyle === 'radial' && !isVert && wins.length > 0) {
        // Style 4: Prism Arc Orbital Semi-Circle
        const hubW = Math.min(480, Math.max(320, wins.length * 108));
        const hubH = 196;
        const cx = hubW / 2;
        const cy = hubH - 8;
        const R = Math.min(138, Math.max(92, 82 + wins.length * 11));
        const spread = wins.length === 1 ? [0] : wins.map((_, i) => -68 + (136 * i) / (wins.length - 1));
        const rawX = radialAnchorX ?? (window.innerWidth / 2);
        const left = Math.max(8, Math.min(window.innerWidth - hubW - 8, rawX - hubW / 2));
        const bottomPx = dockR ? Math.max(44, Math.round(window.innerHeight - dockR.top + 4)) : 56;
        hub.style.width = `${hubW}px`;
        hub.style.height = `${hubH}px`;
        hub.style.top = 'auto';
        hub.style.bottom = `${bottomPx}px`;
        hub.style.left = `${left.toFixed(1)}px`;

        const arcPath = orbArcPath(cx, cy, R, -74, 74);
        let nodesHtml = '';
        wins.forEach((w, i) => {
            const p = polar(cx, cy, R, spread[i]);
            const clean = cleanWindowTitle(w.title, g.displayName);
            nodesHtml += `
                <div class="arc-node ${w.isActive ? 'active-win' : ''}"
                     style="left:${p.x.toFixed(1)}px;top:${p.y.toFixed(1)}px;"
                     onmouseenter="radialSelectedHwnd=${w.hwnd};scheduleDwmPreview(${w.hwnd},false);"
                     onclick="event.stopPropagation();send('focusWindow',{hwnd:${w.hwnd}});closeRadialHub(true);"
                     onauxclick="if(event.button===1){event.stopPropagation();send('closeWindow',{hwnd:${w.hwnd}});}">
                    ${gIcon ? `<img src="data:image/png;base64,${gIcon}"/>` : ''}
                    <span>${escHtml(shortOrbLabel(clean))}</span>
                    <button class="orb-tbtn danger" style="width:18px;height:18px;" onclick="event.stopPropagation();send('closeWindow',{hwnd:${w.hwnd}});">${SVG.close}</button>
                </div>
            `;
        });
        hub.innerHTML = `
            <svg class="const-svg-layer" viewBox="0 0 ${hubW} ${hubH}">
                <path d="${arcPath}" fill="none" stroke="rgba(var(--a1-rgb),0.40)" stroke-width="2" stroke-dasharray="4 4"/>
                <circle cx="${cx}" cy="${cy - 2}" r="5" fill="var(--accent-1)"/>
            </svg>
            <div class="orb-topbar show" style="top:auto;bottom:14px;">
                ${icHtml}
                <span class="orb-topbar-title">${escHtml(g.displayName)} (${wins.length})</span>
                <span class="orb-topbar-sep"></span>
                <span class="orb-topbar-acts">
                    ${wins.length >= 2 ? `<button class="orb-tbtn-pill" onclick="event.stopPropagation();pairRadialGroupWindows('${safeKey}');">${SVG.pair}<span>50/50</span></button>` : ''}
                    <button class="orb-tbtn" title="Yeni Pencere" onclick="event.stopPropagation();send('launchNewInstance',{key:'${safeKey}'});closeRadialHub(true);">${SVG.plus}</button>
                    <button class="orb-tbtn ${g.isPinned ? 'active' : ''}" title="Sabitle" onclick="event.stopPropagation();togglePinRadial();">${SVG.pin}</button>
                    <button class="orb-tbtn danger" title="Hepsini Kapat" onclick="event.stopPropagation();send('closeAllGroupWindows',{key:'${safeKey}'});closeRadialHub(true);">${SVG.trash}</button>
                </span>
            </div>
            ${nodesHtml}
        `;
        hub.className = 'open';
        requestAnimationFrame(reportHitRects);
        return;
    }

    // Style 2: 3D Fan Cards OR Style 3: Windows 11 Modern Horizontal Card Strip
    const isFan = (hubStyle === 'fan3d');
    const bodyCards = wins.length === 0 ? `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 4px;">
            <span style="font-size:11.5px;color:var(--text-2);">Açık pencere yok</span>
            <button class="pill-btn accent" onclick="launchRadialGroup()">Başlat</button>
        </div>
    ` : isFan ? `
        <div class="fan3d-stage">
            ${wins.map((w, i) => {
                const mid = (wins.length - 1) / 2;
                const d = i - mid;
                const rot = (d * 7.5).toFixed(1);
                const dy = (Math.abs(d) * 7).toFixed(1);
                const ry = (-d * 10).toFixed(1);
                const clean = cleanWindowTitle(w.title, g.displayName);
                return `
                    <div class="fan3d-card ${w.isActive ? 'active-win' : ''}"
                         style="--fan-rot:${rot}deg;--fan-dy:${dy}px;--fan-ry:${ry}deg;--fan-z:${10 - Math.round(Math.abs(d))};"
                         onmouseenter="radialSelectedHwnd=${w.hwnd};scheduleDwmPreview(${w.hwnd},false);"
                         onclick="event.stopPropagation();send('focusWindow',{hwnd:${w.hwnd}});closeRadialHub(true);">
                        <div class="wcard-top">
                            ${gIcon ? `<img src="data:image/png;base64,${gIcon}"/>` : ''}
                            <span class="wcard-title">${escHtml(shortOrbLabel(clean))}</span>
                        </div>
                        <div class="wcard-sub">${escHtml(clean)}</div>
                        <div class="wcard-acts">
                            <div style="display:flex;gap:2px;">
                                <button class="orb-tbtn" title="Sola Yasla" onclick="event.stopPropagation();execOrbWindowAction(${w.hwnd},'arrange','left',this);">${SVG.snapL}</button>
                                <button class="orb-tbtn" title="Sağa Yasla" onclick="event.stopPropagation();execOrbWindowAction(${w.hwnd},'arrange','right',this);">${SVG.snapR}</button>
                                <button class="orb-tbtn ${w.isTopMost ? 'active' : ''}" title="Üstte Tut" onclick="event.stopPropagation();execOrbWindowAction(${w.hwnd},'top','',this);">${SVG.pin}</button>
                            </div>
                            <button class="orb-tbtn danger" title="Kapat" onclick="event.stopPropagation();execOrbWindowAction(${w.hwnd},'close','',this);">${SVG.close}</button>
                        </div>
                    </div>
                `;
            }).join('')}
        </div>
    ` : `
        <div class="cards-strip">
            ${wins.map(w => {
                const clean = cleanWindowTitle(w.title, g.displayName);
                return `
                    <div class="win-card ${w.isActive ? 'active-win' : ''}"
                         onmouseenter="radialSelectedHwnd=${w.hwnd};scheduleDwmPreview(${w.hwnd},false);"
                         onclick="event.stopPropagation();send('focusWindow',{hwnd:${w.hwnd}});closeRadialHub(true);">
                        <div class="wcard-top">
                            ${gIcon ? `<img src="data:image/png;base64,${gIcon}"/>` : ''}
                            <span class="wcard-title">${escHtml(g.displayName)}</span>
                            <button class="orb-tbtn danger" title="Kapat" onclick="event.stopPropagation();execOrbWindowAction(${w.hwnd},'close','',this);">${SVG.close}</button>
                        </div>
                        <div class="wcard-sub">${escHtml(clean)}</div>
                        <div class="wcard-acts">
                            <button class="orb-tbtn" title="Sola %50" onclick="event.stopPropagation();execOrbWindowAction(${w.hwnd},'arrange','left',this);">${SVG.snapL}</button>
                            <button class="orb-tbtn" title="Sağa %50" onclick="event.stopPropagation();execOrbWindowAction(${w.hwnd},'arrange','right',this);">${SVG.snapR}</button>
                            <button class="orb-tbtn ${w.isTopMost ? 'active' : ''}" title="Üstte Tut" onclick="event.stopPropagation();execOrbWindowAction(${w.hwnd},'top','',this);">${SVG.pin}</button>
                            <button class="orb-tbtn" title="Simge Durumuna" onclick="event.stopPropagation();execOrbWindowAction(${w.hwnd},'min','',this);">${SVG.min}</button>
                        </div>
                    </div>
                `;
            }).join('')}
        </div>
    `;

    hub.style.width = 'auto';
    hub.style.height = 'auto';
    hub.innerHTML = `
        <div class="glass-shell hub-shell-card">
            <div class="hub-hdr">
                <span class="hub-hdr-title">${icHtml}<span>${escHtml(g.displayName)}</span><span style="font-size:10.5px;color:var(--text-2);font-weight:600;">(${wins.length})</span></span>
                <span class="hub-hdr-acts">
                    ${g.audioPid ? `<button class="micro-btn ${g.audioMuted ? 'danger' : 'active'}" style="width:24px;height:24px;" title="${g.audioMuted ? 'Sesi Aç' : 'Uygulamayı Sustur'} (%${g.audioVolume ?? 100})" onclick="event.stopPropagation();send('toggleAppMute',{pid:${g.audioPid},groupKey:'${safeKey}'});">${g.audioMuted ? SVG.mute : SVG.vol}</button>` : ''}
                    ${wins.length >= 2 ? `<button class="orb-tbtn-pill" onclick="event.stopPropagation();pairRadialGroupWindows('${safeKey}');">${SVG.pair}<span>50/50</span></button>` : ''}
                    <button class="micro-btn" style="width:24px;height:24px;" title="Yeni Pencere" onclick="event.stopPropagation();send('launchNewInstance',{key:'${safeKey}'});closeRadialHub(true);">${SVG.plus}</button>
                    <button class="micro-btn ${g.isPinned ? 'active' : ''}" style="width:24px;height:24px;" title="${g.isPinned ? 'Sabiti Kaldır' : 'Sabitle'}" onclick="event.stopPropagation();togglePinRadial();">${SVG.pin}</button>
                    ${wins.length > 0 ? `<button class="micro-btn danger" style="width:24px;height:24px;" title="Tümünü Kapat" onclick="event.stopPropagation();send('closeAllGroupWindows',{key:'${safeKey}'});closeRadialHub(true);">${SVG.trash}</button>` : ''}
                </span>
            </div>
            ${bodyCards}
        </div>
    `;
    hub.className = 'open';

    requestAnimationFrame(() => {
        const hr = hub.getBoundingClientRect();
        if (isVert && dockR) {
            const rawY = radialAnchorY ?? (window.innerHeight / 2);
            const topPos = Math.max(8, Math.min(window.innerHeight - hr.height - 8, rawY - hr.height / 2));
            const leftPos = edge === 'Left' ? (dockR.right + 10) : Math.max(8, dockR.left - hr.width - 10);
            hub.style.bottom = 'auto';
            hub.style.top = `${topPos.toFixed(1)}px`;
            hub.style.left = `${leftPos.toFixed(1)}px`;
        } else {
            const rawX = radialAnchorX ?? (window.innerWidth / 2);
            const leftPos = Math.max(10, Math.min(window.innerWidth - hr.width - 10, rawX - hr.width / 2));
            const bottomPx = dockR ? Math.max(48, Math.round(window.innerHeight - dockR.top + 8)) : 60;
            hub.style.top = 'auto';
            hub.style.bottom = `${bottomPx}px`;
            hub.style.left = `${leftPos.toFixed(1)}px`;
        }
        reportHitRects();
    });
}

function setConstellationHover(nodeId) {
    clearTimeout(constellationHoverTimer);
    if (constellationHoveredId === nodeId) {
        const n = constellationNodes.find(x => x.id === nodeId);
        if (n && n.hwnd) scheduleDwmPreview(n.hwnd, false);
        return;
    }
    constellationHoveredId = nodeId;
    const n = constellationNodes.find(x => x.id === nodeId);
    if (n && n.hwnd) {
        radialSelectedHwnd = n.hwnd;
        scheduleDwmPreview(n.hwnd, false);
    } else {
        hideDwmPreviewNow();
    }
    updateConstellationHoverVisuals();
}

function updateConstellationHoverVisuals() {
    const hub = document.getElementById('radialHub');
    if (!hub || !hub.classList.contains('open')) return;

    const cur = constellationNodes.find(n => n.id === constellationHoveredId) || null;
    const activeParentId = cur ? (cur.parentId || cur.id) : null;

    hub.querySelectorAll('.orb-node[data-orb-id]').forEach(el => {
        el.classList.toggle('hovered', el.getAttribute('data-orb-id') === constellationHoveredId);
    });
    hub.querySelectorAll('.orb-stem, .orb-stem-glow').forEach(el => {
        const toId = el.getAttribute('data-edge-to');
        const hot = Boolean(cur && (toId === cur.id || toId === activeParentId));
        el.classList.toggle('hot', hot);
    });

    // Update unified top control bar (title + spaced circular controls, zero overlap!)
    const bar = document.getElementById('orbTopBar');
    if (bar) {
        if (!cur) {
            bar.classList.remove('show');
        } else {
            const grp = (state?.groups || []).find(g => g.key === cur.groupKey);
            const winCnt = grp?.windows?.length || 0;
            const safeKey = escAttr(cur.groupKey || '');
            let actsHtml = '';

            if (cur.isLaunch && grp) {
                actsHtml = `
                    <button class="orb-tbtn-pill" title="Uygulamayı Başlat" onclick="event.stopPropagation();launchRadialGroup();">Başlat</button>
                    <button class="orb-tbtn ${grp.isPinned ? 'active' : ''}" title="${grp.isPinned ? 'Sabiti Kaldır' : 'Dock\'a Sabitle'}" onclick="event.stopPropagation();togglePinRadial();">${SVG.pin}</button>
                `;
            } else if (cur.isLeaf && cur.hwnd) {
                actsHtml = `
                    ${grp?.audioPid ? `<button class="orb-tbtn ${grp.audioMuted ? 'danger' : 'active'}" title="${grp.audioMuted ? 'Uygulama Sesini Aç' : 'Uygulamayı Sustur'} (%${grp.audioVolume ?? 100})" onclick="event.stopPropagation();send('toggleAppMute',{pid:${grp.audioPid},groupKey:'${safeKey}'});">${grp.audioMuted ? SVG.mute : SVG.vol}</button>` : ''}
                    <button class="orb-tbtn" title="Sola Yasla %50" onclick="event.stopPropagation();execOrbWindowAction(${cur.hwnd},'arrange','left',this);">${SVG.snapL}</button>
                    <button class="orb-tbtn" title="Sağa Yasla %50" onclick="event.stopPropagation();execOrbWindowAction(${cur.hwnd},'arrange','right',this);">${SVG.snapR}</button>
                    ${winCnt >= 2 ? `<button class="orb-tbtn-pill" title="2 Pencereyi 50/50 Yan Yana Diz" onclick="event.stopPropagation();pairRadialGroupWindows('${safeKey}');">${SVG.pair}<span>50/50</span></button>` : ''}
                    <button class="orb-tbtn ${cur.isTopMost ? 'active' : ''}" title="Her Zaman Üstte" onclick="event.stopPropagation();execOrbWindowAction(${cur.hwnd},'top','',this);">${SVG.pin}</button>
                    ${grp ? `<button class="orb-tbtn" title="Yeni Pencere Aç" onclick="event.stopPropagation();send('launchNewInstance',{key:'${safeKey}'});closeRadialHub(true);">${SVG.plus}</button>` : ''}
                    <button class="orb-tbtn danger" title="Pencereyi Kapat" onclick="event.stopPropagation();execOrbWindowAction(${cur.hwnd},'close','',this);">${SVG.close}</button>
                `;
            } else if (cur.hasKids && grp) {
                actsHtml = `
                    <button class="orb-tbtn-pill" title="2 Pencereyi 50/50 Yan Yana Diz" onclick="event.stopPropagation();pairRadialGroupWindows('${safeKey}');">${SVG.pair}<span>50/50</span></button>
                    <button class="orb-tbtn" title="Yeni Pencere Aç" onclick="event.stopPropagation();send('launchNewInstance',{key:'${safeKey}'});closeRadialHub(true);">${SVG.plus}</button>
                    <button class="orb-tbtn danger" title="Tüm Pencereleri Kapat" onclick="event.stopPropagation();send('closeAllGroupWindows',{key:'${safeKey}'});closeRadialHub(true);">${SVG.trash}</button>
                `;
            }

            bar.innerHTML = `
                <span class="orb-topbar-dot"></span>
                <span class="orb-topbar-title" title="${escHtml(cur.fullTitle)}">${escHtml(cur.fullTitle)}</span>
                ${actsHtml ? `<span class="orb-topbar-sep"></span><span class="orb-topbar-acts">${actsHtml}</span>` : ''}
            `;
            bar.classList.add('show');
        }
    }
}

function execOrbWindowAction(hwnd, act, mode, btnEl) {
    if (!hwnd) return;
    radialSelectedHwnd = hwnd;
    if (act === 'arrange') {
        send('arrangeWindow', { hwnd, mode });
        closeRadialHub(true);
    } else if (act === 'min') {
        send('minimizeWindow', { hwnd });
        closeRadialHub(true);
    } else if (act === 'top') {
        if (btnEl) btnEl.classList.toggle('active');
        send('toggleTopMost', { hwnd });
    } else if (act === 'close') {
        send('closeWindow', { hwnd });
        const leafCount = constellationNodes.filter(n => n.isLeaf).length;
        if (leafCount <= 1) closeRadialHub(true);
    }
}

function launchNewRadialInstance() {
    if (!radialGroupKey) return;
    const k = radialGroupKey;
    closeRadialHub(true);
    send('launchNewInstance', { key: k });
}

function closeAllRadialWindows() {
    if (!radialGroupKey) return;
    const k = radialGroupKey;
    closeRadialHub(true);
    send('closeAllGroupWindows', { key: k });
}

function launchRadialGroup() {
    if (!radialGroupKey) return;
    const k = radialGroupKey;
    closeRadialHub(true);
    send('invokeGroup', { key: k });
}

function previewPinCaption() {}

function togglePinRadial() {
    const g = (state?.groups || []).find(x => x.key === radialGroupKey);
    if (!g) return;
    send('togglePin', { name: g.displayName, path: g.executablePath, aumid: g.aumid || '' });
    closeRadialHub(true);
}

function scheduleTargetOrb(hwnd) {
    const n = constellationNodes.find(x => x.hwnd === hwnd);
    if (n) setConstellationHover(n.id);
}

function setTargetedOrbImmediate(hwnd) {
    radialSelectedHwnd = hwnd;
    const n = constellationNodes.find(x => x.hwnd === hwnd);
    if (n) {
        constellationHoveredId = n.id;
        updateConstellationHoverVisuals();
    }
}

function previewOrbitCaption() {}
function restoreOrbCaption() {}

function execOrbitAction(act, mode) {
    const g = (state?.groups || []).find(x => x.key === radialGroupKey);
    const hwnd = radialSelectedHwnd || g?.windows?.[0]?.hwnd;

            const rect = el.getBoundingClientRect();
            const center = isVert ? (rect.top + rect.height / 2) : (rect.left + rect.width / 2);
            const dist = Math.abs((isVert ? mouseY : mouseX) - center);
            if (dist < focusRadius) {
                const t = 1 - (dist / focusRadius);
                const influence = t * t * (3 - 2 * t);
                const inAcc = Boolean(el.closest('.acc-drawer'));
                const maxAdd = inAcc
                    ? Math.min(0.11, magStrength * 0.16)
                    : Math.min(0.16, magStrength * 0.22);
                target = 1.0 + (maxAdd * influence);
            }
        }
        targets.push({ el, baseDim, cur, target });
    });

    for (const it of targets) {
        let next = it.cur + (it.target - it.cur) * 0.34;
        if (Math.abs(next - it.target) < 0.0015) next = it.target;
        else needsNextFrame = true;

        it.el._magCur = next;
        const extra = Math.max(0, next - 1.0);
        if (extra < 0.001) {
            it.el.style.transform = '';
            it.el.style.zIndex = '';
        } else {
            const lift = Math.min(6.5, extra * it.baseDim * 0.92);
            if (isVert) {
                const dir = edge === 'Right' ? -1 : 1;
                it.el.style.transform = `translateX(${(dir * lift).toFixed(1)}px) scale(${next.toFixed(3)})`;
            } else {
                it.el.style.transform = `translateY(-${lift.toFixed(1)}px) scale(${next.toFixed(3)})`;
            }
            it.el.style.zIndex = String(Math.round(next * 100));
        }
    }

    if (needsNextFrame) {
        waveRafId = requestAnimationFrame(stepParabolicWave);
    }
}

function normTr(s) {
    return String(s || '')
        .replace(/İ/g, 'i').replace(/I/g, 'i').replace(/ı/g, 'i')
        .replace(/Ğ/g, 'g').replace(/ğ/g, 'g')
        .replace(/Ü/g, 'u').replace(/ü/g, 'u')
        .replace(/Ş/g, 's').replace(/ş/g, 's')
        .replace(/Ö/g, 'o').replace(/ö/g, 'o')
        .replace(/Ç/g, 'c').replace(/ç/g, 'c')
        .toLowerCase();
}

function positionOmniBar() {

function evalSafeMathAst(expr) {
    let s = String(expr || '').trim()
        .replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/,/g, '.');
    if (!s || s.length > 96) return null;
    s = s.replace(/\bpi\b/gi, String(Math.PI)).replace(/\be\b/gi, String(Math.E));
    const tokens = [];
    let i = 0;
    while (i < s.length) {
        const ch = s[i];
        if (/\s/.test(ch)) { i++; continue; }
        if (/[0-9.]/.test(ch)) {
            let num = '';
            let dotSeen = false;
            while (i < s.length && /[0-9.]/.test(s[i])) {
                if (s[i] === '.') {
                    if (dotSeen) return null;
                    dotSeen = true;
                }
                num += s[i++];
            }
            const v = Number(num);
            if (!Number.isFinite(v)) return null;
            tokens.push({ t: 'num', v });
            continue;
        }
        if (/[a-zA-Z]/.test(ch)) {
            let id = '';
            while (i < s.length && /[a-zA-Z0-9_]/.test(s[i])) id += s[i++];
            tokens.push({ t: 'id', v: id.toLowerCase() });
            continue;
        }
        if ('+-*/%^()'.includes(ch)) {
            tokens.push({ t: 'op', v: ch });
            i++;
            continue;
        }
        return null;
    }
    if (tokens.length === 0) return null;
    const hasOp = tokens.some(tk => tk.t === 'op' && '+-*/%^'.includes(tk.v)) || tokens.some(tk => tk.t === 'id');
    if (!hasOp) return null;

    let pos = 0;
    const peek = () => tokens[pos] || null;
    const consume = () => tokens[pos++] || null;
    const funcs = {
        sqrt: Math.sqrt, abs: Math.abs, round: Math.round, floor: Math.floor, ceil: Math.ceil,
        sin: Math.sin, cos: Math.cos, tan: Math.tan, log: Math.log10, ln: Math.log
    };
    function parseExpr() {
        let left = parseTerm();
        if (left === null) return null;
        while (peek() && peek().t === 'op' && (peek().v === '+' || peek().v === '-')) {
            const op = consume().v;
            const rhsStart = pos;
            const right = parseTerm();
            if (right === null) return null;
            if (peek() && peek().t === 'op' && peek().v === '%' && pos - rhsStart === 1) {
                consume();
                const pct = left * (right / 100);
                left = op === '+' ? (left + pct) : (left - pct);
            } else {
                left = op === '+' ? (left + right) : (left - right);
            }
        }
        return left;
    }
    function parseTerm() {
        let left = parsePow();
        if (left === null) return null;
        while (peek() && peek().t === 'op' && (peek().v === '*' || peek().v === '/')) {
            const op = consume().v;
            const right = parsePow();
            if (right === null) return null;
            if (op === '/' && right === 0) return null;
            left = op === '*' ? (left * right) : (left / right);
        }
        return left;
    }
    function parsePow() {
        let base = parseUnary();
        if (base === null) return null;
        if (peek() && peek().t === 'op' && peek().v === '^') {
            consume();
            const exp = parsePow();
            if (exp === null) return null;
            return Math.pow(base, exp);
        }
        return base;
    }
    function parseUnary() {
        if (peek() && peek().t === 'op' && (peek().v === '+' || peek().v === '-')) {
            const op = consume().v;
            const v = parseUnary();
            if (v === null) return null;
            return op === '-' ? -v : v;
        }
        return parsePrimary();
    }
    function parsePrimary() {
        const tk = consume();
        if (!tk) return null;
        if (tk.t === 'num') {
            if (peek() && peek().t === 'op' && peek().v === '%') {
                const next = tokens[pos + 1];
                if (!next || (next.t === 'op' && '*/^)'.includes(next.v))) {
                    consume();
                    return tk.v / 100;
                }
            }
            return tk.v;
        }
        if (tk.t === 'id' && funcs[tk.v]) {
            if (!peek() || peek().t !== 'op' || peek().v !== '(') return null;
            consume();
            const arg = parseExpr();
            if (arg === null || !peek() || peek().t !== 'op' || peek().v !== ')') return null;
            consume();
            return funcs[tk.v](arg);
        }
        if (tk.t === 'op' && tk.v === '(') {
            const inner = parseExpr();
            if (inner === null || !peek() || peek().t !== 'op' || peek().v !== ')') return null;
            consume();
            return inner;
        }
        return null;
    }
    const res = parseExpr();
    if (res === null || pos !== tokens.length || !Number.isFinite(res)) return null;
    return res;
}

function tryEvalMath(q) {

    return {

}

function tryConvertUnit(q) {
    const m = q.trim().match(/^(-?\d+(?:[.,]\d+)?)\s*([a-zA-Z°/]+)\s*(?:to|in|->|=|kac|kaç)?\s*([a-zA-Z°/]+)$/i);
    if (!m) return null;
    const num = parseFloat(m[1].replace(',', '.'));
    if (!Number.isFinite(num)) return null;
    const u1 = m[2].toLowerCase().replace('°', '');
    const u2 = m[3].toLowerCase().replace('°', '');
    if (u1 === u2) return null;

    const groups = [
        { map: { mm: 0.001, cm: 0.01, m: 1, km: 1000, in: 0.0254, ft: 0.3048, yd: 0.9144, mi: 1609.344 } },
        { map: { mg: 0.001, g: 1, gr: 1, kg: 1000, ton: 1e6, lb: 453.59237, oz: 28.349523 } },
        { map: { b: 1, kb: 1000, mb: 1e6, gb: 1e9, tb: 1e12, kib: 1024, mib: 1048576, gib: 1073741824 } },
        { map: { ms: 1, 'm/s': 1, kmh: 1 / 3.6, 'km/h': 1 / 3.6, mph: 0.44704, knot: 0.514444 } },
        { map: { s: 1, sn: 1, min: 60, dk: 60, h: 3600, sa: 3600, d: 86400, gun: 86400 } }
    ];
    for (const g of groups) {
        if (u1 in g.map && u2 in g.map) {
            const res = (num * g.map[u1]) / g.map[u2];
            const fmt = Math.abs(res) >= 100 ? res.toFixed(2) : Number(res.toFixed(4)).toString();
            return {
                kind: 'smart',
                badge: 'BİRİM',
                title: `${fmt} ${m[3]}`,
                subtitle: `${num} ${m[2]} = ${fmt} ${m[3]} · Enter: Kopyala`,
                copyText: fmt
            };
        }
    }
    const tempAlias = { c: 'c', cel: 'c', f: 'f', fah: 'f', k: 'k' };
    if (u1 in tempAlias && u2 in tempAlias) {
        const a = tempAlias[u1], b = tempAlias[u2];
        const c = a === 'c' ? num : (a === 'f' ? (num - 32) * 5 / 9 : num - 273.15);
        const res = b === 'c' ? c : (b === 'f' ? (c * 9 / 5 + 32) : c + 273.15);
        const fmt = Number(res.toFixed(2)).toString();
        return {
            kind: 'smart',
            badge: 'SICAKLIK',
            title: `${fmt} °${b.toUpperCase()}`,
            subtitle: `${num} °${a.toUpperCase()} = ${fmt} °${b.toUpperCase()} · Enter: Kopyala`,
            copyText: fmt
        };
    }
    return null;
}

function tryConvertCurrency(q) {
    const mk = state?.market || {};
    const usdTry = (mk.usdTry > 0) ? mk.usdTry : 34.5;
    const eurTry = (mk.eurTry > 0) ? mk.eurTry : (usdTry * 1.08);
    const gbpTry = (mk.gbpTry > 0) ? mk.gbpTry : (usdTry * 1.27);
    const btcTry = (mk.btcUsd > 0) ? (mk.btcUsd * usdTry) : (90000 * usdTry);
    const rates = {
        try: 1, tl: 1, usd: usdTry, '$': usdTry, dolar: usdTry,
        eur: eurTry, '€': eurTry, euro: eurTry,
        gbp: gbpTry, '£': gbpTry, sterlin: gbpTry,
        btc: btcTry, '₿': btcTry
    };
    const m = normTr(q).trim().match(/^(\d+(?:[.,]\d+)?)\s*(try|tl|usd|dolar|\$|eur|euro|€|gbp|sterlin|£|btc|₿)(?:\s*(?:to|in|->|=|kac)?\s*(try|tl|usd|dolar|\$|eur|euro|€|gbp|sterlin|£|btc|₿))?$/i);
    if (!m) return null;
    const amount = parseFloat(m[1].replace(',', '.'));
    const fromKey = m[2];
    const toKey = m[3] || (fromKey === 'try' || fromKey === 'tl' ? 'usd' : 'try');
    if (!(fromKey in rates) || !(toKey in rates)) return null;
    const res = (amount * rates[fromKey]) / rates[toKey];
    const fmt = toKey === 'btc' ? res.toFixed(6) : res.toFixed(2);
    const toDisp = toKey.toUpperCase().replace('$', 'USD').replace('€', 'EUR').replace('£', 'GBP').replace('₿', 'BTC');
    const fromDisp = fromKey.toUpperCase().replace('$', 'USD').replace('€', 'EUR').replace('£', 'GBP').replace('₿', 'BTC');
    return {
        kind: 'smart',
        badge: mk.valid ? 'CANLI KUR' : 'TAHMİNİ KUR',
        title: `${fmt} ${toDisp}`,
        subtitle: `${amount} ${fromDisp} ≈ ${fmt} ${toDisp} · Enter: Kopyala`,
        copyText: fmt
    };
}

function tryParseColor(q) {
    const t = q.trim();
    const hexM = t.match(/^#([0-9a-f]{3}|[0-9a-f]{6})$/i);
    let r, g, b, hex;
    if (hexM) {
        let h = hexM[1];
        if (h.length === 3) h = h.split('').map(c => c + c).join('');
        r = parseInt(h.slice(0, 2), 16);
        g = parseInt(h.slice(2, 4), 16);
        b = parseInt(h.slice(4, 6), 16);
        hex = `#${h.toUpperCase()}`;
    } else {
        const rgbM = t.match(/^rgb\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})\s*\)$/i);
        if (!rgbM) return null;
        r = Math.min(255, +rgbM[1]); g = Math.min(255, +rgbM[2]); b = Math.min(255, +rgbM[3]);
        hex = '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('').toUpperCase();
    }
    const max = Math.max(r, g, b) / 255, min = Math.min(r, g, b) / 255;
    const l = (max + min) / 2;
    let h = 0, s = 0;
    if (max !== min) {
        const d = max - min;
        s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
        const rn = r / 255, gn = g / 255, bn = b / 255;
        h = max === rn ? ((gn - bn) / d + (gn < bn ? 6 : 0)) : (max === gn ? ((bn - rn) / d + 2) : ((rn - gn) / d + 4));
        h /= 6;
    }
    const hslStr = `hsl(${Math.round(h * 360)}, ${Math.round(s * 100)}%, ${Math.round(l * 100)}%)`;
    const rgbStr = `rgb(${r}, ${g}, ${b})`;
    return {
        kind: 'smart',
        badge: 'RENK',
        swatch: hex,
        title: `${hex} · ${rgbStr}`,
        subtitle: `${hslStr} · Enter: HEX Kopyala`,
        copyText: hex
    };
}

function tryEvalTimezone(q) {
    const m = normTr(q).trim().match(/^(?:time|saat)\s+([a-z\s]+)$/);
    if (!m) return null;
    const key = m[1].trim();
    const zones = {
        istanbul: 'Europe/Istanbul', ankara: 'Europe/Istanbul', tr: 'Europe/Istanbul',
        london: 'Europe/London', londra: 'Europe/London', uk: 'Europe/London',
        ny: 'America/New_York', 'new york': 'America/New_York', est: 'America/New_York',
        sf: 'America/Los_Angeles', la: 'America/Los_Angeles', pst: 'America/Los_Angeles',
        tokyo: 'Asia/Tokyo', jp: 'Asia/Tokyo',
        berlin: 'Europe/Berlin', paris: 'Europe/Paris', dubai: 'Asia/Dubai',
        utc: 'UTC', gmt: 'UTC'
    };
    const tz = zones[key];
    if (!tz) return null;
    const now = new Date();
    const timeStr = new Intl.DateTimeFormat('tr-TR', { timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(now);
    const dateStr = new Intl.DateTimeFormat('tr-TR', { timeZone: tz, weekday: 'short', day: 'numeric', month: 'short' }).format(now);
    return {
        kind: 'smart',
        badge: tz,
        title: timeStr,
        subtitle: `${key.toUpperCase()} · ${dateStr} · Enter: Kopyala`,
        copyText: timeStr
    };
}

function buildOmniSmartCard(q) {
    const trimmed = (q || '').trim();
    if (!trimmed || trimmed.startsWith('>')) return null;

    const webM = trimmed.match(/^(g|yt|gh)\s+(.+)$/i);
    if (webM) {
        const prefix = webM[1].toLowerCase();
        const term = webM[2].trim();
        const engines = {
            g:  { name: 'Google',  url: `https://www.google.com/search?q=${encodeURIComponent(term)}` },
            yt: { name: 'YouTube', url: `https://www.youtube.com/results?search_query=${encodeURIComponent(term)}` },
            gh: { name: 'GitHub',  url: `https://github.com/search?q=${encodeURIComponent(term)}` }
        };
        const eng = engines[prefix];
        return {
            kind: 'smart-web',
            badge: eng.name.toUpperCase(),
            title: `${eng.name}: "${term}"`,
            subtitle: 'Tarayıcıda ara · Enter',
            url: eng.url
        };
    }

    if (/^(https?:\/\/)?[a-z0-9-]+(\.[a-z0-9-]+)+(\/.*)?$/i.test(trimmed) && !/\s/.test(trimmed)) {
        const url = /^https?:\/\//i.test(trimmed) ? trimmed : `https://${trimmed}`;
        return {
            kind: 'smart-web',
            badge: 'WEB URL',
            title: url,
            subtitle: 'Bağlantıyı aç · Enter',
            url
        };
    }

    return tryParseColor(trimmed)
        || tryConvertCurrency(trimmed)
        || tryConvertUnit(trimmed)
        || tryEvalTimezone(trimmed)
        || tryEvalMath(trimmed);
}

function scoreOmniMatch(nq, hayRaw) {
    if (!nq) return 10;
    const hay = normTr(hayRaw);
    if (hay === nq) return 120;
    if (hay.startsWith(nq)) return 95;
    if (hay.includes(' ' + nq)) return 80;
    if (hay.includes(nq)) return 60;
    let qi = 0;
    for (let i = 0; i < hay.length && qi < nq.length; i++) {
        if (hay[i] === nq[qi]) qi++;
    }
    return qi === nq.length ? 30 : 0;
}

                subtitle: 'Shell üzerinden çalıştır (cmdrun)',
                svgIcon: SVG.extLink,
                act: { t: 'shell', cmd: shellCmd }
            });
        }
        if (cmdMode) return items.sort((a, b) => (b.score || 200) - (a.score || 200)).slice(0, 14);
    }

    if (omniFilter === 'all' || omniFilter === 'wins') {
        const winSeen = new Set();
        const openWins = Array.isArray(state?.openWindows) && state.openWindows.length > 0
            ? state.openWindows
            : (state?.groups || []).flatMap(g => (g.windows || []).map(w => ({
                hwnd: w.hwnd,
                title: w.title,
                processName: w.processName || g.displayName,
                displayName: g.displayName,
                isActive: w.isActive,
                iconKey: g.iconKey || w.iconKey,
                icon: resolveItemIcon(w) || resolveItemIcon(g)
            })));
        for (const w of openWins) {
            if (!w || !w.hwnd || winSeen.has(w.hwnd)) continue;
            winSeen.add(w.hwnd);
            const appName = w.displayName || w.processName || 'Pencere';
            const cleanT = cleanWindowTitle(w.title || appName, appName);
            const sc = nq ? scoreOmniMatch(nq, `${appName} ${cleanT} ${w.title || ''}`) : (w.isActive ? 92 : 76);
            if (sc > 0) {
                items.push({
                    kind: 'win',
                    score: sc + 20,
                    hwnd: w.hwnd,
                    title: cleanT || appName,
                    subtitle: `${appName}${w.isActive ? ' · Aktif' : ' · Pencereye geç'}`,
                    icon: resolveItemIcon(w) || null,
                    mono: appName.slice(0, 1).toUpperCase()
                });
            }
        }
    }

    if (omniFilter === 'all' || omniFilter === 'clip') {
        const clips = Array.isArray(state?.clipboard) ? state.clipboard : [];
        const clipTerm = nq.startsWith('@clip') ? nq.replace(/^@clip\s*/, '') : nq;
        for (const cl of clips.slice(0, 15)) {
            const text = String(cl.preview || cl.text || '').trim();
            if (!text) continue;
            const sc = clipTerm ? scoreOmniMatch(clipTerm, text) : (omniFilter === 'clip' ? 75 : 22);
            if (sc > 0) {
                items.push({
                    kind: 'clip',
                    score: sc + (omniFilter === 'clip' ? 40 : 0),
                    clipId: cl.id,
                    title: text.slice(0, 72),
                    subtitle: 'Pano geçmişi · Enter: Kopyala',
                    svgIcon: SVG.clip
                });
            }
        }
    }

    if ((omniFilter === 'all' || omniFilter === 'files') && Array.isArray(omniLatestFileHits) && omniLatestFileHits.length > 0) {
        for (const fh of omniLatestFileHits.slice(0, 8)) {
            const path = fh.path || fh.fullPath || '';
            const name = fh.name || fh.title || path.split(/[\\/]/).pop() || path;
            if (!path) continue;
            items.push({
                kind: 'file',
                score: 52,
                path,
                title: name,
                subtitle: path,
                svgIcon: fh.isDir ? SVG.folder : SVG.extLink
            });
        }
    }

    if ((omniFilter === 'web' || (omniFilter === 'all' && trimmed.length >= 2 && !smart)) && !trimmed.startsWith('>')) {
        items.push({
            kind: 'web',
            score: omniFilter === 'web' ? 95 : 14,
            title: `Google'da ara: "${trimmed}"`,
            subtitle: 'Kısayol: g <sorgu>',
            url: `https://www.google.com/search?q=${encodeURIComponent(trimmed)}`,
            svgIcon: SVG.globe
        });
    }

    let apps = [];
    if (omniFilter === 'all' || omniFilter === 'apps') {
        const seenApps = new Set();
        const pinnedPaths = new Set((state?.groups || []).filter(g => g.isPinned).map(g => (g.executablePath || g.key || '').toLowerCase()));
        const rawApps = [
            ...(Array.isArray(dockCatalog?.installedApps) ? dockCatalog.installedApps : []),
            ...(state?.groups || []).map(g => ({
                name: g.displayName,
                displayName: g.displayName,
                path: g.executablePath || '',
                aumid: g.aumid || '',
                key: g.key,
                iconKey: g.iconKey,
                icon: resolveItemIcon(g),
                isPinned: g.isPinned
            }))
        ];
        for (const a of rawApps) {
            const name = a.name || a.displayName || '';
            const dedupe = (a.path || a.aumid || a.key || name).toLowerCase();
            if (!name || !dedupe || seenApps.has(dedupe)) continue;
            seenApps.add(dedupe);
            const sc = nq ? scoreOmniMatch(nq, `${name} ${a.path || ''}`) : 64;
            if (sc > 0) {
                apps.push({
                    kind: 'app',
                    score: sc + (a.isPinned || pinnedPaths.has(dedupe) ? 8 : 0),
                    name,
                    path: a.path || '',
                    aumid: a.aumid || '',
                    key: a.key || '',
                    isPinned: Boolean(a.isPinned || pinnedPaths.has(dedupe)),
                    icon: resolveItemIcon(a) || null,
                    mono: name.slice(0, 1).toUpperCase()
                });
            }
        }
        apps.sort((a, b) => b.score - a.score);
        if (!nq) apps = apps.slice(0, omniFilter === 'apps' ? 24 : 8);
        else apps = apps.slice(0, 16);
    }

    items.sort((a, b) => (b.score || 999) - (a.score || 999));
    return { smart, listItems: items.filter(x => x !== smart).slice(0, 10), apps };
}

                    <div style="min-width:0;">

            const badgeLabel = it.kind === 'win' ? 'Pencere' : (it.kind === 'clip' ? 'Pano' : (it.kind === 'file' ? 'Dosya' : (it.kind === 'web' ? 'Web' : 'Komut')));
            html += `
                <div class="omni-row ${selCls}" data-omni-idx="${idx}" onclick="execOmniItem(${idx})" onmouseenter="setOmniHoverIdx(${idx})">
                    ${icHtml}
                    <div style="flex:1;min-width:0;">
                        <div style="font-size:12px;font-weight:700;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escHtml(it.title)}</div>
                        <div style="font-size:10px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escHtml(it.subtitle || '')}</div>

        html += `</div>`;
    }

    if (apps.length > 0) {
        const gridStartIdx = currentOmniItems.length;
        html += `<div class="omni-grid" data-grid-start="${gridStartIdx}">`;
        for (const ap of apps) {
            const idx = currentOmniItems.length;
            currentOmniItems.push(ap);
            const selCls = omniIdx === idx ? 'sel' : '';
            const icHtml = ap.icon
                ? `<img src="data:image/png;base64,${ap.icon}"/>`
                : `<span style="width:22px;height:22px;border-radius:6px;background:var(--accent-1);color:var(--accent-ink);font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;">${escHtml(ap.mono)}</span>`;
            html += `
                <div class="omni-app-card ${selCls}" data-omni-idx="${idx}" onclick="execOmniItem(${idx})" onmouseenter="setOmniHoverIdx(${idx})">
                    ${icHtml}
                    <span style="flex:1;min-width:0;font-size:11.5px;font-weight:700;color:var(--text-1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escHtml(ap.name)}</span>
