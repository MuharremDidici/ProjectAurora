        <!DOCTYPE html>

        <head>
        <meta charset="UTF-8">
        <style>
        :root {
    --bg-glass-1: rgba(15, 23, 42, 0.90);
    --bg-glass-2: rgba(22, 32, 56, 0.94);
    --bg-card: rgba(255, 255, 255, 0.045);
    --bg-card-hover: rgba(255, 255, 255, 0.09);
    --bg-inset: rgba(0, 0, 0, 0.28);
    --border-rim: rgba(255, 255, 255, 0.14);
    --border-subtle: rgba(255, 255, 255, 0.075);
    --text-1: #F8FAFC;
    --text-2: #B6C4D8;
    --accent-1: #38BDF8;
    --accent-2: #818CF8;
    --a1-rgb: 56, 189, 248;
    --a2-rgb: 129, 140, 248;
    --accent-soft: rgba(var(--a1-rgb), 0.13);
    --accent-tint: rgba(var(--a1-rgb), 0.22);
    --accent-ring: rgba(var(--a1-rgb), 0.46);
    --accent-glow: rgba(var(--a1-rgb), 0.30);
    --accent-ink: #04101F;
    --success: #34D399;
    --warning: #FBBF24;
    --danger: #FB7185;
    --radius-shell: 22px;
    --radius-card: 15px;
    --radius-item: 12px;
    --radius-btn: 999px;
    --shadow-shell:
        0 22px 54px -14px rgba(0, 0, 0, 0.72),
        0 4px 16px -4px rgba(0, 0, 0, 0.38),
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        inset 0 0 0 0.5px rgba(255, 255, 255, 0.07);
    --font: 'Segoe UI Variable Display', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'Cascadia Mono', 'JetBrains Mono', ui-monospace, Consolas, monospace;
    --spring: cubic-bezier(0.22, 1.12, 0.36, 1);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
* { box-sizing: border-box; user-select: none; -webkit-user-drag: none; }
html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent !important;
    overflow: hidden;
    font-family: var(--font);
    color: var(--text-1);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
}
.num { font-variant-numeric: tabular-nums; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.28); border-radius: 99px; }
.svg-ic {
    width: 15px; height: 15px; display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0; stroke: currentColor; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
}
.svg-ic.sm { width: 13px; height: 13px; }
.svg-ic.lg { width: 18px; height: 18px; }

/* ========== BASE OPTICAL SHELL (Liquid Glass 26 Default) ========== */
.glass-shell {
    position: relative;
    background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.11) 0%, rgba(255, 255, 255, 0.025) 34%, transparent 64%),
        radial-gradient(ellipse 68% 58% at 18% 0%, rgba(var(--a1-rgb), 0.12), transparent 66%),
        radial-gradient(ellipse 52% 46% at 86% 100%, rgba(var(--a2-rgb), 0.09), transparent 62%),
        linear-gradient(165deg, var(--bg-glass-1), var(--bg-glass-2));
    border: 1px solid var(--border-rim);
    box-shadow: var(--shadow-shell);
}

/* ========== 2026 ARCHITECTURAL VISUAL STYLES (Distinct Silhouette, Material, Texture & Controls) ========== */

/* 1. LIQUID GLASS 26 — Apple macOS Tahoe / iOS 26 Refractive Optical Crystal */
body.style-liquid-glass {
    --radius-shell: 24px;
    --radius-card: 17px;
    --radius-item: 13px;
    --radius-btn: 999px;
}
body.style-liquid-glass .glass-shell {
    background:
        linear-gradient(180deg, rgba(255,255,255,0.13) 0%, rgba(255,255,255,0.03) 34%, transparent 66%),
        radial-gradient(ellipse 66% 54% at 22% 0%, rgba(var(--a1-rgb), 0.14), transparent 65%),
        radial-gradient(ellipse 50% 45% at 85% 100%, rgba(var(--a2-rgb), 0.09), transparent 64%),
        linear-gradient(165deg, var(--bg-glass-1), var(--bg-glass-2));
    border: 1px solid rgba(255, 255, 255, 0.22);
    box-shadow:
        0 26px 58px -14px rgba(0, 0, 0, 0.72),
        0 6px 20px -6px rgba(0, 0, 0, 0.42),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.34),
        inset 0 -1px 0 rgba(255, 255, 255, 0.07);
}

/* 2. BENTO SILK — Scandinavian Tactile Porcelain & Layered Ceramic (Zero Neon Glow, Real Elevation!) */
body.style-bento-silk {
    --radius-shell: 22px;
    --radius-card: 16px;
    --radius-item: 13px;
    --radius-btn: 11px;
}
body.style-bento-silk .glass-shell {
    background: linear-gradient(180deg, var(--bg-glass-1), var(--bg-glass-2));
    border: 1px solid rgba(20, 22, 26, 0.13);
    box-shadow:
        0 22px 46px -14px rgba(20, 22, 26, 0.22),
        0 6px 16px -4px rgba(20, 22, 26, 0.11),
        inset 0 1px 0 rgba(255, 255, 255, 0.94);
}
body.style-bento-silk:not(.mode-light) .glass-shell {
    border-color: rgba(255, 255, 255, 0.15);
    box-shadow:
        0 22px 46px -14px rgba(0, 0, 0, 0.62),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
}
body.style-bento-silk .pill-btn {
    border-radius: 10px;
    border: 1px solid var(--border-rim);
    border-bottom-width: 2px;
    box-shadow: 0 1px 2px rgba(20, 22, 26, 0.06);
}
body.style-bento-silk.mode-light .pill-btn:not(.accent):not(.subtle) {
    background: rgba(255, 255, 255, 0.86);
}
body.style-bento-silk.mode-light .pill-btn:not(.accent):not(.subtle):hover {
    background: #FFFFFF;
    border-color: rgba(20, 22, 26, 0.22);
}
body.style-bento-silk .pill-btn.accent {
    background: var(--accent-1);
    border-color: rgba(0, 0, 0, 0.18);
    border-bottom-width: 2px;
    box-shadow: 0 2px 6px rgba(20, 22, 26, 0.14);
}
body.style-bento-silk .micro-btn {
    border-radius: 10px;
    border: 1px solid var(--border-subtle);
    border-bottom-width: 2px;
}
body.style-bento-silk.mode-light .micro-btn:not(.active) {
    background: rgba(255, 255, 255, 0.78);
}

/* 3. LINEAR SWISS — Raycast / Linear / Vercel Matte Carbon, Razor 1px Hairlines, Zero Glow */
body.style-linear-precision {
    --radius-shell: 10px;
    --radius-card: 7px;
    --radius-item: 7px;
    --radius-btn: 6px;
}
body.style-linear-precision .glass-shell {
    background: var(--bg-glass-1);
    border: 1px solid var(--border-rim);
    box-shadow:
        0 18px 40px -12px rgba(0, 0, 0, 0.72),
        inset 0 1px 0 rgba(255, 255, 255, 0.065);
}
body.style-linear-precision .pill-btn {
    border-radius: 6px;
    font-weight: 600;
    letter-spacing: -0.015em;
    transition: background 0.10s ease, border-color 0.10s ease, color 0.10s ease;
}
body.style-linear-precision .pill-btn:hover { transform: none; }
body.style-linear-precision .pill-btn.accent {
    background: var(--accent-1);
    box-shadow: none;
    border: 1px solid rgba(255, 255, 255, 0.16);
}
body.style-linear-precision .micro-btn {
    border-radius: 6px;
    transition: background 0.10s ease, border-color 0.10s ease, color 0.10s ease;
}

/* 4. MONO MATRIX — Refined Architectural Obsidian & Micro-Grain Hardware */
body.style-mono-matrix {
    --radius-shell: 20px;
    --radius-card: 14px;
    --radius-item: 12px;
    --radius-btn: 999px;
}
body.style-mono-matrix .glass-shell {
    background:
        radial-gradient(rgba(255, 255, 255, 0.032) 1px, transparent 1px),
        linear-gradient(180deg, rgba(16, 20, 30, 0.90), rgba(10, 13, 20, 0.95));
    background-size: 14px 14px, 100% 100%;
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow:
        0 24px 54px -14px rgba(0, 0, 0, 0.78),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
}
body.style-mono-matrix.mode-light .glass-shell {
    background:
        radial-gradient(rgba(15, 23, 42, 0.04) 1px, transparent 1px),
        linear-gradient(180deg, rgba(250, 252, 255, 0.92), rgba(238, 243, 250, 0.95));
    background-size: 14px 14px, 100% 100%;
    border-color: rgba(15, 23, 42, 0.14);
}
body.style-mono-matrix .num,
body.style-mono-matrix .drop-time,
body.style-mono-matrix .card-title,
body.style-mono-matrix .studio-sec-lbl,
body.style-mono-matrix .tab,
body.style-mono-matrix .count-pill,
body.style-mono-matrix .acc-count,
body.style-mono-matrix .wcag-pill {
    font-family: var(--font-mono);
    letter-spacing: 0.03em;
}
body.style-mono-matrix .pill-btn {
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    font-family: var(--font);
    font-size: 11px;
    font-weight: 600;
}
body.style-mono-matrix.mode-light .pill-btn:not(.accent) {
    border-color: rgba(15, 23, 42, 0.14);
}
body.style-mono-matrix .pill-btn.accent {
    background: var(--accent-1);
    color: var(--accent-ink);
    box-shadow: 0 6px 18px -6px rgba(var(--a1-rgb), 0.52);
    border-color: var(--accent-1);
}
body.style-mono-matrix .micro-btn {
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.12);
}
body.style-mono-matrix .micro-btn:hover {
    border-color: var(--accent-1);
    background: rgba(var(--a1-rgb), 0.14);
}

/* 5. SPATIAL VISION — Apple visionOS 26 Floating Spatial Capsules & Double Frosted Glass Rim */
body.style-spatial-vision {
    --radius-shell: 30px;
    --radius-card: 22px;
    --radius-item: 14px;
    --radius-btn: 999px;
}
body.style-spatial-vision .glass-shell {
    background:
        radial-gradient(ellipse 84% 58% at 50% 0%, rgba(255, 255, 255, 0.16), transparent 64%),
        radial-gradient(ellipse 64% 55% at 15% 100%, rgba(var(--a1-rgb), 0.15), transparent 62%),
        radial-gradient(ellipse 60% 55% at 88% 100%, rgba(var(--a2-rgb), 0.14), transparent 62%),
        linear-gradient(160deg, var(--bg-glass-1), var(--bg-glass-2));
    border: 1.5px solid rgba(255, 255, 255, 0.28);
    box-shadow:
        0 30px 66px -14px rgba(0, 0, 0, 0.72),
        0 0 0 0.5px rgba(255, 255, 255, 0.14),
        inset 0 2px 0 rgba(255, 255, 255, 0.44),
        inset 0 -1.5px 0 rgba(255, 255, 255, 0.12),
        inset 1px 0 0 rgba(255, 255, 255, 0.16),
        inset -1px 0 0 rgba(255, 255, 255, 0.16);
}
body.style-spatial-vision .pill-btn {
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.085);
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
}
body.style-spatial-vision .pill-btn:hover {
    background: rgba(255, 255, 255, 0.18);
    border-color: rgba(255, 255, 255, 0.40);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 6px 18px -6px rgba(0, 0, 0, 0.40);
}
body.style-spatial-vision .pill-btn.accent {
    background: linear-gradient(135deg, rgba(255,255,255,0.28), rgba(var(--a1-rgb),0.45));
    color: var(--text-1);
    border: 1px solid rgba(255, 255, 255, 0.48);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 8px 22px -6px var(--accent-glow);
}
body.style-spatial-vision .micro-btn {
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.09);
    border: 1px solid rgba(255, 255, 255, 0.20);
}
body.style-spatial-vision .micro-btn:hover {
    background: rgba(255, 255, 255, 0.22);
    border-color: rgba(255, 255, 255, 0.48);
    box-shadow: 0 0 14px rgba(255, 255, 255, 0.22);
}

/* 6. CYBER HUD — Precision Sci-Fi Chamfered Tactical HUD, Blueprint Grid & Laser Rail */
body.style-cyber-prism {
    --radius-shell: 3px;
    --radius-card: 3px;
    --radius-item: 3px;
    --radius-btn: 3px;
}
body.style-cyber-prism .glass-shell {
    background:
        linear-gradient(var(--accent-1), var(--accent-1)) 0 0 / 12px 2px no-repeat,
        linear-gradient(var(--accent-1), var(--accent-1)) 0 0 / 2px 12px no-repeat,
        linear-gradient(var(--accent-2), var(--accent-2)) 100% 100% / 12px 2px no-repeat,
        linear-gradient(var(--accent-2), var(--accent-2)) 100% 100% / 2px 12px no-repeat,
        linear-gradient(rgba(var(--a1-rgb), 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(var(--a1-rgb), 0.055) 1px, transparent 1px),
        linear-gradient(180deg, var(--bg-glass-1), var(--bg-glass-2));
    background-size: 12px 2px, 2px 12px, 12px 2px, 2px 12px, 16px 16px, 16px 16px, 100% 100%;
    border: 1px solid rgba(var(--a1-rgb), 0.34);
    border-top: 2px solid var(--accent-1);
    box-shadow:
        0 22px 50px -12px rgba(0, 0, 0, 0.88),
        0 0 26px -10px rgba(var(--a1-rgb), 0.32),
        inset 0 1px 16px -6px rgba(var(--a1-rgb), 0.26);
}
body.style-cyber-prism .num,
body.style-cyber-prism .drop-time,
body.style-cyber-prism .card-title,
body.style-cyber-prism .tab,
body.style-cyber-prism .studio-sec-lbl,
body.style-cyber-prism .wcag-pill {
    font-family: var(--font-mono);
    letter-spacing: 0.04em;
}
body.style-cyber-prism .pill-btn {
    border-radius: 3px;
    border: 1px solid rgba(var(--a1-rgb), 0.24);
    background: rgba(var(--a1-rgb), 0.055);
}
body.style-cyber-prism .pill-btn:hover {
    border-color: var(--accent-1);
    background: rgba(var(--a1-rgb), 0.14);
    box-shadow: 0 0 12px -4px var(--accent-glow);
}
body.style-cyber-prism .pill-btn.accent {
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    border-radius: 3px;
    box-shadow: 0 0 16px -4px var(--accent-glow);
}
body.style-cyber-prism .micro-btn {
    border-radius: 3px;
    border: 1px solid rgba(var(--a1-rgb), 0.24);
}

/* 7. HIGH CONTRAST — Zero blur, crisp WCAG AAA outlines */
body.style-high-contrast {
    --radius-shell: 6px;
    --radius-card: 5px;
    --radius-item: 5px;
    --radius-btn: 5px;
}
body.style-high-contrast .glass-shell {
    background: var(--bg-glass-1);
    border: 2px solid var(--border-rim);
    box-shadow: none;
}

/* ========== SHARED TACTILE CONTROLS ========== */
.pill-btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 29px; padding: 0 11px;
    border-radius: var(--radius-btn);
    border: 1px solid var(--border-subtle);
    background: var(--bg-card);
    color: var(--text-1);
    font-family: var(--font); font-size: 11.5px; font-weight: 600;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: transform 0.15s var(--ease), background 0.14s, border-color 0.14s, color 0.14s, box-shadow 0.15s;
    white-space: nowrap;
}
.pill-btn:hover { background: var(--bg-card-hover); border-color: var(--border-rim); transform: translateY(-0.5px); }
.pill-btn:active { transform: scale(0.96); }
.pill-btn.accent {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: var(--accent-ink);
    border-color: transparent;
    box-shadow: 0 6px 18px -5px var(--accent-glow);
}
.pill-btn.accent:hover { filter: brightness(1.06); }
.pill-btn.subtle { background: transparent; border-color: transparent; color: var(--text-2); }
.pill-btn.subtle:hover { background: var(--bg-card); color: var(--text-1); border-color: var(--border-subtle); }
.micro-btn {
    width: 27px; height: 27px; border-radius: 8px;
    border: 1px solid var(--border-subtle);
    background: var(--bg-card);
    color: var(--text-2);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    transition: all 0.14s var(--ease);
}
.micro-btn:hover { background: var(--bg-card-hover); color: var(--text-1); border-color: var(--accent-ring); }
.micro-btn.active { background: var(--accent-tint); color: var(--accent-1); border-color: var(--accent-ring); }
.micro-btn.danger:hover { background: rgba(251,113,133,0.20); color: var(--danger); border-color: var(--danger); }
/* ========== PROJECT AURORA v3.0 RUST ENGINE VISUAL POLISH ========== */
body.style-mono-matrix .tab.active {
    background: var(--text-1) !important;
    color: #0B0B0E !important;
    font-weight: 800 !important;
}
body.style-mono-matrix.mode-light .tab.active {
    background: #111114 !important;
    color: #FAFAFA !important;
}
body.style-cyber-prism .dock-item.active::after {
    box-shadow: 0 0 12px var(--accent-1), 0 0 4px var(--accent-1) !important;
}
        :root {
    --radial-disc-bg: radial-gradient(circle at 50% 30%, rgba(20, 30, 52, 0.96), rgba(8, 12, 22, 0.985));
    --radial-orb-bg: rgba(255, 255, 255, 0.065);
    --radial-orb-border: rgba(255, 255, 255, 0.14);
    --radial-orb-hover: rgba(var(--a1-rgb), 0.20);
    --radial-orbit-bg: rgba(12, 18, 32, 0.96);
    --radial-caption-bg: rgba(10, 15, 28, 0.96);
    --radial-ring-stroke: rgba(148, 163, 184, 0.30);
    --radial-shadow: 0 22px 52px -10px rgba(0, 0, 0, 0.76), 0 6px 20px -4px rgba(0, 0, 0, 0.42);
    --acc-bg: rgba(255, 255, 255, 0.045);
    --acc-open-bg: rgba(var(--a1-rgb), 0.10);
}
.dock-stage {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center;
    padding-bottom: 8px;
    pointer-events: none;
    position: relative;
}
.dock-stage.pinned-bar-stage {
    padding-bottom: 0 !important;
}
.dock-stage.tucked-stage {
    padding-bottom: 3px;
}

/* ========== 2026 AURORA ZERO-SHIFT DENDRITIC CIRCULAR CONSTELLATION ========== */
/* Fixed circular optical-glass orbs connected by organic curved light stems — 0px layout shift, tiny 21px outward micro-beads! */
#radialHub {
    position: fixed;
    bottom: 52px;
    left: 50%;
    padding: 0;
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    display: none;
    pointer-events: auto;
    z-index: 30;
    overflow: visible;
}
#radialHub.open { display: block; }

.const-svg-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
    z-index: 1;
}

.orb-stem {
    fill: none;
    stroke: rgba(255, 255, 255, 0.28);
    stroke-width: 1.35;
    stroke-linecap: round;
    transition: stroke 0.16s ease, stroke-width 0.16s ease, opacity 0.16s ease;
}
body.mode-light .orb-stem {
    stroke: rgba(15, 23, 42, 0.24);
}
.orb-stem.hot {
    stroke: var(--accent-1);
    stroke-width: 2.0;
}
.orb-stem-glow {
    fill: none;
    stroke: var(--accent-1);
    stroke-width: 4.5;
    stroke-linecap: round;
    opacity: 0;
    transition: opacity 0.18s ease;
}
.orb-stem-glow.hot {
    opacity: 0.32;
}
.orb-halo-arc {
    fill: none;
    stroke: rgba(255, 255, 255, 0.30);
    stroke-width: 1.25;
    stroke-linecap: round;
}
body.mode-light .orb-halo-arc {
    stroke: rgba(15, 23, 42, 0.24);
}

/* Invisible hover cushion around hovered leaf orb + its tiny micro-beads so moving onto micro-beads never drops hover */
.orb-bridge {
    position: absolute;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    pointer-events: none;
    z-index: 8;
}
.orb-bridge.active {
    pointer-events: auto;
    z-index: 16;
}

/* Fixed circular glass orb — NEVER shifts width or position! */
.orb-node {
    position: absolute;
    transform: translate(-50%, -50%);
    border-radius: 50% !important;
    background:
        radial-gradient(circle at 30% 22%, rgba(255, 255, 255, 0.26), rgba(255, 255, 255, 0.05) 46%, rgba(11, 15, 26, 0.88) 100%) !important;
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border: 1.25px solid rgba(255, 255, 255, 0.24) !important;
    box-shadow:
        0 14px 28px -6px rgba(0, 0, 0, 0.72),
        0 3px 10px rgba(0, 0, 0, 0.38),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.42),
        inset 0 -6px 12px rgba(0, 0, 0, 0.34);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    pointer-events: auto;
    z-index: 14;
    transition: border-color 0.15s ease, box-shadow 0.18s ease, background 0.15s ease;
}
body.mode-light .orb-node {
    background:
        radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.98), rgba(241, 246, 253, 0.92) 60%, rgba(226, 234, 246, 0.95) 100%) !important;
    border-color: rgba(15, 23, 42, 0.16) !important;
    box-shadow:
        0 12px 24px -6px rgba(15, 23, 42, 0.20),
        0 2px 6px rgba(15, 23, 42, 0.10),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.98);
}
#radialHub.animate-in .orb-node {
    animation: orbBloomIn 0.20s var(--spring) both;
    animation-delay: calc(var(--stagger, 0) * 24ms);
}
@keyframes orbBloomIn {
    from { opacity: 0; transform: translate(-50%, -50%) scale(0.72); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(1); }

/* ========== 2026 FLOATING CRYSTAL DOCK & EDGE-TO-EDGE FIXED BAR ========== */
/* Prevent empty 24x54 glass stub before first Rust state payload arrives on cold boot */
body:not(.state-ready) #dockBar {
    opacity: 0 !important;
    pointer-events: none !important;
}
#dockBar {
    --ds: 1;
    --item-sz: calc(40px * var(--ds));
    --img-sz: calc(25px * var(--ds));
    pointer-events: auto;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    gap: calc(6px * var(--ds));
    max-width: calc(100vw - 24px);
    width: auto;
    height: auto;
    min-height: calc(54px * var(--ds));
    padding: calc(6px * var(--ds)) calc(11px * var(--ds));
    border-radius: var(--radius-shell);
    transition: width 0.22s var(--ease), height 0.22s var(--ease), border-radius 0.22s var(--ease), padding 0.20s var(--ease), opacity 0.18s;
    z-index: 20;
}

/* PINNED EDGE-TO-EDGE FIXED BAR ("Sabit Bar") — 0px wallpaper bleed, exact WorkArea height! */
#dockBar.pinned-bar {
    width: 100vw;
    max-width: 100vw;
    height: calc(52px * var(--ds));
    min-height: calc(52px * var(--ds));
    padding: 0 calc(16px * var(--ds));
    gap: calc(5px * var(--ds));
    border-radius: 0 !important;
    border-left: none !important;
    border-right: none !important;
    border-bottom: none !important;
    left: 0 !important;
    top: 0 !important;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
}
#dockBar.pinned-bar {
    --item-sz: calc(38px * var(--ds));
    --img-sz: calc(24px * var(--ds));
}
#dockBar.pinned-bar.density-compact {
    height: calc(44px * var(--ds));
    min-height: calc(44px * var(--ds));
    --item-sz: calc(33px * var(--ds));
    --img-sz: calc(20px * var(--ds));
    padding: 0 calc(14px * var(--ds));
}
#dockBar.pinned-bar.density-cozy {
    height: calc(60px * var(--ds));
    min-height: calc(60px * var(--ds));
    --item-sz: calc(44px * var(--ds));
    --img-sz: calc(28px * var(--ds));
    padding: 0 calc(18px * var(--ds));
}

/* 3-Zone Adaptive Collision-Proof Dock Layout (Symmetric when balanced, Flex when asymmetric, Crowd tiers 1..3) */
#dockBar:not(.tucked):not([data-dock-layout="symmetric"]) {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: calc(8px * var(--ds));
}
#dockBar[data-dock-layout="measure"] {
    display: flex !important;
    align-items: center !important;
    justify-content: flex-start !important;
    width: max-content !important;
    max-width: none !important;
    gap: calc(8px * var(--ds)) !important;
}
#dockBar[data-dock-layout="measure"] .bar-zone-left,
#dockBar[data-dock-layout="measure"] .bar-zone-center,
#dockBar[data-dock-layout="measure"] .bar-zone-right {
    flex: 0 0 auto !important;
    width: max-content !important;
    max-width: none !important;
    overflow: visible !important;
}
#dockBar[data-dock-layout="symmetric"] {
    display: grid !important;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) !important;
    align-items: center !important;
    gap: calc(8px * var(--ds)) !important;
}
#dockBar[data-dock-layout="symmetric"] .bar-zone-left { justify-self: start; }
#dockBar[data-dock-layout="symmetric"] .bar-zone-center { justify-self: center; }
#dockBar[data-dock-layout="symmetric"] .bar-zone-right { justify-self: end; }
#dockBar[data-dock-layout="flex"] {
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    gap: calc(8px * var(--ds)) !important;
}
#dockBar[data-dock-layout="flex"] .bar-zone-left { flex: 0 1 auto; min-width: 0; }
#dockBar[data-dock-layout="flex"] .bar-zone-center { flex: 0 1 auto; min-width: 0; justify-content: center; }
#dockBar[data-dock-layout="flex"] .bar-zone-right { flex: 0 1 auto; min-width: 0; }
.bar-zone-left {
    display: flex; align-items: center; justify-content: flex-start;
    gap: calc(5px * var(--ds)); min-width: 0; overflow: hidden;
}
.bar-zone-center {
    display: flex; align-items: center; justify-content: center;
    gap: calc(5px * var(--ds)); min-width: 0;
}
.bar-zone-right {
    display: flex; align-items: center; justify-content: flex-end;
    gap: calc(5px * var(--ds)); min-width: 0; overflow: hidden;
}
.bar-zone-center.center-scroll {
    flex: 1 1 0% !important;
    justify-content: flex-start !important;
    overflow-x: auto !important;
    overflow-y: hidden !important;
    scrollbar-width: none;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 12px, #000 calc(100% - 12px), transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0, #000 12px, #000 calc(100% - 12px), transparent 100%);
}
.bar-zone-center.center-scroll::-webkit-scrollbar { display: none; }

/* Progressive Crowd Tiers (data-crowd="1|2|3") */
#dockBar[data-crowd="1"] .dw-seek-track { width: 46px !important; }
#dockBar[data-crowd="1"] .dw-ms-meta { max-width: 74px !important; }
#dockBar[data-crowd="1"] .dw-pill { padding: 0 7px; gap: 4px; }
#dockBar[data-crowd="1"] .dock-status-pill,
#dockBar[data-crowd="1"] .dock-clock-pill { padding: 0 7px; gap: 5px; }

#dockBar[data-crowd="2"],
#dockBar[data-crowd="3"] {
    --item-sz: calc(35px * var(--ds));
    --img-sz: calc(22px * var(--ds));
}
#dockBar[data-crowd="2"] .bar-zone-center,
#dockBar[data-crowd="3"] .bar-zone-center {
    gap: calc(3px * var(--ds));
}
#dockBar[data-crowd="2"] .dw-media-studio,
#dockBar[data-crowd="3"] .dw-media-studio {
    gap: 6px; padding: 0 4px;
}
#dockBar[data-crowd="2"] .dw-media-studio .dw-ms-timeline,
#dockBar[data-crowd="2"] .dw-media-studio .dw-ms-vol,
#dockBar[data-crowd="3"] .dw-media-studio .dw-ms-timeline,
#dockBar[data-crowd="3"] .dw-media-studio .dw-ms-vol {
    display: none !important;
}
#dockBar[data-crowd="2"] .dw-media-studio .dw-ms-meta,
#dockBar[data-crowd="3"] .dw-media-studio .dw-ms-meta {
    max-width: 68px !important;
}
#dockBar[data-crowd="2"] .dw-pill,
#dockBar[data-crowd="3"] .dw-pill {
    padding: 0 6px; gap: 4px;
}
#dockBar[data-crowd="2"] .dock-status-pill,
#dockBar[data-crowd="2"] .dock-clock-pill,
#dockBar[data-crowd="3"] .dock-status-pill,
#dockBar[data-crowd="3"] .dock-clock-pill {
    padding: 0 6px; gap: 4px;
}
#dockBar[data-crowd="3"] .dw-ms-artist,
#dockBar[data-crowd="3"] .dw-st-bot,
#dockBar[data-crowd="3"] .dock-clock-date,
#dockBar[data-crowd="3"] .dw-ed-date,
#dockBar[data-crowd="3"] .dw-sub,
#dockBar[data-crowd="3"] .start-capsule span {
    display: none !important;
}
#dockBar[data-crowd="3"] .dw-media-studio .dw-ms-meta {
    max-width: 54px !important;
}

/* TUCKED INTELLIHIDE / AUTO-HIDE HOME INDICATOR — Ultra-slim 4px flush edge trigger! */
#dockBar.tucked {
    height: 4px; min-height: 4px; width: 148px; min-width: 0; padding: 0; border-radius: 99px;
    background: linear-gradient(90deg, transparent 0%, var(--accent-1) 26%, var(--accent-2) 74%, transparent 100%);
    border: none !important;
    box-shadow: 0 0 12px var(--accent-glow), 0 1px 6px rgba(0, 0, 0, 0.35);
    cursor: pointer; opacity: 0.86;
}
#dockBar.tucked::after { display: none !important; }

.dock-pin-btn {
    position: relative;
}
.dock-pin-btn.smart-dodge {
    background: rgba(var(--a2-rgb), 0.15);
    color: var(--accent-2);
    border-color: rgba(var(--a2-rgb), 0.36);
}
.dock-pin-btn .hover-label {
    top: -34px;
}
.dock-pin-btn:hover .hover-label {
    opacity: 1;
}

/* Attention Pulse & Live Progress Arc on Dock Icons */
@keyframes attnPulse {
    0%, 100% { box-shadow: 0 0 0 1.5px rgba(251,191,36,0.72), 0 0 14px -2px rgba(251,191,36,0.48); border-color: var(--warning); }
    50% { box-shadow: 0 0 0 2.5px rgba(251,191,36,0.92), 0 0 20px 0px rgba(251,191,36,0.68); border-color: var(--warning); }
}
.dock-item.attention {
    animation: attnPulse 1.65s ease-in-out infinite;
}
.attn-pip {
    position: absolute; top: 1px; left: 1px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--warning);
    box-shadow: 0 0 7px var(--warning);
    border: 1.5px solid var(--bg-glass-2);
    pointer-events: none;
}
.dock-item.drag-target {
    border-color: var(--accent-1) !important;
    background: var(--accent-tint) !important;
    box-shadow: 0 0 0 2px var(--accent-ring), 0 8px 20px -4px var(--accent-glow) !important;
    transform: translateY(-5px) scale(1.10) !important;
}
.dock-prog-svg {
    position: absolute; inset: -1px;
    width: calc(100% + 2px); height: calc(100% + 2px);
    pointer-events: none;
}
.prog-pill {
    position: absolute; bottom: -3px; right: -4px;
    padding: 0 4px; height: 13px; border-radius: 99px;
    background: var(--success); color: #04101F;
    font-size: 8.5px; font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.32);

/* Dock Folder Stacks ("Klasör Yığınları") */
.folder-chip {
    position: relative;
    width: calc(var(--item-sz) * 0.90); height: calc(var(--item-sz) * 0.90); flex-shrink: 0;
    border-radius: var(--radius-item);

    border: 1px solid transparent;

    border-color: var(--accent-ring);

}

#folderStackCard {
    position: fixed;
    bottom: 62px;
    left: 50%;

.radial-bottom-row {

.radial-bottom-row .radial-bottom-pill {

.radial-bottom-row .radial-bottom-pill.danger:hover {
    border-color: var(--danger); color: var(--danger);
}

/* 2026 RESTRAINED SEARCH TRIGGER (Understated neutral at rest, accent bloom on hover) */
.search-pill {
    position: relative;
    height: calc(var(--item-sz) * 0.86); padding: 0 calc(11px * var(--ds));
    border-radius: var(--radius-btn);
    display: inline-flex; align-items: center; gap: calc(6px * var(--ds));
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    color: var(--text-2); font-size: calc(11.5px * var(--ds)); font-weight: 600;

.search-pill:hover {
    background: var(--accent-soft);
    color: var(--accent-1); border-color: var(--accent-ring);
}
.search-pill:hover .hover-label { opacity: 1; }

/* 2026 UNBOXED DOCK ICONOGRAPHY — Zero heavy idle borders, pure tactile hover/active focus! */
.dock-item {
    position: relative;
    width: var(--item-sz); height: var(--item-sz); flex-shrink: 0;
    border-radius: var(--radius-item);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transform-origin: bottom center;
    will-change: transform;
    background: transparent;
    border: 1px solid transparent;
    transition: background 0.15s var(--ease), border-color 0.15s var(--ease), box-shadow 0.16s var(--ease);

    border-color: rgba(var(--a1-rgb), 0.28);

.dock-item.radial-anchored {

.dock-item img {
    width: var(--img-sz); height: var(--img-sz);

    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.28));
}

    width: var(--img-sz); height: var(--img-sz); border-radius: calc(7px * var(--ds));
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: var(--accent-ink); font-weight: 800; font-size: calc(12px * var(--ds));
    display: flex; align-items: center; justify-content: center;
}
.dock-dot {
    position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%);
    height: 3px; border-radius: 99px;
    background: var(--text-2);
    pointer-events: none;

}

.dw-vinyl-disc img {

.cal-today-hero {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 10px; border-radius: var(--radius-card);
    background: linear-gradient(135deg, rgba(var(--a1-rgb), 0.14), rgba(var(--a2-rgb), 0.09));
    border: 1px solid var(--accent-ring);
}
.cal-cd-pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 8px; border-radius: 99px;
    background: var(--bg-card); border: 1px solid var(--border-subtle);
    font-size: 10.5px; font-weight: 700; color: var(--text-1); cursor: pointer;
    transition: border-color 0.14s, background 0.14s;
}
.cal-cd-pill:hover { border-color: var(--accent-ring); background: var(--bg-card-hover); }
.cal-section {
    display: flex; flex-direction: column; gap: 6px;
    padding-top: 8px; border-top: 1px solid var(--border-subtle);
}
.cal-sec-hdr {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    font-size: 10.5px; font-weight: 800; color: var(--text-2);
    text-transform: uppercase; letter-spacing: 0.04em;
}
.cal-todo-list {
    display: flex; flex-direction: column; gap: 4px; max-height: 104px; overflow-y: auto;
}
.cal-todo-row {
    display: flex; align-items: center; gap: 7px;
    padding: 5px 7px; border-radius: 9px;
    background: var(--bg-card); border: 1px solid var(--border-subtle);
    font-size: 11.5px;
}
.cal-todo-chk {
    width: 16px; height: 16px; border-radius: 5px;
    border: 1.5px solid var(--border-rim); background: transparent;
    color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0; font-size: 10px; font-weight: 800;
}
.cal-todo-chk.done {
    background: var(--accent-1); border-color: var(--accent-1);
}
.cal-todo-txt {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    cursor: pointer;
}
.cal-todo-txt.done { text-decoration: line-through; opacity: 0.55; }

/* Categorized Widget Picker */
.dwp-cats {
    display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
}
.dwp-cat-btn {
    height: 23px; padding: 0 8px; border-radius: 99px;
    border: 1px solid var(--border-subtle); background: var(--bg-card);
    color: var(--text-2); font-family: var(--font); font-size: 10px; font-weight: 700;
    cursor: pointer; transition: all 0.12s;
}
.dwp-cat-btn:hover { color: var(--text-1); border-color: var(--border-rim); }
.dwp-cat-btn.active { background: var(--accent-soft); border-color: var(--accent-ring); color: var(--accent-1); }
.dwp-group-lbl {
    font-size: 9.5px; font-weight: 800; color: var(--text-2);
    text-transform: uppercase; letter-spacing: 0.05em;
    padding: 4px 2px 1px;
}

/* ========== BOTTOM OMNISEARCH (#omnibar) ========== */
#omnibar {
    pointer-events: auto;
    position: fixed;
    left: 50%;
    bottom: 64px;
    transform: translateX(-50%);
    width: min(700px, calc(100vw - 24px));
    max-height: min(530px, calc(100vh - 82px));
    overflow: hidden;
    border-radius: var(--radius-shell);
    padding: 13px;
    display: none;
    flex-direction: column;
    gap: 9px;
    z-index: 58;
    animation: omniPopIn 0.17s var(--spring);
}
#omnibar.open { display: flex; }
body.edge-left #omnibar,
body.edge-right #omnibar {
    transform: none;
    animation: popRiseIn 0.17s var(--spring);
    width: min(640px, calc(100vw - 92px));
    max-height: calc(100vh - 28px);
}
@keyframes omniPopIn {
    from { opacity: 0; transform: translateX(-50%) translateY(10px) scale(0.97); }
    to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
}
.omni-input-wrap {
    display: flex; align-items: center; gap: 9px;
    background: var(--bg-inset);
    border: 1.5px solid var(--accent-ring);
    border-radius: var(--radius-card);
    padding: 8px 11px;
    box-shadow: 0 0 0 3px rgba(var(--a1-rgb), 0.10);
}
.omni-input-wrap:focus-within {
    border-color: var(--accent-1);
    box-shadow: 0 0 0 3px rgba(var(--a1-rgb), 0.22);
}
.omni-input-wrap input {
    flex: 1; min-width: 0; background: transparent; border: none; outline: none;
    color: var(--text-1); font-family: var(--font); font-size: 13.5px; font-weight: 500;
    user-select: text;
}
.omni-input-wrap input::placeholder { color: var(--text-2); opacity: 0.78; }
.omni-filters {
    display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
}
.omni-chip {
    height: 24px; padding: 0 9px; border-radius: 99px;
    border: 1px solid var(--border-subtle); background: var(--bg-card);
    color: var(--text-2); font-family: var(--font); font-size: 10.5px; font-weight: 700;
    cursor: pointer; transition: all 0.12s;
}
.omni-chip:hover { color: var(--text-1); border-color: var(--border-rim); }
.omni-chip.active { background: var(--accent-soft); border-color: var(--accent-ring); color: var(--accent-1); }
.omni-smart-card {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 9px 12px; border-radius: var(--radius-card);
    background: linear-gradient(135deg, rgba(var(--a1-rgb), 0.16), rgba(var(--a2-rgb), 0.10));
    border: 1.5px solid var(--accent-ring);
    cursor: pointer; transition: border-color 0.12s, box-shadow 0.12s;
}
.omni-smart-card.sel, .omni-smart-card:hover {
    border-color: var(--accent-1);
    box-shadow: 0 0 0 2px rgba(var(--a1-rgb), 0.32);
}
.omni-list {
    display: flex; flex-direction: column; gap: 4px;
    max-height: 276px; overflow-y: auto; padding-right: 2px;
}
.omni-row {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 10px; border-radius: var(--radius-item);
    background: var(--bg-card); border: 1px solid transparent;
    cursor: pointer; transition: background 0.11s, border-color 0.11s, box-shadow 0.11s;
}
.omni-row:hover {
    background: var(--bg-card-hover); border-color: var(--border-rim);
}
.omni-row.sel {
    background: var(--accent-soft);
    border-color: var(--accent-1);
    box-shadow: 0 0 0 2px rgba(var(--a1-rgb), 0.34);
}
.omni-row img { width: 22px; height: 22px; border-radius: 5px; flex-shrink: 0; object-fit: contain; }
.omni-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 6px; max-height: 272px; overflow-y: auto; padding: 2px;
}
.omni-app-card {
    position: relative;
    display: flex; align-items: center; gap: 8px;
    padding: 7px 9px; border-radius: var(--radius-item);
    background: var(--bg-card); border: 1px solid var(--border-subtle);
    cursor: pointer; transition: background 0.12s, border-color 0.12s, box-shadow 0.12s;
}
.omni-app-card:hover {
    background: var(--bg-card-hover); border-color: var(--border-rim);
}
.omni-app-card.sel {
    background: var(--accent-soft);
    border-color: var(--accent-1);
    box-shadow: 0 0 0 2px rgba(var(--a1-rgb), 0.36);
}
.omni-app-card img { width: 22px; height: 22px; border-radius: 5px; flex-shrink: 0; object-fit: contain; }
.omni-app-card .pin-mini {
    opacity: 0; width: 20px; height: 20px; border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--bg-inset); color: var(--text-2); flex-shrink: 0;
    transition: opacity 0.12s, color 0.12s;
}
.omni-app-card:hover .pin-mini, .omni-app-card.sel .pin-mini { opacity: 1; }
.omni-app-card .pin-mini:hover { color: var(--accent-1); }
.omni-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap;
    padding-top: 7px; border-top: 1px solid var(--border-subtle);
}
.omni-row button:focus-visible, .omni-chip:focus-visible, .omni-app-card:focus-visible, .omni-input-wrap input:focus-visible {
    outline: none;
}
.omni-kbd {
    font-family: var(--font-mono); font-size: 9.5px; font-weight: 700;
    padding: 1px 5px; border-radius: 5px;
    background: var(--bg-inset); border: 1px solid var(--border-subtle); color: var(--text-2);
}

.qc-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px; }
.qc-tile {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 11px; border-radius: var(--radius-card);
    border: 1px solid var(--border-subtle);
    background: var(--bg-card); color: var(--text-1);
    cursor: pointer; text-align: left;
    transition: background 0.14s, border-color 0.14s, transform 0.12s;
}
.qc-tile:hover { background: var(--bg-card-hover); border-color: var(--border-rim); }
.qc-tile:active { transform: scale(0.97); }
.qc-tile.on {
    background: linear-gradient(135deg, rgba(var(--a1-rgb), 0.22), rgba(var(--a2-rgb), 0.16));
    border-color: var(--accent-ring);
}
.qc-tile .qc-ic {
    width: 30px; height: 30px; border-radius: 10px;
    background: var(--bg-card-hover); color: var(--text-2);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.qc-tile.on .qc-ic { background: var(--accent-1); color: var(--accent-ink); }
.qc-tile .qc-lbl { font-size: 12px; font-weight: 700; line-height: 1.15; }
.qc-tile .qc-sub { font-size: 10px; color: var(--text-2); margin-top: 1px; }

.qc-slider-box {
    display: flex; flex-direction: column; gap: 8px;
    padding: 10px 11px; border-radius: var(--radius-card);
    background: var(--bg-card); border: 1px solid var(--border-subtle);
}
.qc-srow { display: flex; align-items: center; gap: 8px; }
.qc-srow input[type=range] {
    flex: 1; accent-color: var(--accent-1); height: 5px; cursor: pointer;
}
.qc-srow .qc-val { width: 34px; text-align: right; font-size: 11px; font-weight: 700; color: var(--text-2); }
.qc-out-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.qc-out-chip {
    font-size: 10px; font-weight: 600; padding: 3px 8px; border-radius: 99px;
    border: 1px solid var(--border-subtle); background: transparent; color: var(--text-2);
    cursor: pointer; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.qc-out-chip.active { background: var(--accent-soft); border-color: var(--accent-ring); color: var(--accent-1); }

.qc-media {
    display: flex; align-items: center; gap: 9px;
    padding: 9px 10px; border-radius: var(--radius-card);
    background: linear-gradient(135deg, rgba(var(--a1-rgb), 0.12), rgba(var(--a2-rgb), 0.08));
    border: 1px solid var(--border-subtle);
}
.qc-media-art {
    width: 38px; height: 38px; border-radius: 9px; object-fit: cover;
    background: var(--bg-card-hover); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.qc-bat-strip { display: flex; flex-wrap: wrap; gap: 6px; }
.qc-bat-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 8px; border-radius: 99px;
    background: var(--bg-card); border: 1px solid var(--border-subtle);
    font-size: 10.5px; font-weight: 600; color: var(--text-1);
}
.qc-foot {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding-top: 6px; border-top: 1px solid var(--border-subtle);
}

/* Calendar & Notifications Popover */
.cn-tabs {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
    padding: 3px; border-radius: 11px; background: var(--bg-inset);
}
.cn-tab {
    border: none; background: transparent; color: var(--text-2);
    font-family: var(--font); font-size: 11.5px; font-weight: 700;
    padding: 6px 8px; border-radius: 8px; cursor: pointer;
    transition: background 0.14s, color 0.14s;
}
.cn-tab.active { background: var(--bg-card-hover); color: var(--text-1); box-shadow: 0 2px 6px rgba(0,0,0,0.22); }
.cn-list { display: flex; flex-direction: column; gap: 5px; max-height: 256px; overflow-y: auto; }
.cn-item {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 8px 10px; border-radius: 11px;
    background: var(--bg-card); border: 1px solid var(--border-subtle);
    cursor: pointer; transition: background 0.13s, border-color 0.13s;
}
.cn-item:hover { background: var(--bg-card-hover); border-color: var(--border-rim); }
.cal-head { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; font-weight: 800; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
.cal-dow { font-size: 10px; font-weight: 700; color: var(--text-2); padding: 3px 0; }
.cal-day {
    position: relative; height: 27px; border-radius: 8px; border: 1px solid transparent;
    background: transparent; color: var(--text-1); font-size: 11.5px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.cal-day:hover { background: var(--bg-card-hover); }
.cal-day.muted { opacity: 0.34; }
.cal-day.today { background: var(--accent-1); color: var(--accent-ink); font-weight: 800; }
.cal-day.sel:not(.today) { border-color: var(--accent-1); background: var(--accent-soft); }
.cal-day.has-note::after {
    content: ''; position: absolute; bottom: 2px; width: 4px; height: 4px; border-radius: 50%;
    background: var(--accent-2);
}
.cal-note-row { display: flex; gap: 6px; margin-top: 4px; }
.cal-note-inp {
    flex: 1; height: 30px; padding: 0 10px; border-radius: 9px;
    border: 1px solid var(--border-rim); background: var(--bg-inset); color: var(--text-1);
    font-family: var(--font); font-size: 11.5px; outline: none; user-select: text;
}
.cal-note-inp:focus { border-color: var(--accent-1); }

/* Context Menu */
.ctx-row {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 7px 9px; border-radius: 9px;
    border: none; background: transparent; color: var(--text-1);
    font-family: var(--font); font-size: 11.5px; font-weight: 600;
    cursor: pointer; text-align: left;
}
.ctx-row:hover { background: var(--bg-card-hover); }
.ctx-sep { height: 1px; background: var(--border-subtle); margin: 3px 6px; }
.ctx-style-chips { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; padding: 3px 6px; }
.ctx-chip {
    padding: 4px 6px; border-radius: 7px; font-size: 10px; font-weight: 700;
    border: 1px solid var(--border-subtle); background: var(--bg-card); color: var(--text-2);
    cursor: pointer; text-align: center;
}
.ctx-chip.active { background: var(--accent-soft); border-color: var(--accent-ring); color: var(--accent-1); }

/* ========== v4.0 MULTI-STYLE DOCK HUBS (3D Fan Cards, Win11 Modern Cards, Prism Radial Arc) ========== */
.hub-shell-card {
    border-radius: var(--radius-shell);
    padding: 10px 12px;
    display: flex; flex-direction: column; gap: 8px;
    min-width: 248px; max-width: min(740px, calc(100vw - 24px));
    animation: popRiseIn 0.17s var(--spring);
}
.hub-hdr { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.hub-hdr-title { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: var(--text-1); }
.hub-hdr-acts { display: inline-flex; align-items: center; gap: 4px; }

.fan3d-stage {
    display: flex; align-items: flex-end; justify-content: center;
    padding: 14px 18px 6px; perspective: 950px;
}
.fan3d-card {
    position: relative; width: 158px; min-height: 98px;
    margin: 0 -16px; padding: 10px;
    border-radius: 14px;
    background: linear-gradient(160deg, var(--bg-glass-2), var(--bg-glass-1));
    border: 1px solid var(--border-rim);
    box-shadow: 0 14px 28px -8px rgba(0, 0, 0, 0.56);
    cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
    transform: rotate(var(--fan-rot, 0deg)) translateY(var(--fan-dy, 0px)) rotateY(var(--fan-ry, 0deg));
    transition: transform 0.20s var(--spring), border-color 0.14s, box-shadow 0.16s, z-index 0s;
    z-index: var(--fan-z, 2);
}
.fan3d-card:hover, .fan3d-card.hovered {
    transform: rotate(0deg) translateY(-14px) scale(1.07);
    border-color: var(--accent-1);
    box-shadow: 0 20px 36px -8px rgba(0, 0, 0, 0.72), 0 0 18px -4px var(--accent-glow);
    z-index: 30;
}
.fan3d-card.active-win { border-color: var(--accent-ring); }

.cards-strip { display: flex; align-items: stretch; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.win-card {
    width: 176px; flex-shrink: 0; padding: 9px 10px;
    border-radius: 13px;
    background: var(--bg-card); border: 1px solid var(--border-subtle);
    cursor: pointer; display: flex; flex-direction: column; gap: 8px;
    transition: background 0.14s, border-color 0.14s, transform 0.14s var(--ease);
}
.win-card:hover, .win-card.hovered {
    background: var(--bg-card-hover); border-color: var(--accent-1); transform: translateY(-2px);
}
.win-card.active-win { border-color: var(--accent-ring); background: var(--accent-soft); }
.wcard-top { display: flex; align-items: center; gap: 7px; }
.wcard-top img { width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0; }
.wcard-title { font-size: 11.5px; font-weight: 700; color: var(--text-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.wcard-sub {
    font-size: 10px; color: var(--text-2);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    line-height: 1.3; min-height: 26px;
}
.wcard-acts { display: flex; align-items: center; justify-content: space-between; gap: 3px; }

.arc-node {
    position: absolute; transform: translate(-50%, -50%);
    display: inline-flex; align-items: center; gap: 6px;
    height: 36px; padding: 0 11px 0 8px; max-width: 148px;
    border-radius: 999px;
    background: linear-gradient(160deg, var(--bg-glass-2), var(--bg-glass-1));
    border: 1.25px solid var(--border-rim);
    box-shadow: 0 12px 24px -6px rgba(0, 0, 0, 0.62);
    cursor: pointer; z-index: 16;
    transition: border-color 0.14s, box-shadow 0.14s, transform 0.16s var(--spring);
}
.arc-node:hover, .arc-node.hovered {
    border-color: var(--accent-1);
    box-shadow: 0 14px 28px -6px rgba(0, 0, 0, 0.72), 0 0 18px -4px var(--accent-glow);
    transform: translate(-50%, -50%) scale(1.06);
    z-index: 26;
}
.arc-node img { width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0; }
.arc-node span { font-size: 11px; font-weight: 700; color: var(--text-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ========== v4.2 PRO 4-ZONE DOCK WIDGETS, DIRECT DRAG-REORDER & FLUID ZERO-CLICK UX ========== */
.dw-zone {
    display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0; min-width: 0;
    border-radius: 11px; transition: background 0.14s, border-color 0.14s, padding 0.14s;
}
.dw-zone.empty-idle { display: none; }
body.dock-dragging-widget .dw-zone,
body.dock-edit-mode .dw-zone {
    display: inline-flex !important;
    min-width: 58px; min-height: calc(var(--item-sz) * 0.78);
    padding: 0 5px;
    border: 1.5px dashed rgba(var(--a1-rgb), 0.36);
    background: rgba(var(--a1-rgb), 0.06);
}
.dw-zone.drop-hot {
    border-color: var(--accent-1) !important;
    background: rgba(var(--a1-rgb), 0.20) !important;
    box-shadow: 0 0 14px -3px var(--accent-glow);
}
.dw-zone-tag {
    display: none;
    font-size: 9px; font-weight: 800; letter-spacing: 0.03em;
    color: var(--accent-1); opacity: 0.85; padding: 0 4px;
    pointer-events: none; white-space: nowrap;
}
body.dock-dragging-widget .dw-zone:empty .dw-zone-tag,
body.dock-dragging-widget .dw-zone.zone-has-only-tag .dw-zone-tag,
body.dock-edit-mode .dw-zone.zone-has-only-tag .dw-zone-tag {
    display: inline-flex; align-items: center;
}
body.dock-edit-mode .dw-pill {
    border-style: dashed !important;
    border-color: rgba(var(--a1-rgb), 0.55) !important;
    cursor: grab !important;
}
.dw-edit-done {
    height: calc(var(--item-sz) * 0.78); padding: 0 10px;
    border-radius: 999px; border: 1px solid var(--accent-1);
    background: var(--accent-1); color: var(--accent-ink);
    font-size: 10.5px; font-weight: 800; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0;
    box-shadow: 0 4px 14px -3px var(--accent-glow);
}

/* Per-Widget Size & Appearance Modes */
.dw-pill.dw-sz-compact {
    height: calc(var(--item-sz) * 0.76); padding: 0 7px; gap: 4px; font-size: 10.5px;
}
.dw-pill.dw-sz-wide {
    padding: 0 12px; gap: 8px;
}
body .dw-pill.dw-st-clean,
.dw-pill.dw-st-clean {
    background: transparent !important; border-color: transparent !important;
    box-shadow: none !important;
    padding-left: 5px; padding-right: 5px;
}
body .dw-pill.dw-st-clean:hover,
body .dw-pill.dw-st-clean.open,
.dw-pill.dw-st-clean:hover {
    background: rgba(255, 255, 255, 0.08) !important; border-color: transparent !important;
    box-shadow: none !important;
}
body.mode-light .dw-pill.dw-st-clean:hover,

    const sil = getDockSilhouette();
    const arch = getShellArchitecture();
    if (FLOATING_ARCHS.includes(arch) || SPLIT_ARCHS.includes(arch) || sil === 'floating' || sil === 'islands' || sil === 'compact') return false;

function applyDockGeometryAndOffset() {
    const dock = document.getElementById('dockBar');
    if (!dock) return;
    const isVert = isVerticalEdge();
    const tuckedNow = isDockTuckedNow();
    const pinnedBar = isPinnedBarMode();

    const rawScale = liveScaleOverride !== null ? liveScaleOverride : (state?.dockScalePercent ?? 100);
    let ds = Math.max(0.75, Math.min(1.35, rawScale / 100.0));
    dock.style.setProperty('--ds', ds.toFixed(3));

    if (!tuckedNow && !pinnedBar && isVert) {
        const maxH = Math.max(220, window.innerHeight - 24);
        const actualH = dock.scrollHeight;
        if (actualH > maxH && actualH > 0) {
            const fitDs = Math.max(0.56, ds * ((maxH - 8) / actualH));
            dock.style.setProperty('--ds', fitDs.toFixed(3));
        }
    } else if (!tuckedNow && isVert && pinnedBar) {
        const maxH = Math.max(220, window.innerHeight - 16);
        const actualH = dock.scrollHeight;
        if (actualH > maxH && actualH > 0) {
            const fitDs = Math.max(0.56, ds * ((maxH - 8) / actualH));
            dock.style.setProperty('--ds', fitDs.toFixed(3));
        }
    }

    if (pinnedBar) {
        dock.style.left = '';
        dock.style.top = '';
    } else {
        const offsetPct = Math.max(-100, Math.min(100, state?.dockOffsetPercent ?? 0));
        if (offsetPct === 0) {
            dock.style.left = '';
            dock.style.top = '';
        } else if (isVert) {
            const rect = dock.getBoundingClientRect();
            const maxTravel = Math.max(0, (window.innerHeight - rect.height) / 2 - 14);
            const dy = Math.round((offsetPct / 100.0) * maxTravel);
            dock.style.left = '';
            dock.style.top = `${dy}px`;
        } else {
            const rect = dock.getBoundingClientRect();
            const maxTravel = Math.max(0, (window.innerWidth - rect.width) / 2 - 14);
            const dx = Math.round((offsetPct / 100.0) * maxTravel);
            dock.style.top = '';
            dock.style.left = `${dx}px`;
        }
    }

    dock.querySelectorAll('.mag-target').forEach(el => {
        el._baseW = null;
        el._baseH = null;
    });
}

let _fittingDockZones = false;
function fitDockZones() {
    const dock = document.getElementById('dockBar');
    if (!dock || isVerticalEdge() || isDockTuckedNow()) {
        if (dock) {
            dock.removeAttribute('data-crowd');
            dock.removeAttribute('data-dock-layout');
            dock.classList.remove('has-center-scroll');
        }
        return;
    }
    const leftEl = dock.querySelector('.bar-zone-left');
    const centerEl = dock.querySelector('.bar-zone-center');
    const rightEl = dock.querySelector('.bar-zone-right');
    if (!leftEl || !centerEl || !rightEl) return;
    if (_fittingDockZones) return;
    _fittingDockZones = true;
    try {
        const arch = getShellArchitecture();
        const sil = getDockSilhouette();
        const isIslands = (sil === 'islands' || SPLIT_ARCHS.includes(arch));
        const isArc = (arch === 'arc-split');
        const isFitCapsule = !isPinnedBarMode() && !isIslands && (arch === 'tahoe-glass' || arch === 'vision-orb');

        const cs = getComputedStyle(dock);
        const padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
        const viewportLimit = Math.max(320, window.innerWidth - (isPinnedBarMode() ? 0 : 26));
        const dockInnerW = Math.max(240, viewportLimit - padX);
        const gap = isIslands ? 10 : 8;

        const measureZones = (crowdLevel) => {
            dock.setAttribute('data-crowd', String(crowdLevel));
            dock.setAttribute('data-dock-layout', 'measure');
            dock.classList.remove('has-center-scroll');
            centerEl.classList.remove('center-scroll');
            leftEl.style.maxWidth = '';
            rightEl.style.maxWidth = '';
            centerEl.style.maxWidth = '';
            const lw = Math.ceil(leftEl.getBoundingClientRect().width);
            const cw = Math.ceil(centerEl.getBoundingClientRect().width);
            const rw = Math.ceil(rightEl.getBoundingClientRect().width);
            return { lw, cw, rw };
        };

        let chosenCrowd = 0;
        let chosenLayout = 'flex';
        let m = measureZones(0);

        const canSym = (x) => !isArc && !isFitCapsule && (Math.max(x.lw, x.rw) * 2 + x.cw + gap * 2 <= dockInnerW);
        const canFlex = (x) => (x.lw + x.cw + x.rw + gap * 2 <= dockInnerW);

        if (canSym(m)) {
            chosenCrowd = 0;
            chosenLayout = 'symmetric';
        } else if (canFlex(m)) {
            chosenCrowd = 0;
            chosenLayout = 'flex';
        } else {
            for (const tier of [1, 2, 3]) {
                m = measureZones(tier);
                chosenCrowd = tier;
                if (canSym(m)) {
                    chosenLayout = 'symmetric';
                    break;
                }
                if (canFlex(m)) {
                    chosenLayout = 'flex';
                    break;
                }
            }
        }

        dock.setAttribute('data-crowd', String(chosenCrowd));
        dock.setAttribute('data-dock-layout', chosenLayout);

        // Mathematical zero-overlap clamp: ensure left.right <= center.left and center.right <= right.left
        const lr = leftEl.getBoundingClientRect();
        const cr = centerEl.getBoundingClientRect();
        const rr = rightEl.getBoundingClientRect();
        const availForCenter = Math.max(0, dockInnerW - lr.width - rr.width - gap * 2);
        if (cr.width > availForCenter + 1 || lr.right > cr.left + 0.5 || cr.right > rr.left + 0.5) {
            if (chosenLayout === 'symmetric') {
                dock.setAttribute('data-dock-layout', 'flex');
            }
            if (lr.width + rr.width + gap * 2 + 120 > dockInnerW) {
                const sideBudget = Math.max(88, dockInnerW - 120 - gap * 2);
                const lShare = Math.round(sideBudget * (lr.width / Math.max(1, lr.width + rr.width)));
                const rShare = Math.max(64, sideBudget - lShare);
                leftEl.style.maxWidth = `${lShare}px`;
                rightEl.style.maxWidth = `${rShare}px`;
            }
            dock.classList.add('has-center-scroll');
            centerEl.classList.add('center-scroll');
        } else if (centerEl.scrollWidth > centerEl.clientWidth + 2) {
            dock.classList.add('has-center-scroll');
            centerEl.classList.add('center-scroll');
        }
    } finally {
        _fittingDockZones = false;
    }
}

function escHtml(s) {

function escAttr(s) {

function parseHexRgb(hex, fallback = [56, 189, 248]) {
    const h = String(hex || '').replace('#', '').trim();
    const clean = h.length === 8 ? h.slice(2) : h;
    if (clean.length !== 6) return fallback;
    const n = parseInt(clean, 16);
    if (Number.isNaN(n)) return fallback;
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function hexToRgba(hex, alpha) {
    const [r, g, b] = parseHexRgb(hex, [15, 23, 42]);
    return `rgba(${r},${g},${b},${alpha})`;
}

function relativeLum(hex) {
    const [r, g, b] = parseHexRgb(hex, [56, 189, 248]).map(v => {
        const c = v / 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
