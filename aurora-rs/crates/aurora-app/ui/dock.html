        <!DOCTYPE html>

        <style>
        :root {
    --bg-glass-1: rgba(15, 23, 42, 0.90);
    --bg-glass-2: rgba(22, 32, 56, 0.94);
    --bg-card: rgba(255, 255, 255, 0.045);
    --bg-card-hover: rgba(255, 255, 255, 0.09);
    --bg-inset: rgba(0, 0, 0, 0.28);
    --border-rim: rgba(255, 255, 255, 0.14);
    --border-subtle: rgba(255, 255, 255, 0.075);
    --text-1: #F8FAFC;
    --text-2: #B6C4D8;
    --accent-1: #38BDF8;
    --accent-2: #818CF8;
    --a1-rgb: 56, 189, 248;
    --a2-rgb: 129, 140, 248;
    --accent-soft: rgba(var(--a1-rgb), 0.13);
    --accent-tint: rgba(var(--a1-rgb), 0.22);
    --accent-ring: rgba(var(--a1-rgb), 0.46);
    --accent-glow: rgba(var(--a1-rgb), 0.30);
    --accent-ink: #04101F;
    --success: #34D399;
    --warning: #FBBF24;
    --danger: #FB7185;
    --radius-shell: 22px;
    --radius-card: 15px;
    --radius-item: 12px;
    --radius-btn: 999px;
    --shadow-shell:
        0 22px 54px -14px rgba(0, 0, 0, 0.72),
        0 4px 16px -4px rgba(0, 0, 0, 0.38),
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        inset 0 0 0 0.5px rgba(255, 255, 255, 0.07);
    --font: 'Segoe UI Variable Display', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'Cascadia Mono', 'JetBrains Mono', ui-monospace, Consolas, monospace;
    --spring: cubic-bezier(0.22, 1.12, 0.36, 1);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
* { box-sizing: border-box; user-select: none; -webkit-user-drag: none; }
html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent !important;
    overflow: hidden;
    font-family: var(--font);
    color: var(--text-1);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
}
.num { font-variant-numeric: tabular-nums; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.28); border-radius: 99px; }
.svg-ic {
    width: 15px; height: 15px; display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0; stroke: currentColor; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
}
.svg-ic.sm { width: 13px; height: 13px; }
.svg-ic.lg { width: 18px; height: 18px; }

/* ========== BASE OPTICAL SHELL (Liquid Glass 26 Default) ========== */
.glass-shell {
    position: relative;
    background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.11) 0%, rgba(255, 255, 255, 0.025) 34%, transparent 64%),
        radial-gradient(ellipse 68% 58% at 18% 0%, rgba(var(--a1-rgb), 0.12), transparent 66%),
        radial-gradient(ellipse 52% 46% at 86% 100%, rgba(var(--a2-rgb), 0.09), transparent 62%),
        linear-gradient(165deg, var(--bg-glass-1), var(--bg-glass-2));
    border: 1px solid var(--border-rim);
    box-shadow: var(--shadow-shell);
}

/* ========== 2026 ARCHITECTURAL VISUAL STYLES (Distinct Silhouette, Material, Texture & Controls) ========== */

/* 1. LIQUID GLASS 26 — Apple macOS Tahoe / iOS 26 Refractive Optical Crystal */
body.style-liquid-glass {
    --radius-shell: 24px;
    --radius-card: 17px;
    --radius-item: 13px;
    --radius-btn: 999px;
}
body.style-liquid-glass .glass-shell {
    background:
        linear-gradient(180deg, rgba(255,255,255,0.13) 0%, rgba(255,255,255,0.03) 34%, transparent 66%),
        radial-gradient(ellipse 66% 54% at 22% 0%, rgba(var(--a1-rgb), 0.14), transparent 65%),
        radial-gradient(ellipse 50% 45% at 85% 100%, rgba(var(--a2-rgb), 0.09), transparent 64%),
        linear-gradient(165deg, var(--bg-glass-1), var(--bg-glass-2));
    border: 1px solid rgba(255, 255, 255, 0.22);
    box-shadow:
        0 26px 58px -14px rgba(0, 0, 0, 0.72),
        0 6px 20px -6px rgba(0, 0, 0, 0.42),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.34),
        inset 0 -1px 0 rgba(255, 255, 255, 0.07);
}

/* 2. BENTO SILK — Scandinavian Tactile Porcelain & Layered Ceramic (Zero Neon Glow, Real Elevation!) */
body.style-bento-silk {
    --radius-shell: 22px;
    --radius-card: 16px;
    --radius-item: 13px;
    --radius-btn: 11px;
}
body.style-bento-silk .glass-shell {
    background: linear-gradient(180deg, var(--bg-glass-1), var(--bg-glass-2));
    border: 1px solid rgba(20, 22, 26, 0.13);
    box-shadow:
        0 22px 46px -14px rgba(20, 22, 26, 0.22),
        0 6px 16px -4px rgba(20, 22, 26, 0.11),
        inset 0 1px 0 rgba(255, 255, 255, 0.94);
}
body.style-bento-silk:not(.mode-light) .glass-shell {
    border-color: rgba(255, 255, 255, 0.15);
    box-shadow:
        0 22px 46px -14px rgba(0, 0, 0, 0.62),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
}
body.style-bento-silk .pill-btn {
    border-radius: 10px;
    border: 1px solid var(--border-rim);
    border-bottom-width: 2px;
    box-shadow: 0 1px 2px rgba(20, 22, 26, 0.06);
}
body.style-bento-silk.mode-light .pill-btn:not(.accent):not(.subtle) {
    background: rgba(255, 255, 255, 0.86);
}
body.style-bento-silk.mode-light .pill-btn:not(.accent):not(.subtle):hover {
    background: #FFFFFF;
    border-color: rgba(20, 22, 26, 0.22);
}
body.style-bento-silk .pill-btn.accent {
    background: var(--accent-1);
    border-color: rgba(0, 0, 0, 0.18);
    border-bottom-width: 2px;
    box-shadow: 0 2px 6px rgba(20, 22, 26, 0.14);
}
body.style-bento-silk .micro-btn {
    border-radius: 10px;
    border: 1px solid var(--border-subtle);
    border-bottom-width: 2px;
}
body.style-bento-silk.mode-light .micro-btn:not(.active) {
    background: rgba(255, 255, 255, 0.78);
}

/* 3. LINEAR SWISS — Raycast / Linear / Vercel Matte Carbon, Razor 1px Hairlines, Zero Glow */
body.style-linear-precision {
    --radius-shell: 10px;
    --radius-card: 7px;
    --radius-item: 7px;
    --radius-btn: 6px;
}
body.style-linear-precision .glass-shell {
    background: var(--bg-glass-1);
    border: 1px solid var(--border-rim);
    box-shadow:
        0 18px 40px -12px rgba(0, 0, 0, 0.72),
        inset 0 1px 0 rgba(255, 255, 255, 0.065);
}
body.style-linear-precision .pill-btn {
    border-radius: 6px;
    font-weight: 600;
    letter-spacing: -0.015em;
    transition: background 0.10s ease, border-color 0.10s ease, color 0.10s ease;
}
body.style-linear-precision .pill-btn:hover { transform: none; }
body.style-linear-precision .pill-btn.accent {
    background: var(--accent-1);
    box-shadow: none;
    border: 1px solid rgba(255, 255, 255, 0.16);
}
body.style-linear-precision .micro-btn {
    border-radius: 6px;
    transition: background 0.10s ease, border-color 0.10s ease, color 0.10s ease;
}

/* 4. MONO MATRIX — Refined Architectural Obsidian & Micro-Grain Hardware */
body.style-mono-matrix {
    --radius-shell: 20px;
    --radius-card: 14px;
    --radius-item: 12px;
    --radius-btn: 999px;
}
body.style-mono-matrix .glass-shell {
    background:
        radial-gradient(rgba(255, 255, 255, 0.032) 1px, transparent 1px),
        linear-gradient(180deg, rgba(16, 20, 30, 0.90), rgba(10, 13, 20, 0.95));
    background-size: 14px 14px, 100% 100%;
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow:
        0 24px 54px -14px rgba(0, 0, 0, 0.78),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
}
body.style-mono-matrix.mode-light .glass-shell {
    background:
        radial-gradient(rgba(15, 23, 42, 0.04) 1px, transparent 1px),
        linear-gradient(180deg, rgba(250, 252, 255, 0.92), rgba(238, 243, 250, 0.95));
    background-size: 14px 14px, 100% 100%;
    border-color: rgba(15, 23, 42, 0.14);
}
body.style-mono-matrix .num,
body.style-mono-matrix .drop-time,
body.style-mono-matrix .card-title,
body.style-mono-matrix .studio-sec-lbl,
body.style-mono-matrix .tab,
body.style-mono-matrix .count-pill,
body.style-mono-matrix .acc-count,
body.style-mono-matrix .wcag-pill {
    font-family: var(--font-mono);
    letter-spacing: 0.03em;
}
body.style-mono-matrix .pill-btn {
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 600;
}
body.style-mono-matrix .pill-btn.accent {
    background: var(--accent-1);
    color: var(--accent-ink);
    box-shadow: 0 6px 18px -6px rgba(var(--a1-rgb), 0.52);
    border-color: var(--accent-1);
}
body.style-mono-matrix .micro-btn {
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.12);
}
body.style-mono-matrix .micro-btn:hover {
    border-color: var(--accent-1);
    background: rgba(var(--a1-rgb), 0.14);
}

/* 5. SPATIAL VISION — Apple visionOS 26 Floating Spatial Capsules & Double Frosted Glass Rim */
body.style-spatial-vision {
    --radius-shell: 30px;
    --radius-card: 22px;
    --radius-item: 14px;
    --radius-btn: 999px;
}
body.style-spatial-vision .glass-shell {
    background:
        radial-gradient(ellipse 84% 58% at 50% 0%, rgba(255, 255, 255, 0.16), transparent 64%),
        radial-gradient(ellipse 64% 55% at 15% 100%, rgba(var(--a1-rgb), 0.15), transparent 62%),
        radial-gradient(ellipse 60% 55% at 88% 100%, rgba(var(--a2-rgb), 0.14), transparent 62%),
        linear-gradient(160deg, var(--bg-glass-1), var(--bg-glass-2));
    border: 1.5px solid rgba(255, 255, 255, 0.28);
    box-shadow:
        0 30px 66px -14px rgba(0, 0, 0, 0.72),
        0 0 0 0.5px rgba(255, 255, 255, 0.14),
        inset 0 2px 0 rgba(255, 255, 255, 0.44),
        inset 0 -1.5px 0 rgba(255, 255, 255, 0.12),
        inset 1px 0 0 rgba(255, 255, 255, 0.16),
        inset -1px 0 0 rgba(255, 255, 255, 0.16);
}
body.style-spatial-vision .pill-btn {
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.085);
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
}
body.style-spatial-vision .pill-btn:hover {
    background: rgba(255, 255, 255, 0.18);
    border-color: rgba(255, 255, 255, 0.40);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 6px 18px -6px rgba(0, 0, 0, 0.40);
}
body.style-spatial-vision .pill-btn.accent {
    background: linear-gradient(135deg, rgba(255,255,255,0.28), rgba(var(--a1-rgb),0.45));
    color: var(--text-1);
    border: 1px solid rgba(255, 255, 255, 0.48);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 8px 22px -6px var(--accent-glow);
}
body.style-spatial-vision .micro-btn {
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.09);
    border: 1px solid rgba(255, 255, 255, 0.20);
}
body.style-spatial-vision .micro-btn:hover {
    background: rgba(255, 255, 255, 0.22);
    border-color: rgba(255, 255, 255, 0.48);
    box-shadow: 0 0 14px rgba(255, 255, 255, 0.22);
}

/* 6. CYBER HUD — Precision Sci-Fi Chamfered Tactical HUD, Blueprint Grid & Laser Rail */
body.style-cyber-prism {
    --radius-shell: 3px;
    --radius-card: 3px;
    --radius-item: 3px;
    --radius-btn: 3px;
}
body.style-cyber-prism .glass-shell {
    background:
        linear-gradient(var(--accent-1), var(--accent-1)) 0 0 / 12px 2px no-repeat,
        linear-gradient(var(--accent-1), var(--accent-1)) 0 0 / 2px 12px no-repeat,
        linear-gradient(var(--accent-2), var(--accent-2)) 100% 100% / 12px 2px no-repeat,
        linear-gradient(var(--accent-2), var(--accent-2)) 100% 100% / 2px 12px no-repeat,
        linear-gradient(rgba(var(--a1-rgb), 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(var(--a1-rgb), 0.055) 1px, transparent 1px),
        linear-gradient(180deg, var(--bg-glass-1), var(--bg-glass-2));
    background-size: 12px 2px, 2px 12px, 12px 2px, 2px 12px, 16px 16px, 16px 16px, 100% 100%;
    border: 1px solid rgba(var(--a1-rgb), 0.34);
    border-top: 2px solid var(--accent-1);
    box-shadow:
        0 22px 50px -12px rgba(0, 0, 0, 0.88),
        0 0 26px -10px rgba(var(--a1-rgb), 0.32),
        inset 0 1px 16px -6px rgba(var(--a1-rgb), 0.26);
}
body.style-cyber-prism .num,
body.style-cyber-prism .drop-time,
body.style-cyber-prism .card-title,
body.style-cyber-prism .tab,
body.style-cyber-prism .studio-sec-lbl,
body.style-cyber-prism .wcag-pill {
    font-family: var(--font-mono);
    letter-spacing: 0.04em;
}
body.style-cyber-prism .pill-btn {
    border-radius: 3px;
    border: 1px solid rgba(var(--a1-rgb), 0.24);
    background: rgba(var(--a1-rgb), 0.055);
}
body.style-cyber-prism .pill-btn:hover {
    border-color: var(--accent-1);
    background: rgba(var(--a1-rgb), 0.14);
    box-shadow: 0 0 12px -4px var(--accent-glow);
}
body.style-cyber-prism .pill-btn.accent {
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    border-radius: 3px;
    box-shadow: 0 0 16px -4px var(--accent-glow);
}
body.style-cyber-prism .micro-btn {
    border-radius: 3px;
    border: 1px solid rgba(var(--a1-rgb), 0.24);
}

/* 7. HIGH CONTRAST — Zero blur, crisp WCAG AAA outlines */
body.style-high-contrast {
    --radius-shell: 6px;
    --radius-card: 5px;
    --radius-item: 5px;
    --radius-btn: 5px;
}
body.style-high-contrast .glass-shell {
    background: var(--bg-glass-1);
    border: 2px solid var(--border-rim);
    box-shadow: none;
}

/* ========== SHARED TACTILE CONTROLS ========== */
.pill-btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 29px; padding: 0 11px;
    border-radius: var(--radius-btn);
    border: 1px solid var(--border-subtle);
    background: var(--bg-card);
    color: var(--text-1);
    font-family: var(--font); font-size: 11.5px; font-weight: 600;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: transform 0.15s var(--ease), background 0.14s, border-color 0.14s, color 0.14s, box-shadow 0.15s;
    white-space: nowrap;
}
.pill-btn:hover { background: var(--bg-card-hover); border-color: var(--border-rim); transform: translateY(-0.5px); }
.pill-btn:active { transform: scale(0.96); }
.pill-btn.accent {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: var(--accent-ink);
    border-color: transparent;
    box-shadow: 0 6px 18px -5px var(--accent-glow);
}
.pill-btn.accent:hover { filter: brightness(1.06); }
.pill-btn.subtle { background: transparent; border-color: transparent; color: var(--text-2); }
.pill-btn.subtle:hover { background: var(--bg-card); color: var(--text-1); border-color: var(--border-subtle); }
.micro-btn {
    width: 27px; height: 27px; border-radius: 8px;
    border: 1px solid var(--border-subtle);
    background: var(--bg-card);
    color: var(--text-2);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    transition: all 0.14s var(--ease);
}
.micro-btn:hover { background: var(--bg-card-hover); color: var(--text-1); border-color: var(--accent-ring); }
.micro-btn.active { background: var(--accent-tint); color: var(--accent-1); border-color: var(--accent-ring); }
.micro-btn.danger:hover { background: rgba(251,113,133,0.20); color: var(--danger); border-color: var(--danger); }
/* ========== PROJECT AURORA v3.0 RUST ENGINE VISUAL POLISH ========== */
body.style-mono-matrix .tab.active {
    background: var(--text-1) !important;
    color: #0B0B0E !important;
    font-weight: 800 !important;
}
body.style-mono-matrix.mode-light .tab.active {
    background: #111114 !important;
    color: #FAFAFA !important;
}
body.style-cyber-prism .dock-item.active::after {
    box-shadow: 0 0 12px var(--accent-1), 0 0 4px var(--accent-1) !important;
}
        :root {
    --radial-disc-bg: radial-gradient(circle at 50% 30%, rgba(20, 30, 52, 0.96), rgba(8, 12, 22, 0.985));
    --radial-orb-bg: rgba(255, 255, 255, 0.065);
    --radial-orb-border: rgba(255, 255, 255, 0.14);
    --radial-orb-hover: rgba(var(--a1-rgb), 0.20);
    --radial-orbit-bg: rgba(12, 18, 32, 0.96);
    --radial-caption-bg: rgba(10, 15, 28, 0.96);
    --radial-ring-stroke: rgba(148, 163, 184, 0.30);
    --radial-shadow: 0 22px 52px -10px rgba(0, 0, 0, 0.76), 0 6px 20px -4px rgba(0, 0, 0, 0.42);
    --acc-bg: rgba(255, 255, 255, 0.045);
    --acc-open-bg: rgba(var(--a1-rgb), 0.10);
}
.dock-stage {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    justify-content: flex-end; align-items: center;
    padding-bottom: 8px;
    pointer-events: none;
    position: relative;
}
.dock-stage.pinned-bar-stage {
    padding-bottom: 0 !important;
}
.dock-stage.tucked-stage {
    padding-bottom: 3px;
}

/* ========== 2026 AURORA ZERO-SHIFT DENDRITIC CIRCULAR CONSTELLATION ========== */
/* Fixed circular optical-glass orbs connected by organic curved light stems — 0px layout shift, tiny 21px outward micro-beads! */
#radialHub {
    position: fixed;
    bottom: 52px;
    left: 50%;
    padding: 0;
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    display: none;
    pointer-events: auto;
    z-index: 30;
    overflow: visible;
}
#radialHub.open { display: block; }

.const-svg-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
    z-index: 1;
}

.orb-stem {
    fill: none;
    stroke: rgba(255, 255, 255, 0.28);
    stroke-width: 1.35;
    stroke-linecap: round;
    transition: stroke 0.16s ease, stroke-width 0.16s ease, opacity 0.16s ease;
}
body.mode-light .orb-stem {
    stroke: rgba(15, 23, 42, 0.24);
}
.orb-stem.hot {
    stroke: var(--accent-1);
    stroke-width: 2.0;
}
.orb-stem-glow {
    fill: none;
    stroke: var(--accent-1);
    stroke-width: 4.5;
    stroke-linecap: round;
    opacity: 0;
    transition: opacity 0.18s ease;
}
.orb-stem-glow.hot {
    opacity: 0.32;
}
.orb-halo-arc {
    fill: none;
    stroke: rgba(255, 255, 255, 0.30);
    stroke-width: 1.25;
    stroke-linecap: round;
}
body.mode-light .orb-halo-arc {
    stroke: rgba(15, 23, 42, 0.24);
}

/* Invisible hover cushion around hovered leaf orb + its tiny micro-beads so moving onto micro-beads never drops hover */
.orb-bridge {
    position: absolute;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    pointer-events: none;
    z-index: 8;
}
.orb-bridge.active {
    pointer-events: auto;
    z-index: 16;
}

/* Fixed circular glass orb — NEVER shifts width or position! */
.orb-node {
    position: absolute;
    transform: translate(-50%, -50%);
    border-radius: 50% !important;
    background:
        radial-gradient(circle at 30% 22%, rgba(255, 255, 255, 0.26), rgba(255, 255, 255, 0.05) 46%, rgba(11, 15, 26, 0.88) 100%) !important;
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border: 1.25px solid rgba(255, 255, 255, 0.24) !important;
    box-shadow:
        0 14px 28px -6px rgba(0, 0, 0, 0.72),
        0 3px 10px rgba(0, 0, 0, 0.38),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.42),
        inset 0 -6px 12px rgba(0, 0, 0, 0.34);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    pointer-events: auto;
    z-index: 14;
    transition: border-color 0.15s ease, box-shadow 0.18s ease, background 0.15s ease;
}
body.mode-light .orb-node {
    background:
        radial-gradient(circle at 30% 20%, rgba(255, 255, 255, 0.98), rgba(241, 246, 253, 0.92) 60%, rgba(226, 234, 246, 0.95) 100%) !important;
    border-color: rgba(15, 23, 42, 0.16) !important;
    box-shadow:
        0 12px 24px -6px rgba(15, 23, 42, 0.20),
        0 2px 6px rgba(15, 23, 42, 0.10),
        inset 0 1.5px 1px rgba(255, 255, 255, 0.98);
}
#radialHub.animate-in .orb-node {
    animation: orbBloomIn 0.20s var(--spring) both;
    animation-delay: calc(var(--stagger, 0) * 24ms);
}
@keyframes orbBloomIn {
    from { opacity: 0; transform: translate(-50%, -50%) scale(0.72); }
    to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

.orb-node.active-win {
    border-color: rgba(var(--a1-rgb), 0.56) !important;
}
.orb-node.hovered {

/* ========== 2026 FLOATING CRYSTAL DOCK & EDGE-TO-EDGE FIXED BAR ========== */
/* Prevent empty 24x54 glass stub before first Rust state payload arrives on cold boot */
body:not(.state-ready) #dockBar {
    opacity: 0 !important;
    pointer-events: none !important;
}
#dockBar {
    --ds: 1;
    --item-sz: calc(40px * var(--ds));
    --img-sz: calc(25px * var(--ds));
    pointer-events: auto;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    gap: calc(6px * var(--ds));
    max-width: calc(100vw - 24px);
    width: auto;
    height: auto;
    min-height: calc(54px * var(--ds));
    padding: calc(6px * var(--ds)) calc(11px * var(--ds));
    border-radius: var(--radius-shell);
    transition: width 0.22s var(--ease), height 0.22s var(--ease), border-radius 0.22s var(--ease), padding 0.20s var(--ease), opacity 0.18s;
    z-index: 20;
}

/* PINNED EDGE-TO-EDGE FIXED BAR ("Sabit Bar") — 0px wallpaper bleed, exact WorkArea height! */
#dockBar.pinned-bar {
    width: 100vw;
    max-width: 100vw;
    height: calc(52px * var(--ds));
    min-height: calc(52px * var(--ds));
    padding: 0 calc(16px * var(--ds));
    gap: calc(5px * var(--ds));
    border-radius: 0 !important;
    border-left: none !important;
    border-right: none !important;
    border-bottom: none !important;
    left: 0 !important;
    top: 0 !important;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.14);
}
#dockBar.pinned-bar {
    --item-sz: calc(38px * var(--ds));
    --img-sz: calc(24px * var(--ds));
}
#dockBar.pinned-bar.density-compact {
    height: calc(44px * var(--ds));
    min-height: calc(44px * var(--ds));
    --item-sz: calc(33px * var(--ds));
    --img-sz: calc(20px * var(--ds));
    padding: 0 calc(14px * var(--ds));
}
#dockBar.pinned-bar.density-cozy {
    height: calc(60px * var(--ds));
    min-height: calc(60px * var(--ds));
    --item-sz: calc(44px * var(--ds));
    --img-sz: calc(28px * var(--ds));
    padding: 0 calc(18px * var(--ds));
}

/* 3-Zone Balanced Fixed Bar Layout (Left: Search & Folders | Center: Apps | Right: Tray, Derli, Pin) */
#dockBar.pinned-bar.layout-split {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: calc(10px * var(--ds));
}
.bar-zone-left {
    display: flex; align-items: center; justify-content: flex-start;
    gap: calc(6px * var(--ds)); min-width: 0;
}
.bar-zone-center {
    display: flex; align-items: center; justify-content: center;
    gap: calc(5px * var(--ds)); min-width: 0;
}
.bar-zone-right {
    display: flex; align-items: center; justify-content: flex-end;
    gap: calc(6px * var(--ds)); min-width: 0;
}

/* TUCKED INTELLIHIDE / AUTO-HIDE HOME INDICATOR — Ultra-slim 4px flush edge trigger! */
#dockBar.tucked {
    height: 4px; min-height: 4px; width: 148px; min-width: 0; padding: 0; border-radius: 99px;
    background: linear-gradient(90deg, transparent 0%, var(--accent-1) 26%, var(--accent-2) 74%, transparent 100%);
    border: none !important;
    box-shadow: 0 0 12px var(--accent-glow), 0 1px 6px rgba(0, 0, 0, 0.35);
    cursor: pointer; opacity: 0.86;
}
#dockBar.tucked::after { display: none !important; }

.dock-pin-btn {
    position: relative;
}
.dock-pin-btn.smart-dodge {
    background: rgba(var(--a2-rgb), 0.15);
    color: var(--accent-2);
    border-color: rgba(var(--a2-rgb), 0.36);
}
.dock-pin-btn .hover-label {
    top: -34px;
}
.dock-pin-btn:hover .hover-label {
    opacity: 1;
}

/* Attention Pulse & Live Progress Arc on Dock Icons */
@keyframes attnPulse {
    0%, 100% { box-shadow: 0 0 0 1.5px rgba(251,191,36,0.72), 0 0 14px -2px rgba(251,191,36,0.48); border-color: var(--warning); }
    50% { box-shadow: 0 0 0 2.5px rgba(251,191,36,0.92), 0 0 20px 0px rgba(251,191,36,0.68); border-color: var(--warning); }
}
.dock-item.attention {
    animation: attnPulse 1.65s ease-in-out infinite;
}
.attn-pip {
    position: absolute; top: 1px; left: 1px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--warning);
    box-shadow: 0 0 7px var(--warning);
    border: 1.5px solid var(--bg-glass-2);
    pointer-events: none;
}
.dock-item.drag-target {
    border-color: var(--accent-1) !important;
    background: var(--accent-tint) !important;
    box-shadow: 0 0 0 2px var(--accent-ring), 0 8px 20px -4px var(--accent-glow) !important;
    transform: translateY(-5px) scale(1.10) !important;
}
.dock-prog-svg {
    position: absolute; inset: -1px;
    width: calc(100% + 2px); height: calc(100% + 2px);
    pointer-events: none;
}
.prog-pill {
    position: absolute; bottom: -3px; right: -4px;
    padding: 0 4px; height: 13px; border-radius: 99px;
    background: var(--success); color: #04101F;
    font-size: 8.5px; font-weight: 800;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.32);
    pointer-events: none;
}

/* Dock Folder Stacks ("Klasör Yığınları") */
.folder-chip {
    position: relative;
    width: calc(var(--item-sz) * 0.90); height: calc(var(--item-sz) * 0.90); flex-shrink: 0;
    border-radius: var(--radius-item);
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent;
    border: 1px solid transparent;
    color: var(--text-2);
    cursor: pointer;
    transform-origin: bottom center;
    transition: background 0.14s, border-color 0.14s, color 0.14s, box-shadow 0.14s;
}
.folder-chip:hover, .folder-chip.open {
    background: var(--accent-soft);
    border-color: var(--accent-ring);
    color: var(--accent-1);
}
.folder-chip:hover:not(.open) .hover-label { opacity: 1; }
#folderStackCard {
    position: fixed;
    bottom: 62px;
    left: 50%;
    width: 288px;
    max-height: 318px;
    border-radius: var(--radius-shell);
    padding: 11px;
    display: none;
    flex-direction: column;
    gap: 7px;
    pointer-events: auto;
    z-index: 32;
    transform-origin: bottom center;
    animation: radialBloom 0.18s var(--spring);
}
#folderStackCard.open { display: flex; }
.fstack-list {
    display: flex; flex-direction: column; gap: 4px;
    max-height: 242px; overflow-y: auto;
}
.fstack-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 10px;
    background: var(--bg-card); border: 1px solid transparent;
    cursor: pointer; transition: background 0.13s, border-color 0.13s;
}
.fstack-row:hover {
    background: var(--bg-card-hover); border-color: var(--border-rim);
}
.fstack-row img { width: 20px; height: 20px; border-radius: 5px; flex-shrink: 0; }
.radial-bottom-row {
    position: absolute;
    left: 50%; top: 220px;
    transform: translateX(-50%);
    display: inline-flex; align-items: center; gap: 5px;
    z-index: 4;
}
.radial-bottom-row .radial-bottom-pill {
    position: static; transform: none;
}
.radial-bottom-row .radial-bottom-pill:hover {
    transform: translateY(-1px);
}
.radial-bottom-row .radial-bottom-pill.danger:hover {
    border-color: var(--danger); color: var(--danger);
}

/* 2026 RESTRAINED SEARCH TRIGGER (Understated neutral at rest, accent bloom on hover) */
.search-pill {
    position: relative;
    height: calc(var(--item-sz) * 0.86); padding: 0 calc(11px * var(--ds));
    border-radius: var(--radius-btn);
    display: inline-flex; align-items: center; gap: calc(6px * var(--ds));
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    color: var(--text-2); font-size: calc(11.5px * var(--ds)); font-weight: 600;
    cursor: pointer; transform-origin: bottom center; flex-shrink: 0;
    transition: all 0.15s var(--ease);
}
.search-pill:hover {
    background: var(--accent-soft);
    color: var(--accent-1); border-color: var(--accent-ring);
}
.search-pill:hover .hover-label { opacity: 1; }

/* 2026 UNBOXED DOCK ICONOGRAPHY — Zero heavy idle borders, pure tactile hover/active focus! */
.dock-item {
    position: relative;
    width: var(--item-sz); height: var(--item-sz); flex-shrink: 0;
    border-radius: var(--radius-item);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transform-origin: bottom center;
    will-change: transform;
    background: transparent;
    border: 1px solid transparent;
    transition: background 0.15s var(--ease), border-color 0.15s var(--ease), box-shadow 0.16s var(--ease);
}
.dock-item::before {
    content: '';
    position: absolute;
    inset: -3px -3px -10px -3px;
    pointer-events: auto;
}
.dock-item:hover {
    background: var(--bg-card-hover);
    border-color: var(--border-subtle);
}
.dock-item.active {
    background: var(--accent-soft);
    border-color: rgba(var(--a1-rgb), 0.28);
}
.dock-item.radial-anchored {
    border-color: var(--accent-1);
    background: var(--accent-tint);
}
.dock-item img {
    width: var(--img-sz); height: var(--img-sz);
    border-radius: calc(6px * var(--ds));
    pointer-events: none;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.28));
}
.dock-item .fallback-badge {
    width: var(--img-sz); height: var(--img-sz); border-radius: calc(7px * var(--ds));
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: var(--accent-ink); font-weight: 800; font-size: calc(12px * var(--ds));
    display: flex; align-items: center; justify-content: center;
}
.dock-dot {
    position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%);
    height: 3px; border-radius: 99px;
    background: var(--text-2);
    pointer-events: none;
    transition: width 0.18s var(--ease), background 0.18s;
}
#dockBar.pinned-bar .dock-dot { bottom: -1px; }
.dock-item.active .dock-dot {
    width: 14px;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    box-shadow: 0 0 8px var(--accent-glow);
}
.dock-item.running:not(.active) .dock-dot { width: 4.5px; opacity: 0.72; }
.count-pill {
    position: absolute; top: -2px; right: -2px;
    min-width: 15px; height: 15px; padding: 0 4px;
    border-radius: 99px;
    background: var(--accent-1);
    color: var(--accent-ink);
    font-size: 9px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.32);
    pointer-events: none;
}
.hover-label {
    position: absolute; top: -34px; left: 50%; transform: translateX(-50%);
    padding: 4px 10px; border-radius: 8px;
    background: var(--bg-glass-2);
    border: 1px solid var(--border-rim);
    color: var(--text-1); font-size: 11px; font-weight: 600;
    white-space: nowrap; opacity: 0; pointer-events: none;
    transition: opacity 0.12s ease, transform 0.14s var(--ease);
    box-shadow: 0 10px 24px -6px rgba(0,0,0,0.48);
    z-index: 95;
}
.dock-item:hover:not(.radial-anchored) .hover-label { opacity: 1; }
.dock-v-btn { position: relative; height: calc(var(--item-sz) * 0.78); padding: 0 9px; font-size: 11px; }
.dock-v-btn:hover .hover-label { opacity: 1; }
.dock-v-btn.tidy-on {
    background: linear-gradient(135deg, rgba(var(--a1-rgb), 0.24), rgba(var(--a2-rgb), 0.18));
    border-color: rgba(var(--a1-rgb), 0.58);
    color: var(--text-1);
    box-shadow: 0 4px 14px -4px rgba(var(--a1-rgb), 0.42);
}
.dock-v-badge {
    display: none;
    position: absolute; top: -3px; right: -3px;
    min-width: 15px; height: 15px; padding: 0 3.5px;
    border-radius: 99px;
    background: var(--bg-glass-2);
    border: 1px solid var(--border-rim);
    color: var(--text-1);
    font-size: 8.5px; font-weight: 800;
    align-items: center; justify-content: center;
    pointer-events: none;
    box-shadow: 0 2px 6px rgba(0,0,0,0.28);
}
.dock-sep {
    width: 1px; height: 22px;
    background: var(--border-subtle);
    margin: 0 3px; flex-shrink: 0;
}

/* Dock Density Variants (Floating Pill Mode) */
#dockBar:not(.pinned-bar).density-compact {
    --item-sz: calc(34px * var(--ds));
    --img-sz: calc(21px * var(--ds));
    min-height: calc(46px * var(--ds));
    padding: calc(5px * var(--ds)) calc(9px * var(--ds));
    gap: calc(5px * var(--ds));
}
#dockBar.density-compact .acc-bucket { height: calc(34px * var(--ds)); }
#dockBar.density-compact .acc-head { height: calc(30px * var(--ds)); padding: 0 calc(7px * var(--ds)); font-size: calc(11px * var(--ds)); }
#dockBar.density-compact .dock-sep { height: calc(18px * var(--ds)); }

#dockBar:not(.pinned-bar).density-cozy {
    --item-sz: calc(46px * var(--ds));
    --img-sz: calc(29px * var(--ds));
    min-height: calc(62px * var(--ds));
    padding: calc(8px * var(--ds)) calc(14px * var(--ds));
    gap: calc(8px * var(--ds));
}
#dockBar.density-cozy .acc-bucket { height: calc(46px * var(--ds)); }
#dockBar.density-cozy .acc-head { height: calc(40px * var(--ds)); font-size: calc(12px * var(--ds)); }

/* Inline Accordion Category Stack for Smart Tidy ("Derli") — Crisp Stadium Geometry, NEVER 50% oval! */
.acc-bucket {
    display: inline-flex; align-items: center;
    height: calc(var(--item-sz) * 0.88); border-radius: 14px !important;
    background: rgba(255, 255, 255, 0.055);
    border: 1px solid rgba(255, 255, 255, 0.11);
    padding: 0 3px;
    flex-shrink: 0;
    transition: background 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
}
body.mode-light .acc-bucket {
    background: rgba(15, 23, 42, 0.045);
    border-color: rgba(15, 23, 42, 0.11);
}
.acc-bucket.has-active {
    border-color: rgba(var(--a1-rgb), 0.45);
    background: rgba(var(--a1-rgb), 0.10);
}
.acc-bucket.open {

function applyDockGeometryAndOffset() {
    const dock = document.getElementById('dockBar');
    if (!dock) return;
    const isVert = isVerticalEdge();
    const tuckedNow = isDockTuckedNow();
    const pinnedBar = isPinnedBarMode();

    const rawScale = liveScaleOverride !== null ? liveScaleOverride : (state?.dockScalePercent ?? 100);
    let ds = Math.max(0.75, Math.min(1.35, rawScale / 100.0));
    dock.style.setProperty('--ds', ds.toFixed(3));

    if (!tuckedNow && !pinnedBar && isVert) {
        const maxH = Math.max(240, window.innerHeight - 24);
        const actualH = dock.scrollHeight;
        if (actualH > maxH && actualH > 0) {
            const fitDs = Math.max(0.68, ds * ((maxH - 6) / actualH));
            dock.style.setProperty('--ds', fitDs.toFixed(3));
        }
    }

    if (pinnedBar) {
        dock.style.left = '';
        dock.style.top = '';
    } else {
        const offsetPct = Math.max(-100, Math.min(100, state?.dockOffsetPercent ?? 0));
        if (offsetPct === 0) {
            dock.style.left = '';
            dock.style.top = '';
        } else if (isVert) {
            const rect = dock.getBoundingClientRect();
            const maxTravel = Math.max(0, (window.innerHeight - rect.height) / 2 - 14);
            const dy = Math.round((offsetPct / 100.0) * maxTravel);
            dock.style.left = '';
            dock.style.top = `${dy}px`;
        } else {
            const rect = dock.getBoundingClientRect();
            const maxTravel = Math.max(0, (window.innerWidth - rect.width) / 2 - 14);
            const dx = Math.round((offsetPct / 100.0) * maxTravel);
            dock.style.top = '';
            dock.style.left = `${dx}px`;
        }
    }

    dock.querySelectorAll('.mag-target').forEach(el => {
        el._baseW = null;
        el._baseH = null;
    });
}

function parseHexRgb(hex, fallback = [56, 189, 248]) {
    const h = String(hex || '').replace('#', '').trim();
    const clean = h.length === 8 ? h.slice(2) : h;
    if (clean.length !== 6) return fallback;
    const n = parseInt(clean, 16);
    if (Number.isNaN(n)) return fallback;
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function hexToRgba(hex, alpha) {
    const [r, g, b] = parseHexRgb(hex, [15, 23, 42]);
    return `rgba(${r},${g},${b},${alpha})`;
}

function relativeLum(hex) {
    const [r, g, b] = parseHexRgb(hex, [56, 189, 248]).map(v => {
        const c = v / 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}

function isDockTuckedNow() {
    if (radialGroupKey || openFolderPath || autoHideRevealed || isDraggingFileOverDock)
        return false;
    if (manualTucked)
        return true;
    const mode = state?.dockMode || (state?.dockAutoHide ? 'AutoHide' : 'AlwaysVisible');
    if (mode === 'AutoHide') return true;
    if (mode === 'SmartDodge') {
        const dodged = (liveDodgedOverride !== null) ? liveDodgedOverride : Boolean(state?.dockDodged);
        return dodged;
    }
    return false;
}

let pointerOverDock = false;

function reportHitRects() {
    if (!state) return;
    const rects = [];
    const dock = document.getElementById('dockBar');
    const hub = document.getElementById('radialHub');
    const fcard = document.getElementById('folderStackCard');
    const edge = getDockEdge();
    const isVert = isVerticalEdge();
    const pinnedBar = isPinnedBarMode();
    let dockRect = null;

    if (dock && getComputedStyle(dock).display !== 'none') {
        const r = dock.getBoundingClientRect();
        if (r.width > 0 && r.height > 0) {
            dockRect = r;
            const tuckedNow = isDockTuckedNow();
            if (isVert) {
                if (tuckedNow) {
                    const padY = 48;
                    const rx = edge === 'Left' ? 0 : Math.max(0, r.left - 6);
                    const rw = edge === 'Left' ? (r.right + 6) : (window.innerWidth - rx);
                    rects.push({ x: rx, y: Math.max(0, r.top - padY), w: Math.min(14, Math.max(10, rw)), h: r.height + padY * 2 });
                } else if (pinnedBar) {
                    const hoverPad = pointerOverDock ? 56 : 4;
                    const rx = edge === 'Left' ? 0 : Math.max(0, r.left - hoverPad);
                    const rw = edge === 'Left' ? (r.right + hoverPad) : (window.innerWidth - rx);
                    rects.push({ x: rx, y: 0, w: rw, h: window.innerHeight });
                } else {
                    const padLeft = edge === 'Right' ? (pointerOverDock ? 56 : 16) : 12;
                    const padRight = edge === 'Left' ? (pointerOverDock ? 56 : 16) : 12;
                    const padY = 16;
                    rects.push({
                        x: Math.max(0, r.left - padLeft),
                        y: Math.max(0, r.top - padY),
                        w: r.width + padLeft + padRight,
                        h: r.height + padY * 2
                    });
                }
            } else if (tuckedNow) {
                // Precision bottom-edge trigger (total ~11px) so WhatsApp/Antigravity typing boxes NEVER accidentally wake Dock!
                const extraTop = 4;
                const padX = 72;
                const padB = 6;
                rects.push({
                    x: Math.max(0, r.left - padX),
                    y: Math.max(0, r.top - extraTop),
                    w: Math.min(window.innerWidth, r.width + padX * 2),
                    h: Math.min(14, r.height + extraTop + padB)
                });
            } else if (pinnedBar) {
                // Dynamic unclipped tooltip halo ONLY while cursor is on the Dock — 0px overlap while typing above!
                const extraTop = pointerOverDock ? 56 : 2;
                rects.push({ x: 0, y: Math.max(0, r.top - extraTop), w: window.innerWidth, h: r.height + extraTop });
            } else {
                const extraTop = pointerOverDock ? 56 : 18;
                const padX = 14;
                const padB = 12;
                rects.push({ x: r.left - padX, y: Math.max(0, r.top - extraTop), w: r.width + padX * 2, h: r.height + extraTop + padB });
            }
        }
    }

    for (const pop of [hub, fcard]) {
        if (pop && getComputedStyle(pop).display !== 'none') {
            const hr = pop.getBoundingClientRect();
            if (hr.width > 0 && hr.height > 0) {
                if (isVert && dockRect) {
                    const leftX = edge === 'Left'
                        ? Math.min(hr.left - 14, dockRect.right - 4)
                        : (hr.left - 14);
                    const rightX = edge === 'Right'
                        ? Math.max(hr.right + 14, dockRect.left + 4)
                        : (hr.right + 14);
                    rects.push({
                        x: Math.max(0, leftX),
                        y: Math.max(0, hr.top - 16),
                        w: Math.max(hr.width + 28, rightX - leftX),
                        h: hr.height + 32
                    });
                } else {
                    const bridgeBottom = dockRect ? Math.max(hr.bottom + 14, dockRect.top + 8) : (hr.bottom + 16);
                    rects.push({
                        x: Math.max(0, hr.left - 14),
                        y: Math.max(0, hr.top - 18),
                        w: hr.width + 28,
                        h: Math.max(hr.height + 34, bridgeBottom - Math.max(0, hr.top - 18))
                    });
                }
            }
        }
    }

    window.chrome.webview.postMessage({
        type: 'hitRects',
        vw: window.innerWidth,
        vh: window.innerHeight,
        rects
    });
}

function classifyCategory(proc) {
    const p = (proc || '').toLowerCase();
    if (/edge|chrome|firefox|brave|opera|arc/.test(p)) return { id: 'cat-web', name: 'Web' };
    if (/code|devenv|antigravity|powershell|pwsh|windowsterminal|cmd|git|rider|idea|cursor/.test(p)) return { id: 'cat-dev', name: 'Geliştirme' };
    if (/spotify|music|vlc|discord|whatsapp|telegram|teams|slack/.test(p)) return { id: 'cat-media', name: 'İletişim' };
    return { id: 'cat-sys', name: 'Uygulama' };
}

function cleanWindowTitle(raw, appName) {
    let t = String(raw || '').trim();
    if (!t) return appName || 'Pencere';
    const suffixes = [
        ' - Opera', ' - Brave', ' - Google Chrome', ' - Microsoft Edge',
        ' — Mozilla Firefox', ' - Mozilla Firefox', ' - Visual Studio Code',
        ' - Microsoft Teams', ' - Dosya Gezgini', ' - File Explorer',
        ' - Notepad', ' - Not Defteri', ' - Windows PowerShell'
    ];
    if (appName) suffixes.unshift(' - ' + appName, ' — ' + appName);
    for (const sfx of suffixes) {
        if (t.length > sfx.length + 2 && t.toLowerCase().endsWith(sfx.toLowerCase())) {
            t = t.slice(0, t.length - sfx.length).trim();
            break;
        }
    }
    return t || appName || 'Pencere';
}

function shortOrbLabel(cleaned) {
    let s = String(cleaned || '').replace(/^\(\d+\)\s*/, '').trim();
    if (!s) return 'Pencere';
    if (s.includes('\\') && s.length > 14) {
        const segs = s.split('\\').filter(Boolean);
        if (segs.length) s = segs[segs.length - 1];
    }
    if (/^[a-z0-9.-]+\.[a-z]{2,}(\/|$)/i.test(s)) {
        s = s.split('/')[0].replace(/^www\./i, '').split('.')[0];
    }
    const words = s.split(/\s+/);
    if (words.length === 1 && s.length > 9) {
        return s.slice(0, 8) + '…';
    }
    return s.length > 16 ? s.slice(0, 15) + '…' : s;
}

function getSmartTidyBuckets(runningUnpinned) {
    const buckets = {};
    for (const g of runningUnpinned) {
        const cat = classifyCategory(g.windows[0]?.processName || g.displayName);
        if (!buckets[cat.id]) buckets[cat.id] = { ...cat, groups: [], windows: [], icons: [], hasActive: false };
        buckets[cat.id].groups.push(g);
        buckets[cat.id].windows.push(...g.windows);
        if (g.hasActive) buckets[cat.id].hasActive = true;
        if (g.icon && buckets[cat.id].icons.length < 4) buckets[cat.id].icons.push(g.icon);
    }
    return Object.values(buckets);
}

function renderDock() {
    if (!state) return;
    document.body.classList.add('state-ready');
    applyThemeVars(state.theme);

    const edge = getDockEdge();
    const isVert = isVerticalEdge();
    const edgeChanged = (lastRenderedEdge !== edge);
    lastRenderedEdge = edge;
    document.body.classList.toggle('edge-left', edge === 'Left');
    document.body.classList.toggle('edge-right', edge === 'Right');

    const stage = document.querySelector('.dock-stage');
    const dock = document.getElementById('dockBar');
    if (isDockTuckedNow()) {
        closeRadialHub(false);
        if (stage) {
            stage.classList.remove('pinned-bar-stage');
            stage.classList.add('tucked-stage');
        }
        dock.className = 'glass-shell tucked';
        dock.innerHTML = '';
        applyDockGeometryAndOffset();
        dock.onmouseenter = () => { clearTimeout(autoHideTimer); manualTucked = false; autoHideRevealed = true; renderDock(); };
        dock.onmouseleave = null;
        dock.onclick = () => { clearTimeout(autoHideTimer); manualTucked = false; autoHideRevealed = true; renderDock(); };
        reportHitRects();
        requestAnimationFrame(reportHitRects);
        if (edgeChanged) { setTimeout(reportHitRects, 140); setTimeout(reportHitRects, 320); }
        return;
    }
    dock.onmouseenter = () => { clearTimeout(autoHideTimer); clearTimeout(radialCloseTimer); autoHideRevealed = true; };
    dock.onmouseleave = () => {
        mouseX = null;
        mouseY = null;
        applyParabolicWave();
        scheduleDockAutoHide(440);
    };
    dock.onclick = null;

    const pinnedBar = isPinnedBarMode();
    const splitLayout = pinnedBar && state.dockBarLayout === 'Split3Zone';
    if (stage) {
        stage.classList.toggle('pinned-bar-stage', pinnedBar);

    const barCls = pinnedBar ? (' pinned-bar' + (splitLayout ? ' layout-split' : '')) : '';
    dock.className = 'glass-shell' + densCls + barCls;

    const groups = state.groups || [];
    const pinned = groups.filter(g => g.isPinned);
    const runningUnpinned = groups.filter(g => !g.isPinned && g.windows.length > 0);

    const searchHtml = `
