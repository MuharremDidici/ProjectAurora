<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Aurora Desktop Widgets v5.0</title>
<style>
:root {
    --bg-glass-1: rgba(14, 18, 28, 0.78);
    --bg-glass-2: rgba(20, 26, 40, 0.88);
    --bg-card: rgba(255, 255, 255, 0.055);
    --bg-card-hover: rgba(255, 255, 255, 0.11);
    --border-subtle: rgba(255, 255, 255, 0.10);
    --border-rim: rgba(255, 255, 255, 0.19);
    --text-1: #F8FAFC;
    --text-2: #94A3B8;
    --accent-1: #38BDF8;
    --accent-2: #818CF8;
    --accent-ink: #040914;
    --a1-rgb: 56, 189, 248;
    --a2-rgb: 129, 140, 248;
    --radius-w: 22px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --shadow-w: 0 18px 46px -14px rgba(0, 0, 0, 0.56), inset 0 1px 0 rgba(255, 255, 255, 0.16);
    --braun-bg: #1A1B1E;
    --braun-bg-2: #23252A;
    --braun-border: rgba(255, 255, 255, 0.11);
    --braun-accent: #F97316;
    --matrix-bg: rgba(9, 10, 13, 0.92);
    --matrix-dot: rgba(255, 255, 255, 0.075);
    --editorial-bg: rgba(15, 17, 23, 0.95);
    --editorial-line: rgba(255, 255, 255, 0.10);
}
body.mode-light {
    --bg-glass-1: rgba(252, 250, 247, 0.84);
    --bg-glass-2: rgba(255, 254, 252, 0.94);
    --bg-card: rgba(20, 24, 34, 0.045);
    --bg-card-hover: rgba(20, 24, 34, 0.09);
    --border-subtle: rgba(20, 24, 34, 0.10);
    --border-rim: rgba(20, 24, 34, 0.17);
    --text-1: #14171F;
    --text-2: #525B6B;
    --shadow-w: 0 16px 38px -14px rgba(15, 23, 42, 0.16), 0 2px 6px rgba(15, 23, 42, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.95);
    --braun-bg: #F2EFEA;
    --braun-bg-2: #E7E3DC;
    --braun-border: rgba(24, 24, 27, 0.12);
    --braun-accent: #EA580C;
    --matrix-bg: rgba(245, 246, 248, 0.94);
    --matrix-dot: rgba(15, 23, 42, 0.085);
    --editorial-bg: rgba(252, 251, 249, 0.96);
    --editorial-line: rgba(20, 24, 34, 0.10);
}
body.radius-sharp { --radius-w: 10px; }
body.radius-soft { --radius-w: 28px; }
body.eco-mode * { animation: none !important; transition-duration: 0.05s !important; }
body.eco-mode .widget-card { backdrop-filter: none !important; }
body.widgets-paused #canvas { visibility: hidden; pointer-events: none; }
body.widgets-paused * { animation-play-state: paused !important; }

* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
html, body {
    width: 100%; height: 100%; overflow: hidden; background: transparent;
    font-family: 'Segoe UI Variable Display', 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
    color: var(--text-1); -webkit-font-smoothing: antialiased;
}
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: 'Cascadia Mono', 'Consolas', monospace; font-variant-numeric: tabular-nums; }

#canvas { position: fixed; inset: 0; pointer-events: none; }

/* Edit Mode Top Control Bar */
#editBanner {
    display: none;
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    padding: 8px 10px 8px 16px; border-radius: 999px;
    background: var(--bg-glass-2);
    border: 1px solid var(--border-rim);
    backdrop-filter: blur(26px) saturate(165%);
    box-shadow: 0 20px 50px -12px rgba(0,0,0,0.52);
    align-items: center; gap: 12px; z-index: 900; pointer-events: auto;
    font-size: 12px; font-weight: 600; color: var(--text-1);
}
body.edit-mode #editBanner { display: flex; }
.eb-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent-1);
    box-shadow: 0 0 10px rgba(var(--a1-rgb), 0.7);
}
.eb-btn {
    height: 28px; padding: 0 12px; border-radius: 999px;
    border: 1px solid var(--border-subtle); background: var(--bg-card);
    color: var(--text-1); font-size: 11.5px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background 0.14s, border-color 0.14s, transform 0.12s var(--ease);
}
.eb-btn:hover { background: var(--bg-card-hover); border-color: var(--border-rim); }
.eb-btn:active { transform: scale(0.96); }
.eb-btn.primary { background: var(--accent-1); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
.eb-btn.primary:hover { filter: brightness(1.06); }

/* ═══════════ BASE WIDGET CONTAINER ═══════════ */
.widget-card {
    position: absolute; pointer-events: auto;
    border-radius: var(--radius-w);
    padding: 16px 18px;
    overflow: hidden;
    transition: box-shadow 0.2s var(--ease), border-color 0.18s ease, transform 0.18s var(--ease);
}
.widget-card.w-sz-S { width: 236px; min-height: 116px; padding: 13px 15px; }
.widget-card.w-sz-M { width: 320px; min-height: 148px; padding: 16px 18px; }
.widget-card.w-sz-L { width: 392px; min-height: 184px; padding: 18px 20px; }

/* ═══════════ 5 INDUSTRIAL DESIGN ARCHETYPES (SKINS) ═══════════ */

/* 1. OPTICAL GLASS (Apple Tahoe / visionOS) */
.widget-card.skin-glass {
    background: var(--bg-glass-1);
    border: 1px solid var(--border-rim);
    backdrop-filter: blur(28px) saturate(165%);
    box-shadow: var(--shadow-w);
}
.widget-card.skin-glass::before {
    content: ''; position: absolute; inset: 0 0 auto 0; height: 1px; pointer-events: none;
    background: linear-gradient(90deg, transparent 6%, rgba(255,255,255,0.34) 50%, transparent 94%);
    opacity: 0.72;
}
body.mode-light .widget-card.skin-glass::before {
    background: linear-gradient(90deg, transparent 6%, rgba(255,255,255,1) 50%, transparent 94%);
}

/* 2. FRAMELESS WALLPAPER TYPOGRAPHY (Zero box, floats directly over wallpaper!) */
.widget-card.skin-frameless {
    background: transparent !important;
    border: 1px solid transparent !important;
    backdrop-filter: none !important;
    box-shadow: none !important;
    text-shadow: 0 2px 18px rgba(0, 0, 0, 0.52), 0 1px 4px rgba(0, 0, 0, 0.42);
    color: #FFFFFF;
}
.widget-card.skin-frameless .w-sub,
.widget-card.skin-frameless .w-title {
    color: rgba(255, 255, 255, 0.80);
}
.widget-card.skin-frameless .w-btn,
.widget-card.skin-frameless .w-ibtn {
    background: rgba(15, 18, 28, 0.42);
    border-color: rgba(255, 255, 255, 0.22);
    color: #FFFFFF;
    backdrop-filter: blur(16px);
}
.widget-card.skin-frameless .w-btn:hover,
.widget-card.skin-frameless .w-ibtn:hover {
    background: rgba(15, 18, 28, 0.64);
}
.widget-card.skin-frameless .ai-row,
.widget-card.skin-frameless .mkt-chip,
.widget-card.skin-frameless .td-row,
.widget-card.skin-frameless .ln-btn {
    background: rgba(12, 16, 26, 0.38);
    border-color: rgba(255, 255, 255, 0.16);
    backdrop-filter: blur(14px);
}
body.edit-mode .widget-card.skin-frameless {
    border: 1px dashed rgba(var(--a1-rgb), 0.72) !important;
    background: rgba(10, 14, 24, 0.28) !important;
}

/* 3. BRAUN / DIETER RAMS TACTILE INSTRUMENT */
.widget-card.skin-braun {
    background: var(--braun-bg);
    border: 1px solid var(--braun-border);
    border-radius: 16px;
    box-shadow:
        0 18px 40px -16px rgba(0, 0, 0, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.09),
        inset 0 -1px 0 rgba(0, 0, 0, 0.25);
}
body.mode-light .widget-card.skin-braun {
    box-shadow:
        0 14px 32px -14px rgba(15, 23, 42, 0.18),
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        inset 0 -1px 0 rgba(0, 0, 0, 0.06);
}
.widget-card.skin-braun::after {
    content: ''; position: absolute; top: 11px; right: 12px;
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--braun-accent);
    box-shadow: 0 0 8px rgba(249, 115, 22, 0.55);
    pointer-events: none;
}
.widget-card.skin-braun .w-title {
    font-size: 9.5px; letter-spacing: 0.14em; font-weight: 700;
}

/* 4. DOT-MATRIX / NOTHING HARDWARE */
.widget-card.skin-matrix {
    background-color: var(--matrix-bg);
    background-image: radial-gradient(var(--matrix-dot) 1.15px, transparent 1.15px);
    background-size: 10px 10px;
    border: 1px solid var(--border-rim);
    border-radius: 18px;
    backdrop-filter: blur(22px);
    box-shadow: 0 20px 44px -16px rgba(0, 0, 0, 0.58);
}
.widget-card.skin-matrix::before,
.widget-card.skin-matrix::after {
    content: ''; position: absolute; width: 7px; height: 7px; pointer-events: none;
    border-color: rgba(var(--a1-rgb), 0.55); border-style: solid;
}
.widget-card.skin-matrix::before { top: 8px; left: 8px; border-width: 1.5px 0 0 1.5px; border-radius: 2px 0 0 0; }
.widget-card.skin-matrix::after { bottom: 8px; right: 8px; border-width: 0 1.5px 1.5px 0; border-radius: 0 0 2px 0; }
.widget-card.skin-matrix .w-title {
    font-family: 'Cascadia Mono', 'Consolas', monospace;
    font-size: 9.5px; letter-spacing: 0.14em;
}

/* 5. EDITORIAL SWISS MATTE / PORCELAIN */
.widget-card.skin-editorial {
    background: var(--editorial-bg);
    border: 1px solid var(--editorial-line);
    border-radius: 14px;
    box-shadow: 0 14px 34px -14px rgba(0, 0, 0, 0.34);
}
body.mode-light .widget-card.skin-editorial {
    box-shadow: 0 12px 30px -12px rgba(15, 23, 42, 0.13), 0 1px 3px rgba(15, 23, 42, 0.05);
}
.widget-card.skin-editorial .w-head {
    padding-bottom: 8px; margin-bottom: 10px;
    border-bottom: 1px solid var(--editorial-line);
}

/* Edit Mode Overlay */
body.edit-mode .widget-card {
    cursor: grab;
    box-shadow: 0 0 0 1.5px rgba(var(--a1-rgb), 0.65), var(--shadow-w);
}
body.edit-mode .widget-card.dragging {
    cursor: grabbing;
    transform: scale(1.015);
    z-index: 800;
    box-shadow: 0 24px 60px -10px rgba(0, 0, 0, 0.68), 0 0 0 2px var(--accent-1);
}
.w-edit-bar {
    display: none;
    position: absolute; top: 8px; left: 8px; right: 8px;
    justify-content: space-between; align-items: center; gap: 4px;
    padding: 4px 6px; border-radius: 10px;
    background: var(--bg-glass-2);
    border: 1px solid var(--border-rim);
    backdrop-filter: blur(18px);
    z-index: 30;
}
body.edit-mode .widget-card:hover .w-edit-bar,
body.edit-mode .widget-card.dragging .w-edit-bar { display: flex; }

/* Shared Typography & Micro Controls */
.w-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-bottom: 10px;
}
.w-title {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--text-2);
}
.w-title svg { width: 13px; height: 13px; flex-shrink: 0; color: var(--accent-1); }
.w-sub { font-size: 11px; color: var(--text-2); font-weight: 500; }
.w-badge {
    font-size: 9.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px;
    background: rgba(var(--a1-rgb), 0.14); color: var(--accent-1);
    border: 1px solid rgba(var(--a1-rgb), 0.25); letter-spacing: 0.02em;
}
.w-btn {
    height: 26px; padding: 0 10px; border-radius: 8px;
    border: 1px solid var(--border-subtle); background: var(--bg-card);
    color: var(--text-1); font-size: 11px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    transition: background 0.14s, border-color 0.14s, transform 0.12s var(--ease);
}
.w-btn:hover { background: var(--bg-card-hover); border-color: var(--border-rim); }
.w-btn:active { transform: scale(0.95); }
.w-btn.primary { background: var(--accent-1); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
.w-ibtn {
    width: 26px; height: 26px; border-radius: 8px;
    border: 1px solid var(--border-subtle); background: var(--bg-card);
    color: var(--text-1); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.14s, border-color 0.14s, transform 0.12s var(--ease);
}
.w-ibtn:hover { background: var(--bg-card-hover); border-color: var(--border-rim); }
.w-ibtn:active { transform: scale(0.92); }
.w-ibtn.active { background: rgba(var(--a1-rgb), 0.2); border-color: var(--accent-1); color: var(--accent-1); }
.w-ibtn.danger:hover { background: rgba(244, 63, 94, 0.22); border-color: rgba(244, 63, 94, 0.55); color: #FB7185; }
.w-ibtn svg, .w-btn svg { width: 13px; height: 13px; }

/* ═══════════ 1. CLOCK WIDGET (7 PRO DESIGNS) ═══════════ */
.clk-swiss-row { display: flex; align-items: baseline; gap: 4px; line-height: 0.94; }
.clk-swiss-hh { font-size: 56px; font-weight: 800; letter-spacing: -0.045em; }
.clk-swiss-sep { font-size: 46px; font-weight: 300; color: var(--accent-1); opacity: 0.85; transform: translateY(-3px); }
.clk-swiss-mm { font-size: 56px; font-weight: 300; letter-spacing: -0.04em; opacity: 0.92; }
.clk-swiss-ss { font-size: 15px; font-weight: 700; color: var(--accent-1); margin-left: 6px; }
.w-sz-S .clk-swiss-hh, .w-sz-S .clk-swiss-mm { font-size: 40px; }
.w-sz-L .clk-swiss-hh, .w-sz-L .clk-swiss-mm { font-size: 68px; }
.clk-sec-track { width: 100%; height: 2px; border-radius: 99px; background: var(--border-subtle); margin: 10px 0 8px; overflow: hidden; }
.clk-sec-fill { height: 100%; background: var(--accent-1); transition: width 0.35s linear; }
.clk-meta-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--text-2); }

/* Hero Frameless Clock */
.clk-hero { text-align: left; padding: 4px 2px; }
.clk-hero-time { font-size: 68px; font-weight: 200; letter-spacing: -0.05em; line-height: 0.92; }
.w-sz-S .clk-hero-time { font-size: 48px; }
.w-sz-L .clk-hero-time { font-size: 84px; }
.clk-hero-date { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.84; margin-top: 8px; }
.clk-hero-weath { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; opacity: 0.78; margin-top: 4px; }

/* 3D Mechanical Split-Flap */
.flip-stage { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 4px 0 8px; }
.flip-tile {
    position: relative; width: 78px; height: 84px; border-radius: 13px;
    background: linear-gradient(180deg, #1E222B 0%, #151820 49%, #11131A 51%, #1A1E28 100%);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 10px 24px -8px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    display: flex; align-items: center; justify-content: center;
    font-size: 44px; font-weight: 800; color: #F8FAFC; letter-spacing: -0.03em;
}
body.mode-light .widget-card:not(.skin-frameless) .flip-tile {
    background: linear-gradient(180deg, #FFFFFF 0%, #F4F5F8 49%, #E6E8EE 51%, #F8F9FB 100%);
    color: #111827; border-color: rgba(15, 23, 42, 0.14);
    box-shadow: 0 8px 18px -8px rgba(15, 23, 42, 0.22), inset 0 1px 0 #FFFFFF;
}
.w-sz-S .flip-tile { width: 62px; height: 68px; font-size: 34px; }
.w-sz-L .flip-tile { width: 96px; height: 98px; font-size: 54px; }
.flip-tile::after {
    content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 2px;
    background: rgba(0, 0, 0, 0.55); box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08);
}
.flip-rivet-l, .flip-rivet-r {
    position: absolute; top: calc(50% - 3px); width: 4px; height: 6px; border-radius: 2px;
    background: rgba(148, 163, 184, 0.45); z-index: 2;
}
.flip-rivet-l { left: 4px; } .flip-rivet-r { right: 4px; }
.flip-colon { display: flex; flex-direction: column; gap: 10px; }
.flip-colon span { width: 5px; height: 5px; border-radius: 50%; background: var(--accent-1); opacity: 0.85; }

/* Braun Chronograph Analog */
.chrono-wrap { display: flex; align-items: center; gap: 16px; }
.chrono-dial { width: 112px; height: 112px; flex-shrink: 0; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.28)); }
.w-sz-S .chrono-dial { width: 88px; height: 88px; }
.w-sz-L .chrono-dial { width: 132px; height: 132px; }

/* Dot-Matrix LED Clock */
.dm-box {
    padding: 12px 14px; border-radius: 12px;
    background-color: rgba(0, 0, 0, 0.26);
    background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);
    background-size: 6px 6px;
    border: 1px solid var(--border-subtle);
}
body.mode-light .widget-card:not(.skin-frameless) .dm-box {
    background-color: rgba(15, 23, 42, 0.04);
    background-image: radial-gradient(rgba(15, 23, 42, 0.08) 1px, transparent 1px);
}
.dm-time { font-size: 42px; font-weight: 800; letter-spacing: 0.08em; color: var(--text-1); line-height: 1; }
.w-sz-S .dm-time { font-size: 30px; }
.dm-dots { display: flex; gap: 3px; margin-top: 10px; }
.dm-dots span { flex: 1; height: 4px; border-radius: 99px; background: var(--border-subtle); }
.dm-dots span.on { background: var(--accent-1); }

/* Turkish Typographic Word Clock */
.word-clk-main { font-size: 26px; font-weight: 800; line-height: 1.12; letter-spacing: -0.025em; }
.word-clk-min { font-size: 24px; font-weight: 300; line-height: 1.14; color: var(--accent-1); }

/* World Horizon */
.world-list { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.world-cell {
    padding: 8px 10px; border-radius: 11px;
    background: var(--bg-card); border: 1px solid var(--border-subtle);
    display: flex; align-items: center; justify-content: space-between;
}

/* ═══════════ 2. MEDIA WIDGET (4 PRO DESIGNS) ═══════════ */
.med-ambient-bg {
    position: absolute; inset: -24px; background-size: cover; background-position: center;
    filter: blur(28px) saturate(145%) brightness(0.55); opacity: 0.38; pointer-events: none; z-index: 0;
}
body.mode-light .med-ambient-bg { filter: blur(28px) saturate(135%) brightness(1.1); opacity: 0.24; }
.med-fg { position: relative; z-index: 1; }
.med-row { display: flex; align-items: center; gap: 13px; }
.med-art {
    width: 62px; height: 62px; border-radius: 13px; flex-shrink: 0; overflow: hidden;
    background: linear-gradient(135deg, rgba(var(--a1-rgb), 0.28), rgba(var(--a2-rgb), 0.22));
    border: 1px solid var(--border-rim);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 22px -8px rgba(0, 0, 0, 0.45);
}
.med-art img { width: 100%; height: 100%; object-fit: cover; }
.med-title { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.med-artist { font-size: 11.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.med-ctrls { display: flex; align-items: center; gap: 6px; margin-top: 9px; }

/* Animated 5-Bar Equalizer */
.eq-bars { display: inline-flex; align-items: flex-end; gap: 2.5px; height: 13px; }
.eq-bars i {
    display: block; width: 2.5px; border-radius: 99px; background: var(--accent-1);
    height: 4px; transition: height 0.2s;
}
.eq-bars.play i:nth-child(1) { animation: eqWave 0.72s ease-in-out infinite alternate; }
.eq-bars.play i:nth-child(2) { animation: eqWave 0.54s ease-in-out 0.14s infinite alternate; }
.eq-bars.play i:nth-child(3) { animation: eqWave 0.86s ease-in-out 0.08s infinite alternate; }
.eq-bars.play i:nth-child(4) { animation: eqWave 0.62s ease-in-out 0.22s infinite alternate; }
@keyframes eqWave { from { height: 3px; } to { height: 13px; } }

/* Spinning Vinyl Turntable + Tonearm */
.tt-stage { position: relative; width: 78px; height: 70px; flex-shrink: 0; }
.tt-disc {
    width: 68px; height: 68px; border-radius: 50%; overflow: hidden; position: relative;
    background: radial-gradient(circle at center, #111 0%, #1c1f26 30%, #0d0f14 32%, #181b22 62%, #0c0e13 64%, #151820 100%);
    border: 1.5px solid rgba(255, 255, 255, 0.16);
    box-shadow: 0 10px 22px -6px rgba(0, 0, 0, 0.55);
    display: flex; align-items: center; justify-content: center;
}
.tt-disc.spin { animation: spinSlow 9s linear infinite; }
.tt-disc img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid #0B0D12; }
.tt-spindle { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #E2E8F0; box-shadow: 0 0 0 1.5px #090B10; }
.tt-arm {
    position: absolute; top: 2px; right: 0; width: 22px; height: 54px; pointer-events: none;
    transform-origin: 14px 8px; transform: rotate(-22deg); transition: transform 0.35s var(--ease);
}
.tt-arm.engaged { transform: rotate(8deg); }
@keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* Hardware Tape Deck */
.deck-window {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;

.bar-track { height: 6px; border-radius: 99px; background: var(--border-subtle); overflow: hidden; }

.note-ta {

.td-list { display: flex; flex-direction: column; gap: 5px; max-height: 132px; overflow-y: auto; }

function hexToRgb(hex) {
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '');
    return m ? `${parseInt(m[1],16)}, ${parseInt(m[2],16)}, ${parseInt(m[3],16)}` : '56, 189, 248';
}
function hexLum(hex) {
    const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex || '');
    if (!m) return 0.5;
    return (0.299 * parseInt(m[1],16) + 0.587 * parseInt(m[2],16) + 0.114 * parseInt(m[3],16)) / 255;
}
function normalizeVariant(kind, raw) {

function applyTheme(t, radiusPreset, eco) {
    if (!t || !t.colors) return;
    const isLight = t.colorMode === 'Light';
    document.body.classList.toggle('mode-light', isLight);
    document.body.classList.toggle('eco-mode', Boolean(eco));
    document.body.classList.remove('radius-sharp', 'radius-modern', 'radius-soft');
    document.body.classList.add('radius-' + (radiusPreset || 'modern'));
    const c = t.colors;
    const op = Math.max(0.64, Math.min(0.98, Number(t.surfaceOpacity ?? (isLight ? 0.86 : 0.78))));
    const root = document.documentElement.style;
    root.setProperty('--bg-glass-1', `rgba(${hexToRgb(c.surface1)}, ${op.toFixed(2)})`);
    root.setProperty('--bg-glass-2', `rgba(${hexToRgb(c.surface2)}, ${Math.min(0.98, op + 0.08).toFixed(2)})`);
    root.setProperty('--text-1', c.textPrimary);
    root.setProperty('--text-2', c.textSecondary);
    root.setProperty('--accent-1', c.accentPrimary);
    root.setProperty('--accent-2', c.accentSecondary);
    root.setProperty('--a1-rgb', hexToRgb(c.accentPrimary));
    root.setProperty('--a2-rgb', hexToRgb(c.accentSecondary));
    root.setProperty('--accent-ink', hexLum(c.accentPrimary) > 0.56 ? '#090D16' : '#FFFFFF');
}

function reportHitRects() {
    const rects = [];
    const addEl = el => {
        if (!el) return;
        const r = el.getBoundingClientRect();
        if (r.width > 4 && r.height > 4) {
            rects.push({ x: Math.floor(r.left - 3), y: Math.floor(r.top - 3), w: Math.ceil(r.width + 6), h: Math.ceil(r.height + 6) });
        }
    };
    if (state?.widgetEditMode) {
        addEl(document.getElementById('editBanner'));
    }
    document.querySelectorAll('.widget-card').forEach(addEl);
    const insp = document.getElementById('widgetInspector');
    if (insp && insp.classList.contains('open')) addEl(insp);
    try { window.chrome.webview.postMessage({ type: 'hitRects', rects }); } catch (_) {}
}
function scheduleHitRects() {
    clearTimeout(hitTimer);
    hitTimer = setTimeout(reportHitRects, 28);
}

function resolveWidgetXY(w) {
    const vw = window.innerWidth || 1920;
    const vh = window.innerHeight || 1080;
    const estW = w.size === 'S' ? 236 : (w.size === 'L' ? 392 : 320);
    let left = w.x < 0 ? (vw + w.x) : w.x;
    let top = w.y < 0 ? (vh + w.y) : w.y;
    left = Math.max(12, Math.min(vw - estW - 12, left));
    top = Math.max(12, Math.min(vh - 120, top));
    return { left: Math.round(left), top: Math.round(top) };
}

    const r = 23, c = 2 * Math.PI * r;
    const off = c * (1 - p / 100);
    return `
        <div class="ring-item">
            <svg class="ring-svg" viewBox="0 0 58 58">
                <circle cx="29" cy="29" r="${r}" fill="none" stroke="var(--border-subtle)" stroke-width="4.5"/>
                <circle cx="29" cy="29" r="${r}" fill="none" stroke="${color}" stroke-width="4.5"
                    stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
                    transform="rotate(-90 29 29)"/>
                <text x="29" y="33" text-anchor="middle" fill="currentColor" font-size="12" font-weight="800" class="num">${p}%</text>
            </svg>
            <div class="ring-lbl" title="${escHtml(label)}">${subIcon ? `<span style="display:inline-flex;vertical-align:-2px;margin-right:3px;width:11px;height:11px;color:${color};">${subIcon}</span>` : ''}${escHtml(label)}</div>
        </div>
    `;
}

function buildSparklineSvg(arr, color, idSuffix) {
    const pts = (Array.isArray(arr) && arr.length > 1) ? arr : [10, 14, 12, 18, 15, 22, 19, 24];
    const maxV = Math.max(20, ...pts);
    const w = 132, h = 34;
    const coords = pts.map((v, i) => {
        const x = (i / (pts.length - 1)) * w;
        const y = h - 3 - ((Math.max(0, v) / maxV) * (h - 6));
        return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    const poly = coords.join(' ');
    const area = `0,${h} ${poly} ${w},${h}`;
    return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block;overflow:visible;">
        <defs><linearGradient id="sg-${idSuffix}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${color}" stop-opacity="0.34"/>
            <stop offset="100%" stop-color="${color}" stop-opacity="0.0"/>
        </linearGradient></defs>
        <polygon points="${area}" fill="url(#sg-${idSuffix})"/>
        <polyline points="${poly}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
}

function btDeviceIcon(cat) {
    if (cat === 'headset') return IC.headset;
    if (cat === 'mouse') return IC.mouse;
    if (cat === 'keyboard') return IC.keyboard;
    if (cat === 'gamepad') return IC.gamepad;
    return IC.battery;
}

function buildWidgetInner(w) {
    const variant = normalizeVariant(w.kind, w.variant);
    const now = new Date();
    const days = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
    const months = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
    const fullDateTr = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]}`;
    const clk = state.clock || `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    const parts = clk.split(':');
    const hh = parts[0] || String(now.getHours()).padStart(2,'0');
    const mm = parts[1] || String(now.getMinutes()).padStart(2,'0');
    const ss = String(now.getSeconds()).padStart(2,'0');
    const secPct = ((now.getSeconds() / 59) * 100).toFixed(1);
    const weathLine = state.weather?.live ? `${Math.round(state.weather.temp)}° · ${escHtml(state.weather.city || '')}` : '';

    /* 1. CLOCK (10+ STUDIO DESIGNS) */
    if (w.kind === 'clock') {
        if (variant === 'dotmatrix-led') {
            return `
                <div class="w-head"><span class="w-title">${IC.clock} LED MATRİS 5×7</span><span class="mono w-sub" data-clock-ss>${ss}s</span></div>
                <div id="dmLed-${escHtml(w.id)}">${renderDotMatrix5x7Svg(`${hh}:${mm}`, 'var(--accent-1)')}</div>
                <div class="clk-meta-row" style="margin-top:8px;"><span class="mono">${escHtml(fullDateTr)}</span><span class="mono">${weathLine}</span></div>
            `;
        }
        if (variant === 'solar') {
            const hrs = now.getHours() + now.getMinutes() / 60;
            const dayFrac = Math.max(0, Math.min(1, (hrs - 6) / 14));
            const isDay = hrs >= 6 && hrs <= 20;
            const ang = Math.PI * (1 - dayFrac);
            const sx = (90 + 68 * Math.cos(ang)).toFixed(1);
            const sy = (44 - 30 * Math.sin(ang)).toFixed(1);
            return `
                <div class="w-head"><span class="w-title">${isDay ? IC.sun : IC.moon} Güneş Yörüngesi</span><span class="num w-sub">${escHtml(weathLine || fullDateTr)}</span></div>
                <div style="display:flex;align-items:center;gap:12px;">
                    <div style="font-size:38px;font-weight:800;letter-spacing:-0.04em;line-height:1;" class="num" data-clock-live>${escHtml(hh)}:${escHtml(mm)}</div>
                    <svg viewBox="0 0 180 54" style="flex:1;height:48px;">
                        <line x1="14" y1="44" x2="166" y2="44" stroke="currentColor" stroke-opacity="0.18" stroke-dasharray="3 3"/>
                        <path d="M 22 44 A 68 30 0 0 1 158 44" fill="none" stroke="var(--accent-1)" stroke-opacity="0.35" stroke-width="1.6"/>
                        <circle cx="${sx}" cy="${sy}" r="6" fill="${isDay ? '#FBBF24' : '#818CF8'}"/>
                    </svg>
                </div>
                <div class="w-sub" style="margin-top:4px;">${escHtml(fullDateTr)}</div>
            `;
        }
        if (variant === 'orbital') {
            const hp = ((now.getHours() % 12) / 12) * 100;
            const mp = (now.getMinutes() / 60) * 100;
            const sp = (now.getSeconds() / 60) * 100;
            const ring = (r, p, col) => {
                const c = 2 * Math.PI * r;
                return `<circle cx="44" cy="44" r="${r}" fill="none" stroke="${col}" stroke-opacity="0.16" stroke-width="4.5"/><circle cx="44" cy="44" r="${r}" fill="none" stroke="${col}" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-p/100)).toFixed(1)}" transform="rotate(-90 44 44)"/>`;
            };
            return `
                <div style="display:flex;align-items:center;gap:14px;">
                    <svg viewBox="0 0 88 88" width="84" height="84" style="flex-shrink:0;">
                        ${ring(38, hp, 'var(--accent-1)')}
                        ${ring(29, mp, 'var(--accent-2)')}
                        ${ring(20, sp, '#34D399')}
                    </svg>
                    <div style="flex:1;min-width:0;">
                        <div class="w-title" style="margin-bottom:4px;">Orbital</div>
                        <div class="num" style="font-size:30px;font-weight:800;line-height:1;" data-clock-live>${escHtml(hh)}:${escHtml(mm)}<span style="font-size:13px;color:var(--accent-1);margin-left:4px;" data-clock-ss>${ss}</span></div>
                        <div class="w-sub" style="margin-top:4px;">${escHtml(fullDateTr)}</div>
                    </div>
                </div>
            `;
        }
        if (variant === 'editorial-poster') {
            return `
                <div style="display:flex;flex-direction:column;justify-content:space-between;min-height:122px;">
                    <div style="display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--text-2);font-weight:700;">
                        <span>${escHtml(days[now.getDay()])}</span><span>${escHtml(weathLine || 'AURORA')}</span>
                    </div>
                    <div style="font-size:58px;font-weight:900;letter-spacing:-0.055em;line-height:0.9;margin:8px 0;" class="num" data-clock-live>${escHtml(hh)}:${escHtml(mm)}</div>
                    <div style="font-size:11.5px;font-weight:600;color:var(--accent-1);">${now.getDate()} ${escHtml(months[now.getMonth()])} ${now.getFullYear()}</div>
                </div>
            `;
        }
        if (variant === 'dev-hex') {
            const epoch = Math.floor(now.getTime() / 1000);
            const hNum = now.getHours();
            const bits = Array.from({ length: 6 }, (_, i) => (hNum >> (5 - i)) & 1);
            return `
                <div class="w-head"><span class="w-title">${IC.cpu} DEV TELEMETRY</span><span class="mono w-sub">0x${epoch.toString(16).toUpperCase()}</span></div>
                <div class="mono" style="font-size:36px;font-weight:800;letter-spacing:-0.03em;line-height:1;" data-clock-live>${escHtml(hh)}:${escHtml(mm)}:${ss}</div>
                <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:8px;border-top:1px solid var(--border-subtle);">
                    <span class="mono w-sub">UNIX ${epoch}</span>
                    <span style="display:inline-flex;gap:4px;" title="Binary Saat">${bits.map(b => `<span style="width:7px;height:7px;border-radius:50%;background:${b ? 'var(--accent-1)' : 'var(--border-rim)'};"></span>`).join('')}</span>
                </div>
            `;
        }
        if (variant === 'hero') {
            return `
                <div class="clk-hero">
                    <div class="clk-hero-time num" data-clock-live>${escHtml(hh)}:${escHtml(mm)}</div>
                    <div class="clk-hero-date">${escHtml(fullDateTr)}</div>
                    ${weathLine ? `<div class="clk-hero-weath">${IC.sun.replace('<svg ', '<svg width="13" height="13" ')}<span>${weathLine} · ${escHtml(state.weather.summary || '')}</span></div>` : ''}
                </div>
            `;
        }
        if (variant === 'flip') {
            return `
                <div class="w-head"><span class="w-title">${IC.clock} Split-Flap</span><span class="w-sub">${escHtml(state.shortDate || '')}</span></div>
                <div class="flip-stage">
                    <div class="flip-tile num"><span class="flip-rivet-l"></span><span data-clock-hh>${escHtml(hh)}</span><span class="flip-rivet-r"></span></div>
                    <div class="flip-colon"><span></span><span></span></div>
                    <div class="flip-tile num"><span class="flip-rivet-l"></span><span data-clock-mm>${escHtml(mm)}</span><span class="flip-rivet-r"></span></div>
                </div>
                <div class="clk-meta-row"><span>${escHtml(fullDateTr)}</span><span class="num">${weathLine}</span></div>
            `;
        }
        if (variant === 'chronograph' || variant === 'braun-pro') {
            return `
                <div class="chrono-wrap">
                    ${buildChronographSvg(now)}
                    <div style="flex:1;min-width:0;">
                        <div class="w-title" style="margin-bottom:4px;">Braun BN0032</div>
                        <div style="font-size:26px;font-weight:800;letter-spacing:-0.03em;" class="num" data-clock-live>${escHtml(hh)}:${escHtml(mm)}</div>
                        <div class="w-sub" style="margin-top:3px;">${escHtml(fullDateTr)}</div>
                        ${weathLine ? `<div class="w-sub" style="margin-top:4px;color:var(--braun-accent, var(--accent-1));font-weight:600;">${weathLine}</div>` : ''}
                    </div>
                </div>
            `;
        }
        if (variant === 'dotmatrix') {
            const lit = Math.max(1, Math.round(((now.getHours() * 60 + now.getMinutes()) / 1440) * 18));
            const strip = Array.from({ length: 18 }, (_, i) => `<span class="${i < lit ? 'on' : ''}"></span>`).join('');
            return `
                <div class="w-head"><span class="w-title">${IC.clock} DOT-MATRIX</span><span class="mono w-sub">UTC${now.getTimezoneOffset() <= 0 ? '+' : '-'}${Math.abs(Math.round(now.getTimezoneOffset() / 60))}</span></div>
                <div class="dm-box">
                    <div class="dm-time mono" data-clock-live>${escHtml(hh)}:${escHtml(mm)}<span style="font-size:16px;color:var(--accent-1);margin-left:5px;" data-clock-ss>${ss}</span></div>
                    <div class="dm-dots">${strip}</div>
                </div>
                <div class="clk-meta-row" style="margin-top:8px;"><span class="mono">${escHtml(fullDateTr)}</span><span class="mono">${weathLine}</span></div>
            `;
        }
        if (variant === 'word') {
            const words = turkishTimeWords(now.getHours(), now.getMinutes());
            return `
                <div class="w-head"><span class="w-title">${IC.clock} Zaman</span><span class="num w-sub" data-clock-live>${escHtml(hh)}:${escHtml(mm)}</span></div>
                <div class="word-clk-main">${escHtml(words.hLine)}</div>
                <div class="word-clk-min">${escHtml(words.mLine)}</div>
                <div class="w-sub" style="margin-top:10px;">${escHtml(fullDateTr)}</div>
            `;
        }
        if (variant === 'world') {
            const zones = [
                { city: 'İstanbul', tz: 'Europe/Istanbul' },
                { city: 'Londra', tz: 'Europe/London' },
                { city: 'New York', tz: 'America/New_York' },
                { city: 'Tokyo', tz: 'Asia/Tokyo' }
            ];
            return `
                <div class="w-head"><span class="w-title">${IC.clock} Dünya Saatleri</span><span class="w-sub">${escHtml(state.shortDate || '')}</span></div>
                <div class="world-list">
                    ${zones.map(z => {
                        let tStr = '--:--', hr = 12;
                        try {
                            const fmt = new Intl.DateTimeFormat('tr-TR', { timeZone: z.tz, hour: '2-digit', minute: '2-digit', hour12: false });
                            tStr = fmt.format(now);
                            hr = parseInt(tStr.split(':')[0], 10) || 12;
                        } catch (_) {}
                        const isDay = hr >= 6 && hr < 19;
                        return `<div class="world-cell">
                            <div>
                                <div style="font-size:10.5px;color:var(--text-2);font-weight:600;">${z.city}</div>
                                <div style="font-size:16px;font-weight:800;margin-top:1px;" class="num">${tStr}</div>
                            </div>
                            <span style="width:15px;height:15px;color:${isDay ? '#FBBF24' : '#818CF8'};">${isDay ? IC.sun : IC.moon}</span>
                        </div>`;
                    }).join('')}
                </div>
            `;
        }
        // Default: Swiss Editorial Giant
        return `
            <div class="clk-swiss-row num">
                <span class="clk-swiss-hh" data-clock-hh>${escHtml(hh)}</span>
                <span class="clk-swiss-sep">:</span>
                <span class="clk-swiss-mm" data-clock-mm>${escHtml(mm)}</span>
                <span class="clk-swiss-ss" data-clock-ss>${ss}</span>
            </div>
            <div class="clk-sec-track"><div class="clk-sec-fill" data-clock-bar style="width:${secPct}%"></div></div>
            <div class="clk-meta-row">
                <span>${escHtml(fullDateTr)}</span>
                <span class="num" style="font-weight:600;color:var(--text-1);">${weathLine}</span>
            </div>
        `;
    }

    /* 2. MEDIA PLAYER (4 PRO DESIGNS) */
    if (w.kind === 'media') {
        const m = state.media;
        const playing = Boolean(m?.isPlaying);
        const title = m?.title || 'Çalan Medya Yok';
        const artist = m?.artist || (m?.app || 'Spotify · Tarayıcı · Medya');
        const artSrc = m?.artwork ? `data:image/jpeg;base64,${m.artwork}` : null;
        const ctrls = `
            <div class="med-ctrls" onpointerdown="event.stopPropagation()">
                <button class="w-ibtn" onclick="send('mediaCmd',{cmd:'prev'})" title="Önceki">${IC.prev}</button>
                <button class="w-btn primary" style="height:26px;padding:0 12px;" onclick="send('mediaCmd',{cmd:'play_pause'})" title="${playing ? 'Duraklat' : 'Oynat'}">${playing ? IC.pause : IC.play}</button>
                <button class="w-ibtn" onclick="send('mediaCmd',{cmd:'next'})" title="Sonraki">${IC.next}</button>
                <div class="eq-bars ${playing ? 'play' : ''}" style="margin-left:auto;"><i></i><i></i><i></i><i></i></div>
            </div>
        `;
        if (variant === 'turntable') {
            return `
                <div class="w-head"><span class="w-title">${IC.music} Pikap Stüdyo</span><span class="w-sub">${playing ? 'Çalıyor' : 'Hazır'}</span></div>
                <div class="med-row">
                    <div class="tt-stage">
                        <div class="tt-disc ${playing ? 'spin' : ''}">
                            ${artSrc ? `<img src="${artSrc}"/>` : `<span style="width:20px;height:20px;color:var(--accent-1);">${IC.music}</span>`}
                            <span class="tt-spindle"></span>
                        </div>
                        <svg class="tt-arm ${playing ? 'engaged' : ''}" viewBox="0 0 24 58" fill="none">
                            <circle cx="15" cy="8" r="5" fill="#94A3B8" stroke="#1E293B" stroke-width="1.5"/>
                            <path d="M15 11 L13 42 L7 50" stroke="#CBD5E1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                            <rect x="4" y="48" width="6" height="4" rx="1" transform="rotate(-35 4 48)" fill="var(--braun-accent, var(--accent-1))"/>
                        </svg>
                    </div>
                    <div style="flex:1;min-width:0;">
                        <div class="med-title">${escHtml(title)}</div>
                        <div class="med-artist">${escHtml(artist)}</div>
                        ${ctrls}
                    </div>
                </div>
            `;
        }
        if (variant === 'poster') {
            return `
                <div class="med-poster-card">
                    ${artSrc ? `<div class="med-poster-bg" style="background-image:url('${artSrc}');"></div>` : ''}
                    <div class="med-poster-scrim"></div>
                    <div class="med-poster-fg">
                        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
                            <span style="font-size:9.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;opacity:0.8;">${escHtml(m?.app || 'MEDYA')}</span>
                            <div class="eq-bars ${playing ? 'play' : ''}"><i></i><i></i><i></i><i></i></div>
                        </div>
                        <div class="med-title" style="font-size:15px;">${escHtml(title)}</div>
                        <div class="med-artist" style="color:rgba(255,255,255,0.75);">${escHtml(artist)}</div>
                        <div class="med-ctrls" style="margin-top:10px;" onpointerdown="event.stopPropagation()">
                            <button class="w-ibtn" style="background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.22);color:#FFF;" onclick="send('mediaCmd',{cmd:'prev'})">${IC.prev}</button>
                            <button class="w-btn primary" style="height:26px;padding:0 13px;" onclick="send('mediaCmd',{cmd:'play_pause'})">${playing ? IC.pause : IC.play}</button>
                            <button class="w-ibtn" style="background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.22);color:#FFF;" onclick="send('mediaCmd',{cmd:'next'})">${IC.next}</button>
                        </div>
                    </div>
                </div>
            `;
        }
        if (variant === 'tp7') {
            return `
                <div class="w-head"><span class="w-title">${IC.music} TE TP-7 STUDIO</span><span class="mono w-sub" style="color:#EA580C;">${playing ? 'REC/PLAY' : 'STANDBY'}</span></div>
                <div class="tp7-wrap">
                    <div class="tp7-platter ${playing ? 'spin' : ''}">
                        <span class="tp7-notch"></span>
                        <div class="tp7-center"></div>
                    </div>
                    <div style="flex:1;min-width:0;">
                        <div class="tp7-oled">
                            <div class="med-title mono" style="font-size:11.5px;color:#FFF;">${escHtml(title)}</div>
                            <div class="med-artist mono" style="font-size:9.5px;color:#94A3B8;">${escHtml(artist)}</div>
                        </div>
                        ${ctrls}
                    </div>
                </div>
            `;
        }
        if (variant === 'cassette' || variant === 'deck') {
            const reelSvg = `<svg class="deck-reel ${playing ? 'spin' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v6M4.2 16.5l5.2-3M19.8 16.5l-5.2-3"/></svg>`;
            return `
                <div class="w-head"><span class="w-title">${IC.music} Kaset Deck</span><span class="mono w-sub">${playing ? 'PLAY' : 'STOP'}</span></div>
                <div class="cassette-shell">
                    <div class="deck-window" style="margin-bottom:5px;">
                        ${reelSvg}
                        <div style="flex:1;min-width:0;text-align:center;">
                            <div class="med-title" style="font-size:12px;">${escHtml(title)}</div>
                            <div class="med-artist" style="font-size:10px;">${escHtml(artist)}</div>
                        </div>
                        ${reelSvg}
                    </div>
                    <div style="height:3px;border-radius:99px;background:rgba(255,255,255,0.1);overflow:hidden;"><div style="width:${playing ? '64%' : '20%'};height:100%;background:var(--accent-1);"></div></div>
                </div>
                ${ctrls}
            `;
        }
        if (variant === 'waveform') {
            const fakeWave = playing ? [25, 58, 42, 84, 65, 92, 48, 76, 38, 62, 74, 40] : [18, 20, 18, 22, 19, 21, 18, 20, 19, 18, 20, 18];
            return `
                <div class="w-head"><span class="w-title">${IC.music} Ses Dalgası</span><span class="w-sub">${escHtml(m?.app || 'Medya')}</span></div>
                <div class="med-title">${escHtml(title)}</div>
                <div class="med-artist" style="margin-bottom:6px;">${escHtml(artist)}</div>
                ${renderOscilloscopeSvg(fakeWave, 'var(--accent-1)', 260, 34, w.id + 'mw')}
                ${ctrls}

        }
        if (variant === 'minimal') {
            return `
                <div class="med-row">
                    <div class="med-art" style="width:44px;height:44px;border-radius:10px;">${artSrc ? `<img src="${artSrc}"/>` : `<span style="width:18px;height:18px;color:var(--accent-1);">${IC.music}</span>`}</div>
                    <div style="flex:1;min-width:0;">
                        <div class="med-title" style="font-size:12.5px;">${escHtml(title)}</div>
                        <div class="med-artist" style="font-size:10.5px;">${escHtml(artist)}</div>
                    </div>
                    <div style="display:flex;gap:4px;" onpointerdown="event.stopPropagation()">
                        <button class="w-ibtn" onclick="send('mediaCmd',{cmd:'play_pause'})">${playing ? IC.pause : IC.play}</button>
                        <button class="w-ibtn" onclick="send('mediaCmd',{cmd:'next'})">${IC.next}</button>
                    </div>
                </div>
            `;
        }
        // Default: Ambient Album-Art Studio Card
        return `
            ${artSrc ? `<div class="med-ambient-bg" style="background-image:url('${artSrc}');"></div>` : ''}
            <div class="med-fg">
                <div class="w-head"><span class="w-title">${IC.music} Medya Stüdyo</span><span class="w-sub">${escHtml(m?.app || (playing ? 'Çalıyor' : 'Beklemede'))}</span></div>
                <div class="med-row">
                    <div class="med-art">${artSrc ? `<img src="${artSrc}"/>` : `<span style="width:24px;height:24px;color:var(--accent-1);">${IC.music}</span>`}</div>
                    <div style="flex:1;min-width:0;">
                        <div class="med-title">${escHtml(title)}</div>
                        <div class="med-artist">${escHtml(artist)}</div>
                        ${ctrls}
                    </div>
                </div>
            </div>
        `;
    }

    /* 3. WEATHER (4 PRO VECTOR DESIGNS) */
    if (w.kind === 'weather') {
        const wt = state.weather || {};
        const temp = wt.live ? `${Math.round(wt.temp)}°` : '--°';
        const city = wt.city || 'Konum Bekleniyor';
        const sum = wt.summary || 'Veri yenileniyor';
        if (variant === 'dynamic-sky') {
            const hr = now.getHours();
            const isRain = /(yağmur|sağanak|rain|storm|fırtına)/i.test(sum);
            const skyCls = isRain ? 'sky-rain' : (hr >= 18 && hr < 21 ? 'sky-sunset' : (hr >= 6 && hr < 18 ? 'sky-day' : 'sky-night'));
            return `
                <div class="weath-sky-card ${skyCls}">
                    <div style="display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;opacity:0.86;">
                        <span>${escHtml(city)}</span><span>${wt.live ? 'CANLI' : 'HAVA'}</span>
                    </div>
                    <div class="weath-hero" style="margin-top:10px;">
                        <div>
                            <div class="weath-temp num">${temp}</div>
                            <div style="font-size:12px;font-weight:600;opacity:0.9;margin-top:4px;">${escHtml(sum)}</div>
                        </div>
                        ${weatherIllustrationSvg(sum)}
                    </div>
                </div>
            `;
        }
        if (variant === 'barometer') {
            const tNum = wt.live ? Math.round(wt.temp) : 20;
            const norm = Math.max(0, Math.min(1, (tNum + 10) / 55));
            const ang = -125 + norm * 250;
            return `
                <div class="w-head"><span class="w-title">${IC.sun} Barometre</span><span class="w-sub">${escHtml(city)}</span></div>
                <div style="display:flex;align-items:center;gap:14px;">
                    <svg viewBox="0 0 80 80" width="76" height="76" style="flex-shrink:0;">
                        <circle cx="40" cy="40" r="34" fill="none" stroke="var(--border-rim)" stroke-width="3" stroke-dasharray="150 220" stroke-dashoffset="-15" transform="rotate(140 40 40)"/>
                        <line x1="40" y1="44" x2="40" y2="14" stroke="#EA580C" stroke-width="2.4" stroke-linecap="round" transform="rotate(${ang.toFixed(1)} 40 40)"/>
                        <circle cx="40" cy="40" r="3.5" fill="var(--text-1)"/>
                    </svg>
                    <div><div class="weath-temp num" style="font-size:36px;">${temp}</div><div class="w-sub" style="margin-top:3px;">${escHtml(sum)}</div></div>
                </div>
            `;
        }
        if (variant === 'minimal') {
            return `
                <div style="display:flex;align-items:center;gap:12px;">
                    <div style="width:42px;height:42px;">${weatherIllustrationSvg(sum).replace('class="weath-svg"', 'width="42" height="42"')}</div>
                    <div>
                        <div style="font-size:30px;font-weight:800;line-height:1;" class="num">${temp}</div>
                        <div class="w-sub" style="margin-top:2px;">${escHtml(city)} · ${escHtml(sum)}</div>
                    </div>
                </div>
            `;
        }
        if (variant === 'telemetry') {
            return `
                <div class="w-head"><span class="w-title">${IC.sun} Hava Telemetri</span><span class="w-badge">${wt.live ? 'Canlı' : 'Çevrimdışı'}</span></div>
                <div class="weath-hero">
                    <div>
                        <div class="weath-temp num">${temp}</div>
                        <div style="font-size:12.5px;font-weight:700;margin-top:3px;">${escHtml(city)}</div>
                    </div>
                    ${weatherIllustrationSvg(sum)}
                </div>
                <div class="weath-meta-grid">
                    <div class="weath-cell"><div class="w-sub">Durum</div><div style="font-weight:700;margin-top:2px;">${escHtml(sum)}</div></div>
                    <div class="weath-cell"><div class="w-sub">Tarih</div><div style="font-weight:700;margin-top:2px;" class="num">${escHtml(state.shortDate || '')}</div></div>
                </div>
            `;
        }
        return `
            <div class="w-head"><span class="w-title">${IC.sun} Hava Durumu</span><span class="w-sub">${escHtml(city)}</span></div>
            <div class="weath-hero">
                <div>
                    <div class="weath-temp num">${temp}</div>
                    <div style="font-size:12.5px;font-weight:600;color:var(--text-2);margin-top:4px;">${escHtml(sum)}</div>
                </div>
                ${weatherIllustrationSvg(sum)}
            </div>
        `;
    }

    /* 4. AI QUOTA STUDIO (BESPOKE BRAND EMBLEMS) */
    if (w.kind === 'ai-quota') {
        const snaps = state.aiSnapshots || [];
        const colorOf = p => p === 'openai' ? '#10B981' : (p === 'gemini' ? '#38BDF8' : '#F59E0B');
        const emblemOf = p => p === 'openai' ? IC.openai : (p === 'gemini' ? IC.gemini : IC.claude);
        const list = snaps.length > 0 ? snaps : [
            { provider: 'openai', displayName: 'ChatGPT', planName: 'Plus', sourceBadge: 'Sayaç', remainingPercent: 100, primaryLabel: '0 / 80', secondaryLabel: 'Hazır' },
            { provider: 'gemini', displayName: 'Gemini', planName: 'Pro', sourceBadge: 'Sayaç', remainingPercent: 100, primaryLabel: '0 / 100', secondaryLabel: 'Hazır' },
            { provider: 'claude', displayName: 'Claude', planName: 'Pro', sourceBadge: 'Sayaç', remainingPercent: 100, primaryLabel: '0 / 45', secondaryLabel: 'Hazır' }
        ];
        if (variant === 'rings') {
            return `
                <div class="w-head">
                    <span class="w-title">${IC.spark} AI Kota Stüdyosu</span>
                    <button class="w-ibtn" style="width:22px;height:22px;" onpointerdown="event.stopPropagation()" onclick="send('refreshAiQuota')" title="Yenile">${IC.refresh}</button>
                </div>
                <div class="rings-grid">
                    ${list.map(s => buildRingSvg(s.remainingPercent, colorOf(s.provider), s.displayName, emblemOf(s.provider))).join('')}
                </div>
            `;
        }
        return `
            <div class="w-head">
                <span class="w-title">${IC.spark} AI Kota Stüdyosu</span>
                <div style="display:flex;gap:4px;" onpointerdown="event.stopPropagation()">
                    <button class="w-ibtn" style="width:22px;height:22px;" onclick="send('refreshAiQuota')" title="Yenile">${IC.refresh}</button>
                    <button class="w-ibtn" style="width:22px;height:22px;" onclick="send('openSettings',{section:'widgets'})" title="API & Plan Ayarları">${IC.sliders}</button>
                </div>
            </div>
            <div class="ai-list">
                ${list.map(s => {
                    const col = colorOf(s.provider);
                    const pct = Math.max(0, Math.min(100, Number(s.remainingPercent ?? 100)));
                    return `<div class="ai-row">
                        <div class="ai-emblem">${emblemOf(s.provider)}</div>
                        <div style="flex:1;min-width:0;">
                            <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;">
                                <span style="font-size:12px;font-weight:700;">${escHtml(s.displayName)} <span style="font-size:10px;color:var(--text-2);font-weight:500;">${escHtml(s.planName || '')}</span></span>
                                <span style="font-size:10.5px;font-weight:800;color:${col};" class="num">${pct}%</span>
                            </div>
                            <div style="display:flex;align-items:center;justify-content:space-between;font-size:10px;color:var(--text-2);margin-top:1px;">
                                <span class="num">${escHtml(s.primaryLabel || '')}</span>
                                <span>${escHtml(s.sourceBadge || 'Sayaç')}</span>
                            </div>
                            <div class="ai-bar"><div class="ai-fill" style="width:${pct}%;background:${col};"></div></div>
                        </div>
                        <div style="display:flex;gap:3px;" onpointerdown="event.stopPropagation()">
                            <button class="w-btn" style="height:22px;padding:0 7px;font-size:10px;" onclick="send('bumpAiManualUsage',{provider:'${escHtml(s.provider)}',delta:1})" title="+1 İstem">+1</button>
                        </div>
                    </div>`;
                }).join('')}
            </div>
        `;
    }

    /* 5. BATTERY & BLUETOOTH RINGS / BARS */
    if (w.kind === 'battery') {
        const items = [];
        if (state.battery?.present) {
            items.push({ name: state.battery.charging ? 'PC · Şarj' : 'Bilgisayar', pct: state.battery.percent ?? 100, col: state.battery.charging ? '#34D399' : 'var(--accent-1)', icon: IC.laptop });
        }
        (state.btDevices || []).slice(0, 3).forEach(d => {
            items.push({
                name: d.name || 'Bluetooth',
                pct: d.hasBattery === false ? 100 : (d.percent ?? 0),
                col: (d.percent ?? 100) <= 20 ? '#FB7185' : '#38BDF8',
                icon: btDeviceIcon(d.category)
            });
        });
        if (items.length === 0) {
            items.push({ name: 'AC Güç', pct: 100, col: '#34D399', icon: IC.bolt });
        }
        if (variant === 'bars') {
            return `
                <div class="w-head"><span class="w-title">${IC.battery} Pil & Bluetooth</span><span class="w-sub">${items.length} cihaz</span></div>
                <div style="display:flex;flex-direction:column;gap:9px;">
                    ${items.map(it => `<div>
                        <div style="display:flex;justify-content:space-between;align-items:center;font-size:11.5px;margin-bottom:4px;">
                            <span style="display:inline-flex;align-items:center;gap:6px;font-weight:600;"><span style="width:13px;height:13px;color:${it.col};">${it.icon}</span>${escHtml(it.name)}</span>
                            <span class="num" style="font-weight:700;">${it.pct}%</span>
                        </div>
                        <div class="bar-track"><div class="bar-fill" style="width:${it.pct}%;background:${it.col};"></div></div>
                    </div>`).join('')}
                </div>
            `;
        }
        return `
            <div class="w-head"><span class="w-title">${IC.battery} Pil & Bluetooth</span><span class="w-sub">${items.length} cihaz</span></div>
            <div class="rings-grid">${items.map(it => buildRingSvg(it.pct, it.col, it.name, it.icon)).join('')}</div>
        `;
    }

    /* 6. SYSTEM TELEMETRY */
    if (w.kind === 'system') {
        const m = state.metrics || {};
        const cpu = Math.round(m.cpu || 0), ram = Math.round(m.ramPct || 0);
        const rx = Number(m.rxKbps || 0);
        const netLbl = rx >= 1024 ? `${(rx / 1024).toFixed(1)} MB/s` : `${Math.round(rx)} KB/s`;
        if (variant === 'oscilloscope') {
            return `
                <div class="w-head"><span class="w-title">${IC.cpu} OSİLOSKOP</span><span class="mono w-sub">CPU ${cpu}% · RAM ${ram}%</span></div>
                <div style="display:flex;flex-direction:column;gap:6px;">
                    <div>
                        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-2);margin-bottom:2px;"><span>CPU Yükü</span><span class="mono" style="color:var(--accent-1);font-weight:700;">${cpu}%</span></div>
                        ${renderOscilloscopeSvg(m.cpuHist, 'var(--accent-1)', 260, 32, w.id + 'oc')}
                    </div>
                    <div>
                        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-2);margin-bottom:2px;"><span>Bellek (${m.ramUsed ?? 0}/${m.ramTotal ?? 0} GB)</span><span class="mono" style="color:var(--accent-2);font-weight:700;">${ram}%</span></div>
                        ${renderOscilloscopeSvg(m.ramHist, 'var(--accent-2)', 260, 32, w.id + 'or')}
                    </div>
                </div>
            `;
        }
        if (variant === 'spark') {
            return `
                <div class="w-head"><span class="w-title">${IC.cpu} Canlı Telemetri</span><span class="mono w-sub">${netLbl}</span></div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                    <div>
                        <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;"><span class="w-sub">CPU</span><span class="num" style="font-weight:800;">${cpu}%</span></div>
                        ${buildSparklineSvg(m.cpuHist, '#38BDF8', w.id + 'c')}
                    </div>
                    <div>
                        <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;"><span class="w-sub">RAM</span><span class="num" style="font-weight:800;">${ram}%</span></div>
                        ${buildSparklineSvg(m.ramHist, '#818CF8', w.id + 'r')}
                    </div>
                </div>
            `;
        }
        return `
            <div class="w-head"><span class="w-title">${IC.cpu} Sistem</span><span class="mono w-sub">${m.ramUsed ?? 0}/${m.ramTotal ?? 0} GB · ${netLbl}</span></div>
            <div class="rings-grid">
                ${buildRingSvg(cpu, '#38BDF8', 'CPU', null)}
                ${buildRingSvg(ram, '#818CF8', 'RAM', null)}
                ${buildRingSvg(Math.min(100, Math.round(rx / 120)), '#34D399', 'Ağ', null)}
            </div>
        `;
    }

    /* 7. CALENDAR */
    if (w.kind === 'calendar') {
        const todayKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        const note = state.agendaNotes?.[todayKey] || '';
        if (variant === 'month') {
            const yr = now.getFullYear(), mo = now.getMonth();
            const firstDow = (new Date(yr, mo, 1).getDay() + 6) % 7;
            const daysInMo = new Date(yr, mo + 1, 0).getDate();
            const prevDays = new Date(yr, mo, 0).getDate();
            const cells = [];
            for (let i = firstDow - 1; i >= 0; i--) cells.push(`<div class="cal-m-cell muted num">${prevDays - i}</div>`);
            for (let d = 1; d <= daysInMo; d++) {
                const dk = `${yr}-${String(mo + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const hasNote = Boolean(state.agendaNotes?.[dk]);
                const isToday = d === now.getDate();
                cells.push(`<div class="cal-m-cell num ${isToday ? 'today' : ''} ${hasNote ? 'note' : ''}">${d}</div>`);
            }
            while (cells.length % 7 !== 0) cells.push(`<div class="cal-m-cell muted num">${(cells.length % 7) + 1}</div>`);
            return `
                <div class="w-head"><span class="w-title">${IC.calendar} ${escHtml(months[mo])} ${yr}</span><span class="w-sub">${now.getDate()}</span></div>
                <div class="cal-month-grid">
                    ${['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(d => `<div class="cal-m-dow">${d}</div>`).join('')}
                    ${cells.join('')}
                </div>
            `;
        }
        return `
            <div class="w-head"><span class="w-title">${IC.calendar} Takvim</span><span class="w-sub">${escHtml(months[now.getMonth()])} ${now.getFullYear()}</span></div>
            <div style="display:flex;align-items:center;gap:14px;">
                <div class="cal-day-num num">${now.getDate()}</div>
                <div style="flex:1;min-width:0;">
                    <div style="font-size:14px;font-weight:700;">${escHtml(days[now.getDay()])}</div>
                    <div class="w-sub" style="margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${note ? escHtml(note) : 'Bugün için plan notu yok'}</div>
                </div>
            </div>
        `;
    }

    /* 8. STICKY NOTES */
    if (w.kind === 'notes') {
        return `
            <div class="w-head"><span class="w-title">${IC.note} Hızlı Not</span><span class="w-sub">Otomatik Kayıt</span></div>
            <textarea class="note-ta" data-note-wid="${escHtml(w.id)}" placeholder="Notunuzu yazın..."
                onfocus="send('requestWidgetFocus')"
                onblur="send('releaseWidgetFocus');saveWidgetNote('${escHtml(w.id)}',this.value)"
                onpointerdown="event.stopPropagation()">${escHtml(w.noteText || '')}</textarea>
        `;
    }

    /* 9. POMODORO */
    if (w.kind === 'pomodoro') {
        const f = state.focus || { running: false, seconds: 1500, label: '25:00' };
        const pct = Math.max(0, Math.min(100, Math.round(((1500 - (f.seconds || 0)) / 1500) * 100)));
        return `
            <div class="w-head"><span class="w-title">${IC.timer} Odak Zamanlayıcı</span><span class="w-badge">${f.running ? 'Aktif' : 'Hazır'}</span></div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
                <div style="font-size:36px;font-weight:800;letter-spacing:-0.03em;" class="num">${escHtml(f.label || '25:00')}</div>
                <div style="display:flex;gap:6px;" onpointerdown="event.stopPropagation()">
                    <button class="w-btn primary" onclick="send('toggleFocus')">${f.running ? 'Duraklat' : 'Başlat'}</button>
                    <button class="w-ibtn" onclick="send('resetFocus')" title="Sıfırla">${IC.refresh}</button>
                </div>
            </div>
            <div class="bar-track" style="margin-top:10px;"><div class="bar-fill" style="width:${pct}%;"></div></div>
        `;
    }

    /* 10. QUICK LAUNCHER (SAFE INDEX-BASED — ZERO INLINE PATH ESCAPING!) */
    if (w.kind === 'launcher') {
        const pins = (state.pinnedShortcuts || []).slice(0, w.size === 'S' ? 4 : 8);
        return `
            <div class="w-head"><span class="w-title">${IC.grid} Hızlı Başlatıcı</span><span class="w-sub">${pins.length} kısayol</span></div>
            <div class="ln-grid" onpointerdown="event.stopPropagation()">
                ${pins.map((p, idx) => `<button class="ln-btn" onclick="launchPinnedIndex(${idx})" title="${escHtml(p.name)}">
                    ${p.icon ? `<img src="data:image/png;base64,${p.icon}"/>` : `<span style="width:22px;height:22px;border-radius:6px;background:rgba(var(--a1-rgb),0.18);color:var(--accent-1);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;">${escHtml((p.name || 'A')[0].toUpperCase())}</span>`}
                    <span>${escHtml(p.name)}</span>
                </button>`).join('')}
            </div>
        `;
    }

    /* 11. TODO LIST */
    if (w.kind === 'todo') {
        const todos = state.todos || [];
        return `
            <div class="w-head"><span class="w-title">${IC.list} Görevler</span><span class="w-sub num">${todos.filter(t => !t.done).length} açık</span></div>
            <div class="td-inp-row" onpointerdown="event.stopPropagation()">
                <input class="td-inp" id="tdInp-${escHtml(w.id)}" placeholder="Yeni görev ekle..."
                    onfocus="send('requestWidgetFocus')" onblur="send('releaseWidgetFocus')"
                    onkeydown="if(event.key==='Enter')submitTodo('${escHtml(w.id)}')"/>
                <button class="w-btn primary" onclick="submitTodo('${escHtml(w.id)}')">Ekle</button>
            </div>
            <div class="td-list" onpointerdown="event.stopPropagation()">
                ${todos.length === 0 ? `<div class="w-sub" style="padding:8px 2px;">Henüz görev yok.</div>` : todos.slice(0, 6).map(t => `
                    <div class="td-row">
                        <button class="td-chk ${t.done ? 'done' : ''}" onclick="send('toggleTodo',{id:'${escHtml(t.id)}'})">${t.done ? IC.check.replace('<svg ','<svg width="10" height="10" ') : ''}</button>
                        <span class="td-txt ${t.done ? 'done' : ''}" onclick="send('toggleTodo',{id:'${escHtml(t.id)}'})">${escHtml(t.text)}</span>
                        <button class="w-ibtn danger" style="width:20px;height:20px;" onclick="send('removeTodo',{id:'${escHtml(t.id)}'})">${IC.close}</button>
                    </div>
                `).join('')}
            </div>
        `;
    }

    /* 12. MARKET & FX */
    if (w.kind === 'market') {
        const mk = state.market || {};
        const rows = [
            { k: 'USD/TRY', v: mk.usdTry ? mk.usdTry.toFixed(2) + ' ₺' : '--' },
            { k: 'EUR/TRY', v: mk.eurTry ? mk.eurTry.toFixed(2) + ' ₺' : '--' },
            { k: 'BTC', v: mk.btcUsd ? '$' + Math.round(mk.btcUsd).toLocaleString('tr-TR') : '--' },
            { k: 'ETH', v: mk.ethUsd ? '$' + Math.round(mk.ethUsd).toLocaleString('tr-TR') : '--' }
        ];
        return `
            <div class="w-head">
                <span class="w-title">${IC.chart} Piyasa & Döviz</span>
                <button class="w-ibtn" style="width:22px;height:22px;" onpointerdown="event.stopPropagation()" onclick="send('refreshMarket')" title="Yenile">${IC.refresh}</button>
            </div>
            <div class="mkt-grid">
                ${rows.map(r => `<div class="mkt-chip"><div class="w-sub">${r.k}</div><div class="num" style="font-size:14px;font-weight:800;margin-top:2px;">${r.v}</div></div>`).join('')}
            </div>
        `;
    }

    /* 13. COUNTDOWN */
    if (w.kind === 'countdown') {
        const cd = state.countdown || { title: 'Hedef', targetDate: '2026-12-31' };
        const diffDays = Math.max(0, Math.ceil((new Date(cd.targetDate + 'T00:00:00') - now) / 86400000));
        return `
            <div class="w-head">
                <span class="w-title">${IC.flag} Geri Sayım</span>
                <button class="w-ibtn" style="width:22px;height:22px;" onpointerdown="event.stopPropagation()" onclick="countdownEditOpen=!countdownEditOpen;renderWidgets(true);" title="Düzenle">${IC.sliders}</button>
            </div>
            ${countdownEditOpen ? `
                <div style="display:flex;flex-direction:column;gap:6px;" onpointerdown="event.stopPropagation()">
                    <input class="td-inp" id="cdTitle" value="${escHtml(cd.title)}" onfocus="send('requestWidgetFocus')" onblur="send('releaseWidgetFocus')"/>
                    <input class="td-inp" id="cdDate" type="date" value="${escHtml(cd.targetDate)}" onfocus="send('requestWidgetFocus')" onblur="send('releaseWidgetFocus')"/>
                    <button class="w-btn primary" onclick="saveCountdownForm()">Kaydet</button>
                </div>
            ` : `
                <div style="display:flex;align-items:baseline;gap:10px;">
                    <div style="font-size:42px;font-weight:800;color:var(--accent-1);line-height:1;" class="num">${isNaN(diffDays) ? 0 : diffDays}</div>
                    <div>
                        <div style="font-size:13px;font-weight:700;">gün kaldı</div>
                        <div class="w-sub">${escHtml(cd.title)} · ${escHtml(cd.targetDate)}</div>
                    </div>
                </div>
            `}
        `;
    }

    /* 14. STORAGE & NET */
    if (w.kind === 'storage-net') {
        const disks = (state.disks || []).slice(0, 3);
        return `
            <div class="w-head">
                <span class="w-title">${IC.disk} Disk & Depolama</span>
                <button class="w-ibtn" style="width:22px;height:22px;" onpointerdown="event.stopPropagation()" onclick="send('refreshLocalAi')">${IC.refresh}</button>
            </div>
            <div style="display:flex;flex-direction:column;gap:8px;">
                ${disks.length === 0 ? `<div class="w-sub">Diskler taranıyor...</div>` : disks.map(d => {
                    const pct = Math.round(d.usedPercent || 0);
                    return `<div>
                        <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;">
                            <span style="font-weight:700;">${escHtml(d.drive)}</span>

    /* 17. AUDIO MIXER (MASTER + OUTPUTS + PER-APP SESSIONS) */

    /* 18. FOCUS RINGS (3 ACTIVITY RINGS) */
    if (w.kind === 'focus-rings') {
        const fs = state.focusStats || { completedMins: 0, goalMins: 90 };
        const todos = state.todos || [];
        const doneCnt = todos.filter(t => t.done).length;
        const focusPct = Math.min(100, Math.round(((fs.completedMins || 0) / Math.max(15, fs.goalMins || 90)) * 100));
        const todoPct = todos.length > 0 ? Math.min(100, Math.round((doneCnt / todos.length) * 100)) : 0;
        const f = state.focus || { running: false, label: '25:00' };
        const ring = (r, p, col) => {
            const c = 2 * Math.PI * r;
            return `<circle cx="42" cy="42" r="${r}" fill="none" stroke="${col}" stroke-opacity="0.16" stroke-width="5"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-p/100)).toFixed(1)}" transform="rotate(-90 42 42)"/>`;

    /* 20. QUICK DROP & CLIPBOARD */

            <div class="w-head"><span class="w-title">${IC.spark} Hızlı Araç & Pano</span><span class="w-sub">${clips.length} öğe</span></div>

function cycleSize(id, cur) {
    const next = cur === 'S' ? 'M' : (cur === 'M' ? 'L' : 'S');
    send('updateDesktopWidget', { id, size: next });
}
function cycleVariant(id, kind, cur) {
    const list = VARIANT_CATALOG[kind] || [];
    if (list.length <= 1) return;
    const norm = normalizeVariant(kind, cur);
    const idx = Math.max(0, list.findIndex(x => x.id === norm));
    const next = list[(idx + 1) % list.length].id;
    send('updateDesktopWidget', { id, variant: next });
}

/* ═══════════ DIRECT RIGHT-CLICK PRO INSPECTOR ═══════════ */
function openWidgetInspector(e, wid) {
    e.preventDefault();
    e.stopPropagation();
    inspectorWid = wid;
    const vw = window.innerWidth || 1920;
    const vh = window.innerHeight || 1080;
    inspectorPos = {
        x: Math.max(12, Math.min(vw - 304, e.clientX + 8)),
        y: Math.max(12, Math.min(vh - 360, e.clientY + 8))
    };
    renderInspector();
    scheduleHitRects();
}
function closeWidgetInspector() {
    if (!inspectorWid) return;
    inspectorWid = null;
    const el = document.getElementById('widgetInspector');
    if (el) { el.classList.remove('open'); el.innerHTML = ''; }
    scheduleHitRects();
}
function renderInspector() {
    const el = document.getElementById('widgetInspector');
    if (!el || !inspectorWid || !state) return;

        <div class="insp-sec">
            <div class="insp-lbl">Tasarım Arketipi</div>
            <div class="insp-chips">
                ${SKIN_META.map(s => `<button class="insp-chip ${curSkin === s.id ? 'active' : ''}" onclick="setWidgetProp('${escHtml(w.id)}',{skin:'${s.id}'})">${s.name}</button>`).join('')}

        ${vars.length > 1 ? `
        <div class="insp-sec">

                ${vars.map(v => `<button class="insp-chip ${curVar === v.id ? 'active' : ''}" onclick="setWidgetProp('${escHtml(w.id)}',{variant:'${v.id}'})">${v.name}</button>`).join('')}
            </div>
        </div>` : ''}
        <div class="insp-sec">
            <div class="insp-lbl">Boyut</div>
            <div class="insp-chips">
                ${['S','M','L'].map(sz => `<button class="insp-chip ${(w.size || 'M') === sz ? 'active' : ''}" style="min-width:44px;" onclick="setWidgetProp('${escHtml(w.id)}',{size:'${sz}'})">${sz}</button>`).join('')}
            </div>
        </div>
        <div class="insp-sec">
            <div style="display:flex;justify-content:space-between;"><span class="insp-lbl">Saydamlık</span><span class="num" style="font-size:10.5px;color:var(--text-2);">${curOp}%</span></div>
            <input class="insp-range" type="range" min="45" max="100" value="${curOp}" oninput="previewWidgetOpacity('${escHtml(w.id)}',this.value)" onchange="setWidgetProp('${escHtml(w.id)}',{opacity:Number(this.value)/100})"/>
        </div>

        </div>` : ''}
        <div class="insp-foot">
            <button class="w-btn ${w.pinnedTop ? 'primary' : ''}" onclick="setWidgetProp('${escHtml(w.id)}',{pinnedTop:${!w.pinnedTop}})">${IC.pin} Üstte Tut</button>
            <button class="w-btn" onclick="send('setWidgetEditMode',{active:${!state.widgetEditMode}});closeWidgetInspector();">Taşı</button>
            <button class="w-ibtn danger" onclick="send('removeDesktopWidget',{id:'${escHtml(w.id)}'});closeWidgetInspector();" title="Widget'ı Kaldır">${IC.trash}</button>

function setWidgetProp(id, patch) {
    if (state?.widgets) {
        const w = state.widgets.find(x => x.id === id);
        if (w) Object.assign(w, patch);
        renderWidgets(true);
        renderInspector();
    }
    send('updateDesktopWidget', { id, ...patch });
}
function previewWidgetOpacity(id, val) {

function renderWidgets(force) {
    if (!state) return;
    applyTheme(state.theme, state.cornerRadiusPreset, state.ecoModeActive);
    document.body.classList.toggle('edit-mode', Boolean(state.widgetEditMode));

    const sig = JSON.stringify({
        edit: state.widgetEditMode,
        locked: state.widgetsLocked,
        eco: Boolean(state.ecoModeActive),
        theme: state.theme?.id,
        rad: state.cornerRadiusPreset,
        widgets: state.widgets,
        media: state.media ? `${state.media.title}|${state.media.isPlaying}|${Boolean(state.media.artwork)}` : null,
        bat: state.battery,
        bts: state.btDevices,
        audio: state.audio,
        outs: state.audioOutputs,
        sess: state.audioSessions,
        clips: state.clipboard,
        fstats: state.focusStats,
        photos: Object.keys(state.widgetPhotos || {}).map(k => `${k}:${(state.widgetPhotos[k]||'').length}`),
        met: state.metrics ? `${state.metrics.cpu}|${state.metrics.ramPct}|${state.metrics.rxKbps}` : null,
        weath: state.weather,
        focus: state.focus,
        ai: state.aiSnapshots,
        todos: state.todos,
        countdown: state.countdown,
        cdEdit: countdownEditOpen,
        qOff: quoteOffset,
        market: state.market,
        localAi: state.localAi,
        disks: state.disks,
        notes: state.agendaNotes,
        pins: (state.pinnedShortcuts || []).length
    });
    if (!force && sig === lastRenderSig) {
        updateLiveClockDom();
        return;
    }
    lastRenderSig = sig;

    const canvas = document.getElementById('canvas');
    const widgets = state.widgets || [];
    canvas.innerHTML = widgets.map(w => {
        const pos = resolveWidgetXY(w);
        const skin = w.skin || 'glass';
        const opStyle = typeof w.opacity === 'number' ? `opacity:${w.opacity.toFixed(2)};` : '';
        return `
            <div class="widget-card w-sz-${escHtml(w.size || 'M')} skin-${escHtml(skin)}"
                 data-wid="${escHtml(w.id)}"
                 style="left:${pos.left}px;top:${pos.top}px;${opStyle}"
                 oncontextmenu="openWidgetInspector(event,'${escHtml(w.id)}')"
                 onpointerdown="startWidgetDrag(event,'${escHtml(w.id)}')">
                <div class="w-edit-bar" onpointerdown="event.stopPropagation()">
                    <div style="display:flex;gap:3px;align-items:center;">
                        <button class="w-ibtn" style="width:22px;height:21px;font-size:10px;font-weight:700;" onclick="cycleSize('${escHtml(w.id)}','${escHtml(w.size||'M')}')" title="Boyut: S/M/L">${escHtml(w.size||'M')}</button>
                        <button class="w-btn" style="height:21px;padding:0 7px;font-size:9.5px;" onclick="openWidgetInspector(event,'${escHtml(w.id)}')" title="Arketip & Stil Denetçisi">${IC.sliders} Stil</button>
                    </div>
                    <div style="display:flex;gap:3px;align-items:center;">
