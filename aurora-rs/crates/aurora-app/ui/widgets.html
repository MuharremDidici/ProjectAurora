function renderWidgets(force) {
    if (!state) return;
    applyTheme(state.theme, state.cornerRadiusPreset, state.ecoModeActive);
    document.body.classList.toggle('edit-mode', Boolean(state.widgetEditMode));

    const sig = JSON.stringify({
        edit: state.widgetEditMode,
        locked: state.widgetsLocked,
        eco: Boolean(state.ecoModeActive),
        theme: state.theme?.id,
        rad: state.cornerRadiusPreset,
        widgets: state.widgets,
        media: state.media ? `${state.media.title}|${state.media.isPlaying}|${Boolean(state.media.artwork)}|${state.media.positionSecs || 0}|${state.media.durationSecs || 0}` : null,
        bat: state.battery,
        bts: state.btDevices,
        audio: state.audio,
        outs: state.audioOutputs,
        sess: state.audioSessions,
        clips: state.clipboard,
        fstats: state.focusStats,
        photos: Object.keys(state.widgetPhotos || {}).map(k => `${k}:${(state.widgetPhotos[k]||'').length}`),
        met: state.metrics ? `${state.metrics.cpu}|${state.metrics.ramPct}|${state.metrics.rxKbps}|${state.metrics.txKbps}` : null,
        weath: state.weather,
        focus: state.focus,
        ai: state.aiSnapshots,
        todos: state.todos,
        countdown: state.countdown,
        cdEdit: countdownEditOpen,
        qOff: quoteOffset,
        market: state.market,
        localAi: state.localAi,
        disks: state.disks,
        notes: state.agendaNotes,
        pins: (state.pinnedShortcuts || []).length
    });
    const ae = document.activeElement;
    const editingInline = ae && (ae.classList?.contains('td-inp') || ae.classList?.contains('note-ta') || ae.classList?.contains('mkt-conv-inp') || ae.classList?.contains('mkt-conv-sel'));
    if (!force && (sig === lastRenderSig || editingInline)) {
        updateLiveClockDom();
        return;
    }
    lastRenderSig = sig;

    const canvas = document.getElementById('canvas');
    const widgets = state.widgets || [];
    canvas.innerHTML = widgets.map(w => {
        const pos = resolveWidgetXY(w);
        const skin = w.skin || 'glass';
        const variant = normalizeVariant(w.kind, w.variant);
        const opStyle = typeof w.opacity === 'number' ? `opacity:${w.opacity.toFixed(2)};` : '';
        return `
            <div class="widget-card w-sz-${escHtml(w.size || 'M')} w-kind-${escHtml(w.kind || 'clock')} w-variant-${escHtml(variant)} skin-${escHtml(skin)}"
                 data-wid="${escHtml(w.id)}"
                 style="left:${pos.left}px;top:${pos.top}px;${opStyle}"
                 oncontextmenu="openWidgetInspector(event,'${escHtml(w.id)}')"
                 onpointerdown="startWidgetDrag(event,'${escHtml(w.id)}')">
                <div class="w-edit-bar" onpointerdown="event.stopPropagation()">
                    <div style="display:flex;gap:3px;align-items:center;">
                        <button class="w-ibtn" style="width:22px;height:21px;font-size:10px;font-weight:700;" onclick="cycleSize('${escHtml(w.id)}','${escHtml(w.size||'M')}')" title="Boyut: S/M/L">${escHtml(w.size||'M')}</button>
                        <button class="w-btn" style="height:21px;padding:0 7px;font-size:9.5px;" onclick="openWidgetInspector(event,'${escHtml(w.id)}')" title="Stil Denetçisi">${IC.sliders} Stil</button>
                    </div>
                    <div style="display:flex;gap:3px;align-items:center;">
                        <button class="w-ibtn ${w.pinnedTop ? 'active' : ''}" style="width:21px;height:21px;" onclick="send('updateDesktopWidget',{id:'${escHtml(w.id)}',pinnedTop:${!w.pinnedTop}})" title="Her Zaman Üstte">${IC.pin}</button>
                        <button class="w-ibtn danger" style="width:21px;height:21px;" onclick="send('removeDesktopWidget',{id:'${escHtml(w.id)}'})" title="Kaldır">${IC.close}</button>
                    </div>
                </div>
                ${buildWidgetInner(w)}
            </div>
        `;
    }).join('');

    if (inspectorWid) renderInspector();
    scheduleHitRects();
}

function updateLiveClockDom() {
    const now = new Date();
    const clk = state?.clock || `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    const [hh, mm] = clk.split(':');
    const ss = String(now.getSeconds()).padStart(2, '0');
    document.querySelectorAll('[data-clock-live]').forEach(el => {
        if (el.querySelector('[data-clock-ss]')) {
            el.firstChild.nodeValue = `${hh}:${mm}`;
        } else {
            el.textContent = `${hh}:${mm}`;
        }
    });
    document.querySelectorAll('[data-clock-hh]').forEach(el => { el.textContent = hh || '00'; });
    document.querySelectorAll('[data-clock-mm]').forEach(el => { el.textContent = mm || '00'; });
    document.querySelectorAll('[data-clock-ss]').forEach(el => { el.textContent = ss; });
    document.querySelectorAll('[data-clock-bar]').forEach(el => { el.style.width = `${((now.getSeconds() / 59) * 100).toFixed(1)}%`; });
    document.querySelectorAll('[id^="dmLed-"]').forEach(el => {
        el.innerHTML = renderDotMatrix5x7Svg(`${hh}:${mm}`, 'var(--accent-1)');
    });
    const hDeg = (((now.getHours() % 12) + now.getMinutes() / 60) * 30).toFixed(1);
    const mDeg = ((now.getMinutes() + now.getSeconds() / 60) * 6).toFixed(1);
    const sDeg = (now.getSeconds() * 6).toFixed(1);
    document.querySelectorAll('[data-chrono-h]').forEach(el => el.setAttribute('transform', `rotate(${hDeg} 50 50)`));
    document.querySelectorAll('[data-chrono-m]').forEach(el => el.setAttribute('transform', `rotate(${mDeg} 50 50)`));
    document.querySelectorAll('[data-chrono-s]').forEach(el => el.setAttribute('transform', `rotate(${sDeg} 50 50)`));
    document.querySelectorAll('[data-chrono-sub-s]').forEach(el => el.setAttribute('transform', `rotate(${sDeg} 50 72)`));
    document.querySelectorAll('[data-world-tz]').forEach(el => {
        const tz = el.getAttribute('data-world-tz');
        if (!tz) return;
        try {
            el.textContent = new Intl.DateTimeFormat('tr-TR', { timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false }).format(now);
        } catch (_) {}
    });

    if (!window.__widgetMediaSeeking && state?.media && Number(state.media.durationSecs) > 0) {
        const dur = Number(state.media.durationSecs);
        const pos = getWidgetLiveMediaPos(state.media);
        const pct = Math.max(0, Math.min(100, (pos / dur) * 100)).toFixed(2) + '%';
        const txt = formatMediaClockTime(pos);
        document.querySelectorAll('[data-live-media-seek]').forEach(row => {
            const p = row.querySelector('[data-live-media-pos]');
            const f = row.querySelector('[data-live-media-fill]');
            const k = row.querySelector('[data-live-media-knob]');
            if (p) p.textContent = txt;
            if (f) f.style.width = pct;
            if (k) k.style.left = pct;
        });
    }
}

function startWidgetDrag(e, id) {
    if (!state?.widgetEditMode || state?.widgetsLocked || e.button !== 0) return;
    if (e.target.closest('button, input, textarea, select, .w-edit-bar')) return;
    closeWidgetInspector();
    const el = e.currentTarget;
    const r = el.getBoundingClientRect();
    dragCtx = { id, el, offX: e.clientX - r.left, offY: e.clientY - r.top, curX: r.left, curY: r.top };
    el.classList.add('dragging');
    el.setPointerCapture?.(e.pointerId);
}

document.addEventListener('pointerdown', e => {
    if (inspectorWid && !e.target.closest('#widgetInspector')) {
        closeWidgetInspector();
    }
});

document.addEventListener('pointermove', e => {
    if (!dragCtx) return;
    const rawX = e.clientX - dragCtx.offX;
    const rawY = e.clientY - dragCtx.offY;
    const snapX = Math.max(12, Math.min(window.innerWidth - dragCtx.el.offsetWidth - 12, Math.round(rawX / 16) * 16));
    const snapY = Math.max(12, Math.min(window.innerHeight - dragCtx.el.offsetHeight - 12, Math.round(rawY / 16) * 16));
    dragCtx.curX = snapX;
    dragCtx.curY = snapY;
    dragCtx.el.style.left = snapX + 'px';
    dragCtx.el.style.top = snapY + 'px';
});

function finishWidgetDrag() {
    if (!dragCtx) return;
    const d = dragCtx;
    dragCtx = null;
    d.el.classList.remove('dragging');
    const vw = window.innerWidth || 1920;
    const saveX = (d.curX > vw * 0.55) ? (d.curX - vw) : d.curX;
    send('updateDesktopWidget', { id: d.id, x: Math.round(saveX), y: Math.round(d.curY) });
    scheduleHitRects();
}
document.addEventListener('pointerup', finishWidgetDrag);
document.addEventListener('pointercancel', finishWidgetDrag);

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        if (inspectorWid) closeWidgetInspector();
        else if (state?.widgetEditMode) send('setWidgetEditMode', { active: false });
    }
});

window.addEventListener('resize', () => { renderWidgets(true); scheduleHitRects(); });

if (typeof ResizeObserver !== 'undefined') {
    const ro = new ResizeObserver(scheduleHitRects);
    ro.observe(document.documentElement);
    const cv = document.getElementById('canvas');
    if (cv) ro.observe(cv);
}

window.chrome.webview.addEventListener('message', e => {
    const msg = e.data;
    if (msg.type === 'state') {
        state = msg.payload;
        if (state?.iconCacheDelta) ingestIconCacheDelta(state.iconCacheDelta);
        if (Array.isArray(state?.pinnedShortcuts)) state.pinnedShortcuts.forEach(resolveItemIcon);
        renderWidgets(false);
    } else if (msg.type === 'clockTick') {
        if (state && msg.clock) {
            state.clock = msg.clock;
            updateLiveClockDom();
        }
    } else if (msg.type === 'widgetVisibility') {
        document.body.classList.toggle('widgets-paused', Boolean(msg.paused));
    } else if (msg.type === 'syncLayout') {
        renderWidgets(true);
        scheduleHitRects();
    }
});

function signalUiReady() {
    if (!state) ICON_CACHE.clear();
    try { window.chrome.webview.postMessage({ type: 'uiReady' }); } catch (_) {}
}
signalUiReady();
const _wRetry = setInterval(() => {
    if (state) { clearInterval(_wRetry); return; }
    signalUiReady();
}, 450);
</script>
