function renderForecastStripHtml(wt, now) {
    const live = Boolean(wt?.live);
    const baseTemp = live ? Math.round(wt.temp) : 20;
    const city = wt?.city || 'İstanbul';
    const sum = wt?.summary || (live ? 'Açık' : 'Veri bekleniyor');
    const customSlots = Array.isArray(wt?.forecast) && wt.forecast.length ? wt.forecast.slice(0, 4) : null;
    const slots = customSlots || [0, 3, 6, 9].map((offsetH, idx) => {
        const h = (now.getHours() + offsetH) % 24;
        const delta = idx === 0 ? 0 : (h >= 12 && h <= 16 ? 2 : (h >= 21 || h < 6 ? -3 : -1));
        const label = idx === 0 ? 'Şimdi' : `${String(h).padStart(2, '0')}:00`;
        const isNightSlot = h >= 20 || h < 6;
        const slotSum = isNightSlot && !/yağmur|kar|bulut/i.test(sum) ? 'Açık Gece' : sum;
        return { label, temp: baseTemp + delta, summary: slotSum, isNight: isNightSlot };
    });
    return `
        <div class="w-head">
            <span class="w-title">${IC.sun} Hava Tahmin Şeridi</span>
            <span class="w-badge">${escHtml(city)} · ${live ? baseTemp + '°' : '--°'}</span>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px;">
            <div>
                <div class="num" style="font-size:28px;font-weight:800;line-height:1;">${live ? baseTemp + '°' : '--°'}</div>
                <div class="w-sub" style="margin-top:2px;">${escHtml(sum)}</div>
            </div>
            <div style="width:42px;height:42px;">${weatherIllustrationSvg(sum, now.getHours() >= 20 || now.getHours() < 6).replace('class="weath-svg"', 'width="42" height="42"')}</div>
        </div>
        <div class="forecast-strip-grid">
            ${slots.map(s => `
                <div class="forecast-slot">
                    <span class="num w-sub" style="font-size:9.5px;font-weight:700;">${escHtml(s.label)}</span>
                    <span style="width:22px;height:22px;display:inline-flex;">${weatherIllustrationSvg(s.summary || sum, Boolean(s.isNight)).replace('class="weath-svg"', 'width="22" height="22"')}</span>
                    <span class="num" style="font-size:12.5px;font-weight:800;">${live ? Math.round(s.temp) + '°' : '--°'}</span>
                </div>
            `).join('')}
        </div>
    `;
}

function computeMarketConversion(mk) {
    const amt = parseFloat(String(marketConvState.amount || '0').replace(',', '.'));
    if (!isFinite(amt) || amt < 0) return '--';
    const usd = Number(mk?.usdTry) || 0;
    const eur = Number(mk?.eurTry) || 0;
    const btc = Number(mk?.btcUsd) || 0;
    const pair = marketConvState.pair || 'usd-try';
    if (pair === 'usd-try' && usd > 0) return (amt * usd).toFixed(2) + ' ₺';
    if (pair === 'eur-try' && eur > 0) return (amt * eur).toFixed(2) + ' ₺';
    if (pair === 'try-usd' && usd > 0) return '$' + (amt / usd).toFixed(2);
    if (pair === 'try-eur' && eur > 0) return '€' + (amt / eur).toFixed(2);
    if (pair === 'btc-usd' && btc > 0) return '$' + Math.round(amt * btc).toLocaleString('tr-TR');
    return '--';
}

function updateMarketConvPreview(wid) {
    const amtEl = document.getElementById('mktAmt-' + wid);
    const pairEl = document.getElementById('mktPair-' + wid);
    const outEl = document.getElementById('mktOut-' + wid);
    if (amtEl) marketConvState.amount = amtEl.value;
    if (pairEl) marketConvState.pair = pairEl.value;
    if (outEl) outEl.textContent = computeMarketConversion(state?.market);
}

function formatMediaClockTime(secs) {
    const s = Math.max(0, Math.floor(Number(secs) || 0));
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const r = s % 60;
    if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(r).padStart(2, '0')}`;
    return `${m}:${String(r).padStart(2, '0')}`;
}
function getWidgetLiveMediaPos(m) {
    if (!m) return 0;
    const dur = Math.max(0, Number(m.durationSecs) || 0);
    let pos = Math.max(0, Number(m.positionSecs) || 0);
    if (m.isPlaying && Number(m.timelineUpdatedMs) > 0) {
        pos = Math.floor(pos + Math.max(0, (Date.now() - Number(m.timelineUpdatedMs)) / 1000));
    }
    return dur > 0 ? Math.min(dur, pos) : pos;
}

function renderMediaSeekBarHtml(m, extraCls = '') {
    const dur = Math.max(0, Number(m?.durationSecs) || 0);
    if (dur <= 0) return '';
    const pos = getWidgetLiveMediaPos(m);
    const pct = Math.max(0, Math.min(100, (pos / dur) * 100));
    return `
        <div class="w-seek-row ${extraCls}" data-live-media-seek="1" data-dur="${dur}" onpointerdown="event.stopPropagation()">
            <span class="w-seek-time num" data-live-media-pos>${formatMediaClockTime(pos)}</span>
            <div class="w-seek-track" onpointerdown="startWidgetMediaSeek(event,this,${dur})" title="Sarıcı: Tıkla veya Sürükle">
                <div class="w-seek-rail">
                    <div class="w-seek-fill" data-live-media-fill style="width:${pct.toFixed(2)}%;"></div>
                    <span class="w-seek-knob" data-live-media-knob style="left:${pct.toFixed(2)}%;"></span>
                </div>
            </div>
            <span class="w-seek-time end num">${formatMediaClockTime(dur)}</span>
        </div>
    `;
}

window.startWidgetMediaSeek = function(e, trackEl, durSecs) {
    if (e.button !== 0) return;
    e.preventDefault();
    e.stopPropagation();
    const dur = Math.max(1, Number(durSecs) || 0);
    const row = trackEl.closest('[data-live-media-seek]');
    const posEl = row?.querySelector('[data-live-media-pos]');
    const fillEl = row?.querySelector('[data-live-media-fill]');
    const knobEl = row?.querySelector('[data-live-media-knob]');
    window.__widgetMediaSeeking = true;
    let lastSec = 0;
    const applyX = (clientX) => {
        const rect = trackEl.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / Math.max(1, rect.width)));
        lastSec = Math.round(ratio * dur);
        const pct = (ratio * 100).toFixed(2) + '%';
        if (fillEl) fillEl.style.width = pct;
        if (knobEl) knobEl.style.left = pct;
        if (posEl) posEl.textContent = formatMediaClockTime(lastSec);
    };
    applyX(e.clientX);
    const onMove = (mv) => applyX(mv.clientX);
    const onUp = (up) => {
        applyX(up.clientX);
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        window.removeEventListener('pointercancel', onUp);
        window.__widgetMediaSeeking = false;
        if (state.media) {
            state.media.positionSecs = lastSec;
            state.media.timelineUpdatedMs = Date.now();
        }
        send('mediaSeek', { positionSecs: lastSec });
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
};

function buildWidgetInner(w) {
    const variant = normalizeVariant(w.kind, w.variant);
    const now = new Date();
    const days = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
    const months = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
    const fullDateTr = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]}`;
    const clk = state.clock || `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    const parts = clk.split(':');
    const hh = parts[0] || String(now.getHours()).padStart(2,'0');
    const mm = parts[1] || String(now.getMinutes()).padStart(2,'0');
    const ss = String(now.getSeconds()).padStart(2,'0');
    const secPct = ((now.getSeconds() / 59) * 100).toFixed(1);
    const weathLine = state.weather?.live ? `${Math.round(state.weather.temp)}° · ${escHtml(state.weather.city || '')}` : '';

    /* 0. DAILY BRIEF (GÜNLÜK ÖZET) */
    if (w.kind === 'daily-brief') {
        const hr = now.getHours();
        const greeting = (hr >= 5 && hr < 12) ? 'Günaydın' : (hr >= 12 && hr < 18 ? 'İyi Günler' : 'İyi Akşamlar');
        const wt = state.weather || {};
        const wtLive = Boolean(wt.live);
        const wtIcon = weatherIllustrationSvg(wt.summary || '', hr >= 20 || hr < 6).replace('class="weath-svg"', 'width="16" height="16"');
        const wtText = wtLive ? `${Math.round(wt.temp)}° · ${wt.city || 'Hava'}` : 'Hava bekleniyor';
        const todos = state.todos || [];
        const pendingTodos = todos.filter(t => !t.done);
        const topTasks = (pendingTodos.length > 0 ? pendingTodos : todos).slice(0, 2);
        const f = state.focus || { running: false, label: '25:00' };
        const focusBadge = f.running ? `Odak Aktif · ${f.label || '25:00'}` : `Odak Hazır · ${f.label || '25:00'}`;
        return `
            <div class="db-top">
                <div style="min-width:0;">
                    <div class="w-title" style="margin-bottom:4px;">${IC.brief} Günlük Özet</div>
                    <div class="db-greet">${greeting}</div>
                    <div class="db-date">${escHtml(fullDateTr)} · <span class="num" data-clock-live>${escHtml(hh)}:${escHtml(mm)}</span></div>
                </div>
                <span class="w-badge num">${pendingTodos.length > 0 ? `${pendingTodos.length} görev` : (todos.length > 0 ? 'Tamamlandı' : 'Boş liste')}</span>
            </div>
            <div class="db-chips">
                <div class="db-chip">
                    <span style="display:inline-flex;width:16px;height:16px;flex-shrink:0;">${wtIcon}</span>
                    <span>${escHtml(wtText)}</span>
                </div>
                <div class="db-chip ${f.running ? 'focus-on' : ''}">
                    <span style="display:inline-flex;width:13px;height:13px;flex-shrink:0;color:${f.running ? 'currentColor' : 'var(--accent-1)'};">${IC.timer}</span>
                    <span class="num">${escHtml(focusBadge)}</span>
                </div>
            </div>
            ${variant !== 'compact' ? `
                <div class="db-tasks" onpointerdown="event.stopPropagation()">
                    ${topTasks.length === 0
                        ? `<div class="w-sub" style="padding:4px 2px;">Bugün için bekleyen görev yok.</div>`
                        : topTasks.map(t => `
                            <div class="db-task" onclick="send('toggleTodo',{id:'${escHtml(t.id)}'})">
                                <span class="td-chk ${t.done ? 'done' : ''}">${t.done ? IC.check.replace('<svg ','<svg width="10" height="10" ') : ''}</span>
                                <span class="td-txt ${t.done ? 'done' : ''}">${escHtml(t.text)}</span>
                            </div>
                        `).join('')}
                </div>
            ` : ''}
            <div class="db-pills" onpointerdown="event.stopPropagation()">
                <button class="db-pill" onclick="send('startScreenOcr')" title="Ekrandan Metin Tara (OCR)">${IC.scanText}<span>OCR</span></button>
                <button class="db-pill" onclick="send('startColorPicker')" title="Ekrandan Renk Seç">${IC.pipette}<span>Renk</span></button>
                <button class="db-pill ${f.running ? 'active' : ''}" onclick="send('toggleFocus')" title="Odak Zamanlayıcıyı Başlat/Duraklat">${IC.timer}<span>Odak</span></button>
            </div>
        `;
    }

    if (w.kind === 'world-clock') {
        return renderWorldClockHtml(now, variant === 'compact');
    }

    /* 1. CLOCK WIDGETS */
    if (w.kind === 'clock') {
        if (variant === 'world-clock') {
            return renderWorldClockHtml(now, false);
        }
        if (variant === 'dot-matrix') {
            const lit = Math.max(1, Math.round(((now.getHours() * 60 + now.getMinutes()) / 1440) * 18));
            const strip = Array.from({ length: 18 }, (_, i) => `<span class="${i < lit ? 'on' : ''}"></span>`).join('');
            return `
                <div class="w-head"><span class="w-title">${IC.clock} DOT-MATRIX LED</span><span class="mono w-sub" data-clock-ss>${ss}s</span></div>
                <div class="dm-box">
                    <div id="dmLed-${escHtml(w.id)}">${renderDotMatrix5x7Svg(`${hh}:${mm}`, 'var(--accent-1)')}</div>
                    <div class="dm-dots">${strip}</div>
                </div>
                <div class="clk-meta-row" style="margin-top:8px;"><span class="mono">${escHtml(fullDateTr)}</span><span class="mono">${weathLine}</span></div>
            `;
        }
        if (variant === 'solar') {
            const hrs = now.getHours() + now.getMinutes() / 60;
            const dayFrac = Math.max(0, Math.min(1, (hrs - 6) / 14));
            const isDay = hrs >= 6 && hrs <= 20;
            const ang = Math.PI * (1 - dayFrac);
            const sx = (90 + 68 * Math.cos(ang)).toFixed(1);
            const sy = (44 - 30 * Math.sin(ang)).toFixed(1);
            return `
                <div class="w-head"><span class="w-title">${isDay ? IC.sun : IC.moon} Güneş Yörüngesi</span><span class="num w-sub">${escHtml(weathLine || fullDateTr)}</span></div>
                <div style="display:flex;align-items:center;gap:12px;">
                    <div style="font-size:38px;font-weight:800;letter-spacing:-0.04em;line-height:1;" class="num" data-clock-live>${escHtml(hh)}:${escHtml(mm)}</div>
                    <svg viewBox="0 0 180 54" style="flex:1;height:48px;">
                        <line x1="14" y1="44" x2="166" y2="44" stroke="currentColor" stroke-opacity="0.18" stroke-dasharray="3 3"/>
                        <path d="M 22 44 A 68 30 0 0 1 158 44" fill="none" stroke="var(--accent-1)" stroke-opacity="0.35" stroke-width="1.6"/>
                        <circle cx="${sx}" cy="${sy}" r="6" fill="${isDay ? '#FBBF24' : '#818CF8'}"/>
                    </svg>
                </div>
                <div class="w-sub" style="margin-top:4px;">${escHtml(fullDateTr)}</div>
            `;
        }
        if (variant === 'orbital') {
            const hp = ((now.getHours() % 12) / 12) * 100;
            const mp = (now.getMinutes() / 60) * 100;
            const sp = (now.getSeconds() / 60) * 100;
            const ring = (r, p, col) => {
                const c = 2 * Math.PI * r;
                return `<circle cx="44" cy="44" r="${r}" fill="none" stroke="${col}" stroke-opacity="0.16" stroke-width="4.5"/><circle cx="44" cy="44" r="${r}" fill="none" stroke="${col}" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-p/100)).toFixed(1)}" transform="rotate(-90 44 44)"/>`;
            };
            return `
                <div style="display:flex;align-items:center;gap:14px;">
                    <svg viewBox="0 0 88 88" width="84" height="84" style="flex-shrink:0;">
                        ${ring(38, hp, 'var(--accent-1)')}
                        ${ring(29, mp, 'var(--accent-2)')}
                        ${ring(20, sp, '#34D399')}
                    </svg>
                    <div style="flex:1;min-width:0;">
                        <div class="w-title" style="margin-bottom:4px;">Orbital</div>
                        <div class="num" style="font-size:30px;font-weight:800;line-height:1;" data-clock-live>${escHtml(hh)}:${escHtml(mm)}<span style="font-size:13px;color:var(--accent-1);margin-left:4px;" data-clock-ss>${ss}</span></div>
                        <div class="w-sub" style="margin-top:4px;">${escHtml(fullDateTr)}</div>
                    </div>
                </div>
            `;
        }
        if (variant === 'editorial-hero') {
            return `
                <div class="clk-ed-hero">
                    <div class="clk-ed-rail"></div>
                    <div style="flex:1;min-width:0;">
                        <div style="display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:0.13em;text-transform:uppercase;color:var(--text-2);font-weight:700;margin-bottom:6px;">
                            <span>${escHtml(days[now.getDay()])}</span>
                            <span class="mono" data-clock-ss>${ss}</span>
                        </div>
                        <div class="clk-ed-time num"><strong data-clock-hh>${escHtml(hh)}</strong>:<span data-clock-mm>${escHtml(mm)}</span></div>
                        <div class="clk-ed-meta">
                            <span style="font-weight:700;color:var(--accent-1);">${now.getDate()} ${escHtml(months[now.getMonth()])}</span>
                            ${weathLine ? `<span class="w-sub">· ${weathLine}</span>` : ''}
                        </div>
                    </div>
                </div>
            `;
        }
        if (variant === 'dev-hex') {
            const epoch = Math.floor(now.getTime() / 1000);
            const hNum = now.getHours();
            const bits = Array.from({ length: 6 }, (_, i) => (hNum >> (5 - i)) & 1);
            return `
                <div class="w-head"><span class="w-title">${IC.cpu} DEV TELEMETRY</span><span class="mono w-sub">0x${epoch.toString(16).toUpperCase()}</span></div>
                <div class="mono" style="font-size:36px;font-weight:800;letter-spacing:-0.03em;line-height:1;" data-clock-live>${escHtml(hh)}:${escHtml(mm)}:${ss}</div>
                <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:8px;border-top:1px solid var(--border-subtle);">
                    <span class="mono w-sub">UNIX ${epoch}</span>
                    <span style="display:inline-flex;gap:4px;" title="Binary Saat">${bits.map(b => `<span style="width:7px;height:7px;border-radius:50%;background:${b ? 'var(--accent-1)' : 'var(--border-rim)'};"></span>`).join('')}</span>
                </div>
            `;
        }
        if (variant === 'split-flap') {
            return `
                <div class="w-head"><span class="w-title">${IC.clock} Split-Flap</span><span class="w-sub">${escHtml(state.shortDate || '')}</span></div>
                <div class="flip-stage">
                    <div class="flip-tile num"><span class="flip-rivet-l"></span><span data-clock-hh>${escHtml(hh)}</span><span class="flip-rivet-r"></span></div>
                    <div class="flip-colon"><span></span><span></span></div>
                    <div class="flip-tile num"><span class="flip-rivet-l"></span><span data-clock-mm>${escHtml(mm)}</span><span class="flip-rivet-r"></span></div>
                </div>
                <div class="clk-meta-row"><span>${escHtml(fullDateTr)}</span><span class="num">${weathLine}</span></div>
            `;
        }
        if (variant === 'swiss-chrono') {
            return `
                <div class="chrono-wrap">
                    ${buildChronographSvg(now)}
                    <div style="flex:1;min-width:0;">
                        <div class="w-title" style="margin-bottom:4px;">Swiss Horology</div>
                        <div style="font-size:28px;font-weight:800;letter-spacing:-0.03em;line-height:1;" class="num" data-clock-live>${escHtml(hh)}:${escHtml(mm)}</div>
                        <div class="w-sub" style="margin-top:5px;">${escHtml(fullDateTr)}</div>
                        ${weathLine ? `<div class="w-sub" style="margin-top:4px;color:var(--braun-accent, var(--accent-1));font-weight:600;">${weathLine}</div>` : ''}
                    </div>
                </div>
            `;
        }
        if (variant === 'word') {
            const words = turkishTimeWords(now.getHours(), now.getMinutes());
            return `
                <div class="w-head"><span class="w-title">${IC.clock} Zaman</span><span class="num w-sub" data-clock-live>${escHtml(hh)}:${escHtml(mm)}</span></div>
                <div class="word-clk-main">${escHtml(words.hLine)}</div>
                <div class="word-clk-min">${escHtml(words.mLine)}</div>
                <div class="w-sub" style="margin-top:10px;">${escHtml(fullDateTr)}</div>
            `;
        }
        // Swiss Giant
        return `
            <div class="clk-swiss-row num">
                <span class="clk-swiss-hh" data-clock-hh>${escHtml(hh)}</span>
                <span class="clk-swiss-sep">:</span>
                <span class="clk-swiss-mm" data-clock-mm>${escHtml(mm)}</span>
                <span class="clk-swiss-ss" data-clock-ss>${ss}</span>
            </div>
            <div class="clk-sec-track"><div class="clk-sec-fill" data-clock-bar style="width:${secPct}%"></div></div>
            <div class="clk-meta-row">
                <span>${escHtml(fullDateTr)}</span>
                <span class="num" style="font-weight:600;color:var(--text-1);">${weathLine}</span>
            </div>
        `;
    }

    /* 2. MEDIA PLAYER */
    if (w.kind === 'media' || w.kind === 'studio-strip') {
        const m = state.media;
        const playing = Boolean(m?.isPlaying);
        const title = m?.title || 'Çalan Medya Yok';
        const artist = m?.artist || (m?.app || 'Spotify · Tarayıcı · Medya');
        const artSrc = m?.artwork ? `data:image/jpeg;base64,${m.artwork}` : null;
        const vol = Math.max(0, Math.min(100, Math.round(state.audio?.volume ?? 50)));
        const muted = Boolean(state.audio?.muted);
        const seekBar = renderMediaSeekBarHtml(m);
        const ctrls = `
            <div class="med-ctrls" onpointerdown="event.stopPropagation()">
                <button class="w-ibtn" onclick="send('mediaCmd',{cmd:'prev'})" title="Önceki">${IC.prev}</button>
                <button class="w-btn primary" style="height:26px;padding:0 12px;" onclick="send('mediaCmd',{cmd:'play_pause'})" title="${playing ? 'Duraklat' : 'Oynat'}">${playing ? IC.pause : IC.play}</button>
                <button class="w-ibtn" onclick="send('mediaCmd',{cmd:'next'})" title="Sonraki">${IC.next}</button>
                <div class="eq-bars ${playing ? 'play' : ''}" style="margin-left:auto;"><i></i><i></i><i></i><i></i></div>
            </div>
        `;
        if (w.kind === 'studio-strip' || variant === 'studio-strip') {
            return `
                <div class="med-strip-row">
                    <div class="med-art" style="width:40px;height:40px;border-radius:10px;flex-shrink:0;">${artSrc ? `<img src="${artSrc}"/>` : `<span style="width:16px;height:16px;color:var(--accent-1);">${IC.music}</span>`}</div>
                    <div class="med-strip-meta">
                        <div class="med-title" style="font-size:12.5px;line-height:1.2;">${escHtml(title)}</div>
                        <div class="med-artist" style="font-size:10.5px;margin-top:2px;">${escHtml(artist)}</div>
                    </div>
                    <div style="flex:1;min-width:105px;">
                        ${seekBar || `<div class="eq-bars ${playing ? 'play' : ''}" style="margin:0 auto;"><i></i><i></i><i></i><i></i></div>`}
                    </div>
                    <div class="med-strip-ctrls" onpointerdown="event.stopPropagation()">
                        <button class="w-ms-btn" onclick="send('mediaCmd',{cmd:'prev'})" title="Önceki">${IC.prev}</button>
                        <button class="w-ms-btn box" onclick="send('mediaCmd',{cmd:'play_pause'})" title="${playing ? 'Duraklat' : 'Oynat'}">${playing ? IC.pause : IC.play}</button>
                        <button class="w-ms-btn" onclick="send('mediaCmd',{cmd:'next'})" title="Sonraki">${IC.next}</button>
                    </div>
                    <div class="med-strip-ctrls med-vol-pill num" style="gap:4px;font-size:11px;font-weight:700;cursor:pointer;padding:3px 7px;border-radius:8px;background:var(--bg-card);border:1px solid var(--border-subtle);" onpointerdown="event.stopPropagation()" onclick="send('toggleMute')" onauxclick="if(event.button===1){event.stopPropagation();send('cycleAudioOutput');}" title="Ses %${vol} · Tıkla: Sessiz">
                        <span style="width:13px;height:13px;display:inline-flex;opacity:0.88;${muted ? 'color:var(--danger);' : ''}">${muted ? IC.mute : IC.vol}</span>
                        <span>%${muted ? 0 : vol}</span>
                    </div>
                </div>
            `;
        }
        if (variant === 'turntable') {
            return `
                <div class="w-head"><span class="w-title">${IC.music} Pikap Stüdyo</span><span class="w-sub">${playing ? 'Çalıyor' : 'Hazır'}</span></div>
                <div class="med-row">
                    <div class="tt-stage">
                        <div class="tt-disc ${playing ? 'spin' : ''}">
                            ${artSrc ? `<img src="${artSrc}"/>` : `<span style="width:20px;height:20px;color:var(--accent-1);">${IC.music}</span>`}
                            <span class="tt-spindle"></span>
                        </div>
                        <svg class="tt-arm ${playing ? 'engaged' : ''}" viewBox="0 0 24 58" fill="none">
                            <circle cx="15" cy="8" r="5" fill="#94A3B8" stroke="#1E293B" stroke-width="1.5"/>
                            <path d="M15 11 L13 42 L7 50" stroke="#CBD5E1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                            <rect x="4" y="48" width="6" height="4" rx="1" transform="rotate(-35 4 48)" fill="var(--braun-accent, var(--accent-1))"/>
                        </svg>
                    </div>
                    <div style="flex:1;min-width:0;">
                        <div class="med-title">${escHtml(title)}</div>
                        <div class="med-artist">${escHtml(artist)}</div>
                        ${seekBar}
                        ${ctrls}
                    </div>
                </div>
            `;
        }
        if (variant === 'poster') {
            return `
                <div class="med-poster-card">
                    ${artSrc ? `<div class="med-poster-bg" style="background-image:url('${artSrc}');"></div>` : ''}
                    <div class="med-poster-scrim"></div>
                    <div class="med-poster-fg">
                        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
                            <span style="font-size:9.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;opacity:0.84;">${escHtml(m?.app || 'MEDYA')}</span>
                            <div class="eq-bars ${playing ? 'play' : ''}"><i></i><i></i><i></i><i></i></div>
                        </div>
                        <div class="med-title" style="font-size:15px;">${escHtml(title)}</div>
                        <div class="med-artist" style="color:rgba(255,255,255,0.78);">${escHtml(artist)}</div>
                        ${seekBar}
                        <div class="med-ctrls" style="margin-top:8px;" onpointerdown="event.stopPropagation()">
                            <button class="w-ibtn" style="background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.22);color:#FFF;" onclick="send('mediaCmd',{cmd:'prev'})">${IC.prev}</button>
                            <button class="w-btn primary" style="height:26px;padding:0 13px;" onclick="send('mediaCmd',{cmd:'play_pause'})">${playing ? IC.pause : IC.play}</button>
                            <button class="w-ibtn" style="background:rgba(255,255,255,0.14);border-color:rgba(255,255,255,0.22);color:#FFF;" onclick="send('mediaCmd',{cmd:'next'})">${IC.next}</button>
                        </div>
                    </div>
                </div>
            `;
        }
        if (variant === 'tp7') {
            return `
                <div class="w-head"><span class="w-title">${IC.music} TE TP-7 STUDIO</span><span class="mono w-sub" style="color:#EA580C;">${playing ? 'REC/PLAY' : 'STANDBY'}</span></div>
                <div class="tp7-wrap">
                    <div class="tp7-platter ${playing ? 'spin' : ''}">
                        <span class="tp7-notch"></span>
                        <div class="tp7-center"></div>
                    </div>
                    <div style="flex:1;min-width:0;">
                        <div class="tp7-oled">
                            <div class="med-title mono" style="font-size:11.5px;color:#FFF;">${escHtml(title)}</div>
                            <div class="med-artist mono" style="font-size:9.5px;color:#94A3B8;">${escHtml(artist)}</div>
                        </div>
                        ${seekBar}
                        ${ctrls}
                    </div>
                </div>
            `;
        }
        if (variant === 'cassette') {
            const reelSvg = `<svg class="deck-reel ${playing ? 'spin' : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/><path d="M12 3v6M4.2 16.5l5.2-3M19.8 16.5l-5.2-3"/></svg>`;
            return `
                <div class="w-head"><span class="w-title">${IC.music} Kaset Deck</span><span class="mono w-sub">${playing ? 'PLAY' : 'STOP'}</span></div>
                <div class="cassette-shell">
                    <div class="deck-window" style="margin-bottom:5px;">
                        ${reelSvg}
                        <div style="flex:1;min-width:0;text-align:center;">
                            <div class="med-title" style="font-size:12px;">${escHtml(title)}</div>
                            <div class="med-artist" style="font-size:10px;">${escHtml(artist)}</div>
                        </div>
                        ${reelSvg}
                    </div>
                    ${seekBar || `<div style="height:3px;border-radius:99px;background:rgba(255,255,255,0.1);overflow:hidden;"><div style="width:${playing ? '64%' : '20%'};height:100%;background:var(--accent-1);"></div></div>`}
                </div>
                ${ctrls}
            `;
        }
        if (variant === 'waveform') {
            const fakeWave = playing ? [25, 58, 42, 84, 65, 92, 48, 76, 38, 62, 74, 40] : [18, 20, 18, 22, 19, 21, 18, 20, 19, 18, 20, 18];
            return `
                <div class="w-head"><span class="w-title">${IC.music} Ses Dalgası</span><span class="w-sub">${escHtml(m?.app || 'Medya')}</span></div>
                <div class="med-title">${escHtml(title)}</div>
                <div class="med-artist" style="margin-bottom:6px;">${escHtml(artist)}</div>
                ${renderOscilloscopeSvg(fakeWave, 'var(--accent-1)', 260, 34, w.id + 'mw')}
                ${seekBar}
                ${ctrls}
            `;
        }
        if (variant === 'minimal') {
            return `
                <div class="med-row">
                    <div class="med-art" style="width:44px;height:44px;border-radius:10px;">${artSrc ? `<img src="${artSrc}"/>` : `<span style="width:18px;height:18px;color:var(--accent-1);">${IC.music}</span>`}</div>
                    <div style="flex:1;min-width:0;">
                        <div class="med-title" style="font-size:12.5px;">${escHtml(title)}</div>
                        <div class="med-artist" style="font-size:10.5px;">${escHtml(artist)}</div>
                    </div>
                    <div style="display:flex;gap:4px;" onpointerdown="event.stopPropagation()">
                        <button class="w-ibtn" onclick="send('mediaCmd',{cmd:'play_pause'})">${playing ? IC.pause : IC.play}</button>
                        <button class="w-ibtn" onclick="send('mediaCmd',{cmd:'next'})">${IC.next}</button>
                    </div>
                </div>
            `;
        }
        // Ambient Studio Card
        return `
            ${artSrc ? `<div class="med-ambient-bg" style="background-image:url('${artSrc}');"></div>` : ''}
            <div class="med-fg">
                <div class="w-head"><span class="w-title">${IC.music} Medya Stüdyo</span><span class="w-sub">${escHtml(m?.app || (playing ? 'Çalıyor' : 'Beklemede'))}</span></div>
                <div class="med-row">
                    <div class="med-art">${artSrc ? `<img src="${artSrc}"/>` : `<span style="width:24px;height:24px;color:var(--accent-1);">${IC.music}</span>`}</div>
                    <div style="flex:1;min-width:0;">
                        <div class="med-title">${escHtml(title)}</div>
                        <div class="med-artist">${escHtml(artist)}</div>
                        ${seekBar}
                        ${ctrls}
                    </div>
                </div>
            </div>
        `;
    }

    /* 3. WEATHER (ATMOSPHERIC + FORECAST STRIP + MINIMAL STUDIO) */
    if (w.kind === 'forecast-strip' || (w.kind === 'weather' && variant === 'forecast-strip')) {
        return renderForecastStripHtml(state.weather, now);
    }
    if (w.kind === 'weather') {
        const wt = state.weather || {};
        const tempNum = wt.live ? Math.round(wt.temp) : null;
        const temp = tempNum !== null ? `${tempNum}°` : '--°';
        const city = wt.city || 'Konum Bekleniyor';
        const sum = wt.summary || 'Veri yenileniyor';
        const hr = now.getHours();
        const isNight = hr < 6 || hr >= 20;
        if (variant === 'atmospheric') {
            const isRain = /(yağmur|sağanak|rain|storm|fırtına)/i.test(sum);
            const isSnow = /(kar|snow)/i.test(sum);
            const skyCls = isRain ? 'sky-rain' : (isSnow ? 'sky-snow' : (hr >= 18 && hr < 21 ? 'sky-sunset' : (!isNight ? 'sky-day' : 'sky-night')));
            const feelsVal = wt.feelsLikeC != null ? `${Math.round(wt.feelsLikeC)}°` : (wt.feelsLike != null ? `${Math.round(wt.feelsLike)}°` : temp);
            const windVal = wt.windKmh != null ? `${Math.round(wt.windKmh)} km/s` : (wt.wind != null ? `${escHtml(wt.wind)}` : (isRain ? '18 km/s' : '9 km/s'));
            const humVal = wt.humidity != null ? `%${Math.round(wt.humidity)}` : (isRain ? '%78' : '%52');
            return `
                <div class="weath-sky-card ${skyCls}">
                    <div style="display:flex;justify-content:space-between;align-items:center;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;opacity:0.9;">
                        <span>${escHtml(city)}</span><span>${wt.live ? 'CANLI' : 'HAVA'}</span>
                    </div>
                    <div class="weath-hero" style="margin-top:8px;">
                        <div>
                            <div class="weath-temp num">${temp}</div>
                            <div style="font-size:12.5px;font-weight:600;opacity:0.94;margin-top:4px;">${escHtml(sum)}</div>
                        </div>
                        ${weatherIllustrationSvg(sum, isNight)}
                    </div>
                    <div class="weath-atmo-pills">
                        <span class="weath-atmo-pill">${IC.thermo}<span class="num">His ${feelsVal}</span></span>
                        <span class="weath-atmo-pill">${IC.wind}<span class="num">${windVal}</span></span>
                        <span class="weath-atmo-pill">${IC.drop}<span class="num">${humVal}</span></span>
                    </div>
                </div>
            `;
        }
        if (variant === 'barometer') {
            const tNum = tempNum !== null ? tempNum : 20;
            const norm = Math.max(0, Math.min(1, (tNum + 10) / 55));
            const ang = -125 + norm * 250;
            return `
                <div class="w-head"><span class="w-title">${IC.sun} Barometre</span><span class="w-sub">${escHtml(city)}</span></div>
                <div style="display:flex;align-items:center;gap:14px;">
                    <svg viewBox="0 0 80 80" width="76" height="76" style="flex-shrink:0;">
                        <circle cx="40" cy="40" r="34" fill="none" stroke="var(--border-rim)" stroke-width="3" stroke-dasharray="150 220" stroke-dashoffset="-15" transform="rotate(140 40 40)"/>
                        <line x1="40" y1="44" x2="40" y2="14" stroke="#EA580C" stroke-width="2.4" stroke-linecap="round" transform="rotate(${ang.toFixed(1)} 40 40)"/>
                        <circle cx="40" cy="40" r="3.5" fill="var(--text-1)"/>
                    </svg>
                    <div><div class="weath-temp num" style="font-size:36px;">${temp}</div><div class="w-sub" style="margin-top:3px;">${escHtml(sum)}</div></div>
                </div>
            `;
        }
        if (variant === 'minimal-studio') {
            return `
                <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
                    <div style="display:flex;align-items:center;gap:12px;min-width:0;">
                        <div style="width:44px;height:44px;flex-shrink:0;">${weatherIllustrationSvg(sum, isNight).replace('class="weath-svg"', 'width="44" height="44"')}</div>
                        <div style="min-width:0;">
                            <div style="font-size:32px;font-weight:800;line-height:1;" class="num">${temp}</div>
                            <div class="w-sub" style="margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escHtml(city)} · ${escHtml(sum)}</div>
                        </div>
                    </div>
                    <span class="w-badge">${wt.live ? 'Canlı' : 'Hazır'}</span>
                </div>
            `;
        }
        if (variant === 'telemetry') {
            return `
                <div class="w-head"><span class="w-title">${IC.sun} Hava Telemetri</span><span class="w-badge">${wt.live ? 'Canlı' : 'Çevrimdışı'}</span></div>
                <div class="weath-hero">
                    <div>
                        <div class="weath-temp num">${temp}</div>
                        <div style="font-size:12.5px;font-weight:700;margin-top:3px;">${escHtml(city)}</div>
                    </div>
                    ${weatherIllustrationSvg(sum, isNight)}
                </div>
                <div class="weath-meta-grid">
                    <div class="weath-cell"><div class="w-sub">Durum</div><div style="font-weight:700;margin-top:2px;">${escHtml(sum)}</div></div>
                    <div class="weath-cell"><div class="w-sub">Tarih</div><div style="font-weight:700;margin-top:2px;" class="num">${escHtml(state.shortDate || '')}</div></div>
                </div>
            `;
        }
        return `
            <div class="w-head"><span class="w-title">${IC.sun} Hava Durumu</span><span class="w-sub">${escHtml(city)}</span></div>
            <div class="weath-hero">
                <div>
                    <div class="weath-temp num">${temp}</div>
                    <div style="font-size:12.5px;font-weight:600;color:var(--text-2);margin-top:4px;">${escHtml(sum)}</div>
                </div>
                ${weatherIllustrationSvg(sum, isNight)}
            </div>
        `;
    }

    /* 4. AI QUOTA STUDIO */
    if (w.kind === 'ai-quota') {
        const snaps = state.aiSnapshots || [];
        const colorOf = p => p === 'openai' ? '#10B981' : (p === 'gemini' ? '#38BDF8' : '#F59E0B');
        const emblemOf = p => p === 'openai' ? IC.openai : (p === 'gemini' ? IC.gemini : IC.claude);
        const list = snaps.length > 0 ? snaps : [
            { provider: 'openai', displayName: 'ChatGPT', planName: 'Plus', sourceBadge: 'Sayaç', remainingPercent: 100, primaryLabel: '0 / 80', secondaryLabel: 'Hazır' },
            { provider: 'gemini', displayName: 'Gemini', planName: 'Pro', sourceBadge: 'Sayaç', remainingPercent: 100, primaryLabel: '0 / 100', secondaryLabel: 'Hazır' },
            { provider: 'claude', displayName: 'Claude', planName: 'Pro', sourceBadge: 'Sayaç', remainingPercent: 100, primaryLabel: '0 / 45', secondaryLabel: 'Hazır' }
        ];
        if (variant === 'rings') {
            return `
                <div class="w-head">
                    <span class="w-title">${IC.spark} AI Kota Stüdyosu</span>
                    <button class="w-ibtn" style="width:22px;height:22px;" onpointerdown="event.stopPropagation()" onclick="send('refreshAiQuota')" title="Yenile">${IC.refresh}</button>
                </div>
                <div class="rings-grid">
                    ${list.map(s => buildRingSvg(s.remainingPercent, colorOf(s.provider), s.displayName, emblemOf(s.provider))).join('')}
                </div>
            `;
        }
        return `
            <div class="w-head">
                <span class="w-title">${IC.spark} AI Kota Stüdyosu</span>
                <div style="display:flex;gap:4px;" onpointerdown="event.stopPropagation()">
                    <button class="w-ibtn" style="width:22px;height:22px;" onclick="send('refreshAiQuota')" title="Yenile">${IC.refresh}</button>
                    <button class="w-ibtn" style="width:22px;height:22px;" onclick="send('openSettings',{section:'widgets'})" title="API & Plan Ayarları">${IC.sliders}</button>
                </div>
            </div>
            <div class="ai-list">
                ${list.map(s => {
                    const col = colorOf(s.provider);
                    const pct = Math.max(0, Math.min(100, Number(s.remainingPercent ?? 100)));
                    return `<div class="ai-row">
                        <div class="ai-emblem">${emblemOf(s.provider)}</div>
                        <div style="flex:1;min-width:0;">
                            <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;">
                                <span style="font-size:12px;font-weight:700;">${escHtml(s.displayName)} <span style="font-size:10px;color:var(--text-2);font-weight:500;">${escHtml(s.planName || '')}</span></span>
                                <span style="font-size:10.5px;font-weight:800;color:${col};" class="num">${pct}%</span>
                            </div>
                            <div style="display:flex;align-items:center;justify-content:space-between;font-size:10px;color:var(--text-2);margin-top:1px;">
                                <span class="num">${escHtml(s.primaryLabel || '')}</span>
                                <span>${escHtml(s.sourceBadge || 'Sayaç')}</span>
                            </div>
                            <div class="ai-bar"><div class="ai-fill" style="width:${pct}%;background:${col};"></div></div>
                        </div>
                        <div style="display:flex;gap:3px;" onpointerdown="event.stopPropagation()">
                            <button class="w-btn" style="height:22px;padding:0 7px;font-size:10px;" onclick="send('bumpAiManualUsage',{provider:'${escHtml(s.provider)}',delta:1})" title="+1 İstem">+1</button>
                        </div>
                    </div>`;
                }).join('')}
            </div>
        `;
    }

    /* 5. BATTERY & BLUETOOTH (MULTI-RING / BARS) */
    if (w.kind === 'battery') {
        const items = [];
        if (state.battery?.present) {
            const pct = state.battery.percent ?? 100;
            const chg = Boolean(state.battery.charging);
            items.push({
                name: chg ? 'PC · Şarj' : 'Bilgisayar',
                pct,
                col: chg ? '#34D399' : (pct <= 20 ? '#FB7185' : 'var(--accent-1)'),
                icon: IC.laptop,
                charging: chg
            });
        }
        (state.btDevices || []).slice(0, 3).forEach(d => {
            const pct = d.hasBattery === false ? 100 : (d.percent ?? 0);
            items.push({
                name: d.name || 'Bluetooth',
                pct,
                col: pct <= 20 ? '#FB7185' : '#38BDF8',
                icon: btDeviceIcon(d.category),
                charging: false
            });
        });
        if (items.length === 0) {
            items.push({ name: 'AC Güç', pct: 100, col: '#34D399', icon: IC.bolt, charging: true });
        }
        if (variant === 'bars') {
            return `
                <div class="w-head"><span class="w-title">${IC.battery} Pil & Bluetooth</span><span class="w-sub">${items.length} cihaz</span></div>
                <div style="display:flex;flex-direction:column;gap:9px;">
                    ${items.map(it => `<div>
                        <div style="display:flex;justify-content:space-between;align-items:center;font-size:11.5px;margin-bottom:4px;">
                            <span style="display:inline-flex;align-items:center;gap:6px;font-weight:600;"><span style="width:13px;height:13px;color:${it.col};">${it.icon}</span>${escHtml(it.name)}</span>
                            <span class="num" style="font-weight:700;">${it.pct}%</span>
                        </div>
                        <div class="bar-track"><div class="bar-fill" style="width:${it.pct}%;background:${it.col};"></div></div>
                    </div>`).join('')}
                </div>
            `;
        }
        return `
            <div class="w-head"><span class="w-title">${IC.battery} Pil & Bluetooth</span><span class="w-sub">${items.length} cihaz</span></div>
            <div class="rings-grid">${items.map(it => buildRingSvg(it.pct, it.col, it.name, it.icon, it.charging)).join('')}</div>
        `;
    }

    /* 6. SYSTEM TELEMETRY (COCKPIT + OSCILLOSCOPE + RINGS + SPARK) */
    if (w.kind === 'system') {
        const m = state.metrics || {};
        const cpu = Math.round(m.cpu || 0), ram = Math.round(m.ramPct || 0);
        const rx = Number(m.rxKbps || 0), tx = Number(m.txKbps || 0);
        const fmtNet = k => k >= 1024 ? `${(k / 1024).toFixed(1)} MB/s` : `${Math.round(k)} KB/s`;
        const netLbl = fmtNet(rx);
        if (variant === 'cockpit') {
            const disks = (state.disks || []).slice(0, 2);
            return `
                <div class="w-head">
                    <span class="w-title">${IC.cpu} Sistem Kokpit</span>
                    <span class="mono w-sub">${m.ramUsed ?? 0}/${m.ramTotal ?? 0} GB</span>
                </div>
                <div class="cockpit-top">
                    <div class="cockpit-gauge">
                        ${buildRadialGaugeSvg(cpu, 'var(--accent-1)', 'CPU')}
                        <div style="min-width:0;">
                            <div class="w-sub" style="font-size:10px;">İşlemci</div>
                            <div class="num" style="font-size:14px;font-weight:800;">${cpu}%</div>
                        </div>
                    </div>
                    <div class="cockpit-gauge">
                        ${buildRadialGaugeSvg(ram, 'var(--accent-2)', 'RAM')}
                        <div style="min-width:0;">
                            <div class="w-sub" style="font-size:10px;">Bellek</div>
                            <div class="num" style="font-size:14px;font-weight:800;">${m.ramUsed ?? 0} GB</div>
                        </div>
                    </div>
                </div>
                <div style="margin-top:8px;">
                    ${buildSparklineSvg(m.cpuHist, 'var(--accent-1)', w.id + 'ck')}
                </div>
                <div class="cockpit-net-row">
                    <span class="w-sub" style="font-weight:700;">Ağ</span>
                    <span class="mono" style="color:var(--accent-1);font-weight:700;">↓ ${fmtNet(rx)}</span>
                    <span class="mono" style="color:var(--accent-2);font-weight:700;">↑ ${fmtNet(tx)}</span>
                </div>
                ${disks.length > 0 ? `
                    <div class="cockpit-disks">
                        ${disks.map(d => {
                            const pct = Math.round(d.usedPercent || 0);
                            return `<div>
                                <div style="display:flex;justify-content:space-between;font-size:10px;margin-bottom:2px;">
                                    <span style="font-weight:700;">${escHtml(d.drive || d.letter || d.name || 'Disk')}</span>
                                    <span class="num w-sub">${(d.freeGb || 0).toFixed(0)} GB boş · ${pct}%</span>
                                </div>
                                <div class="bar-track" style="height:4px;"><div class="bar-fill" style="width:${pct}%;${pct > 88 ? 'background:#FB7185;' : ''}"></div></div>
                            </div>`;
                        }).join('')}
                    </div>
                ` : ''}
            `;
        }
        if (variant === 'oscilloscope') {
            return `
                <div class="w-head"><span class="w-title">${IC.cpu} OSİLOSKOP</span><span class="mono w-sub">CPU ${cpu}% · RAM ${ram}%</span></div>
                <div style="display:flex;flex-direction:column;gap:6px;">
                    <div>
                        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-2);margin-bottom:2px;"><span>CPU Yükü</span><span class="mono" style="color:var(--accent-1);font-weight:700;">${cpu}%</span></div>
                        ${renderOscilloscopeSvg(m.cpuHist, 'var(--accent-1)', 260, 32, w.id + 'oc')}
                    </div>
                    <div>
                        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--text-2);margin-bottom:2px;"><span>Bellek (${m.ramUsed ?? 0}/${m.ramTotal ?? 0} GB)</span><span class="mono" style="color:var(--accent-2);font-weight:700;">${ram}%</span></div>
                        ${renderOscilloscopeSvg(m.ramHist, 'var(--accent-2)', 260, 32, w.id + 'or')}
                    </div>
                </div>
            `;
        }
        if (variant === 'spark') {
            return `
                <div class="w-head"><span class="w-title">${IC.cpu} Canlı Telemetri</span><span class="mono w-sub">${netLbl}</span></div>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                    <div>
                        <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;"><span class="w-sub">CPU</span><span class="num" style="font-weight:800;">${cpu}%</span></div>
                        ${buildSparklineSvg(m.cpuHist, '#38BDF8', w.id + 'c')}
                    </div>
                    <div>
                        <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;"><span class="w-sub">RAM</span><span class="num" style="font-weight:800;">${ram}%</span></div>
                        ${buildSparklineSvg(m.ramHist, '#818CF8', w.id + 'r')}
                    </div>
                </div>
            `;
        }
        return `
            <div class="w-head"><span class="w-title">${IC.cpu} Sistem</span><span class="mono w-sub">${m.ramUsed ?? 0}/${m.ramTotal ?? 0} GB · ${netLbl}</span></div>
            <div class="rings-grid">
                ${buildRingSvg(cpu, '#38BDF8', 'CPU', null)}
                ${buildRingSvg(ram, '#818CF8', 'RAM', null)}
                ${buildRingSvg(Math.min(100, Math.round(rx / 120)), '#34D399', 'Ağ', null)}
            </div>
        `;
    }

    /* 7. CALENDAR */
    if (w.kind === 'calendar') {
        const todayKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        const note = state.agendaNotes?.[todayKey] || '';
        if (variant === 'month') {
            const yr = now.getFullYear(), mo = now.getMonth();
            const firstDow = (new Date(yr, mo, 1).getDay() + 6) % 7;
            const daysInMo = new Date(yr, mo + 1, 0).getDate();
            const prevDays = new Date(yr, mo, 0).getDate();
            const cells = [];
            for (let i = firstDow - 1; i >= 0; i--) cells.push(`<div class="cal-m-cell muted num">${prevDays - i}</div>`);
            for (let d = 1; d <= daysInMo; d++) {
                const dk = `${yr}-${String(mo + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const hasNote = Boolean(state.agendaNotes?.[dk]);
                const isToday = d === now.getDate();
                cells.push(`<div class="cal-m-cell num ${isToday ? 'today' : ''} ${hasNote ? 'note' : ''}">${d}</div>`);
            }
            let nextD = 1;
            while (cells.length % 7 !== 0) cells.push(`<div class="cal-m-cell muted num">${nextD++}</div>`);
            return `
                <div class="w-head"><span class="w-title">${IC.calendar} ${escHtml(months[mo])} ${yr}</span><span class="w-sub">${now.getDate()}</span></div>
                <div class="cal-month-grid">
                    ${['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(d => `<div class="cal-m-dow">${d}</div>`).join('')}
                    ${cells.join('')}
                </div>
            `;
        }
        return `
            <div class="w-head"><span class="w-title">${IC.calendar} Takvim</span><span class="w-sub">${escHtml(months[now.getMonth()])} ${now.getFullYear()}</span></div>
            <div style="display:flex;align-items:center;gap:14px;">
                <div class="cal-day-num num">${now.getDate()}</div>
                <div style="flex:1;min-width:0;">
                    <div style="font-size:14px;font-weight:700;">${escHtml(days[now.getDay()])}</div>
                    <div class="w-sub" style="margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${note ? escHtml(note) : 'Bugün için plan notu yok'}</div>
                </div>
            </div>
        `;
    }

    /* 8. STICKY NOTES */
    if (w.kind === 'notes' || w.kind === 'quick-note') {
        return `
            <div class="w-head"><span class="w-title">${IC.note} Hızlı Not</span><span class="w-sub">Otomatik Kayıt</span></div>
            <textarea class="note-ta" data-note-wid="${escHtml(w.id)}" placeholder="Notunuzu yazın..."
                onfocus="send('requestWidgetFocus')"
                onblur="send('releaseWidgetFocus');saveWidgetNote('${escHtml(w.id)}',this.value)"
                onpointerdown="event.stopPropagation()">${escHtml(w.noteText || '')}</textarea>
        `;
    }

    /* 9. POMODORO & FOCUS */
    if (w.kind === 'pomodoro' || w.kind === 'pomodoro-studio' || w.kind === 'focus') {
        const f = state.focus || { running: false, seconds: 1500, durationSecs: 1500, label: '25:00' };
        const totalSecs = Math.max(60, Number(f.durationSecs || f.totalSeconds || 1500));
        const remSecs = Math.max(0, Math.min(totalSecs, Number(f.seconds ?? totalSecs)));
        const pct = Math.max(0, Math.min(100, Math.round(((totalSecs - remSecs) / totalSecs) * 100)));
        const curMins = Math.round(totalSecs / 60);
        const ringR = 25, ringC = 2 * Math.PI * ringR;
        const ringOff = (ringC * (1 - pct / 100)).toFixed(1);
        return `
            <div class="w-head"><span class="w-title">${IC.timer} Odak Zamanlayıcı</span><span class="w-badge">${f.running ? 'Aktif' : 'Hazır'}</span></div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
                <div style="display:flex;align-items:center;gap:11px;">
                    <svg viewBox="0 0 60 60" width="54" height="54" style="flex-shrink:0;">
                        <circle cx="30" cy="30" r="${ringR}" fill="none" stroke="var(--border-subtle)" stroke-width="4.5"/>
                        <circle cx="30" cy="30" r="${ringR}" fill="none" stroke="var(--accent-1)" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="${ringC.toFixed(1)}" stroke-dashoffset="${ringOff}" transform="rotate(-90 30 30)"/>
                        <text x="30" y="33.5" text-anchor="middle" fill="currentColor" font-size="11" font-weight="800" class="num">${pct}%</text>
                    </svg>
                    <div style="font-size:32px;font-weight:800;letter-spacing:-0.03em;line-height:1;" class="num">${escHtml(f.label || '25:00')}</div>
                </div>
                <div style="display:flex;gap:5px;" onpointerdown="event.stopPropagation()">
                    <button class="w-btn primary" onclick="send('toggleFocus')">${f.running ? 'Duraklat' : 'Başlat'}</button>
                    <button class="w-ibtn" onclick="send('resetFocus')" title="Sıfırla">${IC.refresh}</button>
                </div>
            </div>
            <div class="pomo-preset-row" onpointerdown="event.stopPropagation()">
                ${[5, 15, 25, 45].map(m => `<button class="pomo-preset-btn num ${curMins===m?'active':''}" onclick="send('setFocusPreset',{minutes:${m},start:true})">${m}d</button>`).join('')}
            </div>
        `;
    }

    /* 10. QUICK LAUNCHER */
    if (w.kind === 'launcher') {
        const pins = (state.pinnedShortcuts || []).slice(0, w.size === 'S' ? 4 : 8);
        return `
            <div class="w-head"><span class="w-title">${IC.grid} Hızlı Başlatıcı</span><span class="w-sub">${pins.length} kısayol</span></div>
            <div class="ln-grid" onpointerdown="event.stopPropagation()">
                ${pins.map((p, idx) => { const pIcon = resolveItemIcon(p); return `<button class="ln-btn" onclick="launchPinnedIndex(${idx})" title="${escHtml(p.name)}">
                    ${pIcon ? `<img src="data:image/png;base64,${pIcon}"/>` : `<span style="width:22px;height:22px;border-radius:6px;background:rgba(var(--a1-rgb),0.18);color:var(--accent-1);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;">${escHtml((p.name || 'A')[0].toUpperCase())}</span>`}
                    <span>${escHtml(p.name)}</span>
                </button>`; }).join('')}
            </div>
        `;
    }

    /* 11. TODO LIST */
    if (w.kind === 'todo') {
        const todos = state.todos || [];
        const doneCnt = todos.filter(t => t.done).length;
        const pct = todos.length > 0 ? Math.round((doneCnt / todos.length) * 100) : 0;
        const r = 10, c = 2 * Math.PI * r;
        const off = (c * (1 - pct / 100)).toFixed(1);
        return `
            <div class="w-head">
                <span class="w-title">${IC.list} Görevler</span>
                <div style="display:inline-flex;align-items:center;gap:6px;">
                    <svg viewBox="0 0 26 26" width="22" height="22">
                        <circle cx="13" cy="13" r="${r}" fill="none" stroke="var(--border-subtle)" stroke-width="2.8"/>
                        <circle cx="13" cy="13" r="${r}" fill="none" stroke="var(--accent-1)" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off}" transform="rotate(-90 13 13)"/>
                    </svg>
                    <span class="w-sub num">${doneCnt}/${todos.length} · %${pct}</span>
                </div>
            </div>
            <div class="td-inp-row" onpointerdown="event.stopPropagation()">
                <input class="td-inp" id="tdInp-${escHtml(w.id)}" placeholder="Yeni görev ekle..."
                    onfocus="send('requestWidgetFocus')" onblur="send('releaseWidgetFocus')"
                    onkeydown="if(event.key==='Enter')submitTodo('${escHtml(w.id)}')"/>
                <button class="w-btn primary" onclick="submitTodo('${escHtml(w.id)}')">Ekle</button>
            </div>
            <div class="td-list" onpointerdown="event.stopPropagation()">
                ${todos.length === 0 ? `<div class="w-sub" style="padding:8px 2px;">Henüz görev yok.</div>` : todos.slice(0, 6).map(t => `
                    <div class="td-row">
                        <button class="td-chk ${t.done ? 'done' : ''}" onclick="send('toggleTodo',{id:'${escHtml(t.id)}'})">${t.done ? IC.check.replace('<svg ','<svg width="10" height="10" ') : ''}</button>
                        <span class="td-txt ${t.done ? 'done' : ''}" onclick="send('toggleTodo',{id:'${escHtml(t.id)}'})">${escHtml(t.text)}</span>
                        <button class="w-ibtn danger" style="width:20px;height:20px;" onclick="send('removeTodo',{id:'${escHtml(t.id)}'})">${IC.close}</button>
                    </div>
                `).join('')}
            </div>
        `;
    }

    /* 12. MARKET & INLINE CURRENCY CONVERTER */
    if (w.kind === 'market' || w.kind === 'currency-ticker') {
        const mk = state.market || {};
        const btcChg = Number(mk.btcChange24h || 0);
        const chgLbl = mk.btcUsd ? `${btcChg >= 0 ? '+' : ''}${btcChg.toFixed(1)}%` : '';
        const rows = [
            { k: 'USD/TRY', v: mk.usdTry ? mk.usdTry.toFixed(2) + ' ₺' : '--', sub: '' },
            { k: 'EUR/TRY', v: mk.eurTry ? mk.eurTry.toFixed(2) + ' ₺' : '--', sub: '' },
            { k: 'BTC', v: mk.btcUsd ? '$' + Math.round(mk.btcUsd).toLocaleString('tr-TR') : '--', sub: chgLbl }
        ];
        const convVal = computeMarketConversion(mk);
        return `
            <div class="w-head">
                <span class="w-title">${IC.chart} Piyasa & Döviz</span>
                <div style="display:flex;align-items:center;gap:5px;" onpointerdown="event.stopPropagation()">
                    ${mk.updatedAtHhmm ? `<span class="num w-sub" style="font-size:9.5px;">${escHtml(mk.updatedAtHhmm)}</span>` : ''}
                    <button class="w-ibtn" style="width:22px;height:22px;" onclick="send('refreshMarket')" title="Yenile">${IC.refresh}</button>
                </div>
            </div>
            <div class="mkt-grid">
                ${rows.map(r => `<div class="mkt-chip">
                    <div class="w-sub" style="font-size:9.5px;display:flex;justify-content:space-between;"><span>${r.k}</span>${r.sub ? `<span class="num" style="color:${btcChg>=0?'#10B981':'#FB7185'};font-weight:700;">${r.sub}</span>` : ''}</div>
                    <div class="num" style="font-size:13px;font-weight:800;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${r.v}</div>
                </div>`).join('')}
            </div>
            <div class="mkt-conv" onpointerdown="event.stopPropagation()">
                <input class="mkt-conv-inp num" id="mktAmt-${escHtml(w.id)}" value="${escHtml(marketConvState.amount)}" inputmode="decimal"
                    onfocus="send('requestWidgetFocus')" onblur="send('releaseWidgetFocus')"
                    oninput="updateMarketConvPreview('${escHtml(w.id)}')"/>
                <select class="mkt-conv-sel" id="mktPair-${escHtml(w.id)}" onchange="updateMarketConvPreview('${escHtml(w.id)}')">
                    <option value="usd-try" ${marketConvState.pair==='usd-try'?'selected':''}>USD→TRY</option>
                    <option value="eur-try" ${marketConvState.pair==='eur-try'?'selected':''}>EUR→TRY</option>
                    <option value="try-usd" ${marketConvState.pair==='try-usd'?'selected':''}>TRY→USD</option>
                    <option value="try-eur" ${marketConvState.pair==='try-eur'?'selected':''}>TRY→EUR</option>
                    <option value="btc-usd" ${marketConvState.pair==='btc-usd'?'selected':''}>BTC→USD</option>
                </select>
                <span class="num" id="mktOut-${escHtml(w.id)}" style="margin-left:auto;font-size:12px;font-weight:800;color:var(--accent-1);">${escHtml(convVal)}</span>
            </div>
        `;
    }

    /* 13. COUNTDOWN */
    if (w.kind === 'countdown') {
        const cd = state.countdown || { title: 'Hedef', targetDate: '2026-12-31' };
        const diffDays = Math.max(0, Math.ceil((new Date(cd.targetDate + 'T00:00:00') - now) / 86400000));
        return `
            <div class="w-head">
                <span class="w-title">${IC.flag} Geri Sayım</span>
                <button class="w-ibtn" style="width:22px;height:22px;" onpointerdown="event.stopPropagation()" onclick="countdownEditOpen=!countdownEditOpen;renderWidgets(true);" title="Düzenle">${IC.sliders}</button>
            </div>
            ${countdownEditOpen ? `
                <div style="display:flex;flex-direction:column;gap:6px;" onpointerdown="event.stopPropagation()">
                    <input class="td-inp" id="cdTitle" value="${escHtml(cd.title)}" onfocus="send('requestWidgetFocus')" onblur="send('releaseWidgetFocus')"/>
                    <input class="td-inp" id="cdDate" type="date" value="${escHtml(cd.targetDate)}" onfocus="send('requestWidgetFocus')" onblur="send('releaseWidgetFocus')"/>
                    <button class="w-btn primary" onclick="saveCountdownForm()">Kaydet</button>
                </div>

    /* 14. STORAGE & NET */
    if (w.kind === 'storage-net') {
        const disks = (state.disks || []).slice(0, 3);
        return `
            <div class="w-head">
                <span class="w-title">${IC.disk} Disk & Depolama</span>

            <div class="w-head">
                <span class="w-title">${IC.quote} İlham</span>
                <button class="w-ibtn" style="width:22px;height:22px;" onpointerdown="event.stopPropagation()" onclick="quoteOffset++;renderWidgets(true);" title="Sonraki Söz">${IC.refresh}</button>

            <div class="w-sub" style="margin-top:8px;font-weight:600;">— ${escHtml(q.author)}</div>

    /* 16. LOCAL AI MONITOR */
    if (w.kind === 'local-ai') {
        const la = state.localAi || {};
        return `
            <div class="w-head">
                <span class="w-title">${IC.brain} Yerel AI</span>
                <button class="w-ibtn" style="width:22px;height:22px;" onpointerdown="event.stopPropagation()" onclick="send('refreshLocalAi')">${IC.refresh}</button>

                <div class="ai-row"><span style="flex:1;font-weight:600;">LM Studio</span><span class="w-badge" style="${la.lmStudioRunning ? 'color:#34D399;border-color:rgba(52,211,153,0.35);' : ''}">${la.lmStudioRunning ? 'Çalışıyor' : 'Kapalı'}</span></div>
                ${la.activeModel ? `<div class="w-sub mono" style="padding:2px 4px;">Model: ${escHtml(la.activeModel)}</div>` : ''}
            </div>
        `;
    }

    /* 17. AUDIO MIXER */
    if (w.kind === 'audio-mixer') {
        const aud = state.audio || { volume: 50, muted: false, device: 'Ses Çıkışı' };
        const outs = (state.audioOutputs || []).slice(0, 3);
        const sess = (state.audioSessions || []).slice(0, 3);
        return `

            </div>
            ${sess.map(s => `
                <div class="mix-row" onpointerdown="event.stopPropagation()" style="margin-bottom:5px;">
                    <span style="width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2);">${escHtml(s.name)}</span>
                    <input type="range" min="0" max="100" value="${s.volume}" oninput="send('setAppVolume',{pid:${s.pid},value:+this.value})" />
                    <span class="num" style="width:30px;text-align:right;font-size:10px;">${s.volume}%</span>
                </div>
            `).join('')}
            ${outs.length > 1 ? `
                <div class="mix-outs" onpointerdown="event.stopPropagation()">
                    ${outs.map(o => `<button class="mix-out-chip ${o.isDefault ? 'active' : ''}" onclick="send('setAudioOutputDevice',{id:'${escHtml(o.id)}'})" title="${escHtml(o.fullName || o.name)}">${escHtml(o.name)}</button>`).join('')}

            ` : `<div class="w-sub" style="margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escHtml(aud.device || '')}</div>`}
        `;
    }

    /* 18. FOCUS RINGS */
    if (w.kind === 'focus-rings') {
        const fs = state.focusStats || { completedMins: 0, goalMins: 90 };
        const todos = state.todos || [];
        const doneCnt = todos.filter(t => t.done).length;
        const focusPct = Math.min(100, Math.round(((fs.completedMins || 0) / Math.max(15, fs.goalMins || 90)) * 100));
        const todoPct = todos.length > 0 ? Math.min(100, Math.round((doneCnt / todos.length) * 100)) : 0;
        const f = state.focus || { running: false, label: '25:00' };
        const ring = (r, p, col) => {
            const c = 2 * Math.PI * r;
            return `<circle cx="42" cy="42" r="${r}" fill="none" stroke="${col}" stroke-opacity="0.16" stroke-width="5"/><circle cx="42" cy="42" r="${r}" fill="none" stroke="${col}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-p/100)).toFixed(1)}" transform="rotate(-90 42 42)"/>`;
        };
        return `
            <div class="w-head"><span class="w-title">${IC.timer} Odak Halkaları</span><span class="num w-sub">${fs.completedMins || 0}/${fs.goalMins || 90} dk</span></div>
            <div style="display:flex;align-items:center;gap:14px;">
                <svg viewBox="0 0 84 84" width="78" height="78" style="flex-shrink:0;">
                    ${ring(36, focusPct, '#FB7185')}
                    ${ring(26, todoPct, '#34D399')}
                    ${ring(16, f.running ? 75 : 20, '#38BDF8')}
                </svg>
                <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;">
                    <div style="font-size:11px;"><span style="color:#FB7185;font-weight:700;">Odak:</span> <span class="num">${fs.completedMins || 0} dk</span></div>

                        <button class="w-btn" style="height:23px;font-size:10px;" onclick="send('logFocusMinutes',{delta:15})">+15 dk</button>
                    </div>
                </div>
            </div>
        `;
    }

    /* 19. PHOTO FRAME */
    if (w.kind === 'photo-frame') {

                }

            </div>
        `;
    }

    /* 20. QUICK DROP & CLIPBOARD */
    if (w.kind === 'quick-drop') {
        const clips = (state.clipboard || []).slice(0, 3);
        return `
            <div class="w-head"><span class="w-title">${IC.spark} Hızlı Araç & Pano</span><span class="w-sub">${clips.length} öğe</span></div>
            <div class="qdrop-grid" onpointerdown="event.stopPropagation()">
                <button class="w-btn" style="height:26px;padding:0;font-size:10px;" onclick="send('startScreenOcr')" title="OCR Metin">${IC.scanText}<span>OCR</span></button>
                <button class="w-btn" style="height:26px;padding:0;font-size:10px;" onclick="send('startColorPicker')" title="Renk Seç">${IC.pipette}<span>Renk</span></button>
                <button class="w-btn" style="height:26px;padding:0;font-size:10px;" onclick="send('startGifRecording')" title="GIF Kaydet">${IC.record}<span>GIF</span></button>
                <button class="w-btn" style="height:26px;padding:0;font-size:10px;" onclick="send('pickAndShareQr')" title="QR Gönder">${IC.qr}<span>QR</span></button>
            </div>
            <div style="display:flex;flex-direction:column;gap:4px;" onpointerdown="event.stopPropagation()">
                ${clips.length === 0 ? `<div class="w-sub">Pano geçmişi boş.</div>` : clips.map(c => `
                    <div class="qdrop-clip" onclick="send('copyClipById',{id:${c.id}})" title="Panoya kopyala">${escHtml(c.preview || c.text || 'Görsel')}</div>
                `).join('')}
            </div>
        `;
    }

    return `<div class="w-sub">${escHtml(w.kind)}</div>`;
}

function cycleSize(id, cur) {
    const next = cur === 'S' ? 'M' : (cur === 'M' ? 'L' : 'S');
    send('updateDesktopWidget', { id, size: next });
}
function cycleVariant(id, kind, cur) {
    const list = VARIANT_CATALOG[kind] || [];
    if (list.length <= 1) return;
    const norm = normalizeVariant(kind, cur);
    const idx = Math.max(0, list.findIndex(x => x.id === norm));
    const next = list[(idx + 1) % list.length].id;
    send('updateDesktopWidget', { id, variant: next });
}

/* ═══════════ DIRECT RIGHT-CLICK VISUAL STIL / SKIN INSPECTOR ═══════════ */
function openWidgetInspector(e, wid) {
    e.preventDefault();
    e.stopPropagation();
    inspectorWid = wid;
    const vw = window.innerWidth || 1920;
    const vh = window.innerHeight || 1080;
    inspectorPos = {
        x: Math.max(12, Math.min(vw - 328, e.clientX + 8)),
        y: Math.max(12, Math.min(vh - 420, e.clientY + 8))
    };
    renderInspector();
    scheduleHitRects();
}
function closeWidgetInspector() {
    if (!inspectorWid) return;
    inspectorWid = null;
    const el = document.getElementById('widgetInspector');
    if (el) { el.classList.remove('open'); el.innerHTML = ''; }
    scheduleHitRects();
}
function renderInspector() {
    const el = document.getElementById('widgetInspector');
    if (!el || !inspectorWid || !state) return;
    const w = (state.widgets || []).find(x => x.id === inspectorWid);
    if (!w) { closeWidgetInspector(); return; }
    const curSkin = w.skin || 'glass';
    const curVar = normalizeVariant(w.kind, w.variant);
    const vars = VARIANT_CATALOG[w.kind] || [];
    const curOp = Math.round((typeof w.opacity === 'number' ? w.opacity : 1) * 100);

    el.style.left = inspectorPos.x + 'px';
    el.style.top = inspectorPos.y + 'px';
    el.innerHTML = `
        <div class="insp-head">
            <div style="font-size:12.5px;font-weight:700;">${escHtml(KIND_LABELS[w.kind] || w.kind)} · Stil</div>
            <button class="w-ibtn" style="width:22px;height:22px;" onclick="closeWidgetInspector()">${IC.close}</button>
        </div>
        <div class="insp-sec">
            <div class="insp-lbl">Malzeme & Yüzey</div>
            <div class="insp-skin-grid">
                ${SKIN_META.map(s => {
                    const active = curSkin === s.id || (s.id === 'acrylic' && curSkin === 'neoglass');
                    return `<button class="insp-skin-swatch ${active ? 'active' : ''}" onclick="setWidgetProp('${escHtml(w.id)}',{skin:'${s.id}'})">
                        <span class="insp-sw-preview ${s.preview}"><i style="width:55%;"></i><i style="width:26%;opacity:0.4;"></i></span>
                        <span class="insp-sw-name">${s.name}</span>
                    </button>`;
                }).join('')}
            </div>
        </div>
        ${vars.length > 1 ? `
        <div class="insp-sec">
            <div class="insp-lbl">Canlı Varyant</div>
            <div class="insp-chips">
                ${vars.map(v => `<button class="insp-chip ${curVar === v.id ? 'active' : ''}" onclick="setWidgetProp('${escHtml(w.id)}',{variant:'${v.id}'})">${v.name}</button>`).join('')}
            </div>
        </div>` : ''}
        <div class="insp-sec">
            <div class="insp-lbl">Boyut</div>
            <div class="insp-chips">
                ${['S','M','L'].map(sz => `<button class="insp-chip ${(w.size || 'M') === sz ? 'active' : ''}" style="min-width:46px;" onclick="setWidgetProp('${escHtml(w.id)}',{size:'${sz}'})">${sz}</button>`).join('')}
            </div>
        </div>
        <div class="insp-sec">
            <div style="display:flex;justify-content:space-between;"><span class="insp-lbl">Saydamlık</span><span class="num" style="font-size:10.5px;color:var(--text-2);">${curOp}%</span></div>
            <input class="insp-range" type="range" min="45" max="100" value="${curOp}" oninput="previewWidgetOpacity('${escHtml(w.id)}',this.value)" onchange="setWidgetProp('${escHtml(w.id)}',{opacity:Number(this.value)/100})"/>
        </div>
        ${w.kind === 'photo-frame' ? `
        <div class="insp-sec">
            <button class="w-btn primary" style="width:100%;" onclick="send('pickWidgetPhoto',{id:'${escHtml(w.id)}'});closeWidgetInspector();">${IC.photo}<span>Bilgisayardan Fotoğraf Seç</span></button>
        </div>` : ''}
        <div class="insp-foot">
            <button class="w-btn ${w.pinnedTop ? 'primary' : ''}" onclick="setWidgetProp('${escHtml(w.id)}',{pinnedTop:${!w.pinnedTop}})">${IC.pin} Üstte Tut</button>
            <button class="w-btn" onclick="send('setWidgetEditMode',{active:${!state.widgetEditMode}});closeWidgetInspector();">Taşı</button>
            <button class="w-ibtn danger" onclick="send('removeDesktopWidget',{id:'${escHtml(w.id)}'});closeWidgetInspector();" title="Widget'ı Kaldır">${IC.trash}</button>

    `;
    el.classList.add('open');
}
function setWidgetProp(id, patch) {
    if (state?.widgets) {
        const w = state.widgets.find(x => x.id === id);
        if (w) Object.assign(w, patch);
        renderWidgets(true);
        renderInspector();
    }
    send('updateDesktopWidget', { id, ...patch });
}
function previewWidgetOpacity(id, val) {
    const card = document.querySelector(`.widget-card[data-wid="${CSS.escape(id)}"]`);
