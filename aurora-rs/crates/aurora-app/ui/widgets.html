                        <button class="w-ibtn danger" style="width:21px;height:21px;" onclick="send('removeDesktopWidget',{id:'${escHtml(w.id)}'})" title="Kaldır">${IC.close}</button>
                    </div>
                </div>
                ${buildWidgetInner(w)}
            </div>
        `;
    }).join('');

    if (inspectorWid) renderInspector();
    scheduleHitRects();
}

function updateLiveClockDom() {
    const now = new Date();
    const clk = state?.clock || `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    const [hh, mm] = clk.split(':');
    const ss = String(now.getSeconds()).padStart(2, '0');
    document.querySelectorAll('[data-clock-live]').forEach(el => {
        if (el.querySelector('[data-clock-ss]')) {
            el.firstChild.nodeValue = `${hh}:${mm}`;
        } else {
            el.textContent = `${hh}:${mm}`;
        }
    });
    document.querySelectorAll('[data-clock-hh]').forEach(el => { el.textContent = hh || '00'; });
    document.querySelectorAll('[data-clock-mm]').forEach(el => { el.textContent = mm || '00'; });
    document.querySelectorAll('[data-clock-ss]').forEach(el => { el.textContent = ss; });
    document.querySelectorAll('[data-clock-bar]').forEach(el => { el.style.width = `${((now.getSeconds() / 59) * 100).toFixed(1)}%`; });
    document.querySelectorAll('[id^="dmLed-"]').forEach(el => {
        el.innerHTML = renderDotMatrix5x7Svg(`${hh}:${mm}`, 'var(--accent-1)');
    });
    const hDeg = (((now.getHours() % 12) + now.getMinutes() / 60) * 30).toFixed(1);
    const mDeg = ((now.getMinutes() + now.getSeconds() / 60) * 6).toFixed(1);
    const sDeg = (now.getSeconds() * 6).toFixed(1);
    document.querySelectorAll('[data-chrono-h]').forEach(el => el.setAttribute('transform', `rotate(${hDeg} 50 50)`));
    document.querySelectorAll('[data-chrono-m]').forEach(el => el.setAttribute('transform', `rotate(${mDeg} 50 50)`));
    document.querySelectorAll('[data-chrono-s]').forEach(el => el.setAttribute('transform', `rotate(${sDeg} 50 50)`));
}

function startWidgetDrag(e, id) {
    if (!state?.widgetEditMode || state?.widgetsLocked || e.button !== 0) return;
    if (e.target.closest('button, input, textarea, .w-edit-bar')) return;
    closeWidgetInspector();
    const el = e.currentTarget;
    const r = el.getBoundingClientRect();
    dragCtx = { id, el, offX: e.clientX - r.left, offY: e.clientY - r.top, curX: r.left, curY: r.top };
    el.classList.add('dragging');
    el.setPointerCapture?.(e.pointerId);
}

document.addEventListener('pointerdown', e => {
    if (inspectorWid && !e.target.closest('#widgetInspector')) {
        closeWidgetInspector();
    }
});

document.addEventListener('pointermove', e => {
    if (!dragCtx) return;
    const rawX = e.clientX - dragCtx.offX;
    const rawY = e.clientY - dragCtx.offY;
    const snapX = Math.max(12, Math.min(window.innerWidth - dragCtx.el.offsetWidth - 12, Math.round(rawX / 16) * 16));
    const snapY = Math.max(12, Math.min(window.innerHeight - dragCtx.el.offsetHeight - 12, Math.round(rawY / 16) * 16));
    dragCtx.curX = snapX;
    dragCtx.curY = snapY;
    dragCtx.el.style.left = snapX + 'px';
    dragCtx.el.style.top = snapY + 'px';
});

function finishWidgetDrag() {
    if (!dragCtx) return;
    const d = dragCtx;
    dragCtx = null;
    d.el.classList.remove('dragging');
    const vw = window.innerWidth || 1920;
    const saveX = (d.curX > vw * 0.55) ? (d.curX - vw) : d.curX;
    send('updateDesktopWidget', { id: d.id, x: Math.round(saveX), y: Math.round(d.curY) });
    scheduleHitRects();
}
document.addEventListener('pointerup', finishWidgetDrag);
document.addEventListener('pointercancel', finishWidgetDrag);

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        if (inspectorWid) closeWidgetInspector();
        else if (state?.widgetEditMode) send('setWidgetEditMode', { active: false });
    }
});

window.addEventListener('resize', () => { renderWidgets(true); scheduleHitRects(); });

if (typeof ResizeObserver !== 'undefined') {
    const ro = new ResizeObserver(scheduleHitRects);
    ro.observe(document.documentElement);
    const cv = document.getElementById('canvas');
    if (cv) ro.observe(cv);
}

window.chrome.webview.addEventListener('message', e => {
    const msg = e.data;
    if (msg.type === 'state') {
        state = msg.payload;
        renderWidgets(false);
    } else if (msg.type === 'clockTick') {
        if (state && msg.clock) {
            state.clock = msg.clock;
            updateLiveClockDom();
        }
    } else if (msg.type === 'widgetVisibility') {
        document.body.classList.toggle('widgets-paused', Boolean(msg.paused));
    } else if (msg.type === 'syncLayout') {
        renderWidgets(true);
        scheduleHitRects();
    }
});

function signalUiReady() {
    try { window.chrome.webview.postMessage({ type: 'uiReady' }); } catch (_) {}
}
signalUiReady();
const _wRetry = setInterval(() => {
    if (state) { clearInterval(_wRetry); return; }
    signalUiReady();
}, 450);
</script>
