<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Aurora Desktop Widgets v8.1</title>
<style>
:root {
    --bg-glass-1: rgba(14, 18, 28, 0.78);
    --bg-glass-2: rgba(20, 26, 40, 0.90);
    --bg-card: rgba(255, 255, 255, 0.055);
    --bg-card-hover: rgba(255, 255, 255, 0.11);
    --border-subtle: rgba(255, 255, 255, 0.10);
    --border-rim: rgba(255, 255, 255, 0.20);
    --text-1: #F8FAFC;
    --text-2: #94A3B8;
    --accent-1: #38BDF8;
    --accent-2: #818CF8;
    --accent-ink: #040914;
    --danger: #FB7185;
    --ok: #34D399;
    --a1-rgb: 56, 189, 248;
    --a2-rgb: 129, 140, 248;
    --radius-w: 22px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --shadow-w: 0 20px 48px -14px rgba(0, 0, 0, 0.58), 0 2px 10px rgba(0, 0, 0, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.18);
    --braun-bg: linear-gradient(180deg, #1E2024 0%, #17181B 100%);
    --braun-solid: #1A1B1E;
    --braun-border: rgba(255, 255, 255, 0.11);
    --braun-accent: #F97316;
    --matrix-bg: rgba(8, 10, 14, 0.93);
    --matrix-dot: rgba(255, 255, 255, 0.085);
    --editorial-bg: rgba(13, 15, 21, 0.96);
    --editorial-line: rgba(255, 255, 255, 0.10);
}
body.mode-light {
    --bg-glass-1: rgba(252, 250, 247, 0.84);
    --bg-glass-2: rgba(255, 254, 252, 0.95);
    --bg-card: rgba(15, 23, 42, 0.045);
    --bg-card-hover: rgba(15, 23, 42, 0.09);
    --border-subtle: rgba(15, 23, 42, 0.09);
    --border-rim: rgba(15, 23, 42, 0.15);
    --text-1: #111827;
    --text-2: #4B5563;
    --danger: #E11D48;
    --ok: #059669;
    --shadow-w: 0 18px 40px -14px rgba(15, 23, 42, 0.17), 0 2px 8px rgba(15, 23, 42, 0.05), inset 0 1px 0 rgba(255, 255, 255, 0.96);
    --braun-bg: linear-gradient(180deg, #F5F2EC 0%, #EAE5DC 100%);
    --braun-solid: #EFECE5;
    --braun-border: rgba(24, 24, 27, 0.13);
    --braun-accent: #EA580C;
    --matrix-bg: rgba(244, 246, 249, 0.95);
    --matrix-dot: rgba(15, 23, 42, 0.095);
    --editorial-bg: rgba(252, 250, 247, 0.97);
    --editorial-line: rgba(15, 23, 42, 0.10);
}
body.radius-sharp { --radius-w: 10px; }
body.radius-soft { --radius-w: 28px; }
body.eco-mode * { animation: none !important; transition-duration: 0.05s !important; }
body.eco-mode .widget-card { backdrop-filter: none !important; }
body.widgets-paused #canvas { visibility: hidden; pointer-events: none; }
body.widgets-paused * { animation-play-state: paused !important; }

* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
html, body {
    width: 100%; height: 100%; overflow: hidden; background: transparent;
    font-family: 'Segoe UI Variable Display', 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
    color: var(--text-1); -webkit-font-smoothing: antialiased;
}
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: 'Cascadia Mono', 'Consolas', monospace; font-variant-numeric: tabular-nums; }

#canvas { position: fixed; inset: 0; pointer-events: none; }

/* Edit Mode Top Control Bar */
#editBanner {
    display: none;
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    padding: 8px 10px 8px 16px; border-radius: 999px;
    background: var(--bg-glass-2);
    border: 1px solid var(--border-rim);
    backdrop-filter: blur(26px) saturate(165%);
    box-shadow: 0 20px 50px -12px rgba(0,0,0,0.52);
    align-items: center; gap: 12px; z-index: 900; pointer-events: auto;
    font-size: 12px; font-weight: 600; color: var(--text-1);
}
body.edit-mode #editBanner { display: flex; }
.eb-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent-1);
    box-shadow: 0 0 10px rgba(var(--a1-rgb), 0.7);
}
.eb-btn {
    height: 28px; padding: 0 12px; border-radius: 999px;
    border: 1px solid var(--border-subtle); background: var(--bg-card);
    color: var(--text-1); font-size: 11.5px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background 0.14s, border-color 0.14s, transform 0.12s var(--ease);
}
.eb-btn:hover { background: var(--bg-card-hover); border-color: var(--border-rim); }
.eb-btn:active { transform: scale(0.96); }
.eb-btn.primary { background: var(--accent-1); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
.eb-btn.primary:hover { filter: brightness(1.06); }

/* ═══════════ BASE WIDGET CONTAINER ═══════════ */
.widget-card {
    --wp-y: 16px;
    --wp-x: 18px;
    position: absolute; pointer-events: auto;
    border-radius: var(--radius-w);
    padding: var(--wp-y) var(--wp-x);
    overflow: hidden;
    transition: box-shadow 0.2s var(--ease), border-color 0.18s ease, transform 0.18s var(--ease);
}
.widget-card.w-sz-S { --wp-y: 13px; --wp-x: 15px; width: 248px; min-height: 112px; }
.widget-card.w-sz-M { --wp-y: 16px; --wp-x: 18px; width: 328px; min-height: 142px; }
.widget-card.w-sz-L { --wp-y: 18px; --wp-x: 20px; width: 404px; min-height: 176px; }

.widget-card.w-kind-daily-brief.w-sz-S { width: 276px; }
.widget-card.w-kind-daily-brief.w-sz-M { width: 356px; }
.widget-card.w-kind-daily-brief.w-sz-L { width: 420px; }

.widget-card.w-kind-studio-strip.w-sz-M,
.widget-card.w-kind-studio-strip.w-sz-L,
.widget-card.w-variant-studio-strip.w-sz-M,
.widget-card.w-variant-studio-strip.w-sz-L { --wp-y: 11px; --wp-x: 15px; width: 456px; min-height: 66px; }
.widget-card.w-kind-studio-strip.w-sz-S,
.widget-card.w-variant-studio-strip.w-sz-S { --wp-y: 10px; --wp-x: 13px; width: 348px; min-height: 60px; }

.widget-card.w-kind-forecast-strip.w-sz-M,
.widget-card.w-kind-forecast-strip.w-sz-L,
.widget-card.w-variant-forecast-strip.w-sz-M,
.widget-card.w-variant-forecast-strip.w-sz-L { width: 376px; min-height: 132px; }

/* ═══════════ 6 FLAGSHIP INDUSTRIAL DESIGN SKINS (DARK + LIGHT) ═══════════ */

/* 1. OPTICAL GLASS (visionOS / Tahoe Directional Rim) */
.widget-card.skin-glass {
    background:
        linear-gradient(155deg, rgba(255, 255, 255, 0.11) 0%, rgba(255, 255, 255, 0.02) 48%, rgba(0, 0, 0, 0.08) 100%),
        var(--bg-glass-1);
    border: 1px solid rgba(255, 255, 255, 0.20);
    backdrop-filter: blur(30px) saturate(175%);
    box-shadow:
        0 20px 46px -14px rgba(0, 0, 0, 0.56),
        inset 0 1px 0 rgba(255, 255, 255, 0.28),
        inset 1px 0 0 rgba(255, 255, 255, 0.08);
}
body.mode-light .widget-card.skin-glass {
    background:
        linear-gradient(155deg, rgba(255, 255, 255, 0.88) 0%, rgba(248, 250, 252, 0.72) 55%, rgba(235, 241, 248, 0.76) 100%),
        var(--bg-glass-1);
    border-color: rgba(15, 23, 42, 0.12);
    box-shadow:
        0 18px 38px -14px rgba(15, 23, 42, 0.16),
        0 2px 6px rgba(15, 23, 42, 0.05),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.98),
        inset 1px 0 0 rgba(255, 255, 255, 0.68);
}
.widget-card.skin-glass::before {
    content: ''; position: absolute; inset: 0 0 auto 0; height: 1px; pointer-events: none; z-index: 2;
    background: linear-gradient(90deg, transparent 5%, rgba(255, 255, 255, 0.44) 48%, transparent 95%);
    opacity: 0.78;
}
body.mode-light .widget-card.skin-glass::before {
    background: linear-gradient(90deg, transparent 5%, #FFFFFF 50%, transparent 95%);
    opacity: 0.95;
}

/* 2. ACRYLIC / NEO-GLASS (Deep Multi-Layer Specular Acrylic) */
.widget-card.skin-acrylic,
.widget-card.skin-neoglass {
    background:
        radial-gradient(120% 80% at 10% 0%, rgba(255, 255, 255, 0.16) 0%, transparent 56%),
        linear-gradient(148deg, rgba(255, 255, 255, 0.14) 0%, rgba(255, 255, 255, 0.03) 44%, rgba(var(--a1-rgb), 0.10) 100%),
        var(--bg-glass-1);
    border: 1px solid rgba(255, 255, 255, 0.28);
    backdrop-filter: blur(36px) saturate(195%);
    box-shadow:
        0 26px 56px -14px rgba(0, 0, 0, 0.62),
        0 4px 12px rgba(0, 0, 0, 0.22),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.46),
        inset 1px 0 0 rgba(255, 255, 255, 0.18),
        inset 0 -1px 0 rgba(255, 255, 255, 0.08);
}
body.mode-light .widget-card.skin-acrylic,
body.mode-light .widget-card.skin-neoglass {
    background:
        radial-gradient(120% 80% at 10% 0%, rgba(255, 255, 255, 0.98) 0%, transparent 56%),
        linear-gradient(150deg, rgba(255, 255, 255, 0.92) 0%, rgba(243, 247, 253, 0.80) 60%, rgba(var(--a1-rgb), 0.09) 100%);
    border-color: rgba(15, 23, 42, 0.11);
    box-shadow:
        0 20px 44px -14px rgba(15, 23, 42, 0.18),
        0 2px 6px rgba(15, 23, 42, 0.05),
        inset 0 1.5px 0 #FFFFFF,
        inset 1px 0 0 rgba(255, 255, 255, 0.85),
        inset 0 -1px 0 rgba(15, 23, 42, 0.04);
}
.widget-card.skin-acrylic::before,
.widget-card.skin-neoglass::before {
    content: ''; position: absolute; inset: 0 0 auto 0; height: 1px; pointer-events: none; z-index: 2;
    background: linear-gradient(90deg, transparent 4%, rgba(255, 255, 255, 0.65) 40%, rgba(var(--a1-rgb), 0.35) 75%, transparent 96%);
}

/* 3. FRAMELESS WALLPAPER TYPOGRAPHY (Zero Box, Floats Directly Over Wallpaper) */
.widget-card.skin-frameless {
    background: transparent !important;
    border: 1px solid transparent !important;
    backdrop-filter: none !important;
    box-shadow: none !important;
    text-shadow: 0 2px 18px rgba(0, 0, 0, 0.56), 0 1px 4px rgba(0, 0, 0, 0.44);
    color: #FFFFFF;
}
.widget-card.skin-frameless .w-sub,
.widget-card.skin-frameless .w-title {
    color: rgba(255, 255, 255, 0.84);
}
.widget-card.skin-frameless .w-btn,
.widget-card.skin-frameless .w-ibtn,
.widget-card.skin-frameless .db-pill {
    background: rgba(12, 16, 26, 0.46);
    border-color: rgba(255, 255, 255, 0.22);
    color: #FFFFFF;
    text-shadow: none;
    backdrop-filter: blur(18px) saturate(150%);
}
.widget-card.skin-frameless .w-btn:hover,
.widget-card.skin-frameless .w-ibtn:hover,
.widget-card.skin-frameless .db-pill:hover {
    background: rgba(12, 16, 26, 0.66);
}
.widget-card.skin-frameless .w-btn.primary,
.widget-card.skin-frameless .db-pill.active {
    background: var(--accent-1);
    color: var(--accent-ink);
    border-color: transparent;
}
.widget-card.skin-frameless .ai-row,
.widget-card.skin-frameless .mkt-chip,
.widget-card.skin-frameless .mkt-conv,
.widget-card.skin-frameless .world-cell,
.widget-card.skin-frameless .forecast-slot,
.widget-card.skin-frameless .weath-cell,
.widget-card.skin-frameless .td-row,
.widget-card.skin-frameless .ln-btn,
.widget-card.skin-frameless .db-chip,
.widget-card.skin-frameless .db-task,
.widget-card.skin-frameless .sys-stat-pill {
    background: rgba(12, 16, 26, 0.44);
    border-color: rgba(255, 255, 255, 0.18);
    color: #FFFFFF;
    text-shadow: none;
    backdrop-filter: blur(16px) saturate(145%);
}
.widget-card.skin-frameless .td-inp,
.widget-card.skin-frameless .note-ta,
.widget-card.skin-frameless .mkt-conv-inp,
.widget-card.skin-frameless .mkt-conv-sel {
    background: rgba(12, 16, 26, 0.54);
    border-color: rgba(255, 255, 255, 0.22);
    color: #FFFFFF;
    text-shadow: none;
}
body.mode-light .widget-card.skin-frameless .w-btn,
body.mode-light .widget-card.skin-frameless .w-ibtn,
body.mode-light .widget-card.skin-frameless .db-pill,
body.mode-light .widget-card.skin-frameless .ai-row,
body.mode-light .widget-card.skin-frameless .mkt-chip,
body.mode-light .widget-card.skin-frameless .mkt-conv,
body.mode-light .widget-card.skin-frameless .world-cell,
body.mode-light .widget-card.skin-frameless .forecast-slot,
body.mode-light .widget-card.skin-frameless .weath-cell,
body.mode-light .widget-card.skin-frameless .td-row,
body.mode-light .widget-card.skin-frameless .ln-btn,
body.mode-light .widget-card.skin-frameless .db-chip,
body.mode-light .widget-card.skin-frameless .db-task,
body.mode-light .widget-card.skin-frameless .sys-stat-pill {
    background: rgba(255, 255, 255, 0.78);
    border-color: rgba(15, 23, 42, 0.12);
    color: #111827;
}
body.mode-light .widget-card.skin-frameless .w-sub {
    color: rgba(255, 255, 255, 0.88);
}
body.mode-light .widget-card.skin-frameless .db-chip .w-sub,
body.mode-light .widget-card.skin-frameless .world-cell .w-sub,
body.mode-light .widget-card.skin-frameless .mkt-chip .w-sub,
body.mode-light .widget-card.skin-frameless .sys-stat-pill .w-sub {
    color: #4B5563;
}
body.mode-light .widget-card.skin-frameless .w-btn.primary,
body.mode-light .widget-card.skin-frameless .db-pill.active {
    background: var(--accent-1);
    color: var(--accent-ink);
}
body.mode-light .widget-card.skin-frameless .w-ms-btn.box,
body.mode-light .widget-card.skin-frameless .med-vol-pill {
    background: rgba(255, 255, 255, 0.78);
    border-color: rgba(15, 23, 42, 0.12);
    color: #111827;
    text-shadow: none;
}
body.edit-mode .widget-card.skin-frameless {
    border: 1px dashed rgba(var(--a1-rgb), 0.72) !important;
    background: rgba(10, 14, 24, 0.28) !important;
}

/* 4. BRAUN / DIETER RAMS TACTILE INSTRUMENT */
.widget-card.skin-braun {
    background: var(--braun-bg);
    border: 1px solid var(--braun-border);
    border-radius: 16px;
    box-shadow:
        0 20px 44px -16px rgba(0, 0, 0, 0.60),
        inset 0 1px 0 rgba(255, 255, 255, 0.10),
        inset 0 -2px 0 rgba(0, 0, 0, 0.34);
}
body.mode-light .widget-card.skin-braun {
    box-shadow:
        0 16px 34px -14px rgba(15, 23, 42, 0.18),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.96),
        inset 0 -1.5px 0 rgba(15, 23, 42, 0.07);
}
.widget-card.skin-braun::after {
    content: ''; position: absolute; top: 9px; right: 10px;
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--braun-accent);
    box-shadow: 0 0 8px rgba(249, 115, 22, 0.65);
    pointer-events: none; z-index: 3;
}
.widget-card.skin-braun .w-title {
    font-size: 9.5px; letter-spacing: 0.14em; font-weight: 700;
}

/* 5. DOT-MATRIX / NOTHING HARDWARE */
.widget-card.skin-matrix {
    background-color: var(--matrix-bg);
    background-image: radial-gradient(var(--matrix-dot) 1.15px, transparent 1.15px);
    background-size: 10px 10px;
    border: 1px solid var(--border-rim);
    border-radius: 18px;
    backdrop-filter: blur(24px) saturate(140%);
    box-shadow:
        0 22px 46px -16px rgba(0, 0, 0, 0.60),
        inset 0 1px 0 rgba(255, 255, 255, 0.10);
}
body.mode-light .widget-card.skin-matrix {
    box-shadow:
        0 16px 34px -14px rgba(15, 23, 42, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
}
.widget-card.skin-matrix::before,
.widget-card.skin-matrix::after {
    content: ''; position: absolute; width: 8px; height: 8px; pointer-events: none; z-index: 3;
    border-color: rgba(var(--a1-rgb), 0.62); border-style: solid;
}
.widget-card.skin-matrix::before { top: 7px; left: 7px; border-width: 1.5px 0 0 1.5px; border-radius: 2px 0 0 0; }
.widget-card.skin-matrix::after { bottom: 7px; right: 7px; border-width: 0 1.5px 1.5px 0; border-radius: 0 0 2px 0; }
.widget-card.skin-matrix .w-title {
    font-family: 'Cascadia Mono', 'Consolas', monospace;
    font-size: 9.5px; letter-spacing: 0.14em;
}

/* 6. EDITORIAL SWISS MATTE / PORCELAIN */
.widget-card.skin-editorial {
    background: var(--editorial-bg);
    border: 1px solid var(--editorial-line);
    border-radius: 14px;
    box-shadow:
        0 16px 38px -14px rgba(0, 0, 0, 0.40),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
}
body.mode-light .widget-card.skin-editorial {
    box-shadow:
        0 14px 32px -12px rgba(15, 23, 42, 0.13),
        0 1px 3px rgba(15, 23, 42, 0.05),
        inset 0 1px 0 #FFFFFF;
}
.widget-card.skin-editorial::before {
    content: ''; position: absolute; left: 0; top: 14px; bottom: 14px; width: 2.5px; border-radius: 0 3px 3px 0;
    background: var(--accent-1); opacity: 0.85; pointer-events: none; z-index: 2;
}
.widget-card.skin-editorial .w-head {
    padding-bottom: 8px; margin-bottom: 10px;
    border-bottom: 1px solid var(--editorial-line);
}

/* Edit Mode Overlay */
body.edit-mode .widget-card {
    cursor: grab;
    box-shadow: 0 0 0 1.5px rgba(var(--a1-rgb), 0.65), var(--shadow-w);
}
body.edit-mode .widget-card.dragging {
    cursor: grabbing;
    transform: scale(1.015);
    z-index: 800;
    box-shadow: 0 24px 60px -10px rgba(0, 0, 0, 0.68), 0 0 0 2px var(--accent-1);
}
.w-edit-bar {
    display: none;
    position: absolute; top: 7px; left: 7px; right: 7px;
    justify-content: space-between; align-items: center; gap: 4px;
    padding: 4px 6px; border-radius: 10px;
    background: var(--bg-glass-2);
    border: 1px solid var(--border-rim);
    backdrop-filter: blur(18px);
    z-index: 30;
}
body.edit-mode .widget-card:hover .w-edit-bar,
body.edit-mode .widget-card.dragging .w-edit-bar { display: flex; }

/* Shared Typography & Micro Controls */
.w-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-bottom: 10px;
}
.w-title {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--text-2); min-width: 0;
}
.w-title svg { width: 13px; height: 13px; flex-shrink: 0; color: var(--accent-1); }
.w-sub { font-size: 11px; color: var(--text-2); font-weight: 500; }
.w-badge {
    font-size: 9.5px; font-weight: 700; padding: 2px 7px; border-radius: 999px;
    background: rgba(var(--a1-rgb), 0.14); color: var(--accent-1);
    border: 1px solid rgba(var(--a1-rgb), 0.26); letter-spacing: 0.02em;
    white-space: nowrap; flex-shrink: 0;
}
.w-btn {
    height: 26px; padding: 0 10px; border-radius: 8px;
    border: 1px solid var(--border-subtle); background: var(--bg-card);
    color: var(--text-1); font-size: 11px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    transition: background 0.14s, border-color 0.14s, transform 0.12s var(--ease);
}
.w-btn:hover { background: var(--bg-card-hover); border-color: var(--border-rim); }
.w-btn:active { transform: scale(0.95); }
.w-btn.primary { background: var(--accent-1); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
.w-ibtn {
    width: 26px; height: 26px; border-radius: 8px;
    border: 1px solid var(--border-subtle); background: var(--bg-card);
    color: var(--text-1); cursor: pointer; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.14s, border-color 0.14s, transform 0.12s var(--ease);
}
.w-ibtn:hover { background: var(--bg-card-hover); border-color: var(--border-rim); }
.w-ibtn:active { transform: scale(0.92); }
.w-ibtn.active { background: rgba(var(--a1-rgb), 0.2); border-color: var(--accent-1); color: var(--accent-1); }
.w-ibtn.danger:hover { background: rgba(244, 63, 94, 0.22); border-color: rgba(244, 63, 94, 0.55); color: var(--danger); }
.w-ibtn svg, .w-btn svg { width: 13px; height: 13px; }

/* ═══════════ DAILY BRIEF (GÜNLÜK ÖZET) ═══════════ */
.db-top {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
}
.db-greet {
    font-size: 20px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08;
}
.w-sz-S .db-greet { font-size: 17px; }
.w-sz-L .db-greet { font-size: 23px; }
.db-date { font-size: 11px; color: var(--text-2); font-weight: 600; margin-top: 3px; }
.db-chips {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px;
}
.db-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 9px; border-radius: 999px;
    background: var(--bg-card); border: 1px solid var(--border-subtle);
    font-size: 11px; font-weight: 600; min-width: 0; max-width: 100%;
}
.db-chip.focus-on {
    background: rgba(var(--a1-rgb), 0.16); border-color: rgba(var(--a1-rgb), 0.34); color: var(--accent-1);
}
.db-tasks {
    display: flex; flex-direction: column; gap: 5px; margin-top: 10px;
}
.db-task {
    display: flex; align-items: center; gap: 8px; padding: 6px 9px; border-radius: 10px;
    background: var(--bg-card); border: 1px solid var(--border-subtle);
    font-size: 11.5px; cursor: pointer;
    transition: background 0.13s, border-color 0.13s;
}
.db-task:hover { background: var(--bg-card-hover); border-color: var(--border-rim); }
.db-pills {
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 10px;
}
.db-pill {
    height: 28px; padding: 0 8px; border-radius: 9px;
    border: 1px solid var(--border-subtle); background: var(--bg-card);
    color: var(--text-1); font-size: 11px; font-weight: 700; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    transition: background 0.14s, border-color 0.14s, transform 0.12s var(--ease);
}
.db-pill:hover { background: var(--bg-card-hover); border-color: var(--border-rim); }
.db-pill:active { transform: scale(0.95); }
.db-pill.active { background: var(--accent-1); color: var(--accent-ink); border-color: transparent; }
.db-pill svg { width: 12.5px; height: 12.5px; flex-shrink: 0; }

/* ═══════════ 1. CLOCK WIDGETS ═══════════ */
.clk-swiss-row { display: flex; align-items: baseline; gap: 4px; line-height: 0.94; }
.clk-swiss-hh { font-size: 56px; font-weight: 800; letter-spacing: -0.045em; }
.clk-swiss-sep { font-size: 46px; font-weight: 300; color: var(--accent-1); opacity: 0.85; transform: translateY(-3px); }
.clk-swiss-mm { font-size: 56px; font-weight: 300; letter-spacing: -0.04em; opacity: 0.92; }
.clk-swiss-ss { font-size: 15px; font-weight: 700; color: var(--accent-1); margin-left: 6px; }
.w-sz-S .clk-swiss-hh, .w-sz-S .clk-swiss-mm { font-size: 40px; }
.w-sz-L .clk-swiss-hh, .w-sz-L .clk-swiss-mm { font-size: 68px; }
.clk-sec-track { width: 100%; height: 2px; border-radius: 99px; background: var(--border-subtle); margin: 10px 0 8px; overflow: hidden; }
.clk-sec-fill { height: 100%; background: var(--accent-1); transition: width 0.35s linear; }
.clk-meta-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--text-2); }

/* Editorial Hero Clock */
.clk-ed-hero {
    display: flex; align-items: stretch; gap: 14px; padding: 2px 0;
}
.clk-ed-rail {
    width: 3px; border-radius: 99px; flex-shrink: 0;
    background: linear-gradient(180deg, var(--accent-1), var(--accent-2));
}
.clk-ed-time { font-size: 62px; font-weight: 200; letter-spacing: -0.055em; line-height: 0.9; }
.clk-ed-time strong { font-weight: 800; }
.w-sz-S .clk-ed-time { font-size: 44px; }
.w-sz-L .clk-ed-time { font-size: 74px; }
.clk-ed-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 9px; font-size: 11.5px; }

/* 3D Mechanical Split-Flap */
.flip-stage { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 4px 0 8px; }
.flip-tile {
    position: relative; width: 78px; height: 84px; border-radius: 13px;
    background: linear-gradient(180deg, #1E222B 0%, #151820 49%, #11131A 51%, #1A1E28 100%);
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 10px 24px -8px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    display: flex; align-items: center; justify-content: center;
    font-size: 44px; font-weight: 800; color: #F8FAFC; letter-spacing: -0.03em;
}
body.mode-light .widget-card:not(.skin-frameless) .flip-tile {
    background: linear-gradient(180deg, #FFFFFF 0%, #F4F5F8 49%, #E5E7ED 51%, #F8F9FB 100%);
    color: #111827; border-color: rgba(15, 23, 42, 0.14);
    box-shadow: 0 8px 18px -8px rgba(15, 23, 42, 0.22), inset 0 1px 0 #FFFFFF;
}
.w-sz-S .flip-tile { width: 62px; height: 68px; font-size: 34px; }
.w-sz-L .flip-tile { width: 96px; height: 98px; font-size: 54px; }
.flip-tile::after {
    content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 2px;
    background: rgba(0, 0, 0, 0.45); box-shadow: 0 1px 0 rgba(255, 255, 255, 0.08);
}
.flip-rivet-l, .flip-rivet-r {
    position: absolute; top: calc(50% - 3px); width: 4px; height: 6px; border-radius: 2px;
    background: rgba(148, 163, 184, 0.5); z-index: 2;
}
.flip-rivet-l { left: 4px; } .flip-rivet-r { right: 4px; }
.flip-colon { display: flex; flex-direction: column; gap: 10px; }
.flip-colon span { width: 5px; height: 5px; border-radius: 50%; background: var(--accent-1); opacity: 0.88; }

/* Swiss Chronograph Analog */
.chrono-wrap { display: flex; align-items: center; gap: 14px; }
.chrono-dial { width: 114px; height: 114px; flex-shrink: 0; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.28)); }
.chrono-face { fill: rgba(0, 0, 0, 0.22); }
.chrono-subface { fill: rgba(0, 0, 0, 0.14); }
body.mode-light .widget-card:not(.skin-frameless) .chrono-face { fill: rgba(255, 255, 255, 0.82); }
body.mode-light .widget-card:not(.skin-frameless) .chrono-subface { fill: rgba(15, 23, 42, 0.05); }
.w-sz-S .chrono-dial { width: 88px; height: 88px; }
.w-sz-L .chrono-dial { width: 132px; height: 132px; }

/* Dot-Matrix LED Clock */
.dm-box {
    padding: 12px 14px; border-radius: 12px;
    background-color: rgba(0, 0, 0, 0.26);
    background-image: radial-gradient(rgba(255,255,255,0.08) 1px, transparent 1px);
    background-size: 6px 6px;
    border: 1px solid var(--border-subtle);
}
body.mode-light .widget-card:not(.skin-frameless) .dm-box {
    background-color: rgba(15, 23, 42, 0.04);
    background-image: radial-gradient(rgba(15, 23, 42, 0.08) 1px, transparent 1px);
}
.dm-time { font-size: 42px; font-weight: 800; letter-spacing: 0.08em; color: var(--text-1); line-height: 1; }
.w-sz-S .dm-time { font-size: 30px; }
.dm-dots { display: flex; gap: 3px; margin-top: 10px; }
.dm-dots span { flex: 1; height: 4px; border-radius: 99px; background: var(--border-subtle); }
.dm-dots span.on { background: var(--accent-1); }

/* Turkish Typographic Word Clock */
.word-clk-main { font-size: 26px; font-weight: 800; line-height: 1.12; letter-spacing: -0.025em; }
.word-clk-min { font-size: 24px; font-weight: 300; line-height: 1.14; color: var(--accent-1); }

/* World Horizon */
.world-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
.w-sz-S .world-list { grid-template-columns: 1fr; gap: 5px; }
.world-cell {
    padding: 8px 10px; border-radius: 11px;
    background: var(--bg-card); border: 1px solid var(--border-subtle);
    display: flex; flex-direction: column; justify-content: space-between; gap: 5px; min-width: 0;
}
.world-cell-top, .world-cell-bot {
    display: flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 0;
}
.world-city-name {
    font-size: 11px; color: var(--text-1); font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.world-utc-lbl {
    font-size: 9.5px; color: var(--text-2); font-weight: 600; opacity: 0.85; white-space: nowrap;
}
.world-day-pill {
    display: inline-flex; align-items: center; gap: 3px; flex-shrink: 0;
    font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 999px;
    border: 1px solid transparent; white-space: nowrap;
}
.world-day-pill.day { background: rgba(251, 191, 36, 0.16); color: #F59E0B; border-color: rgba(251, 191, 36, 0.28); }
.world-day-pill.night { background: rgba(129, 140, 248, 0.16); color: #818CF8; border-color: rgba(129, 140, 248, 0.28); }

/* ═══════════ 2. MEDIA WIDGETS ═══════════ */
.med-ambient-bg {
    position: absolute; inset: -24px; background-size: cover; background-position: center;
    filter: blur(28px) saturate(145%) brightness(0.55); opacity: 0.38; pointer-events: none; z-index: 0;
}
body.mode-light .med-ambient-bg { filter: blur(28px) saturate(135%) brightness(1.1); opacity: 0.22; }
.med-fg { position: relative; z-index: 1; }
.med-row { display: flex; align-items: center; gap: 13px; }
.med-art {
    width: 62px; height: 62px; border-radius: 13px; flex-shrink: 0; overflow: hidden;
    background: linear-gradient(135deg, rgba(var(--a1-rgb), 0.28), rgba(var(--a2-rgb), 0.22));
    border: 1px solid var(--border-rim);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 22px -8px rgba(0, 0, 0, 0.45);
}
.med-art img { width: 100%; height: 100%; object-fit: cover; display: block; }
.med-title { font-size: 13.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.med-artist { font-size: 11.5px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.med-ctrls { display: flex; align-items: center; gap: 6px; margin-top: 9px; }

/* Studio Reference-Grade Seek Bar & Borderless Horizontal Strip */
.w-seek-row {
    display: flex; align-items: center; gap: 7px; margin-top: 7px; width: 100%;
}
.w-seek-time {
    font-size: 10px; font-weight: 600; color: var(--text-2);
    font-variant-numeric: tabular-nums; min-width: 26px;
}
.w-seek-time.end { text-align: right; }
.w-seek-track {
    position: relative; flex: 1; height: 16px;
    display: flex; align-items: center; cursor: pointer;
}
.w-seek-rail {
    position: relative; width: 100%; height: 3px; border-radius: 99px;
    background: rgba(255, 255, 255, 0.22);
}
body.mode-light .widget-card:not(.skin-frameless) .w-seek-rail {
    background: rgba(15, 23, 42, 0.16);
}
.w-seek-fill {
    position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px;
    background: var(--text-1); pointer-events: none; transition: width 0.12s linear;
}
.w-seek-knob {
    position: absolute; top: 50%; width: 9px; height: 9px; border-radius: 50%;
    background: var(--text-1); transform: translate(-50%, -50%);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.45); pointer-events: none;
    transition: transform 0.12s var(--ease);
}
.w-seek-track:hover .w-seek-knob { transform: translate(-50%, -50%) scale(1.24); }
.med-strip-row {
    display: flex; align-items: center; gap: 11px; min-width: 0;
}
.med-strip-meta {
    min-width: 84px; flex: 0 1 148px; overflow: hidden;
}
.med-strip-ctrls {
    display: inline-flex; align-items: center; gap: 3px; flex-shrink: 0;
}
.w-ms-btn {
    width: 25px; height: 26px; border-radius: 7px;
    border: none; background: transparent; color: var(--text-1);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    opacity: 0.88; transition: background 0.12s, opacity 0.12s, transform 0.1s;
}
.w-ms-btn:hover { background: rgba(255,255,255,0.12); opacity: 1; }
.w-ms-btn.box {
    width: 28px; height: 28px; border-radius: 8px; opacity: 1;
    background: rgba(255,255,255,0.13); border: 1px solid rgba(255,255,255,0.10);
    backdrop-filter: blur(12px);
}
body.mode-light .widget-card:not(.skin-frameless) .w-ms-btn:hover { background: rgba(15,23,42,0.08); }
body.mode-light .widget-card:not(.skin-frameless) .w-ms-btn.box {
    background: rgba(15,23,42,0.07); border-color: rgba(15,23,42,0.10);
}
.w-ms-btn svg { width: 13px; height: 13px; }

/* Animated 4-Bar Equalizer */
.eq-bars { display: inline-flex; align-items: flex-end; gap: 2.5px; height: 13px; }
.eq-bars i {
    display: block; width: 2.5px; border-radius: 99px; background: var(--accent-1);
    height: 4px; transition: height 0.2s;
}
.eq-bars.play i:nth-child(1) { animation: eqWave 0.72s ease-in-out infinite alternate; }
.eq-bars.play i:nth-child(2) { animation: eqWave 0.54s ease-in-out 0.14s infinite alternate; }
.eq-bars.play i:nth-child(3) { animation: eqWave 0.86s ease-in-out 0.08s infinite alternate; }
.eq-bars.play i:nth-child(4) { animation: eqWave 0.62s ease-in-out 0.22s infinite alternate; }
@keyframes eqWave { from { height: 3px; } to { height: 13px; } }

/* Realistic Vinyl Turntable + Grooves + Tonearm */
.tt-stage { position: relative; width: 82px; height: 74px; flex-shrink: 0; }
.tt-disc {
    width: 72px; height: 72px; border-radius: 50%; overflow: hidden; position: relative;
    background:
        conic-gradient(from 35deg, transparent 0deg, rgba(255,255,255,0.12) 22deg, transparent 48deg, transparent 180deg, rgba(255,255,255,0.10) 202deg, transparent 228deg),
        repeating-radial-gradient(circle at center, #0d0f14 0px, #191d25 1.5px, #0b0d12 3px);
    border: 1.5px solid rgba(255, 255, 255, 0.20);
    box-shadow: 0 12px 24px -6px rgba(0, 0, 0, 0.60), inset 0 0 0 1px rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: center;
}
.tt-disc.spin { animation: spinSlow 9s linear infinite; }
.tt-disc img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid #0B0D12; }
.tt-spindle { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: #E2E8F0; box-shadow: 0 0 0 1.5px #090B10; }
.tt-arm {
    position: absolute; top: 2px; right: 0; width: 22px; height: 56px; pointer-events: none;
    transform-origin: 15px 8px; transform: rotate(-22deg); transition: transform 0.35s var(--ease);
}
.tt-arm.engaged { transform: rotate(9deg); }
@keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

/* Hardware Tape Deck */
.deck-window {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 12px; border-radius: 10px; margin-bottom: 8px;
    background: rgba(0, 0, 0, 0.24); border: 1px solid var(--border-subtle);
}
body.mode-light .widget-card:not(.skin-frameless) .deck-window { background: rgba(15, 23, 42, 0.05); }
.deck-reel { width: 24px; height: 24px; color: var(--accent-1); flex-shrink: 0; }
.deck-reel.spin { animation: spinSlow 3.6s linear infinite; }

/* ═══════════ 3. WEATHER WIDGETS (RICH VECTOR) ═══════════ */
.weath-hero { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.weath-temp { font-size: 44px; font-weight: 800; letter-spacing: -0.04em; line-height: 0.96; }
.weath-svg { width: 60px; height: 60px; flex-shrink: 0; }
.weath-meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
.weath-cell { padding: 6px 9px; border-radius: 9px; background: var(--bg-card); border: 1px solid var(--border-subtle); font-size: 10.5px; }
.weath-sky-card {
    margin: calc(var(--wp-y) * -1) calc(var(--wp-x) * -1);
    padding: var(--wp-y) var(--wp-x);
    min-height: 150px; position: relative; overflow: hidden; color: #FFFFFF;
}
.weath-sky-card.sky-day { background: linear-gradient(155deg, #0369A1 0%, #0EA5E9 52%, #38BDF8 100%); }
.weath-sky-card.sky-night { background: linear-gradient(155deg, #070B1E 0%, #1E1B4B 58%, #312E81 100%); }
.weath-sky-card.sky-rain { background: linear-gradient(155deg, #1E293B 0%, #334155 55%, #0F172A 100%); }
.weath-sky-card.sky-sunset { background: linear-gradient(155deg, #7C2D12 0%, #EA580C 52%, #F59E0B 100%); }
.weath-sky-card.sky-snow { background: linear-gradient(155deg, #334155 0%, #475569 52%, #64748B 100%); }
.weath-atmo-pills {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px;
}
.weath-atmo-pill {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 8px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(12px);
    font-size: 10.5px; font-weight: 600; color: #FFFFFF;
}
.weath-atmo-pill svg { width: 12px; height: 12px; opacity: 0.9; }

/* ═══════════ 4. AI QUOTA STUDIO ═══════════ */
.ai-list { display: flex; flex-direction: column; gap: 7px; }
.ai-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px;
    background: var(--bg-card); border: 1px solid var(--border-subtle);
}
.ai-emblem {
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border-subtle);
}
body.mode-light .widget-card:not(.skin-frameless) .ai-emblem {
    background: rgba(15, 23, 42, 0.05); border-color: rgba(15, 23, 42, 0.10);
}
.ai-emblem svg { width: 16px; height: 16px; }
.ai-bar { height: 4px; border-radius: 99px; background: var(--border-subtle); overflow: hidden; margin-top: 5px; }
.ai-fill { height: 100%; border-radius: 99px; transition: width 0.35s var(--ease); }

/* ═══════════ 5. BATTERY MULTI-RING & SYSTEM COCKPIT ═══════════ */
.rings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(68px, 1fr)); gap: 8px; text-align: center; }
.ring-item { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.ring-svg { width: 60px; height: 60px; }
.ring-lbl { font-size: 10.5px; font-weight: 600; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 84px; }
.bar-track { height: 6px; border-radius: 99px; background: var(--border-subtle); overflow: hidden; }
body.mode-light .widget-card:not(.skin-frameless) .bar-track { background: rgba(15, 23, 42, 0.11); }
.bar-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent-1), var(--accent-2)); transition: width 0.35s var(--ease); }

.cockpit-top {
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;
}
.cockpit-gauge {
    display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 12px;
    background: var(--bg-card); border: 1px solid var(--border-subtle);
}
.cockpit-net-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-top: 8px; padding: 6px 10px; border-radius: 10px;
    background: var(--bg-card); border: 1px solid var(--border-subtle);
    font-size: 11px;
}
.cockpit-disks {
    display: flex; flex-direction: column; gap: 5px; margin-top: 8px;
}

/* ═══════════ 6. OTHER WIDGETS ═══════════ */
.cal-day-num { font-size: 38px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; color: var(--accent-1); }
.note-ta {
    width: 100%; min-height: 92px; resize: none; border-radius: 10px;
    border: 1px solid var(--border-subtle); background: var(--bg-card);
    color: var(--text-1); font: inherit; font-size: 12px; line-height: 1.5;
    padding: 9px 10px; outline: none; user-select: text;
}
.note-ta:focus { border-color: var(--accent-1); }
.ln-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
.ln-btn {
    padding: 8px 4px; border-radius: 11px; border: 1px solid var(--border-subtle);
    background: var(--bg-card); color: var(--text-1); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    transition: background 0.14s, transform 0.12s var(--ease);
}
.ln-btn:hover { background: var(--bg-card-hover); transform: translateY(-1px); }
.ln-btn img { width: 22px; height: 22px; border-radius: 6px; }
.ln-btn span { font-size: 9.5px; font-weight: 600; max-width: 58px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.td-inp-row { display: flex; gap: 6px; margin-bottom: 8px; }
.td-inp {
    flex: 1; min-width: 0; height: 28px; border-radius: 8px;
    border: 1px solid var(--border-subtle); background: var(--bg-card);
    color: var(--text-1); font: inherit; font-size: 11.5px; padding: 0 9px; outline: none; user-select: text;
}
.td-inp:focus { border-color: var(--accent-1); }
.td-list { display: flex; flex-direction: column; gap: 5px; max-height: 140px; overflow-y: auto; }
.td-row {
    display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: 9px;
    background: var(--bg-card); border: 1px solid var(--border-subtle); font-size: 11.5px;
}
.td-chk {
    width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--border-rim);
    background: transparent; cursor: pointer; flex-shrink: 0;
    display: inline-flex; align-items: center; justify-content: center; color: var(--accent-ink);
}
.td-chk.done { background: var(--accent-1); border-color: var(--accent-1); }
.td-txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.td-txt.done { text-decoration: line-through; opacity: 0.5; }
.mkt-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }

    document.body.classList.remove('radius-sharp', 'radius-modern', 'radius-soft');
    document.body.classList.add('radius-' + (radiusPreset || 'modern'));

    root.setProperty('--bg-glass-1', `rgba(${hexToRgb(c.surface1)}, ${op.toFixed(2)})`);
    root.setProperty('--bg-glass-2', `rgba(${hexToRgb(c.surface2)}, ${Math.min(0.98, op + 0.08).toFixed(2)})`);

function buildRingSvg(pct, color, label, subIcon, isCharging = false) {
    const p = Math.max(0, Math.min(100, Number(pct) || 0));
    const r = 23, c = 2 * Math.PI * r;
    const off = c * (1 - p / 100);
    return `
        <div class="ring-item">
            <svg class="ring-svg" viewBox="0 0 58 58">
                <circle cx="29" cy="29" r="${r}" fill="none" stroke="var(--border-subtle)" stroke-width="4.8"/>
                <circle cx="29" cy="29" r="${r}" fill="none" stroke="${color}" stroke-width="4.8"
                    stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
                    transform="rotate(-90 29 29)"/>
                <text x="29" y="${isCharging ? 31 : 33}" text-anchor="middle" fill="currentColor" font-size="11.5" font-weight="800" class="num">${p}%</text>
                ${isCharging ? `<path d="M30.5 34.5 27.5 39h2.2l-.4 3.5 3-4.5h-2.2l.4-3.5z" fill="${color}"/>` : ''}
            </svg>
            <div class="ring-lbl" title="${escHtml(label)}">${subIcon ? `<span style="display:inline-flex;vertical-align:-2px;margin-right:3px;width:11px;height:11px;color:${color};">${subIcon}</span>` : ''}${escHtml(label)}</div>

}

function buildRadialGaugeSvg(pct, color) {
    const p = Math.max(0, Math.min(100, Number(pct) || 0));
    const r = 18, c = 2 * Math.PI * r;
    const off = c * (1 - p / 100);
    return `<svg viewBox="0 0 46 46" width="44" height="44" style="flex-shrink:0;">
        <circle cx="23" cy="23" r="${r}" fill="none" stroke="var(--border-subtle)" stroke-width="4.2"/>
        <circle cx="23" cy="23" r="${r}" fill="none" stroke="${color}" stroke-width="4.2" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 23 23)"/>
        <text x="23" y="26.5" text-anchor="middle" fill="currentColor" font-size="10.5" font-weight="800" class="num">${p}%</text>
    </svg>`;
}

function buildSparklineSvg(arr, color, idSuffix) {
    const pts = (Array.isArray(arr) && arr.length > 1) ? arr : [10, 14, 12, 18, 15, 22, 19, 24];
    const maxV = Math.max(20, ...pts);
    const w = 132, h = 34;
    const coords = pts.map((v, i) => {
        const x = (i / (pts.length - 1)) * w;
        const y = h - 3 - ((Math.max(0, v) / maxV) * (h - 6));
        return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    const poly = coords.join(' ');
    const area = `0,${h} ${poly} ${w},${h}`;
    return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;display:block;overflow:visible;">
        <defs><linearGradient id="sg-${idSuffix}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${color}" stop-opacity="0.34"/>
            <stop offset="100%" stop-color="${color}" stop-opacity="0.0"/>
        </linearGradient></defs>
        <polygon points="${area}" fill="url(#sg-${idSuffix})"/>
        <polyline points="${poly}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
}

function getTzUtcOffsetLabel(tz, now) {
    try {
        const parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: 'shortOffset' }).formatToParts(now);
        const raw = parts.find(p => p.type === 'timeZoneName')?.value || '';
        return raw.replace('GMT', 'UTC') || 'UTC';
    } catch (_) {
        return 'UTC';
    }
}
