        <!DOCTYPE html>
        <html lang="tr">
        <head>
        <meta charset="UTF-8">
        <style>
        :root {
    --bg-glass-1: rgba(15, 23, 42, 0.90);
    --bg-glass-2: rgba(22, 32, 56, 0.94);
    --bg-card: rgba(255, 255, 255, 0.045);
    --bg-card-hover: rgba(255, 255, 255, 0.09);
    --bg-inset: rgba(0, 0, 0, 0.28);
    --border-rim: rgba(255, 255, 255, 0.14);
    --border-subtle: rgba(255, 255, 255, 0.075);
    --text-1: #F8FAFC;
    --text-2: #B6C4D8;
    --accent-1: #38BDF8;
    --accent-2: #818CF8;
    --a1-rgb: 56, 189, 248;
    --a2-rgb: 129, 140, 248;
    --accent-soft: rgba(var(--a1-rgb), 0.13);
    --accent-tint: rgba(var(--a1-rgb), 0.22);
    --accent-ring: rgba(var(--a1-rgb), 0.46);
    --accent-glow: rgba(var(--a1-rgb), 0.30);
    --accent-ink: #04101F;
    --success: #34D399;
    --warning: #FBBF24;
    --danger: #FB7185;
    --radius-shell: 22px;
    --radius-card: 15px;
    --radius-item: 12px;
    --radius-btn: 999px;
    --shadow-shell:
        0 22px 54px -14px rgba(0, 0, 0, 0.72),
        0 4px 16px -4px rgba(0, 0, 0, 0.38),
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        inset 0 0 0 0.5px rgba(255, 255, 255, 0.07);
    --font: 'Segoe UI Variable Display', 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
    --font-mono: 'Cascadia Mono', 'JetBrains Mono', ui-monospace, Consolas, monospace;
    --spring: cubic-bezier(0.22, 1.12, 0.36, 1);
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
* { box-sizing: border-box; user-select: none; -webkit-user-drag: none; }
html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent !important;
    overflow: hidden;
    font-family: var(--font);
    color: var(--text-1);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.01em;
}
.num { font-variant-numeric: tabular-nums; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.28); border-radius: 99px; }
.svg-ic {
    width: 15px; height: 15px; display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0; stroke: currentColor; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
}
.svg-ic.sm { width: 13px; height: 13px; }
.svg-ic.lg { width: 18px; height: 18px; }

/* ========== BASE OPTICAL SHELL (Liquid Glass 26 Default) ========== */
.glass-shell {
    position: relative;
    background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.11) 0%, rgba(255, 255, 255, 0.025) 34%, transparent 64%),
        radial-gradient(ellipse 68% 58% at 18% 0%, rgba(var(--a1-rgb), 0.12), transparent 66%),
        radial-gradient(ellipse 52% 46% at 86% 100%, rgba(var(--a2-rgb), 0.09), transparent 62%),
        linear-gradient(165deg, var(--bg-glass-1), var(--bg-glass-2));
    border: 1px solid var(--border-rim);
    box-shadow: var(--shadow-shell);
}

/* ========== 2026 ARCHITECTURAL VISUAL STYLES (Distinct Silhouette, Material, Texture & Controls) ========== */

/* 1. LIQUID GLASS 26 — Apple macOS Tahoe / iOS 26 Refractive Optical Crystal */
body.style-liquid-glass {
    --radius-shell: 24px;
    --radius-card: 17px;
    --radius-item: 13px;
    --radius-btn: 999px;
}
body.style-liquid-glass .glass-shell {
    background:
        linear-gradient(180deg, rgba(255,255,255,0.13) 0%, rgba(255,255,255,0.03) 34%, transparent 66%),
        radial-gradient(ellipse 66% 54% at 22% 0%, rgba(var(--a1-rgb), 0.14), transparent 65%),
        radial-gradient(ellipse 50% 45% at 85% 100%, rgba(var(--a2-rgb), 0.09), transparent 64%),
        linear-gradient(165deg, var(--bg-glass-1), var(--bg-glass-2));
    border: 1px solid rgba(255, 255, 255, 0.22);
    box-shadow:
        0 26px 58px -14px rgba(0, 0, 0, 0.72),
        0 6px 20px -6px rgba(0, 0, 0, 0.42),
        inset 0 1.5px 0 rgba(255, 255, 255, 0.34),
        inset 0 -1px 0 rgba(255, 255, 255, 0.07);
}

/* 2. BENTO SILK — Scandinavian Tactile Porcelain & Layered Ceramic (Zero Neon Glow, Real Elevation!) */
body.style-bento-silk {
    --radius-shell: 22px;
    --radius-card: 16px;
    --radius-item: 13px;
    --radius-btn: 11px;
}
body.style-bento-silk .glass-shell {
    background: linear-gradient(180deg, var(--bg-glass-1), var(--bg-glass-2));
    border: 1px solid rgba(20, 22, 26, 0.13);
    box-shadow:
        0 22px 46px -14px rgba(20, 22, 26, 0.22),
        0 6px 16px -4px rgba(20, 22, 26, 0.11),
        inset 0 1px 0 rgba(255, 255, 255, 0.94);
}
body.style-bento-silk:not(.mode-light) .glass-shell {
    border-color: rgba(255, 255, 255, 0.15);
    box-shadow:
        0 22px 46px -14px rgba(0, 0, 0, 0.62),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
}
body.style-bento-silk .pill-btn {
    border-radius: 10px;
    border: 1px solid var(--border-rim);
    border-bottom-width: 2px;
    box-shadow: 0 1px 2px rgba(20, 22, 26, 0.06);
}
body.style-bento-silk.mode-light .pill-btn:not(.accent):not(.subtle) {
    background: rgba(255, 255, 255, 0.86);
}
body.style-bento-silk.mode-light .pill-btn:not(.accent):not(.subtle):hover {
    background: #FFFFFF;
    border-color: rgba(20, 22, 26, 0.22);
}
body.style-bento-silk .pill-btn.accent {
    background: var(--accent-1);
    border-color: rgba(0, 0, 0, 0.18);
    border-bottom-width: 2px;
    box-shadow: 0 2px 6px rgba(20, 22, 26, 0.14);
}
body.style-bento-silk .micro-btn {
    border-radius: 10px;
    border: 1px solid var(--border-subtle);
    border-bottom-width: 2px;
}
body.style-bento-silk.mode-light .micro-btn:not(.active) {
    background: rgba(255, 255, 255, 0.78);
}

/* 3. LINEAR SWISS — Raycast / Linear / Vercel Matte Carbon, Razor 1px Hairlines, Zero Glow */
body.style-linear-precision {
    --radius-shell: 10px;
    --radius-card: 7px;
    --radius-item: 7px;
    --radius-btn: 6px;
}
body.style-linear-precision .glass-shell {
    background: var(--bg-glass-1);
    border: 1px solid var(--border-rim);
    box-shadow:
        0 18px 40px -12px rgba(0, 0, 0, 0.72),
        inset 0 1px 0 rgba(255, 255, 255, 0.065);
}
body.style-linear-precision .pill-btn {
    border-radius: 6px;
    font-weight: 600;
    letter-spacing: -0.015em;
    transition: background 0.10s ease, border-color 0.10s ease, color 0.10s ease;
}
body.style-linear-precision .pill-btn:hover { transform: none; }
body.style-linear-precision .pill-btn.accent {
    background: var(--accent-1);
    box-shadow: none;
    border: 1px solid rgba(255, 255, 255, 0.16);
}
body.style-linear-precision .micro-btn {
    border-radius: 6px;
    transition: background 0.10s ease, border-color 0.10s ease, color 0.10s ease;
}

/* 4. MONO MATRIX — Refined Architectural Micro-Grid & Precision Hardware */
body.style-mono-matrix {
    --radius-shell: 20px;
    --radius-card: 14px;
    --radius-item: 12px;
    --radius-btn: 999px;
}
body.style-mono-matrix .glass-shell {
    background:
        radial-gradient(rgba(255, 255, 255, 0.032) 1px, transparent 1px),
        linear-gradient(180deg, rgba(16, 20, 30, 0.92), rgba(10, 13, 20, 0.96));
    background-size: 14px 14px, 100% 100%;
    border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow:
        0 24px 54px -14px rgba(0, 0, 0, 0.78),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
}
body.style-mono-matrix.mode-light .glass-shell {
    background:
        radial-gradient(rgba(15, 23, 42, 0.04) 1px, transparent 1px),
        linear-gradient(180deg, rgba(250, 252, 255, 0.92), rgba(238, 243, 250, 0.95));
    background-size: 14px 14px, 100% 100%;
    border-color: rgba(15, 23, 42, 0.14);
}
body.style-mono-matrix .num,
body.style-mono-matrix .drop-time,
body.style-mono-matrix .card-title,
body.style-mono-matrix .studio-sec-lbl,
body.style-mono-matrix .tab,
body.style-mono-matrix .count-pill,
body.style-mono-matrix .acc-count,
body.style-mono-matrix .hover-label,
body.style-mono-matrix .wcag-pill {
    font-family: var(--font-mono);
    letter-spacing: 0.03em;
}
body.style-mono-matrix .pill-btn {
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.14);
    font-family: var(--font);
    font-size: 11px;
    font-weight: 600;
}
body.style-mono-matrix .pill-btn.accent {
    background: var(--accent-1);
    color: var(--accent-ink);
    box-shadow: 0 6px 18px -6px rgba(var(--a1-rgb), 0.55);
    border-color: var(--accent-1);
}
body.style-mono-matrix .micro-btn {
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.12);
}
body.style-mono-matrix .micro-btn:hover {
    border-color: var(--accent-1);
    background: rgba(var(--a1-rgb), 0.14);
}

/* 5. SPATIAL VISION — Apple visionOS 26 Floating Spatial Capsules & Double Frosted Glass Rim */
body.style-spatial-vision {
    --radius-shell: 30px;
    --radius-card: 22px;
    --radius-item: 50%;
    --radius-btn: 999px;
}
body.style-spatial-vision .glass-shell {
    background:
        radial-gradient(ellipse 84% 58% at 50% 0%, rgba(255, 255, 255, 0.16), transparent 64%),
        radial-gradient(ellipse 64% 55% at 15% 100%, rgba(var(--a1-rgb), 0.15), transparent 62%),
        radial-gradient(ellipse 60% 55% at 88% 100%, rgba(var(--a2-rgb), 0.14), transparent 62%),
        linear-gradient(160deg, var(--bg-glass-1), var(--bg-glass-2));
    border: 1.5px solid rgba(255, 255, 255, 0.28);
    box-shadow:
        0 30px 66px -14px rgba(0, 0, 0, 0.72),
        0 0 0 0.5px rgba(255, 255, 255, 0.14),
        inset 0 2px 0 rgba(255, 255, 255, 0.44),
        inset 0 -1.5px 0 rgba(255, 255, 255, 0.12),
        inset 1px 0 0 rgba(255, 255, 255, 0.16),
        inset -1px 0 0 rgba(255, 255, 255, 0.16);
}
body.style-spatial-vision .pill-btn {
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.085);
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
}
body.style-spatial-vision .pill-btn:hover {
    background: rgba(255, 255, 255, 0.18);
    border-color: rgba(255, 255, 255, 0.40);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 6px 18px -6px rgba(0, 0, 0, 0.40);
}
body.style-spatial-vision .pill-btn.accent {
    background: linear-gradient(135deg, rgba(255,255,255,0.28), rgba(var(--a1-rgb),0.45));
    color: var(--text-1);
    border: 1px solid rgba(255, 255, 255, 0.48);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.55), 0 8px 22px -6px var(--accent-glow);
}
body.style-spatial-vision .micro-btn {
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.09);
    border: 1px solid rgba(255, 255, 255, 0.20);
}
body.style-spatial-vision .micro-btn:hover {
    background: rgba(255, 255, 255, 0.22);
    border-color: rgba(255, 255, 255, 0.48);
    box-shadow: 0 0 14px rgba(255, 255, 255, 0.22);
}

/* 6. CYBER HUD — Precision Sci-Fi Chamfered Tactical HUD, Blueprint Grid & Laser Rail */
body.style-cyber-prism {
    --radius-shell: 3px;
    --radius-card: 3px;
    --radius-item: 3px;
    --radius-btn: 3px;
}
body.style-cyber-prism .glass-shell {
    background:
        linear-gradient(var(--accent-1), var(--accent-1)) 0 0 / 12px 2px no-repeat,
        linear-gradient(var(--accent-1), var(--accent-1)) 0 0 / 2px 12px no-repeat,
        linear-gradient(var(--accent-2), var(--accent-2)) 100% 100% / 12px 2px no-repeat,
        linear-gradient(var(--accent-2), var(--accent-2)) 100% 100% / 2px 12px no-repeat,
        linear-gradient(rgba(var(--a1-rgb), 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(var(--a1-rgb), 0.055) 1px, transparent 1px),
        linear-gradient(180deg, var(--bg-glass-1), var(--bg-glass-2));
    background-size: 12px 2px, 2px 12px, 12px 2px, 2px 12px, 16px 16px, 16px 16px, 100% 100%;
    border: 1px solid rgba(var(--a1-rgb), 0.34);
    border-top: 2px solid var(--accent-1);
    box-shadow:
        0 22px 50px -12px rgba(0, 0, 0, 0.88),
        0 0 26px -10px rgba(var(--a1-rgb), 0.32),
        inset 0 1px 16px -6px rgba(var(--a1-rgb), 0.26);
}
body.style-cyber-prism .num,
body.style-cyber-prism .drop-time,
body.style-cyber-prism .card-title,
body.style-cyber-prism .tab,
body.style-cyber-prism .studio-sec-lbl,
body.style-cyber-prism .wcag-pill {
    font-family: var(--font-mono);
    letter-spacing: 0.04em;
}
body.style-cyber-prism .pill-btn {
    border-radius: 3px;
    border: 1px solid rgba(var(--a1-rgb), 0.24);
    background: rgba(var(--a1-rgb), 0.055);
}
body.style-cyber-prism .pill-btn:hover {
    border-color: var(--accent-1);
    background: rgba(var(--a1-rgb), 0.14);
    box-shadow: 0 0 12px -4px var(--accent-glow);
}
body.style-cyber-prism .pill-btn.accent {
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    border-radius: 3px;
    box-shadow: 0 0 16px -4px var(--accent-glow);
}
body.style-cyber-prism .micro-btn {
    border-radius: 3px;
    border: 1px solid rgba(var(--a1-rgb), 0.24);
}

/* 7. HIGH CONTRAST — Zero blur, crisp WCAG AAA outlines */
body.style-high-contrast {
    --radius-shell: 6px;
    --radius-card: 5px;
    --radius-item: 5px;
    --radius-btn: 5px;
}
body.style-high-contrast .glass-shell {
    background: var(--bg-glass-1);
    border: 2px solid var(--border-rim);
    box-shadow: none;
}

/* ========== SHARED TACTILE CONTROLS ========== */
.pill-btn {
    display: inline-flex; align-items: center; gap: 6px;
    height: 29px; padding: 0 11px;
    border-radius: var(--radius-btn);
    border: 1px solid var(--border-subtle);
    background: var(--bg-card);
    color: var(--text-1);
    font-family: var(--font); font-size: 11.5px; font-weight: 600;
    letter-spacing: -0.01em;
    cursor: pointer;
    transition: transform 0.15s var(--ease), background 0.14s, border-color 0.14s, color 0.14s, box-shadow 0.15s;
    white-space: nowrap;
}
.pill-btn:hover { background: var(--bg-card-hover); border-color: var(--border-rim); transform: translateY(-0.5px); }
.pill-btn:active { transform: scale(0.96); }
.pill-btn.accent {
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: var(--accent-ink);
    border-color: transparent;
    box-shadow: 0 6px 18px -5px var(--accent-glow);
}
.pill-btn.accent:hover { filter: brightness(1.06); }
.pill-btn.subtle { background: transparent; border-color: transparent; color: var(--text-2); }
.pill-btn.subtle:hover { background: var(--bg-card); color: var(--text-1); border-color: var(--border-subtle); }
.micro-btn {
    width: 27px; height: 27px; border-radius: 8px;
    border: 1px solid var(--border-subtle);
    background: var(--bg-card);
    color: var(--text-2);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
    transition: all 0.14s var(--ease);
}
.micro-btn:hover { background: var(--bg-card-hover); color: var(--text-1); border-color: var(--accent-ring); }
.micro-btn.active { background: var(--accent-tint); color: var(--accent-1); border-color: var(--accent-ring); }
.micro-btn.danger:hover { background: rgba(251,113,133,0.20); color: var(--danger); border-color: var(--danger); }
/* ========== PROJECT AURORA v3.0 RUST ENGINE VISUAL POLISH ========== */
body.style-mono-matrix .tab.active {
    background: var(--text-1) !important;
    color: #0B0B0E !important;
    font-weight: 800 !important;
}
body.style-mono-matrix.mode-light .tab.active {
    background: #111114 !important;
    color: #FAFAFA !important;
}
body.style-cyber-prism .dock-item.active::after {
    box-shadow: 0 0 12px var(--accent-1), 0 0 4px var(--accent-1) !important;
}
        .stage {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center;
    padding-top: 0;
    pointer-events: none;
}
#crownWrap {
    pointer-events: auto;
    display: flex; flex-direction: column; align-items: center;
    padding: 0 14px 8px 14px;
    max-width: 100vw;
}
#crown {
    pointer-events: auto;
    position: relative;
    max-width: calc(100vw - 20px);
    overflow: hidden;
    transition:
        margin-top 0.30s var(--spring),
        height 0.30s var(--spring),
        border-radius 0.30s var(--spring),
        padding 0.28s var(--ease),
        box-shadow 0.28s var(--ease);
}
/* LIQUID DROPLET RESTING STATE ("Damla") — Zero Tab Clutter! */
#crown.droplet {
    margin-top: 0;
    height: 25px;
    border-top: none;
    border-radius: 0 0 16px 16px;
    padding: 0 15px;
    display: inline-flex; align-items: center; gap: 8px;
    cursor: pointer;
    box-shadow:
        0 10px 26px -6px rgba(0, 0, 0, 0.68),
        0 2px 10px rgba(var(--a1-rgb), 0.16),
        inset 0 -1px 0 rgba(var(--a1-rgb), 0.34);
}
#crown.droplet::after {
    content: '';
    position: absolute; bottom: 0; left: 20%; right: 20%; height: 2px;
    border-radius: 99px;
    background: linear-gradient(90deg, transparent, var(--accent-1), var(--accent-2), transparent);
    opacity: 0.68;
}

/* 2026 ARCHITECTURAL CROWN SILHOUETTES (Unmistakably Distinct Top Form-Factors) */
body.style-liquid-glass #crown.droplet {
    height: 26px;
    border-radius: 0 0 21px 21px;
    padding: 0 17px;
}
body.style-bento-silk #crown.droplet {
    margin-top: 7px;
    height: 27px;
    border-top: 1px solid var(--border-rim);
    border-radius: 999px;
    padding: 0 15px;
    box-shadow: 0 8px 22px -6px rgba(20, 22, 26, 0.20), 0 1px 3px rgba(20, 22, 26, 0.08), inset 0 1px 0 rgba(255,255,255,0.92);
}
body.style-bento-silk #crown.droplet::after { display: none; }
body.style-bento-silk .drop-dot { box-shadow: none; width: 6.5px; height: 6.5px; }

body.style-linear-precision #crown.droplet {
    height: 22px;
    border-radius: 0 0 6px 6px;
    padding: 0 13px 0 15px;
    border-left: 2.5px solid var(--accent-1);
    box-shadow: 0 8px 18px -8px rgba(0, 0, 0, 0.72);
}
body.style-linear-precision #crown.droplet::after { display: none; }
body.style-linear-precision .drop-dot { width: 5px; height: 5px; border-radius: 1px; box-shadow: none; }

body.style-mono-matrix #crown.droplet {
    margin-top: 6px;
    height: 26px;
    border-top: 1.5px solid rgba(255, 255, 255, 0.22);
    border-radius: 999px;
    padding: 0 14px;
}
body.style-mono-matrix #crown.droplet::after { display: none; }
body.style-mono-matrix .drop-dot {
    width: 7px; height: 7px;
    box-shadow: 0 0 0 2px rgba(var(--a1-rgb), 0.28), 0 0 10px var(--accent-1);
}

body.style-spatial-vision #crown.droplet {
    margin-top: 9px;
    height: 29px;
    border-top: 1.5px solid rgba(255, 255, 255, 0.34);
    border-radius: 999px;
    padding: 0 18px;
}
body.style-spatial-vision #crown.droplet::after { display: none; }

body.style-cyber-prism #crown.droplet {
    height: 26px;
    border-radius: 0;
    padding: 0 23px;
    border-top: none;
    border-bottom: 2px solid var(--accent-1);
    clip-path: polygon(0 0, 100% 0, calc(100% - 11px) 100%, 11px 100%);
    box-shadow:
        0 12px 28px -6px rgba(0, 0, 0, 0.88),
        0 0 18px -4px rgba(var(--a1-rgb), 0.42);
}
body.style-cyber-prism #crown.droplet::after {
    left: 12px; right: 12px; height: 2px; opacity: 0.96;
    border-radius: 0;
}
body.style-cyber-prism .drop-dot { width: 6px; height: 6px; border-radius: 0; transform: rotate(45deg); }
body.style-cyber-prism #crown.pill {
    border-radius: 3px;
    clip-path: polygon(9px 0, calc(100% - 9px) 0, 100% 9px, 100% calc(100% - 9px), calc(100% - 9px) 100%, 9px 100%, 0 calc(100% - 9px), 0 9px);
    padding: 0 14px;
}

/* LIVE HARDWARE OSD MORPH INSIDE LIQUID DROPLET */
#crown.droplet.osd-active {
    height: 36px;
    min-width: 242px;
    padding: 0 15px;
    border-radius: 0 0 20px 20px;
    gap: 9px;
    box-shadow:
        0 14px 36px -8px rgba(0, 0, 0, 0.74),
        0 0 18px rgba(var(--a1-rgb), 0.28),
        inset 0 -1px 0 rgba(var(--a1-rgb), 0.55);
}
body.style-bento-silk #crown.droplet.osd-active,

.osd-label {

/* FULL BENTO COMMAND DECK */
#crown.expanded {

.mini-tray-strip {

}

/* Expanded Deck */
.deck-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.tabs {
    display: flex; gap: 4px; background: var(--bg-inset);

}

    display: inline-flex; align-items: center; gap: 6px;

    color: var(--text-2); cursor: pointer; border: none; background: transparent;
    white-space: nowrap; transition: all 0.16s var(--ease); font-family: var(--font);
}
.tab:hover { color: var(--text-1); }

.deck-body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-right: 3px; display: flex; flex-direction: column; }
.bento-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1.10fr); gap: 11px; flex: 1; min-height: 0; }

.card {

}
.card-title {

}
.card-title-l { display: inline-flex; align-items: center; gap: 6px; }
.studio-sec {

}
.studio-sec-lbl {
    font-size: 9.5px; font-weight: 700; text-transform: uppercase;

}
.studio-chip-row {

.studio-tip {

}
.toggle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile {
    padding: 10px 11px; border-radius: calc(var(--radius-card) - 2px); border: 1px solid var(--border-subtle);

}
.tile:hover { background: var(--bg-card-hover); border-color: var(--border-rim); }

}
.tile.on .t-icon { background: var(--accent-tint); color: var(--accent-1); }
.tile .t-name { font-size: 12px; font-weight: 700; }

.slider-row { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }

    width: 100%; height: 86px; resize: none;

/* ========== 2026 STUDIO: ARCHITECTURAL THEME GALLERY & LIVE COLOR CUSTOMIZER ========== */
.theme-gallery {

.theme-card-meta {
    display: flex; align-items: center; justify-content: space-between; gap: 4px; min-width: 0;
}
.theme-card-name {
    font-size: 11px; font-weight: 700; color: var(--text-1);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.theme-card-tag {
    font-size: 9px; font-weight: 700; color: var(--text-2);
    padding: 1px 5px; border-radius: 99px;

}
.theme-card.active .theme-card-tag {
    color: var(--accent-1);
    background: var(--accent-soft);
}

.color-studio {
    margin-top: 8px;
    padding: 8px 9px;
    border-radius: calc(var(--radius-card) - 3px);
    background: var(--bg-inset);
    border: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    gap: 7px;
}
.swatch-row {
    display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
}
.swatch-btn {
    width: 18px; height: 18px; border-radius: 50%;

.wcag-pill {

    pointer-events: auto;

    display: none; flex-direction: column; gap: 11px;
    animation: flyIn 0.20s var(--spring);
}
.flyout-panel.open { display: flex; }
@keyframes flyIn {
    from { opacity: 0; transform: translateY(-8px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}
#trayPopup { width: min(540px, calc(100vw - 24px)); }
#calendarPopup { width: min(400px, calc(100vw - 24px)); }
#dropPopup { width: min(480px, calc(100vw - 24px)); }
#omnibar {
    pointer-events: auto;
    position: fixed; left: 50%; bottom: 62px; transform: translateX(-50%);

    max-height: min(560px, calc(100vh - 110px)); overflow: hidden;
    border-radius: var(--radius-shell); padding: 15px;

    animation: flyUpOmni 0.18s var(--spring);

    from { opacity: 0; transform: translateX(-50%) translateY(14px) scale(0.97); }
    to { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }

.calc-banner {
    padding: 10px 14px; border-radius: 12px;
    background: linear-gradient(135deg, rgba(52,211,153,0.16), var(--accent-soft));
    border: 1px solid var(--success);
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer;

.app-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr));

    position: relative;
    display: flex; align-items: center; gap: 9px;

.app-card img { width: 24px; height: 24px; border-radius: 6px; flex-shrink: 0; }
.app-card .app-name {

.omni-list { max-height: 256px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
.omni-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 11px; border-radius: 11px; cursor: pointer;
    background: var(--bg-card); border: 1px solid transparent;

/* v2.2 Hardware & Productivity Visual Polish */

/* ========== 2026 ARCHITECTURAL COMMAND DECK STYLES (Unmistakable Visual Paradigms) ========== */

/* 1. LIQUID GLASS 26 — Refractive optical glass lenses with luminous inner top highlights */
body.style-liquid-glass .card {
    background:
        linear-gradient(180deg, rgba(255,255,255,0.085) 0%, rgba(255,255,255,0.02) 45%, transparent 100%),
        var(--bg-card);
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.22);
}
body.style-liquid-glass .tab.active {
    box-shadow: 0 4px 16px -4px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.34);
}
body.style-liquid-glass .tile.on {
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 6px 18px -8px var(--accent-glow);
}

/* 2. BENTO SILK — Tactile Elevated Porcelain Bento Cards, Recessed Track & White Paper Tabs (Zero Neon!) */
body.style-bento-silk.mode-light .card {
    background: rgba(255, 255, 255, 0.88);
    border: 1px solid rgba(20, 22, 26, 0.09);
    box-shadow: 0 3px 10px -3px rgba(20, 22, 26, 0.08), 0 1px 2px rgba(20, 22, 26, 0.05);
}
body.style-bento-silk.mode-light .tabs {
    background: rgba(20, 22, 26, 0.065);
    border: 1px solid rgba(20, 22, 26, 0.08);
    border-radius: 13px;
    padding: 3px;
}
body.style-bento-silk.mode-light .tab {
    border-radius: 10px;
}
body.style-bento-silk.mode-light .tab.active {
    background: #FFFFFF;
    color: var(--text-1);
    box-shadow: 0 2px 6px rgba(20, 22, 26, 0.12), 0 0 0 1px rgba(20, 22, 26, 0.06);
}
body.style-bento-silk.mode-light .tile {
    background: rgba(247, 245, 240, 0.85);
    border: 1px solid rgba(20, 22, 26, 0.09);
    border-bottom-width: 2px;
}
body.style-bento-silk.mode-light .tile:hover {
    background: #FFFFFF;
    border-color: rgba(20, 22, 26, 0.16);
}
body.style-bento-silk.mode-light .tile.on {
    background: rgba(var(--a1-rgb), 0.10);
    border-color: var(--accent-1);
}
body.style-bento-silk.mode-light .tile.on .t-icon {
    background: var(--accent-1);
    color: var(--accent-ink);
}
body.style-bento-silk.mode-light .media-hero {
    background: rgba(247, 245, 240, 0.90);
    border: 1px solid rgba(20, 22, 26, 0.10);
}
body.style-bento-silk.mode-light .color-studio {
    background: rgba(20, 22, 26, 0.038);
    border-color: rgba(20, 22, 26, 0.08);
}
body.style-bento-silk.mode-light .omni-input-wrap {
    background: #FFFFFF;
    box-shadow: 0 2px 10px -4px rgba(20, 22, 26, 0.12);
}

/* 3. LINEAR SWISS — Bottom-Underline Tabs, Header-Ruled Flat Cards, Left-Rail Active Tiles (Zero Glow!) */
body.style-linear-precision .tabs {
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border-subtle);
    border-radius: 0;
    padding: 0;
    gap: 2px;
}
body.style-linear-precision .tab {
    border-radius: 6px 6px 0 0;
    padding: 7px 12px;
}
body.style-linear-precision .tab:hover {
    background: rgba(255, 255, 255, 0.035);
}
body.style-linear-precision .tab.active {
    background: rgba(var(--a1-rgb), 0.09);
    color: var(--text-1);
    box-shadow: inset 0 -2px 0 var(--accent-1);
}
body.style-linear-precision .card {
    background: rgba(255, 255, 255, 0.022);
    border: 1px solid var(--border-subtle);
    border-radius: 7px;
    padding: 11px 12px;
}
body.style-linear-precision .card-title {
    padding-bottom: 7px;
    margin-bottom: 9px;
    border-bottom: 1px solid var(--border-subtle);
    font-size: 10px;
    letter-spacing: 0.09em;

.ai-brand-mark { width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

.ai-key-inp {

}

/* ========== v8.1 8 FLAGSHIP DYNAMIC ISLAND FORM FACTORS, CONCAVE EARS, TWIN-SPLIT & MICRO-DECK ========== */
.crown-row {

    pointer-events: none;
}
.crown-wing {

}

body.mode-light .crown-wing {
    box-shadow: 0 8px 20px -6px rgba(15, 23, 42, 0.18), inset 0 1px 0 rgba(255,255,255,0.85);
}

/* 1. LIQUID PILL — Organic living capsule with ambient album glow & live waveform */
body.isl-liquid-pill #crown.droplet:not(.osd-active):not(.rec-live):not(.bt-popin):not(.notif-morph) {
    margin-top: 8px !important; height: 30px !important; min-height: 30px;
    border-top: 1px solid var(--border-rim) !important;
    border-radius: 999px !important; padding: 0 14px !important;
    box-shadow:
        0 12px 30px -8px rgba(0, 0, 0, 0.58),
        0 0 22px -6px var(--accent-glow),
        inset 0 1px 0 rgba(255, 255, 255, 0.28) !important;
}
body.isl-liquid-pill #crown.droplet.media-ambient-live:not(.osd-active):not(.rec-live):not(.bt-popin):not(.notif-morph) {
    background:
        radial-gradient(ellipse 75% 120% at 15% 50%, rgba(var(--a1-rgb), 0.26), transparent 65%),
        radial-gradient(ellipse 65% 120% at 85% 50%, rgba(var(--a2-rgb), 0.20), transparent 65%),
        linear-gradient(165deg, var(--bg-glass-1), var(--bg-glass-2)) !important;
    box-shadow:
        0 14px 34px -8px rgba(0, 0, 0, 0.62),
        0 0 26px -4px var(--accent-glow),
        inset 0 1px 0 rgba(255, 255, 255, 0.34) !important;
}
body.isl-liquid-pill #crown.droplet::after { display: none !important; }

/* 2. MAC NOTCH — Flush top-edge obsidian notch with SVG concave inverse-rounded bezier ears */
body.isl-mac-notch #crown.droplet:not(.bt-popin):not(.notif-morph),
body.isl-mac-notch #crown.live-stage {
    --text-1: #F8FAFC;
    --text-2: #CBD5E1;
    --bg-card: rgba(255, 255, 255, 0.075);
    --bg-card-hover: rgba(255, 255, 255, 0.13);
    --bg-inset: rgba(255, 255, 255, 0.06);
    --border-rim: rgba(255, 255, 255, 0.16);
    --border-subtle: rgba(255, 255, 255, 0.10);
    margin-top: 0 !important;
    background: #06070B !important;
    color: #F8FAFC !important;
    border: 1px solid rgba(255, 255, 255, 0.11) !important;
    border-top: none !important;
    overflow: visible !important;
}
body.isl-mac-notch #crown.droplet:not(.osd-active):not(.rec-live):not(.bt-popin):not(.notif-morph) {
    height: 28px !important; min-width: 196px;
    border-radius: 0 0 16px 16px !important; padding: 0 16px !important;
    box-shadow: 0 10px 26px -6px rgba(0, 0, 0, 0.78) !important;
}
body.isl-mac-notch #crown.droplet::before,
body.isl-mac-notch #crown.droplet::after,
body.isl-mac-notch #crown.live-stage::before,
body.isl-mac-notch #crown.live-stage::after { display: none !important; content: none !important; }
body.isl-mac-notch #crown.live-stage {
    border-radius: 0 0 24px 24px !important;
    background: linear-gradient(180deg, #06070B 0%, #0C101C 100%) !important;
    box-shadow: 0 22px 54px -10px rgba(0, 0, 0, 0.86) !important;
}
.notch-ear {
    position: absolute; top: 0; width: 14px; height: 14px;
    pointer-events: none; z-index: 2;
}
.notch-ear-l { left: -14px; }
.notch-ear-r { right: -14px; }
.notch-cam-dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    background: radial-gradient(circle at 35% 35%, #38BDF8 0%, #1E293B 45%, #020617 100%);
    box-shadow: 0 0 0 1.5px rgba(255,255,255,0.12);
}

/* 3. TWIN SPLIT — Two separate floating top-center micro-capsules with transparent gap, fusing on hover */
body.isl-twin-split #crown.droplet.isl-twin-host {
    margin-top: 8px !important;
    height: 30px !important;
    padding: 0 !important;
    background: transparent !important;
    border: none !important;
    box-shadow: none !important;
    backdrop-filter: none !important;
    overflow: visible !important;
    display: inline-flex !important;
    align-items: center;
    gap: 10px !important;
    border-radius: 0 !important;
}
body.isl-twin-split #crown.droplet.isl-twin-host::after { display: none !important; }
.twin-cap {
    height: 30px; border-radius: 999px; padding: 0 12px;
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 11px; font-weight: 700; color: var(--text-1);
    cursor: pointer; white-space: nowrap;
    transition: transform 0.22s var(--spring), border-color 0.16s, box-shadow 0.2s;
}
.twin-cap:hover { border-color: var(--accent-ring); transform: translateY(-0.5px); }
body.isl-twin-split #crown.live-stage {
    animation: twinFuse 0.24s var(--spring) !important;
}
@keyframes twinFuse {
    from { opacity: 0.72; transform: scaleX(0.86) scaleY(0.72); letter-spacing: 0.04em; }
    to { opacity: 1; transform: scaleX(1) scaleY(1); letter-spacing: normal; }
}

/* 4. HORIZON BAR — Ultra-thin frosted studio glass ribbon with crisp hairline progress */
body.isl-horizon-bar #crown.droplet:not(.osd-active):not(.rec-live):not(.bt-popin):not(.notif-morph) {
    margin-top: 6px !important; height: 28px !important;
    min-width: 396px; max-width: min(550px, calc(100vw - 32px));
    border-radius: 12px !important; padding: 0 14px !important;
    border-top: 1px solid var(--border-rim) !important;
    justify-content: space-between; gap: 12px;
}
body.isl-horizon-bar #crown.droplet::after { display: none !important; }
.horizon-prog-rail {
    position: absolute; left: 10px; right: 10px; bottom: 0; height: 2px;
    border-radius: 99px; background: rgba(148, 163, 184, 0.22); overflow: hidden;
    pointer-events: none;
}
.horizon-prog-fill {
    height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
    transition: width 0.28s ease;
}

/* 5. NOTHING GLYPH — Industrial dot-matrix LED capsule with segmented glyph arcs & mono readout */
body.isl-nothing-glyph #crown.droplet:not(.osd-active):not(.rec-live):not(.bt-popin):not(.notif-morph) {
    margin-top: 7px !important; height: 31px !important;
    background: radial-gradient(rgba(255,255,255,0.065) 1px, transparent 1px), #0B0D12 !important;
    background-size: 7px 7px, 100% 100% !important;
    border: 1px solid rgba(255,255,255,0.20) !important;
    border-radius: 10px !important; padding: 0 13px !important;
    font-family: var(--font-mono);
    color: #F8FAFC !important;
    gap: 9px;
}
body.mode-light.isl-nothing-glyph #crown.droplet:not(.osd-active):not(.rec-live):not(.bt-popin):not(.notif-morph) {
    background: radial-gradient(rgba(15,23,42,0.08) 1px, transparent 1px), #F2EFE9 !important;
    background-size: 7px 7px, 100% 100% !important;
    border-color: rgba(15,23,42,0.20) !important;
    color: #111827 !important;
}
body.isl-nothing-glyph #crown.droplet::after { display: none !important; }
body.isl-nothing-glyph #crown.live-stage {
    border-radius: 14px !important; font-family: var(--font-mono);
    background: radial-gradient(rgba(255,255,255,0.045) 1px, transparent 1px), linear-gradient(180deg, #101218, #08090D) !important;
    background-size: 9px 9px, 100% 100% !important;
}
body.mode-light.isl-nothing-glyph #crown.live-stage {
    background: radial-gradient(rgba(15,23,42,0.06) 1px, transparent 1px), linear-gradient(180deg, #FAF8F4, #ECE8E0) !important;
    background-size: 9px 9px, 100% 100% !important;
    border-color: rgba(15,23,42,0.18) !important;
}
.glyph-arc-svg { width: 20px; height: 20px; flex-shrink: 0; display: block; }
.glyph-led-dot {
    width: 6px; height: 6px; border-radius: 50%; background: #EF4444;
    box-shadow: 0 0 8px #EF4444; flex-shrink: 0;
}

/* 6. ORBITAL RING — Floating circular orb with album art / live focus ring that blooms outward on hover */
body.isl-orbital-ring #crown.droplet:not(.osd-active):not(.rec-live):not(.bt-popin):not(.notif-morph):not(.privacy-alert) {
    margin-top: 7px !important; width: 38px !important; min-width: 38px !important; height: 38px !important;
    padding: 0 !important; border-radius: 50% !important; justify-content: center;
    border: 1.5px solid rgba(255, 255, 255, 0.34) !important;
    box-shadow: 0 10px 26px -6px rgba(0, 0, 0, 0.60), 0 0 18px -4px var(--accent-glow) !important;
}
body.mode-light.isl-orbital-ring #crown.droplet:not(.osd-active):not(.rec-live):not(.bt-popin):not(.notif-morph):not(.privacy-alert) {
    border-color: rgba(15, 23, 42, 0.20) !important;
    box-shadow: 0 8px 22px -6px rgba(15, 23, 42, 0.22), 0 0 14px -4px var(--accent-glow) !important;
}
body.isl-orbital-ring #crown.droplet::after { display: none !important; }
body.isl-orbital-ring #crown.live-stage {
    animation: orbBloom 0.24s var(--spring) !important;
}
@keyframes orbBloom {
    from { opacity: 0.65; transform: scale(0.45); border-radius: 999px; }
    to { opacity: 1; transform: scale(1); }
}
@keyframes orbSpin { to { transform: rotate(360deg); } }
.orb-ring-wrap {
    position: relative; width: 34px; height: 34px;
    display: inline-flex; align-items: center; justify-content: center;
}
.orb-ring-svg { position: absolute; inset: 0; width: 34px; height: 34px; transform: rotate(-90deg); }
.orb-art-disc {
    width: 22px; height: 22px; border-radius: 50%; object-fit: cover;
    animation: orbSpin 10s linear infinite;
}
body.eco-mode .orb-art-disc { animation-play-state: paused !important; }
.orb-core-dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #FFFFFF 0%, var(--accent-1) 55%, var(--accent-2) 100%);
    box-shadow: 0 0 10px var(--accent-glow);
}

/* 7. STUDIO STRIP — Borderless studio horizontal strip: art + 2-line title/artist + progress + quick tools */
body.isl-studio-strip #crown.droplet:not(.osd-active):not(.rec-live):not(.bt-popin):not(.notif-morph) {
    margin-top: 6px !important; height: 44px !important;
    min-width: 396px; max-width: min(548px, calc(100vw - 32px));
    border-radius: 15px !important; padding: 4px 10px 5px 6px !important;
    border: 1px solid var(--border-subtle) !important;
    gap: 9px;
}
body.mode-light.isl-studio-strip #crown.droplet:not(.osd-active):not(.rec-live):not(.bt-popin):not(.notif-morph) {
    background: rgba(255, 255, 255, 0.86) !important;
    border-color: rgba(20, 22, 26, 0.10) !important;
    box-shadow: 0 10px 28px -8px rgba(20, 22, 26, 0.16), inset 0 1px 0 rgba(255,255,255,0.95) !important;
}
body.isl-studio-strip #crown.droplet::after { display: none !important; }
.strip-art {
    width: 32px; height: 32px; border-radius: 9px; object-fit: cover; flex-shrink: 0;
    background: var(--accent-soft); color: var(--accent-1);
    display: inline-flex; align-items: center; justify-content: center;
}
.strip-meta {
    flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 1px;
}
.strip-title {
    font-size: 11.5px; font-weight: 700; color: var(--text-1);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.15;
}
.strip-sub {
    font-size: 9.8px; color: var(--text-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.15;
}
.strip-tools {
    display: inline-flex; align-items: center; gap: 3px; flex-shrink: 0;
}
.strip-tool-btn {
    width: 24px; height: 24px; border-radius: 7px; border: none;
    background: transparent; color: var(--text-2);
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer; transition: background 0.14s, color 0.14s;
}
.strip-tool-btn:hover { background: var(--bg-card-hover); color: var(--text-1); }
.strip-tool-btn.active { background: var(--accent-tint); color: var(--accent-1); }

/* 8. STEALTH HORIZON — Razor-thin 3px glowing top-edge ambient beacon gliding into deck on hover/event */
body.isl-stealth-horizon #crown.droplet:not(.osd-active):not(.rec-live):not(.bt-popin):not(.notif-morph):not(.privacy-alert) {
    margin-top: 0 !important; width: 144px !important; min-width: 144px !important; height: 3px !important;
    padding: 0 !important; border: none !important;
    border-radius: 0 0 6px 6px !important;
    background: linear-gradient(90deg, rgba(var(--a1-rgb),0.48), var(--accent-1), var(--accent-2), rgba(var(--a2-rgb),0.48)) !important;
    box-shadow: 0 3px 14px var(--accent-glow) !important;
    opacity: 0.92;
}
body.isl-stealth-horizon #crown.droplet:not(.osd-active):not(.rec-live):not(.bt-popin):not(.notif-morph):not(.privacy-alert) > * {
    opacity: 0; pointer-events: none;
}
body.isl-stealth-horizon #crown.droplet.auto-stealth-idle { opacity: 0.50 !important; }
body.isl-stealth-horizon #crown.live-stage {
    border-top: 2px solid var(--accent-1) !important;
    animation: stealthGlide 0.22s var(--spring) !important;
}
@keyframes stealthGlide {
    from { opacity: 0.7; transform: translateY(-10px) scaleY(0.65); }
    to { opacity: 1; transform: translateY(0) scaleY(1); }
}

.snap-tile-grid {
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px;
}
.snap-tile {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    padding: 7px 4px; border-radius: 10px;
    border: 1px solid var(--border-subtle); background: var(--bg-card); color: var(--text-1);
    font-family: var(--font); font-size: 9.8px; font-weight: 700; cursor: pointer;
    transition: border-color 0.14s, background 0.14s, transform 0.12s var(--ease);
}
.snap-tile:hover {
    background: var(--accent-soft); border-color: var(--accent-1); color: var(--accent-1); transform: translateY(-1px);
}
.snap-tile:active { transform: scale(0.96); }
.snap-tile svg { width: 22px; height: 15px; display: block; }

#crown.droplet.auto-stealth-idle { opacity: 0.48; }
#crown.droplet.auto-stealth-idle:hover { opacity: 1; }

/* Instant 1-Hover Live Command Stage */
#crown.live-stage {
    margin-top: 7px;
    width: min(560px, calc(100vw - 24px));
    border-radius: 24px; padding: 11px 13px;
    display: flex; flex-direction: column; gap: 8px;
    animation: popDown 0.18s var(--spring);
}
.stage-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }

.stage-tab {
    border: none; background: transparent; color: var(--text-2);
    font-family: var(--font); font-size: 10px; font-weight: 700;
    padding: 4px 9px; border-radius: 999px; cursor: pointer;
    transition: background 0.14s, color 0.14s; white-space: nowrap; flex-shrink: 0;
}
.stage-tab:hover { color: var(--text-1); }
.stage-tab.active { background: var(--accent-1); color: var(--accent-ink); }
.stage-actions { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }
.stage-bento { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 8px; }
.stage-card {
    padding: 9px 10px; border-radius: 15px;
    background: var(--bg-inset); border: 1px solid var(--border-subtle);
    display: flex; flex-direction: column; gap: 7px; min-width: 0;
}
.stage-act-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; height: 100%; }
.stage-act-btn {
    border: 1px solid var(--border-subtle); background: var(--bg-card); color: var(--text-1);
    border-radius: 10px; padding: 6px 8px; cursor: pointer; font-family: var(--font);
    font-size: 10.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; min-width: 0;
    transition: background 0.13s, border-color 0.13s, transform 0.12s;
}
.stage-act-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stage-act-btn:hover { background: var(--bg-card-hover); border-color: var(--accent-ring); transform: translateY(-0.5px); }
.stage-act-btn.active { background: var(--accent-soft); border-color: var(--accent-1); color: var(--accent-1); }
.stage-strip {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    padding-top: 5px; border-top: 1px solid var(--border-subtle);
}
.stage-clip-chip {
    flex: 1; min-width: 0; height: 24px; padding: 0 8px; border-radius: 8px;
    border: 1px solid var(--border-subtle); background: var(--bg-card); color: var(--text-2);

.stage-clip-chip:hover { color: var(--text-1); border-color: var(--accent-ring); background: var(--bg-card-hover); }
.stage-scratch {
    width: 100%; min-height: 62px; resize: none; border-radius: 11px; padding: 8px 10px;
    border: 1px solid var(--border-subtle); background: var(--bg-inset); color: var(--text-1);
    font-family: var(--font); font-size: 11px; line-height: 1.38; outline: none; user-select: text;
}
.stage-scratch:focus { border-color: var(--accent-1); }

/* 1-Click Ada Tasarimi Quick Switcher inside Expanded Dynamic Island Deck */
.island-qs-wrap {
    display: flex; flex-direction: column; gap: 5px;
    padding: 7px 9px; border-radius: 13px;

/* Automatic Live Morph Cards inside Droplet */
#crown.droplet.bt-popin {
    height: 54px !important; min-width: 296px; padding: 0 15px !important;
    border-radius: 22px !important; gap: 11px; margin-top: 7px !important;
    border-top: 1px solid var(--border-rim) !important;
}
#crown.droplet.notif-morph {
    height: 50px !important; max-width: 390px; padding: 0 13px !important;
    border-radius: 20px !important; gap: 10px; margin-top: 7px !important;
    border-top: 1px solid var(--accent-ring) !important;
}
#crown.droplet.privacy-alert {
    border-color: rgba(251, 113, 133, 0.55) !important;
    box-shadow: 0 10px 26px -6px rgba(225, 29, 72, 0.36) !important;
}
@keyframes pulseRed { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.28); opacity: 0.65; } }
.priv-pulse { width: 7px; height: 7px; border-radius: 50%; background: #EF4444; box-shadow: 0 0 8px #EF4444; animation: pulseRed 1.4s ease-in-out infinite; flex-shrink: 0; }

/* 4-Tab Sleek Micro-Deck (468px) */
#crown.micro-deck {
    margin-top: 8px;
    width: min(472px, calc(100vw - 24px));
    border-radius: 22px; padding: 11px 13px;
    display: flex; flex-direction: column; gap: 9px;
}
.md-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.md-tabs { display: flex; gap: 3px; background: var(--bg-inset); padding: 3px; border-radius: 999px; border: 1px solid var(--border-subtle); }
.md-tab {
    border: none; background: transparent; color: var(--text-2);
    font-family: var(--font); font-size: 10.5px; font-weight: 700;
    padding: 4px 10px; border-radius: 999px; cursor: pointer;
    transition: background 0.14s, color 0.14s;
}
.md-tab:hover { color: var(--text-1); }
.md-tab.active { background: var(--accent-1); color: var(--accent-ink); }
.md-body { display: flex; flex-direction: column; gap: 8px; }
.md-todo-inp {
    flex: 1; height: 29px; padding: 0 10px; border-radius: 9px;
    border: 1px solid var(--border-rim); background: var(--bg-inset);
    color: var(--text-1); font-family: var(--font); font-size: 11.5px; outline: none; user-select: text;
}
.md-todo-inp:focus { border-color: var(--accent-1); }

/* 8 Dock Designs & 8 Dynamic Island Designs Gallery Cards */
.arch-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.arch-card {
    padding: 8px 9px; border-radius: 13px; text-align: left;
    border: 1px solid var(--border-subtle); background: var(--bg-inset);
    color: var(--text-1); cursor: pointer; font-family: var(--font);
    display: flex; flex-direction: column; gap: 6px; min-width: 0;
    transition: border-color 0.15s, background 0.15s, transform 0.13s var(--ease);
}
.arch-card:hover { border-color: var(--border-rim); transform: translateY(-1px); background: var(--bg-card-hover); }
.arch-card.active { border-color: var(--accent-1); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent-ring); }
.arch-card-head { display: flex; align-items: center; justify-content: space-between; gap: 5px; min-width: 0; }
.arch-card strong { font-size: 11.5px; font-weight: 800; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arch-card span { font-size: 9.8px; color: var(--text-2); line-height: 1.25; display: block; }
.arch-badge {
    font-size: 8.5px; font-weight: 800; padding: 1.5px 6px; border-radius: 99px;
    background: var(--accent-soft); color: var(--accent-1); flex-shrink: 0; white-space: nowrap;
}
.arch-diag {
    width: 100%; height: 42px; border-radius: 8px;
    background: linear-gradient(160deg, rgba(var(--a1-rgb),0.10), rgba(var(--a2-rgb),0.06)), var(--bg-card);
    border: 1px solid var(--border-subtle); overflow: hidden; display: block;
}

/* 8-Style Island Form Cards + 6 Curated Widget Packs */
.isl-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; }
.bundle-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
.bundle-btn {
    padding: 9px 10px; border-radius: 12px; text-align: left;
    border: 1px solid var(--border-subtle); background: var(--bg-inset);
    color: var(--text-1); cursor: pointer; font-family: var(--font);
    display: flex; flex-direction: column; gap: 5px; min-width: 0;
    transition: border-color 0.14s, background 0.14s, transform 0.12s;
}
.bundle-btn:hover { border-color: var(--accent-1); background: var(--accent-soft); transform: translateY(-1px); }
.bundle-btn strong { font-size: 11.5px; font-weight: 800; display: block; }
.bundle-btn span { font-size: 9.8px; color: var(--text-2); line-height: 1.25; display: block; }
.bundle-wire {
    width: 100%; height: 30px; border-radius: 7px;
    background: var(--bg-card); border: 1px solid var(--border-subtle);
    display: flex; align-items: center; gap: 4px; padding: 0 7px; overflow: hidden;
}
.bundle-wire-pill {
    height: 16px; border-radius: 4px; background: rgba(var(--a1-rgb), 0.16);
    border: 1px solid rgba(var(--a1-rgb), 0.34);
    display: inline-flex; align-items: center; padding: 0 5px;
    font-size: 8.5px; font-weight: 700; color: var(--accent-1); white-space: nowrap;
}
.wg-thumb.sk-acrylic,
.wg-thumb.sk-neoglass {
    background: linear-gradient(160deg, rgba(255,255,255,0.16), rgba(var(--a1-rgb),0.10) 55%, rgba(0,0,0,0.22));
    border-color: rgba(255,255,255,0.26);
    box-shadow: inset 0 1.5px 0 rgba(255,255,255,0.38), 0 8px 18px -6px rgba(0,0,0,0.4);

body.mode-light .wg-thumb.sk-acrylic,

    border-color: rgba(20,22,26,0.14);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.95), 0 6px 14px -6px rgba(20,22,26,0.12);
}

            } else if (id === 'crown' && (crownHovered || microDeckOpen || crownPinned) && !omniOpen) {
                const targetW = Math.min(564, Math.max(320, vw - 24));
                const w = Math.max(r.width, targetW);
                const h = Math.max(r.bottom, 224);
                const x = Math.min(r.left, (vw - w) * 0.5);
                rects.push({ x: Math.max(0, x - 12), y: 0, w: w + 24, h: h + 14 });
            } else if (id === 'omnibar' && omniOpen) {
                const w = Math.max(r.width, Math.min(740, vw - 24));
                const h = Math.max(r.height, 360);
                const x = Math.min(r.left, (vw - w) * 0.5);
                const y = Math.min(r.top, Math.max(0, vh - h - 50));
                rects.push({ x: Math.max(0, x - 8), y: Math.max(0, y - 8), w: w + 16, h: h + 16 });
            } else if (id === 'crown' && (activeOsd || liveBtPopin || liveNotifMorph)) {
                const h = Math.max(r.bottom, 58);
                rects.push({ x: Math.max(0, r.left - 18), y: 0, w: r.width + 36, h: h + 10 });
            } else {
                const padX = (id === 'crown' && !expanded && !crownHovered) ? 24 : 6;
                const padB = (id === 'crown' && !expanded && !crownHovered) ? 13 : 6;
                const yTop = (id === 'crown' && !expanded) ? 0 : Math.max(0, r.top - 4);
                const extraTop = Math.max(0, r.top - yTop);
                rects.push({ x: Math.max(0, r.left - padX), y: yTop, w: r.width + padX * 2, h: r.height + extraTop + padB });
            }
        }
    }
    const stageOpen = Boolean((crownHovered || microDeckOpen) && !crownPinned);
    if (stageOpen !== Boolean(window._lastCrownStageOpen)) {
        window._lastCrownStageOpen = stageOpen;
        send('setCrownStageState', { open: stageOpen });
    }
    window.chrome.webview.postMessage({
        type: 'hitRects',
        vw,
        vh,
        rects
    });
}

function parseHexRgb(hex, fallback = [56, 189, 248]) {
    const h = String(hex || '').replace('#', '').trim();
    const clean = h.length === 8 ? h.slice(2) : h;
    if (clean.length !== 6) return fallback;
    const n = parseInt(clean, 16);
    if (Number.isNaN(n)) return fallback;
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}

function hexToRgba(hex, alpha) {
    const [r, g, b] = parseHexRgb(hex, [15, 23, 42]);
    return `rgba(${r},${g},${b},${alpha})`;
}

function relativeLum(hex) {
    const [r, g, b] = parseHexRgb(hex, [56, 189, 248]).map(v => {
        const c = v / 255;
        return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}

function applyThemeVars(t) {
    if (!t) return;
    const root = document.documentElement.style;
    const isLight = t.colorMode === 'Light';
    const styleId = t.visualStyle || (isLight ? 'bento-silk' : 'liquid-glass');
    for (const s of ALL_VISUAL_STYLES) {
        document.body.classList.toggle('style-' + s, s === styleId);
    }
    const rawArch = state?.shellArchitecture || 'tahoe-glass';
    const archId = rawArch === 'fluent-aurora' ? 'fluent-mica' : rawArch;
    for (const a of ALL_SHELL_ARCHS) {
        document.body.classList.toggle('arch-' + a, a === archId);
    }
    const rawIsl = state?.islandStyle || 'liquid-pill';
    const islStyle = normalizeIslandStyle(rawIsl);
    for (const is of ALL_ISLAND_STYLES) {
        document.body.classList.toggle('isl-' + is, is === islStyle);
    }
    document.body.classList.toggle('mode-light', isLight);
    if (lastThemeIdApplied && lastThemeIdApplied !== t.id) {
        document.body.classList.remove('theme-' + lastThemeIdApplied);
    }
    if (t.id) {
        document.body.classList.add('theme-' + t.id);
        lastThemeIdApplied = t.id;
    }
    const rad = state?.cornerRadiusPreset || 'modern';
    document.body.classList.toggle('radius-sharp', rad === 'sharp');
    document.body.classList.toggle('radius-modern', rad === 'modern');
    document.body.classList.toggle('radius-capsule', rad === 'capsule');

    const op1 = typeof t.surfaceOpacity === 'number' ? Math.max(0.55, Math.min(1.0, t.surfaceOpacity)) : (isLight ? 0.94 : 0.92);
    const op2 = Math.min(1.0, op1 + 0.04);
    const [a1r, a1g, a1b] = parseHexRgb(t.colors.accentPrimary, [56, 189, 248]);
    const [a2r, a2g, a2b] = parseHexRgb(t.colors.accentSecondary, [129, 140, 248]);
    const accentInk = relativeLum(t.colors.accentPrimary) > 0.36 ? '#050B16' : '#FFFFFF';

    root.setProperty('--bg-glass-1', hexToRgba(t.colors.surface1, op1));
    root.setProperty('--bg-glass-2', hexToRgba(t.colors.surface2, op2));

    root.setProperty('--border-subtle', isLight ? 'rgba(20,22,26,0.08)' : 'rgba(255,255,255,0.08)');
    root.setProperty('--text-1', t.colors.textPrimary);
    root.setProperty('--text-2', t.colors.textSecondary);
    root.setProperty('--accent-1', t.colors.accentPrimary);
    root.setProperty('--accent-2', t.colors.accentSecondary);
    root.setProperty('--a1-rgb', `${a1r},${a1g},${a1b}`);
    root.setProperty('--a2-rgb', `${a2r},${a2g},${a2b}`);
    root.setProperty('--accent-soft', `rgba(${a1r},${a1g},${a1b},${isLight ? 0.12 : 0.14})`);
    root.setProperty('--accent-tint', `rgba(${a1r},${a1g},${a1b},${isLight ? 0.20 : 0.23})`);
    root.setProperty('--accent-ring', `rgba(${a1r},${a1g},${a1b},${isLight ? 0.44 : 0.48})`);

function syncStudioCustomizerReadouts(t) {
    if (!t || !expanded || !(deckMode === 'settings' && settingsSection === 'appearance')) return;

        cpAccent2: c.accentSecondary,

function queueThemeColorPatch(patch) {
    if (!state?.theme) return;
    pendingThemeColorPatch = { ...pendingThemeColorPatch, ...patch };
    // Instant 0ms local visual feedback on Crown without closing active color picker!
    const previewTheme = {
        ...state.theme,
        hasCustomColors: true,
        surfaceOpacity: typeof patch.surfaceOpacity === 'number' ? patch.surfaceOpacity : state.theme.surfaceOpacity,
        colors: {
            ...state.theme.colors,
            ...(patch.accentPrimary ? { accentPrimary: patch.accentPrimary } : {}),
            ...(patch.accentSecondary ? { accentSecondary: patch.accentSecondary } : {}),
            ...(patch.surface1 ? { surface1: patch.surface1 } : {}),
            ...(patch.surface2 ? { surface2: patch.surface2 } : {}),
            ...(patch.textPrimary ? { textPrimary: patch.textPrimary } : {})
        }
    };
    if (patch.surface1) {
        previewTheme.colorMode = relativeLum(patch.surface1) >= 0.42 ? 'Light' : 'Dark';
    }
    applyThemeVars(previewTheme);

    clearTimeout(themeColorSendTimer);
    themeColorSendTimer = setTimeout(() => {
        const payload = { themeId: state.theme.id, ...pendingThemeColorPatch };
        pendingThemeColorPatch = {};
        send('updateThemeColors', payload);
    }, 90);
}

function buildOsdInnerHtml(osd) {
    const hasBar = typeof osd.percent === 'number';
    const pct = hasBar ? Math.max(0, Math.min(100, osd.percent)) : 0;
    return `
        <span class="osd-icon">${getOsdIconSvg(osd)}</span>
        <span class="osd-label">${escHtml(osd.label)}</span>
        ${hasBar
            ? `<div class="osd-bar-track"><div class="osd-bar-fill" style="width:${pct}%;"></div></div><span class="osd-val num">${escHtml(osd.valueText)}</span>`
            : `<span class="osd-status-pill">${escHtml(osd.valueText)}</span>`}
    `;
}

function getOsdToneClass(osd) {
    if (!osd) return '';
    if (osd.kind === 'brightness') return 'osd-brightness';
    if (osd.kind === 'mute' || !osd.active) return 'osd-off';
    return 'osd-' + osd.kind;
}
